name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cài gitleaks (bài tự kiểm của hook pre-commit cần nó)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:hooks
      - run: npm run build

  # «Phần nội bộ không ra trang khách» (bất biến 4) — bộ kiểm rò rỉ của luật ẩn, check bắt buộc trước mỗi lần phát hành
  # (hàng 31). Gồm bài của packages/core/src/redaction và mọi *.ro-ri.test.ts(x) của cửa ra.
  ro-ri:
    name: ro-ri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ro-ri

  # «Công ty này không thấy gì của công ty kia» — check bắt buộc trước mỗi lần phát hành (ADR-0001 §3).
  isolation:
    name: isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: quyhang
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:quyhang@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:test

  # Quét bí mật trên toàn bộ lịch sử — lưới thứ hai sau hook pre-commit trên máy.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$HOME/bin" gitleaks
          "$HOME/bin/gitleaks" git --redact --no-banner --log-level warn .

  # Cổng nghiệm thu của Acceptance-Gate Kit (GUIDE §5.3): chạy từ bản kit ghim tag, không chép tệp kit vào kho.
  # Nâng kit = đổi KIT_TAG bằng một PR có chủ đích mỗi mốc; tệp này nằm trong t1_skip_globs nên PR đó không đỏ T1-escape.
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      KIT_TAG: v2.37.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần lịch sử để kiểm verified_commit, chữ ký và diff của PR
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lấy kit theo tag (ngoài cây kho)
        run: |
          git init -q "$RUNNER_TEMP/kit"
          git -C "$RUNNER_TEMP/kit" fetch -q --depth 1 https://github.com/phanlemanh/acceptance-gate-kit "refs/tags/$KIT_TAG"
          git -C "$RUNNER_TEMP/kit" checkout -q FETCH_HEAD
          echo "CLAUDE_PLUGIN_ROOT=$RUNNER_TEMP/kit" >> "$GITHUB_ENV"
      - name: pre-merge-check
        run: |
          # PR: soi diff với nhánh đích, T1-escape bật. Push lên main: không có tiền đề PR → HEAD~1 + --no-t1-escape
          # (ref trần, không $(rev-parse): ref hỏng thì cổng exit 2 to tiếng thay vì suy biến im lặng).
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            args=(--base "origin/$GITHUB_BASE_REF")
          else
            args=(--base HEAD~1 --no-t1-escape)
          fi
          # set +e: bash -e của Actions sẽ huỷ phép gán khi cổng thoát khác 0, mất cả dòng giải thích.
          set +e
          out="$(bash "$CLAUDE_PLUGIN_ROOT/scripts/pre-merge-check.sh" . "${args[@]}" 2>&1)"; st=$?
          set -e
          printf '%s\n' "$out"
          # Cổng thoát 0 mà không có dòng sổ luật = không luật nào chạy (sai thư mục, sai bản kit) → đỏ.
          if [ "$st" -eq 0 ] \
             && ! grep -qE '^enforcement[[:space:]]*:[[:space:]]*off[[:space:]]*(#.*)?$' _acceptance/config.yaml \
             && ! printf '%s\n' "$out" | grep -q '^pre-merge-check: rules ran='; then
            echo "cổng thoát 0 mà KHÔNG chạy luật nào — kiểm lại đường dẫn kho và bản kit"
            exit 1
          fi
          exit $st
      - name: product-map --check
        run: node "$CLAUDE_PLUGIN_ROOT/scripts/product-map.mjs" --root . --check

  # Môi trường thật (ADR-0009): sau khi gộp main, áp migration lên Supabase rồi chạy lại bộ kiểm cách ly NGAY TRÊN cơ
  # sở dữ liệu thật; chỉ khi cả hai xanh mới gọi deploy hook của Vercel — main tắt tự deploy (apps/web/vercel.json), nên
  # code mới không bao giờ chạy trên schema cũ. Chỉ chạy khi push main: không nằm trong ci-ok (trên PR job này bỏ qua).
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, isolation, secrets, gate, ro-ri]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      # Chỉ bộ kiểm cách ly (mỗi ca rollback, không để lại dữ liệu); test API ghi và xoá dữ liệu nên chỉ chạy ở job isolation.
      - run: npm run test:isolation -w @quy-hang/db
      - name: Deploy bản main lên Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null

  # Check bắt buộc duy nhất của bảo vệ nhánh: xanh khi và chỉ khi mọi job trên xanh.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, isolation, secrets, gate, ro-ri]
    runs-on: ubuntu-latest
    steps:
      - name: Mọi job phải xanh
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
