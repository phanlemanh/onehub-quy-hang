    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/db/tests/isolation.test.mjs ca «shares (048): mức chia» — bảng viết trước chèn qua app.create_share dưới vai quy_hang_app: khách riêng kèm mức 40 → lỗi ràng buộc ghim tên; fee_inclusion chứa khoản ngoài tập đóng → lỗi ràng buộc ghim tên; nhóm môi giới mức 120 → lỗi ràng buộc ghim tên; nhóm môi giới mức -1 → lỗi; đối chứng dương: nhóm môi giới mức 40 và mức null chèn được; quy_hang_app execute được hàm mới; sàn B không đọc được dòng của sàn A (đếm 0, đối chứng A đếm 1); và lệnh migrate chạy hai lần không áp lại 048. Chiều đỏ: bỏ ràng buộc khách riêng → ca đỏ nêu tên ràng buộc."
    paths: [packages/db/migrations/048_*, packages/db/tests/isolation.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    setup:
      - "Postgres dãy L (5571), máy chủ dev ở cổng của executors.ui-check. Dựng dữ liệu qua máy chủ đang chạy: Quản trị đặt mức chia mặc định 50 ở Cài đặt › Sàn › Trang môi giới; Đầu khách gửi ba căn cho nhóm môi giới, sửa mức thành 40; một Lần gửi khác cho khách riêng"
    steps:
      - "Mở link nhóm môi giới ở khổ máy tính khi chưa đăng nhập: đầu trang có tên sàn, người gửi, định nghĩa phí, «Mức chia: 40%»; bảng ba dòng có mã căn"
      - "Bấm «Tải Excel» và «Tải ảnh»: hai tệp tải về (xem mạng hoặc tải xuống)"
      - "Quản trị bật «Ẩn mức chia», mở lại link: không còn dòng mức chia"
      - "Mở link khách riêng: trang thẻ như cũ"
      - "Mở link nhóm môi giới ở khổ điện thoại: bảng cuộn ngang, khung không vỡ"
      - "Mở ảnh PNG vừa tải và chụp lại: đủ tiêu đề cột như bảng trang, ba dòng căn, phần đầu có mức chia"
      - "Trong bộ có một căn đã bán: dòng mờ, không giá"
      - "Mở link đã tắt và một mã sai: thấy «Link không còn mở» trong khung trang"
      - "Giả lỗi đọc: dừng máy chủ web-L, chạy cấu hình web-L-loi của .claude/launch.json (cổng 3498, DATABASE_URL trỏ Postgres không có máy ở 127.0.0.1:5599), mở link nhóm môi giới trên cổng 3498: thấy «Chưa mở được — thử lại sau» trong khung trang; xong thì tắt web-L-loi, chạy lại web-L"
      - "Giả lỗi dựng tệp (chặn bộ ghi trong công cụ trình duyệt): câu báo tại nút tải, bảng vẫn còn"
      - "Ở mục Trang môi giới nhập 120 rồi Lưu: lý do hiện dưới ô"
      - "Mở /settings/broker-page bằng vai Đầu khách: về trang Cá nhân kèm câu báo chỉ Quản trị sàn"
    cmd: config:executors.ui-check
    expected: "Ảnh mỗi bước khớp mô tả; không lỗi ứng dụng trên console; mạng không có gọi tới đường nội bộ khi đang chưa đăng nhập"
    paths: ["apps/web/src/app/s/**", "apps/web/src/app/(app)/settings/broker-page/**"]
    evidence_required: [run_id, screenshot, observed]

  - id: E10c
    criterion: AC-10
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bài thuần của apps/web/src/app/s/broker/ ghim chữ của từng trạng thái trong bảng trạng thái thiết kế — bảng viết trước sáu trạng thái trang môi giới (đang tải, có dữ liệu, ẩn mức chia, link tắt, lỗi tạm, tải lỗi) → chữ mong đợi, đếm 6; mỗi dòng dựng thành phần ở trạng thái ấy và tìm đúng chuỗi. Chiều đỏ: đổi chữ «Link không còn mở» → ca đỏ nêu tên trạng thái."
    paths: ["apps/web/src/app/s/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10b
    criterion: AC-10
    executor: script
    cmd: config:executors.design.khuon
    expected_exit: 1
    expected: "exit 1 (đạt có giới hạn, giám sát trả L-41, luật 33): lưới khuôn không báo lệch mới ở nhóm trang-khach và cai-dat-san cho tệp vòng chạm, trừ đúng một dòng báo oan của kit 2.37.0 — «lệch: apps/web/src/app/(app)/settings/broker-page/page.tsx · thuộc hai nhóm màn: cai-dat-san, trang-tam» dù trang-tam.md đã khai ngoại lệ (bộ đọc bỏ qua ngoai_le không có khoá khoi, kit#485). Mã 1 chỉ được chấp nhận cùng E10e xanh. Kit vá (thoát 0) thì bỏ expected_exit ở đây và bỏ E10e."
    paths: ["apps/web/src/app/s/**", "apps/web/src/app/(app)/settings/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10e
    criterion: AC-10
    executor: script
    cmd: node _acceptance/trang-nhom-moi-gioi/kiem-khuon-e10.mjs
    paths: ["design/patterns/**", "apps/web/src/app/s/**", "apps/web/src/app/(app)/settings/**", "_acceptance/trang-nhom-moi-gioi/kiem-khuon-e10.mjs"]
    expected: "exit 0; năm đối chứng viết sẵn trong bài qua (chỉ dòng báo oan → qua; thêm một lệch, lỗi bản đồ, thoát 1 không có dòng báo oan, không chấm được → đỏ); trên cây thật, các dòng «lệch:» và «sai:» của bước chấm khuôn đúng bằng một dòng báo oan đã khai và bài in «E10e: chỉ có dòng báo oan đã khai». Bước chấm thoát 0 (kit đã vá) thì bài in câu nhắc bỏ mã 1 ở E10b và bài E10e, vẫn thoát 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
