    cmd: config:executors.test.core
    expected: "exit 0; ca «cấp token theo loại kết nối» có mặt và ok trong packages/core/src/agreements.test.ts — duyệt toàn bộ CONNECTION_KINDS (số so bằng CONNECTION_KINDS.length), đúng catalog_source chiều vào và catalog_confirmation chiều ra cho phép, sáu loại còn lại và chiều ngược từ chối; MACHINE_TOKEN_LIMIT là số nguyên dương."
