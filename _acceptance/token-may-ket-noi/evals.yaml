  - id: E11
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.token_may_cach_ly
    expected: "exit 0; packages/db/tests/token-may-thu-tu.test.mjs ca «hai thứ tự áp migration» ok — dựng hai cơ sở dữ liệu tạm từ chính các tệp migration: (1) tới 041 rồi 042–052; (2) tới 040, 042–052 rồi 041; đọc pg_policies, quyền bảng và cột, ràng buộc, trigger của hai bảng mới ở mỗi bản, hai danh sách bằng nhau và khác rỗng; áp lại 041 lần hai không lỗi và danh sách không đổi. Đối chứng dương: bản sao 041 bỏ một luật thì phép so đỏ và nêu tên luật."
