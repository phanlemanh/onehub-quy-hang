<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-6 · Token sau khi thoả thuận tắt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame { max-width: 1200px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1200 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hỏi-6: token sau khi thoả thuận tắt">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Tiêu đề -->
      <text x="80" y="64" fill="#2d3142" font-size="32" font-family="'Instrument Serif', 'Lora', serif" letter-spacing="-0.01em">Hỏi-6 · Máy khuyên: token sau khi thoả thuận tắt</text>

      <!-- Mũi tên trước, hộp sau -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.6">
        <path d="M520 168 L520 192 Q520 200 512 200 L248 200 Q240 200 240 208 L240 296" marker-end="url(#arrow)"/>
        <path d="M600 168 L600 296" marker-end="url(#arrow)"/>
        <path d="M680 168 L680 192 Q680 200 688 200 L952 200 Q960 200 960 208 L960 296" marker-end="url(#arrow)"/>
        <path d="M240 368 L240 456" marker-end="url(#arrow)"/>
        <path d="M600 368 L600 456" marker-end="url(#arrow)"/>
        <path d="M960 368 L960 456" marker-end="url(#arrow)"/>
      </g>

      <!-- Nhãn ba cách tắt -->
      <g font-family="'Geist', sans-serif" font-size="20" font-weight="600" fill="#2d3142">
        <rect x="248" y="240" width="112" height="28" rx="2" fill="#f5f5f5"/>
        <text x="252" y="260">Tạm dừng</text>
        <rect x="608" y="240" width="112" height="28" rx="2" fill="#f5f5f5"/>
        <text x="612" y="260">Quá hạn</text>
        <rect x="968" y="240" width="112" height="28" rx="2" fill="#f5f5f5"/>
        <text x="972" y="260">Kết thúc</text>
      </g>

      <!-- Nhãn việc mở lại -->
      <g font-family="'Geist', sans-serif" font-size="20" font-weight="500" fill="#4f5d75">
        <rect x="248" y="400" width="96" height="28" rx="2" fill="#f5f5f5"/>
        <text x="252" y="420">Bật lại</text>
        <rect x="608" y="400" width="96" height="28" rx="2" fill="#f5f5f5"/>
        <text x="612" y="420">Gia hạn</text>
        <rect x="968" y="400" width="96" height="28" rx="2" fill="#f5f5f5"/>
        <text x="972" y="420">Mở lại</text>
      </g>

      <!-- Nút đầu -->
      <rect x="440" y="104" width="320" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="600" y="144" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thoả thuận bị tắt</text>

      <!-- Trạng thái token -->
      <rect x="80" y="296" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="240" y="340" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Token bị chặn</text>

      <rect x="440" y="296" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="600" y="340" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Token bị chặn</text>

      <rect x="800" y="296" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="296" width="320" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/>
      <text x="960" y="340" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Token bị thu hồi hẳn</text>

      <!-- Kết quả -->
      <rect x="80" y="456" width="320" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="240" y="496" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Token cũ chạy tiếp</text>

      <rect x="440" y="456" width="320" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <text x="600" y="496" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Token cũ chạy tiếp</text>

      <rect x="800" y="456" width="320" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="800" y="456" width="320" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="2"/>
      <text x="960" y="496" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Phải cấp token mới</text>

      <!-- Ghi chú -->
      <line x1="80" y1="556" x2="1120" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="80" y="592" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">Lời gọi trong lúc bị chặn nhận từ chối 403; token đã thu hồi nhận 401.</text>
    </svg>
  </div>
</body>
</html>
