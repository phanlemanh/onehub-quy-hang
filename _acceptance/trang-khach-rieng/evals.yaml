    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/trang-khach.test.ts có mặt và ok: «trang khách: route đọc trả bản ra theo thứ tự gửi» — đầu khách mẫu tạo Lần gửi khách riêng ba căn theo thứ tự c3, c1, c2 qua POST /api/v1/shares thật; GET /api/v1/public/shares/{code} không cookie → 200; companyName, senderName deepEqual giá trị của sàn và người gửi; mảng căn dài 3 và theo đúng thứ tự gửi (so bằng bản ra kỳ vọng dựng từ banRaNgoai cho từng căn, deepEqual từng phần tử); với mỗi căn Object.keys là tập con của truongRa(\"khach_rieng\", CAU_HINH_MAC_DINH), đếm bằng số căn. Đối chứng dương: cùng ca với Lần gửi nhóm môi giới thì mỗi căn có unitNumber. Chiều đỏ: trả thẳng hàng nội bộ thay bản ra → ca đỏ nêu khoá thừa."
    paths: [packages/api/src/public/**, packages/api/test-db/trang-khach.test.ts, packages/db/migrations/031_*.sql]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

