schema_version: 1
feature_slug: trang-khach-rieng
# Lệnh máy: `executors.test.isolation` (packages/api/test-db và packages/db/tests, cần DATABASE_URL tới Postgres dãy L,
# cổng 5571), `executors.test.web` (kiểm thuần apps/web, node:test), `executors.test.api`, `executors.script.ro_ri` (luật
# ẩn + mọi *.ro-ri.test.ts). exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output` — dòng reporter liệt tên ca — và người
# chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO». Dữ liệu: bộ mẫu hàng 5 qua
# đường ghi thật, số `0900 000 0xx`, tên «[Tên]»; căn mồi `canMoi()` của hàng 31.
evals:
