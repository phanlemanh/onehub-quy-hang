<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đọc công khai theo mã · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 2rem 16px;
    }
    .frame { max-width: 560px; margin: 0 auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Trang khách · hai làn</p>
    <h1>Đọc công khai theo mã, và hai sự kiện</h1>

    <svg viewBox="0 0 480 984" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane headers + dividers -->
      <text x="24" y="28" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐỌC</text>
      <text x="464" y="28" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">AC-1 · AC-9</text>
      <line x1="16" y1="40" x2="464" y2="40" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <line x1="16" y1="632" x2="464" y2="632" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="24" y="660" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SỰ KIỆN</text>
      <text x="464" y="660" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">AC-4 · AC-5</text>
      <line x1="16" y1="672" x2="464" y2="672" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- ===== Arrows (drawn before boxes) ===== -->
      <!-- Đọc: main spine -->
      <line x1="160" y1="120" x2="160" y2="150" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="216" x2="160" y2="246" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="312" x2="160" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="408" x2="160" y2="438" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="160" y1="504" x2="160" y2="534" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Tìm theo mã → link không còn mở (hop over the dashed Zalo line at x=312) -->
      <path d="M296 280 H306 A6 6 0 0 1 318 280 H326" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đọc → Sự kiện -->
      <line x1="160" y1="600" x2="160" y2="686" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Sự kiện: two branches -->
      <line x1="88" y1="752" x2="88" y2="790" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="232" y1="752" x2="232" y2="790" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Zalo xem trước → chỉ tải trang ở máy chủ (dashed, no write) -->
      <path d="M328 712 H320 Q312 712 312 704 V192 Q312 184 304 184 H298" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Arrow labels (masked, 8px gap from line) -->
      <rect x="168" y="320" width="76" height="20" rx="2" fill="#f5f5f5"/>
      <text x="172" y="334" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">link còn mở</text>
      <rect x="168" y="512" width="76" height="20" rx="2" fill="#f5f5f5"/>
      <text x="172" y="526" fill="#ba4513" font-size="12" font-family="'Geist', sans-serif">chỉ bản ra</text>
      <rect x="168" y="608" width="96" height="20" rx="2" fill="#f5f5f5"/>
      <text x="172" y="622" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">trang tải xong</text>
      <rect x="96" y="764" width="48" height="20" rx="2" fill="#f5f5f5"/>
      <text x="100" y="778" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">tự báo</text>
      <rect x="152" y="764" width="72" height="20" rx="2" fill="#f5f5f5"/>
      <text x="220" y="778" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">khách chạm</text>

      <!-- ===== Boxes: Đọc ===== -->
      <!-- 1. Khách mở link (input) -->
      <rect x="24" y="56" width="272" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="56" width="272" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="160" y="82" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khách mở link</text>
      <text x="160" y="104" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">trong Zalo · không đăng nhập</text>

      <!-- 2. Trang hỏi cửa công khai -->
      <rect x="24" y="152" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="178" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang hỏi cửa công khai</text>
      <text x="160" y="200" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">ở máy chủ web · không lưu đệm</text>

      <!-- 3. Tìm Lần gửi theo mã -->
      <rect x="24" y="248" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="274" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tìm Lần gửi theo mã</text>
      <text x="160" y="296" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">ra sàn · người gửi · người nhận · còn bật</text>

      <!-- 3b. Link không còn mở được (external) -->
      <rect x="328" y="224" width="136" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="224" width="136" height="112" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="396" y="252" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Link không còn</text>
      <text x="396" y="272" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mở được</text>
      <text x="396" y="296" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">đã tắt · mã không có</text>
      <text x="396" y="312" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">· người gửi rời sàn</text>
      <text x="396" y="328" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">AC-6</text>

      <!-- 4. Đọc căn như người gửi -->
      <rect x="24" y="344" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="370" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc căn như người gửi</text>
      <text x="160" y="392" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">luật cách ly theo dòng vẫn áp</text>

      <!-- 5. Luật ẩn dựng bản ra (focal) -->
      <rect x="24" y="440" width="272" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="440" width="272" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="160" y="466" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Luật ẩn của lõi dựng bản ra</text>
      <text x="160" y="488" fill="#ba4513" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">phần nội bộ bị bỏ ở đây</text>

      <!-- 6. Trang chỉ nhận bản ra -->
      <rect x="24" y="536" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="562" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang chỉ nhận bản ra</text>
      <text x="160" y="584" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">giá và trạng thái sống</text>

      <!-- ===== Boxes: Sự kiện ===== -->
      <!-- 7. Trang chạy ở trình duyệt -->
      <rect x="24" y="688" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="714" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang chạy ở trình duyệt</text>
      <text x="160" y="736" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">khách xem bộ căn</text>

      <!-- 8. Lượt mở -->
      <rect x="24" y="792" width="128" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="88" y="818" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lượt mở</text>
      <text x="88" y="840" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">một máy · một ngày</text>
      <text x="88" y="860" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">AC-4</text>

      <!-- 9. Quan tâm -->
      <rect x="168" y="792" width="128" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="232" y="818" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quan tâm</text>
      <text x="232" y="840" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">một máy · một căn</text>
      <text x="232" y="860" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">AC-5</text>

      <!-- 10. Zalo lấy ảnh xem trước (optional, dashed) -->
      <rect x="328" y="688" width="136" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="688" width="136" height="112" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="396" y="716" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Zalo lấy</text>
      <text x="396" y="736" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ảnh xem trước</text>
      <text x="396" y="760" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">chỉ tải trang</text>
      <text x="396" y="776" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">ở máy chủ</text>
      <text x="396" y="792" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không ghi gì</text>

      <!-- ===== Legend ===== -->
      <line x1="16" y1="896" x2="464" y2="896" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="920" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ THÍCH</text>
      <rect x="24" y="932" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="56" y="944" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">chỗ phần nội bộ bị bỏ khỏi bản ra</text>
      <line x1="24" y1="964" x2="48" y2="964" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="56" y="968" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">chỉ tải trang, không thành sự kiện</text>
    </svg>
  </div>
</body>
</html>
