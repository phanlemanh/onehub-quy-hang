schema_version: 1
feature_slug: khung-ho-so-lien-he
# Khung, nút đóng, cột, dòng tô và trang đầu chấm thuần ở apps/web (renderToStaticMarkup và hàm thuần). Lưới khuôn chấm ở
# packages/ui-lint trên bản sao cây thật. Một lượt nhìn màn thật ở 1440 và 375. Dữ liệu mẫu: `[Tên]`, `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bài thuần của apps/web/src/app/(app)/contacts/ dựng phần cột phụ mà vung.tsx truyền (hàm cotPhuLienHe hay tương đương) cho ba trạng thái hồ sơ đang tải · lỗi · xong: bài dựng đúng cách vung.tsx dựng cột phụ — <KhungHoSo cotPhu> bọc <HoSoNguoi> (bài đọc mã nguồn vung.tsx thấy đúng cách ghép ấy trong cotPhu); với mỗi trạng thái, nút gốc của HTML (thẻ, lớp, data-slot) bằng đúng nút gốc của KhungHoSo cotPhu dựng cùng thân rỗng, và data-slot=\"cot-ho-so\" nằm trong nó, đúng một khung; đếm 3. Đối chứng: KhungHoSo cotPhu và KhungHoSoCan cotPhu cùng nút gốc. Chiều đỏ: bỏ khung ở trạng thái lỗi → ca đỏ nêu «lỗi nằm trần trong cột»."
    paths: ["apps/web/src/app/(app)/contacts/**", "apps/web/src/components/khoi/solution-crm-4/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hồ sơ xong dựng ra có nút aria-label «Đóng hồ sơ» trong đầu hồ sơ; hàm thuần quyết Esc (escDong) theo bảng viết trước: Esc thường khi hồ sơ mở → đóng · hồ sơ đóng → không · defaultPrevented → không · đích là input → không · đích là textarea → không · đích nằm trong phần tử role=menu, listbox hay dialog → không · phím khác → không; đếm 7. Chiều đỏ: escDong bỏ kiểm ô nhập → ca «đích là input» đỏ."
    paths: ["apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; định nghĩa cột của lưới liên hệ có đúng bốn cột theo thứ tự [Người, Người giữ, Cơ hội mở, Căn] (so mảng tiêu đề), không cột Loại; tổng bề rộng tối thiểu của các cột ≤ 1440×0,62 trừ lề vỏ (số viết trước trong bài, rút từ COT_RONG của bố cục, không viết tay); cột Người co giãn. Chiều đỏ: thêm lại cột Loại → ca đỏ nêu tên cột."
    paths: ["apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; DanhSachLienHe dựng với chon = id dòng thứ hai: đúng một dòng mang data-state=\"selected\" và đó là dòng thứ hai; chon null → không dòng nào; khung bảng mang lớp cao hết vùng (h-full min-h-0) và lưới mang headerSticky. Chiều đỏ: bỏ dấu chọn → ca đỏ nêu «dòng đang mở không tô»."
    paths: ["apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; renderToStaticMarkup(KhungHoSoCan cotPhu) bằng đúng chuỗi HTML viết trước chụp từ main trước vòng (ghim trong bài, nguồn commit ghi kèm) — cùng lớp, cùng aria-label «Hồ sơ căn», cùng data-slot. Chiều đỏ: đổi lớp khung chung → ca đỏ nêu «khung hồ sơ căn đổi»."
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/components/khoi/solution-crm-4/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; trong packages/ui-lint/tests/ ca mới trên bản sao cây thật: cây lành → nhóm lien-he 0 lệch; phá ĐÚNG một chỗ (vung.tsx: bỏ <KhungHoSo …> bọc cột phụ) → đúng một lệch, thông điệp khớp /vung\\.tsx: .*khe «cotPhu» phải bọc trong <KhungHoSo>/; lược đồ nhận khe_boc là khoá tuỳ chọn, khe_boc nêu khe không phải tham số của khuôn → lỗi lược đồ. Chiều đỏ: bộ kiểm bỏ qua khe_boc → ca phá vẫn 0 lệch, đỏ."
    paths: [packages/ui-lint/**, design/patterns/lien-he.md, "apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: script
    cmd: config:executors.design.khuon
    expected: "exit 0 hay đúng mã đã khai; lien-he vẫn theo khuôn, 0 lệch mới trên cây thật."
    paths: ["apps/web/src/app/(app)/contacts/**", "design/patterns/**", packages/ui-lint/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hàm thuần trangDauLienHe(thamSo, goi) dựng đúng đường /api/v1/contacts với type, status của URL (bảng ca: không lọc · type · status · cả hai; đếm 4) và trả { items, nextCursor } hay null khi lỗi; page.tsx gọi nó và truyền kết quả vào VungLienHe (đọc mã nguồn: prop dau=). Hàm thuần henDoc(lyDo) trả 0 cho «mo-man» và «doi-loc», 250 cho «go-tim». Chiều đỏ: henDoc trả 250 khi mở màn → ca đỏ."
    paths: ["apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7b
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bàn đọc của vùng (hàm thuần canDocLan(khoaDauMoi, khoaHienTai, khoaDaCo)) quyết không hỏi máy chủ khi bảng đã đúng bộ lọc (kể cả hiệu ứng chạy lại) hay khi trang máy chủ vừa trao đúng bộ lọc (mở màn, đổi lọc qua URL), và hỏi khi gõ ô tìm hay không có trang máy chủ; bảng 6 ca; vung.tsx gọi đúng hàm ấy. Chiều đỏ: luôn hỏi lại → ca «mở màn» đỏ."
    paths: ["apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    setup:
      - "Postgres dãy L (5571) có sàn mẫu (DATABASE_URL=postgres://postgres:quyhang@localhost:5571/postgres node packages/db/seed/nap.mjs --nap); máy chủ dev của dãy L ở http://localhost:3491, nhật ký tee ra .acceptance-runs/web-L.log; mã đăng nhập dev nằm ở dòng «[ma-dang-nhap] <email> <mã>» của tệp ấy. Đăng nhập truong-nhom hay dau-chu-1 của sàn mẫu (@mau.quy-hang.test)."
    steps:
      - "1440 sáng: mở /contacts, chạm một người: hồ sơ trong khung có viền cao hết cột, có nút Đóng; bảng đủ bốn cột Người · Người giữ · Cơ hội mở · Căn, không thanh cuộn ngang; dòng của người ấy được tô"
      - "Cuộn bảng (thu khung nhìn cho danh sách dài hơn): tiêu đề khung, ô tìm, hàng tên cột đứng yên"
      - "Nhấn Esc: hồ sơ đóng; mở lại rồi bấm Đóng: hồ sơ đóng; gõ trong ô tìm rồi Esc: hồ sơ không đóng"
      - "Mở /inventory, chạm một căn: hồ sơ căn vẫn như trước (khung, nút mở toàn màn, Đóng)"
      - "Lấy HTML máy chủ của /contacts và của /contacts?type=Buyer bằng fetch có cookie phiên: mỗi HTML có tên người đầu của bảng tương ứng; HTML của ?type=Buyer không có tên một người chỉ là Chủ nhà (đối chứng: tên ấy có trong HTML không lọc)"
      - "Bật giả lập CPU chậm 4 lần và mạng 4G chậm, ghi mạng, mở /contacts và /contacts?type=Buyer: không có lượt GET /api/v1/contacts nào sau khi trang tải xong (trước khi gõ hay đổi lọc)"
      - "Mở hộp chọn hay menu có trong hồ sơ (vd hộp sửa trường riêng, ô chọn của trường riêng) rồi nhấn Esc: chỉ hộp hay menu đóng, hồ sơ vẫn mở; sau khi Đóng hồ sơ, bảng rộng hết vùng làm việc"
      - "375 sáng: mở /contacts, chạm một người: ngăn hồ sơ mở, không tràn ngang, không vỡ"
    cmd: config:executors.ui-check
    expected: "Ảnh mỗi bước khớp mô tả; không lỗi ứng dụng trên console"
    paths: ["apps/web/src/app/(app)/contacts/**", "apps/web/src/components/khoi/solution-crm-4/**", "apps/web/src/app/(app)/units/ho-so/khung.tsx"]
    evidence_required: [run_id, screenshot, observed]
