evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/routing/routing.test.ts có mặt và ok các ca: «chia: luật chủ trùng đứng trước mọi cách chia» — lặp đủ năm mục của ROUTING_STRATEGIES, mỗi mục: người của lead cùng số thắng dù phụ trách toà khác và đang nhiều lead; người cũ nghỉ hay mất vai đầu chủ thì ra đúng kết quả như lead không có người cũ; «chia: theo khu lần lượt — bảng viết trước» (người nghỉ bị bỏ, số thứ tự chia nhỏ nhất thắng, chưa nhận lần nào đứng đầu, hoà thì vào sàn trước, telesales/trưởng nhóm có khu trùng không được chọn, khu khác không được chọn, mọi người nghỉ → no_agent_for_building); «chia: lần lượt toàn sàn — bảng viết trước» (khu không xét, người không có khu vẫn được chọn, người nghỉ bị bỏ, không vai đầu chủ → no_agent); «chia: theo khu, ít lead đang mở — bảng viết trước» (ít lead đang mở thắng dù vừa được chia, bằng nhau thì lâu chưa được chia, khu khác không được chọn dù rảnh); «chia: kho chung và trưởng nhóm chia tay không tự chia»; «chia: một luồng lead dưới từng cách chia» — sáu lead của luồng mẫu, deepEqual bảng viết trước zone_round_robin [dc2,dc1,dc3,dc2,dc3,dc1], company_round_robin [dc3,dc2,dc1,dc3,dc2,dc1], zone_least_open [dc1,dc2,dc3,dc1,dc3,dc2], open_pool và manual toàn null, đếm đúng năm lần so; «chia: khu khớp toà không phân hoa thường, khoảng trắng». Mỗi bảng đếm số lần so bằng đúng số dòng. Chiều đỏ: bỏ vế openLeads khỏi cách chia ít lead đang mở → hai ca đỏ."
    paths: [packages/core/src/routing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]


