<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đếm gửi được căn ở đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:1120px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:0.35rem; }
    .subtitle { color:var(--color-muted); font-size:0.9rem; line-height:1.5; margin-bottom:1.25rem; max-width:80ch; }
    svg { width:100%; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Điểm quyết định · Hỏi-1 · AC-7</p>
    <h1>«Gửi được căn» đếm ở bước nào</h1>
    <p class="subtitle">Bốn bước nối tiếp từ lúc người bấm Gửi tới lúc tin rời máy. Máy chỉ thấy tới bước 3; bước 4 xảy ra trong Zalo, máy không thấy.</p>
    <svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1: đếm «gửi được căn» ở đâu</title>
      <desc id="d">Dòng thời gian bốn bước: Bấm Gửi, Tạo Lần gửi (máy chủ ghi), Bảng chia sẻ của máy, Người bấm gửi trong Zalo (máy không thấy). Điểm đếm khuyến nghị ở bước 2. Lối khác ở bước 3 cần migration và vẫn không thấy bước 4.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1120" height="400" fill="#f5f5f5"/>

      <!-- Vùng máy thấy / không thấy -->
      <text x="64" y="44" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">MÁY THẤY</text>
      <line x1="64" y1="56" x2="792" y2="56" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="856" y="44" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace">MÁY KHÔNG THẤY</text>
      <line x1="856" y1="56" x2="1056" y2="56" stroke="#bfc0c0" stroke-width="0.8" stroke-dasharray="4,3"/>

      <!-- Mũi tên (vẽ trước hộp) -->
      <line x1="264" y1="128" x2="324" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="528" y1="128" x2="588" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="792" y1="128" x2="852" y2="128" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Bước 1 -->
      <rect x="64" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="96" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="82" y="105" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <text x="164" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm Gửi</text>

      <!-- Bước 2 — điểm đếm khuyên -->
      <rect x="328" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="88" width="200" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="336" y="96" width="20" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="346" y="105" fill="#ba4513" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">2</text>
      <text x="428" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo Lần gửi (máy chủ ghi)</text>
      <text x="428" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shares.created_at</text>

      <!-- Bước 3 -->
      <rect x="592" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="88" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="600" y="96" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="610" y="105" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">3</text>
      <text x="692" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng chia sẻ của máy</text>

      <!-- Bước 4 — máy không thấy -->
      <rect x="856" y="88" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="88" width="200" height="80" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="864" y="96" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="874" y="105" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>
      <text x="956" y="132" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người bấm gửi trong Zalo</text>
      <text x="956" y="150" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(máy không thấy)</text>

      <!-- Điểm đếm khuyên (bước 2) -->
      <line x1="428" y1="168" x2="428" y2="216" stroke="#eb6c36" stroke-width="1.2"/>
      <circle cx="428" cy="220" r="4" fill="#eb6c36"/>
      <text x="428" y="248" fill="#ba4513" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đếm ở đây — Hỏi-1 khuyên</text>

      <!-- Lối khác (bước 3) -->
      <line x1="692" y1="168" x2="692" y2="280" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="692" cy="284" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="692" y="312" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">lối khác: cần migration, vẫn không thấy bước 4</text>

      <!-- Chú giải -->
      <line x1="40" y1="348" x2="1080" y2="348" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="376" fill="#4f5d75" font-size="9" letter-spacing="0.14em" font-family="'Geist Mono', monospace">CHÚ GIẢI</text>
      <circle cx="148" cy="372" r="4" fill="#eb6c36"/>
      <text x="160" y="376" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">điểm đếm khuyến nghị</text>
      <circle cx="356" cy="372" r="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="368" y="376" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">lối khác</text>
      <rect x="480" y="364" width="40" height="16" rx="4" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="532" y="376" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">bước máy không thấy</text>
    </svg>
  </main>
</body>
</html>
