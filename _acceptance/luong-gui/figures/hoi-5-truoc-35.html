<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lối vào Gửi trước 35</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:1120px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:0.35rem; }
    .subtitle { color:var(--color-muted); font-size:0.9rem; line-height:1.5; margin-bottom:1.25rem; max-width:80ch; }
    svg { width:100%; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Điểm quyết định · Hỏi-5 · AC-7</p>
    <h1>Lối vào Gửi trước khi trang khách (35) gộp</h1>
    <p class="subtitle">Hai nhánh theo thời gian qua ba mốc. Không cờ: nút Gửi có ngay, link chưa mở được trang tới khi 35 gộp. Cờ: nút Gửi ẩn tới khi 35 gộp, rồi thêm một lần gộp để mở cờ.</p>
    <svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-5: không cờ hay cờ trước khi 35 gộp</title>
      <desc id="d">Hai làn ngang: Không cờ (khuyên) và Cờ. Ba mốc: 34 gộp, khách nhận link, 35 gộp. Làn không cờ: ở giữa, link chưa mở được trang — chưa có sàn thật trước hai tuần thử. Làn cờ: nút Gửi ẩn tới 35 gộp, rồi mở cờ (một lần gộp thêm).</desc>
      <rect width="1120" height="400" fill="#f5f5f5"/>

      <!-- Mốc -->
      <text x="320" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">34 gộp</text>
      <text x="600" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">khách nhận link</text>
      <text x="880" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">35 gộp</text>
      <line x1="320" y1="56" x2="320" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="600" y1="56" x2="600" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="880" y1="56" x2="880" y2="320" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="1080" y="44" fill="#4f5d75" font-size="9" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="end">THỜI GIAN →</text>

      <!-- Làn 1: Không cờ (khuyên) -->
      <rect x="40" y="72" width="1040" height="112" rx="6" fill="#f4eeeb"/>
      <rect x="56" y="112" width="160" height="32" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="136" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không cờ (khuyên)</text>
      <line x1="320" y1="140" x2="1040" y2="140" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="320" cy="140" r="4" fill="#2d3142"/>
      <circle cx="600" cy="140" r="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="880" cy="140" r="4" fill="#2d3142"/>
      <text x="336" y="168" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">nút Gửi có ngay</text>
      <rect x="404" y="96" width="392" height="20" rx="2" fill="#f4eeeb"/>
      <text x="600" y="110" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">link chưa mở được trang — chưa có sàn thật trước hai tuần thử</text>
      <text x="896" y="168" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">link mở được trang</text>

      <!-- Làn 2: Cờ -->
      <rect x="40" y="200" width="1040" height="112" rx="6" fill="#edeeee"/>
      <rect x="56" y="240" width="160" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cờ</text>
      <line x1="320" y1="268" x2="880" y2="268" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <line x1="880" y1="268" x2="1040" y2="268" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="320" cy="268" r="4" fill="#4f5d75"/>
      <circle cx="880" cy="268" r="4" fill="#2d3142"/>
      <rect x="548" y="224" width="104" height="20" rx="2" fill="#edeeee"/>
      <text x="600" y="238" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">nút Gửi ẩn</text>
      <rect x="840" y="282" width="228" height="20" rx="2" fill="#edeeee"/><text x="1064" y="296" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="end">35 gộp → mở cờ (một lần gộp thêm)</text>

      <!-- Chú giải -->
      <line x1="40" y1="344" x2="1080" y2="344" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="372" fill="#4f5d75" font-size="9" letter-spacing="0.14em" font-family="'Geist Mono', monospace">CHÚ GIẢI</text>
      <rect x="136" y="360" width="40" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="188" y="372" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">nhánh khuyến nghị</text>
      <line x1="352" y1="368" x2="392" y2="368" stroke="#2d3142" stroke-width="1.2"/>
      <text x="404" y="372" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">nút Gửi hiện</text>
      <line x1="528" y1="368" x2="568" y2="368" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="580" y="372" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">nút Gửi ẩn sau cờ</text>
    </svg>
  </main>
</body>
</html>
