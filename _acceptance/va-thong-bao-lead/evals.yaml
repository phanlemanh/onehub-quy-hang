    criterion: AC-4
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; packages/api/src/push/gui.test.ts có các ca «AC-4 …», «AC-5 …», «AC-3 …» và tất cả ok — guiCacDong(dòng, bộ gửi, khoá, {timeoutMs, hanChot, dongHo}) với đồng hồ giả: (a) bộ gửi không bao giờ trả lời → dòng ấy kết quả 'failed' với lỗi «quá hạn gửi», hàm trả về sau đúng timeoutMs của đồng hồ giả; (b) bộ gửi trả ok → 'sent'; (c) bộ gửi trả 410 → 'gone'; (d) dòng có địa chỉ https://push.example.test/x → 'gone' và bộ gửi KHÔNG được gọi (đếm lần gọi = 0 cho dòng ấy); (e) năm dòng, mỗi lần gửi tốn 3 giây đồng hồ giả, hanChot = bắt đầu + 7 giây, timeoutMs 5 giây, điều kiện gửi «bây giờ + timeoutMs ≤ hanChot» → chỉ dòng 1 được gửi (dòng 2 ở 3 giây: 3 + 5 > 7), bốn dòng còn lại trả về trong danh sách «chưa gửi», không có kết quả. Mỗi ô một assert. Đối chứng đỏ: hàm giả bỏ hạn chót thì ô (e) gửi đủ năm dòng và ca đỏ nêu «chưa gửi»; hàm giả không xét địa chỉ thì ô (d) gọi bộ gửi và ca đỏ nêu địa chỉ."
    paths: ["packages/api/src/push/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

