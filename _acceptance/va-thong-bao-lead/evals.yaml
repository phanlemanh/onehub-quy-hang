schema_version: 1
feature_slug: va-thong-bao-lead
# Ca thuần: packages/core/src/push/push.test.ts (lõi), packages/api/src/push/gui.test.ts (máy chủ, đồng hồ giả),
#   apps/web/src/lib/push/dang-ky.test.ts (web). Ca trên Postgres dãy B: packages/api/test-db/va-thong-bao-lead.test.ts và
#   bộ hàng 26 packages/api/test-db/thong-bao-lead.test.ts — chạy qua executors.test.isolation (cần DATABASE_URL tới 5561).
# «DỰNG B» cho bài nhìn: node _acceptance/bang-hang-kieu-sheet/thu/dung-b.mjs (Postgres 5561, dev 3481, người mẫu hàng 5);
#   phiên và trang: _acceptance/bang-hang-kieu-sheet/thu/cdp.mjs (cookieCua, moChrome; Page.addScriptToEvaluateOnNewDocument
#   qua `gui`). Thiết bị «đã bật» giả bằng initScript: Notification.permission = 'granted', PushManager.prototype.getSubscription
#   trả một đăng ký có endpoint do ô đặt và khoá đúng khuôn (p256dh 'B'×87, auth 'A'×22) — lưu thật đi tới máy chủ thật.
# Mỗi bài nhìn GHI số đo vào evidence/<E>-measure.json (đo bằng mã trong trang và truy vấn cơ sở dữ liệu, không ước trên ảnh).
# Bản dev biên dịch /today lần đầu chậm (≈ 25 giây) và khung chờ tải đứng trước khi mã trang chạy: bọc window.fetch bằng initScript
#   ghi URL và mã trả, rồi chờ tới khi có câu trả lời của /api/v1/push/public-key hay /api/v1/me/push-subscriptions (tối đa 90 giây)
#   trước khi đo dải. Không mở trình duyệt khác vào cổng 3481 cùng lúc (tab lặp về /login làm máy chủ dev biên dịch lại liên tục).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; push.test.ts có các ca «AC-1 …» và tất cả ok — ma trận viết tay của laDichVuDay(địa chỉ), mỗi ô một assert: CHẤP NHẬN https://fcm.googleapis.com/fcm/send/x · https://fcm.googleapis.com/wp/x · https://updates.push.services.mozilla.com/wpush/v2/x · https://web.push.apple.com/x · https://wns2-par02p.notify.windows.com/w/?token=x · https://FCM.GOOGLEAPIS.COM/x (chữ hoa) · https://fcm.googleapis.com:443/x; TỪ CHỐI http://fcm.googleapis.com/x · https://push.example.test/x · https://fcm.googleapis.com.evil.test/x · https://evilfcm.googleapis.com/x · https://notify.windows.com/x (không nhãn trước đuôi) · https://evil-notify.windows.com/x · https://fcm.googleapis.com@evil.test/x · https://u:p@fcm.googleapis.com/x · https://fcm.googleapis.com:8443/x · https://169.254.169.254/x · https://localhost/x · https://[::1]/x · chuỗi rỗng · 'không phải địa chỉ'. Ca hằng: PUSH_SEND.deliverBudgetMs + timeoutMs < PUSH_CLAIM_HOLD_MS và tickBudgetMs + timeoutMs < PUSH_CLAIM_HOLD_MS (= 60 000, giữ chỗ của migration 018). Đối chứng đỏ: hàm giả chỉ xét tiền tố «https://» thì các ô https://push.example.test/x và https://fcm.googleapis.com.evil.test/x bị gọi tên trong thông điệp."
    paths: ["packages/core/src/push/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

