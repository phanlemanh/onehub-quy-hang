<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 bảy trên mười ba</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Cây quyết định · Hỏi-1 · AC-1 · AC-8 · AC-9</p>
    <h1>Đóng hàng 52 với 7/13 số đo?</h1>
    <p class="subtitle">Câu SỐNG của ô cơ hội đọc nguyên văn thì 6/13 chưa đạt: sáu số đo chưa có sự kiện.</p>
    <svg viewBox="0 0 1000 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1 bảy trên mười ba</title>
      <desc id="d">Cột trái, đo được từ sự kiện (7): xác nhận trong N ngày, mức đủ cao nhất, mã căn tự điền, lead đến cuộc gọi đầu, lead đến Sẵn sàng bán, lead trùng bị chặn, căn gọi điều chỉnh giá đợt hai. Cột phải, chưa có sự kiện (6), kèm hàng sẽ sinh sự kiện: khách hỏi đến gửi (86, 34), phát bảng hàng (43), mở link khách (35), lượt quan tâm (35), thiết bị theo vai (chưa hàng nào), mất mạng trên điện thoại (chưa hàng nào). Câu hỏi: đóng hàng 52 với 7/13 số đo ra từ sự kiện. Nhánh A, máy khuyên: nhận 7/13 cộng 6 giới hạn có tên; sửa câu SỐNG; mở hàng nhỏ ghi thiết bị và mất mạng. Nhánh B: giữ câu SỐNG nguyên văn; hàng 52 chờ 34, 35, 43, 86 và một hàng thiết bị chưa có.</desc>
      <rect width="1000" height="604" fill="#f5f5f5"/>

      <!-- Connectors (drawn before boxes) -->
      <path d="M 264 264 L 264 268 Q 264 276 272 276 L 480 276 Q 488 276 488 284 L 488 304" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 736 264 L 736 268 Q 736 276 728 276 L 520 276 Q 512 276 512 284 L 512 304" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <line x1="500" y1="360" x2="500" y2="376" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 280 400 L 280 384 Q 280 376 288 376 L 712 376 Q 720 376 720 384 L 720 400" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Left column: đo được từ sự kiện -->
      <rect x="40" y="32" width="448" height="232" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="32" width="448" height="232" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Đo được từ sự kiện (7)</text>
      <line x1="56" y1="76" x2="472" y2="76" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="56" y="100" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Xác nhận trong N ngày</text>
      <text x="56" y="124" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Mức đủ cao nhất</text>
      <text x="56" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Mã căn tự điền</text>
      <text x="56" y="172" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Lead → cuộc gọi đầu</text>
      <text x="56" y="196" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Lead → Sẵn sàng bán</text>
      <text x="56" y="220" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Lead trùng bị chặn</text>
      <text x="56" y="244" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Căn gọi điều chỉnh giá đợt hai</text>

      <!-- Right column: chưa có sự kiện -->
      <rect x="512" y="32" width="448" height="232" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="32" width="448" height="232" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="528" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Chưa có sự kiện (6)</text>
      <text x="944" y="60" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.12em">HÀNG SẼ SINH SỰ KIỆN</text>
      <line x1="528" y1="76" x2="944" y2="76" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="528" y="100" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Khách hỏi → gửi</text>
      <text x="944" y="100" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">86, 34</text>
      <text x="528" y="124" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Phát bảng hàng</text>
      <text x="944" y="124" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">43</text>
      <text x="528" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Mở link khách</text>
      <text x="944" y="148" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">35</text>
      <text x="528" y="172" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Lượt quan tâm</text>
      <text x="944" y="172" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="end">35</text>
      <text x="528" y="196" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Thiết bị theo vai</text>
      <text x="944" y="196" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">chưa hàng nào</text>
      <text x="528" y="220" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Mất mạng trên điện thoại</text>
      <text x="944" y="220" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">chưa hàng nào</text>

      <!-- Question -->
      <rect x="260" y="304" width="480" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="260" y="304" width="480" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đóng hàng 52 với 7/13 số đo ra từ sự kiện?</text>

      <!-- Branch A (máy khuyên) -->
      <rect x="80" y="400" width="400" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="400" width="400" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="96" y="424" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">NHÁNH A · MÁY KHUYÊN</text>
      <text x="96" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Nhận 7/13 + 6 giới hạn có tên</text>
      <text x="96" y="480" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Sửa câu SỐNG</text>
      <text x="96" y="500" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Mở hàng nhỏ ghi thiết bị và mất mạng</text>

      <!-- Branch B -->
      <rect x="520" y="400" width="400" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="400" width="400" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="536" y="424" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.12em">NHÁNH B</text>
      <text x="536" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Giữ câu SỐNG nguyên văn</text>
      <text x="536" y="480" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">· Hàng 52 chờ 34, 35, 43, 86</text>
      <text x="548" y="500" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif">và một hàng thiết bị chưa có</text>

      <!-- Legend -->
      <line x1="32" y1="556" x2="968" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="112" y="568" width="28" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="148" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh máy khuyên</text>
      <rect x="272" y="568" width="28" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="308" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh khác · số đo đã có sự kiện</text>
      <rect x="512" y="568" width="28" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="548" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Số đo chưa có sự kiện</text>
    </svg>
  </main>
</body>
</html>
