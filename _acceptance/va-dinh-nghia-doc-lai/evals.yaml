schema_version: 1
feature_slug: va-dinh-nghia-doc-lai
# Lệnh máy: executors.test.web, executors.script.typecheck, thu/chay-db.mjs (Postgres dãy Q cổng 5577). ui-check: thu/dung.mjs dựng trên
# chỗ thử hàng 49 (Postgres 5577, máy dev 3497, phiên đầu chủ, căn bao phí); Chrome không đầu.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**"]
    expected: "exit 0; apps/web/src/app/(app)/units/ho-so/dinh-nghia-doc-lai.test.ts: ca «giá chờ gửi» dựng bằng moHinhHoSo trên ngăn thật của taoBoDongBo với máy chủ giả mất mạng: giaChoGui true, khoaDoc null, chuDong null với cả lần đọc đang giữ của đúng giá ấy; giá trên mô hình là giá mới. Đối chứng dương: hết chờ thì khoaDoc khác null. Đối chứng đỏ: bản giả bỏ cổng chờ gửi làm ma trận hỏng với thông điệp nêu tên ca «giá chờ gửi»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**"]
    expected: "exit 0; cùng tệp: chuỗi mất mạng → sửa giá → có mạng → thuNgay trên bộ đồng bộ thật nối vào bộ đọc thật với lời đọc điều khiển được: số lời đọc 0 suốt lúc chờ, đúng 1 ở bước hàng đợi hết, dòng mang dấu mới. Ca viết trước: giữ dấu giá A → sửa B → sửa về A → hết chờ thì đúng 1 lời đọc mới và dòng mang dấu mới; lời đọc giá A đang bay → sửa → hết chờ → phản hồi cũ về sau bị bỏ. Đối chứng đỏ: bản giả bộ đọc giữ dấu qua lúc chờ gửi làm ca đổi đi đổi về hỏng với thông điệp nêu tên ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E3
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: node _acceptance/va-dinh-nghia-doc-lai/thu/chay-db.mjs
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**", "packages/api/src/fees/**", "_acceptance/va-dinh-nghia-doc-lai/thu/**"]
    expected: "exit 0; apps/web/src/lib/sync/test-db/dinh-nghia-doc-lai.db-test.mts trên API thật và Postgres: giá 1 bao phí đọc được dấu môi giới 100; sàn đổi môi giới 2%; mất mạng, sửa giá 2 qua bộ đồng bộ; trong lúc chờ gửi GET fee-basis vẫn trả môi giới 100 (đối chứng: máy chủ chưa có dấu mới) và khoaDoc null; có mạng, thuNgay; khoaDoc khác null; GET fee-basis trả môi giới 200; chuDong chứa «Môi giới 2%» và số về tay của giá 2."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E4
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    steps:
      - "node _acceptance/va-dinh-nghia-doc-lai/thu/dung.mjs rồi node _acceptance/va-dinh-nghia-doc-lai/thu/chay-ui.mjs --ra _acceptance/va-dinh-nghia-doc-lai/evidence — Chrome không đầu, chặn lệnh ghi sự kiện để giá kẹt trong hàng đợi trong khi các lời đọc khác vẫn thông."
      - "Đối chiếu các dòng JSON với expected rồi tắt máy dev: node _acceptance/va-dinh-nghia-doc-lai/thu/dung.mjs --tat. Xem ảnh E4-truoc, E4-cho-gui, E4-da-len."
    target: "http://localhost:3497/inventory"
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**"]
    expected: "Dòng truoc: dong chứa «Môi giới 1%». Dòng cho-gui: dong null, gia là giá mới, soDocDau 0 trong suốt lúc chặn. Dòng da-len: dong chứa «Môi giới 2%» và số về tay của giá mới, soDocDau đúng 1, giayTuLucBoChan không quá 8, soTaiTrang 1 (không tải lại). Ảnh khớp các dòng."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E5
    criterion: AC-3
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**"]
    expected: "exit 0; ma trận viết trước của khoaDoc: đọc hỏng cùng lastPullAt → null; lastPullAt mới → khoá khác null và khác khoá cũ; đọc hỏng lần nữa ở lastPullAt mới → null; kết quả null, 4xx → null mãi. Đối chứng đỏ: bản giả thử lại không cần lần kéo mới làm ma trận hỏng với thông điệp nêu tên ca."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E5b
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: node _acceptance/va-dinh-nghia-doc-lai/thu/chay-db.mjs
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**", "packages/api/src/fees/**", "_acceptance/va-dinh-nghia-doc-lai/thu/**"]
    expected: "exit 0; ca «lớp đọc trên API thật» của dinh-nghia-doc-lai.db-test.mts, ma trận viết trước qua hàm gọi API thật: 200 có dấu → kết quả có dấu; 200 null → kết quả cuối; 404 → kết quả cuối; mất mạng (công tắc của hàm gọi) → hỏng; 500 (bọc hàm gọi) → hỏng. Bộ đọc nối vào: hỏng thì không đọc thêm tới khi lastPullAt đổi, đổi thì đúng 1 lời đọc và dòng hiện."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E6
    criterion: AC-4
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**"]
    expected: "exit 0; lặp trên EVENT_TYPES lấy từ lõi với bảng viết trước kiểu Record theo từng loại (thêm loại mới là đỏ kiểu và đỏ bài tới khi được xếp): chỉ price_changed của chính căn cho giaChoGui true; mọi loại khác, và price_changed của căn khác, cho giaChoGui false, không lời đọc mới, dòng giữ nguyên."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**"]
    expected: "exit 0; máy chủ giả báo xung đột phiên bản cho lệnh đổi giá: bd.canXem() có căn, hàng đợi hết, giá trên mô hình về giá máy chủ, giaChoGui false, khoaDoc là khoá của giá máy chủ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E7b
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: node _acceptance/va-dinh-nghia-doc-lai/thu/chay-db.mjs
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/lib/sync/**", "packages/api/src/fees/**", "_acceptance/va-dinh-nghia-doc-lai/thu/**"]
    expected: "exit 0; ca «giá bị từ chối» của dinh-nghia-doc-lai.db-test.mts trên API thật: người khác đổi giá trước, lệnh của máy nhận 409; ghi trạng thái ở mọi lần bộ đồng bộ báo đổi: không bước nào có khoaDoc mang giá bị từ chối khi giaChoGui false; cuối chuỗi căn ở Cần xem, giá trên máy bằng giá máy chủ, khoaDoc mang giá máy chủ."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E8
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**"]
    expected: "exit 0; ma trận: phi excluded, phi null, gia null đều cho khoaDoc null và chuDong null; đối chứng dương: included có giá cho khoá khác null."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E9
    criterion: AC-7
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/ho-so-can.md", "apps/web/src/app/(app)/units/[code]/page.tsx", "apps/web/src/app/(app)/proto/cot-ho-so-can/page.tsx", "apps/web/src/app/(app)/proto/anh-can-ba-ngan/page.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm ho-so-can"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E10
    criterion: AC-7
    executor: script
    cmd: config:executors.design.floor
    paths: ["apps/web/src/app/(app)/units/ho-so/**"]
    expected: "exit 0; không có mã màu thô trên tệp giao diện vòng chạm"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E11
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/units/ho-so/**"]
    expected: "exit 0; apps/web/src/app/(app)/units/ho-so/dinh-nghia.test.ts giữ nguyên hai ca chữ dòng; chuDong trả đúng chuỗi của dongDinhNghia khi có lần đọc thành công."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E12
    criterion: AC-1
    executor: script
    cmd: config:executors.script.typecheck
    paths: ["apps/web/src/**"]
    expected: "exit 0; kiểm kiểu mọi gói xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
