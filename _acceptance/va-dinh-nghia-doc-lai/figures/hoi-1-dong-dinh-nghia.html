<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 · Dòng định nghĩa lúc giá chờ gửi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hình quyết định · Hỏi-1</p>
    <h1>Lúc giá chờ gửi, dòng định nghĩa thế nào</h1>

    <svg viewBox="0 0 1200 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng ba bước: đầu chủ sửa giá khi mạng yếu, giá chờ gửi rẽ hai nhánh, rồi giá lên máy chủ và dòng định nghĩa theo dấu mới">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Đường nối vẽ trước khối -->
      <path d="M200 184 H246" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M336 120 V80 Q336 72 344 72 H518" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M336 248 V288 Q336 296 344 296 H518" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M800 72 H864 Q872 72 872 80 V180" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M800 296 H864 Q872 296 872 288 V188" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M876 184 H918" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Nhãn hai nhánh -->
      <rect x="400" y="44" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="432" y="56" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NHÁNH A</text>
      <rect x="400" y="268" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="432" y="280" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NHÁNH B</text>

      <!-- Bước 1 -->
      <rect x="40" y="136" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="160" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 1</text>
      <text x="120" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đầu chủ sửa giá,</text>
      <text x="120" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mạng yếu</text>

      <!-- Bước 2: điểm rẽ -->
      <polygon points="336,120 424,184 336,248 248,184" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="336" y="172" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 2</text>
      <text x="336" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giá chờ gửi</text>

      <!-- Nhánh A: khuyến nghị -->
      <rect x="520" y="32" width="280" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="32" width="280" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="532" y="40" width="88" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
      <text x="576" y="52" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYẾN NGHỊ</text>
      <text x="660" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giá mới, không có dòng phụ</text>

      <!-- Nhánh B -->
      <rect x="520" y="256" width="280" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="256" width="280" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giá mới, chữ: Định nghĩa bao phí</text>
      <text x="660" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sẽ có khi giá gửi xong</text>

      <!-- Điểm chập -->
      <circle cx="872" cy="184" r="4" fill="#2d3142"/>

      <!-- Bước 3 -->
      <rect x="920" y="120" width="240" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="120" width="240" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1040" y="144" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BƯỚC 3</text>
      <text x="1040" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giá lên máy chủ →</text>
      <text x="1040" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dòng “Tính theo định nghĩa</text>
      <text x="1040" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ngày … — về tay …” theo dấu mới,</text>
      <text x="1040" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">không tải lại trang</text>

      <!-- Dải dưới: đường đã bỏ -->
      <line x1="40" y1="368" x2="1160" y2="368" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="412" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐƯỜNG ĐÃ BỎ</text>
      <rect x="432" y="384" width="336" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="600" y="412" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Trước đây: dòng đứng ở dấu cũ tới khi tải lại</text>
      <line x1="432" y1="432" x2="768" y2="384" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="1160" y="412" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-1 · AC-2</text>
    </svg>
  </div>
</body>
</html>
