schema_version: 1
feature_slug: va-xem-them-noi-lap-dong
# Luật con trỏ chấm bằng bài kiểm thuần của màn (apps/web), đọc nối dây trong vung.tsx, khuôn và sàn thiết kế, và một lượt
# nhìn màn có nhật ký mạng. Dữ liệu mẫu: `[Tên]`, `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trong apps/web/src/app/(app)/contacts/xem-them.test.ts ca «xem thêm: trang cuối sau lượt không đọc lại» có mặt và ok — bảng viết trước năm dòng, đếm 5: (1) trangTuMayChu có trang máy chủ {K0, c1} → {khoa K0, tiep c1} (đối chứng dương: «Xem thêm» lúc mở màn gửi c1 qua conTroXemThem); (2) trangTuMayChu không trang máy chủ → null; (3) trangKhiKhongDoc(trang {K0, c3}, không trang mới, K0) → {K0, c3} — không phải c1 của trang máy chủ lúc mở màn; (4) trangKhiKhongDoc(trang {K0, c3}, trang máy chủ mới {K0, c1'}, K0) → {K0, c1'}; (5) trangKhiKhongDoc(trang {K0, c3}, trang máy chủ mới của bộ lọc khác {K1, x}, K0) → {K0, c3}. Chiều đỏ (phá thử ở S3, cùng tệp): đổi nhánh «không trang mới» của trangKhiKhongDoc sang trả con trỏ trang 1 (hay trả null) → ca đỏ với thông điệp ghim «không đọc lại, không trang mới: giữ trang đã nối»."
    paths: ["apps/web/src/app/(app)/contacts/xem-them.ts", "apps/web/src/app/(app)/contacts/xem-them.test.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trong apps/web/src/app/(app)/contacts/xem-them.test.ts ca «xem thêm: gõ rồi xoá ô tìm trong 250 ms không lặp dòng» có mặt và ok — ba trang mẫu (50, 50, 10 dòng, mã duy nhất), phát lại từng bước bằng khoaLoc, canDocLan, conTroXemThem, duocNoi và trangKhiKhongDoc: mở màn → «Xem thêm» gửi c1, nối trang 2 → gõ «a» (canDocLan true, chưa hết 250 ms) → xoá «a» (canDocLan false) → «Xem thêm» gửi c2 (không phải c1) và nối trang 3; bảng 110 dòng, tập mã = 110 (không trùng), thứ tự đúng trang 1, 2, 3, con = false. Đối chứng: luật cũ (gán trang máy chủ lúc mở màn ở nhánh không đọc) trên cùng kịch bản gửi c1 và bảng có đúng 50 mã lặp. Năm ca cũ của «Xem thêm» (khoá bộ lọc 6 dòng, bấm trong 250 ms sau khi đổi bộ lọc, không gửi khi đang tải hay hết trang 4 dòng, trang về sau khi bộ lọc đã đổi, bấm hai lần trước khi trang về) vẫn có mặt và ok. Chiều đỏ (phá thử ở S3, cùng tệp): trangKhiKhongDoc trả con trỏ trang 1 ở nhánh «không trang mới» → ca đỏ nêu «lần Xem thêm sau gõ-xoá phải gửi con trỏ trang 3»; trả null → ca đỏ nêu «Xem thêm phải bấm được»."
    paths: ["apps/web/src/app/(app)/contacts/xem-them.ts", "apps/web/src/app/(app)/contacts/xem-them.test.ts", "apps/web/src/app/(app)/contacts/lien-he.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: judgment
    inputs: ["apps/web/src/app/(app)/contacts/vung.tsx", "apps/web/src/app/(app)/contacts/xem-them.ts", "_acceptance/va-xem-them-noi-lap-dong/vung-goc.tsx.txt"]
    question: "vung-goc.tsx.txt là vung.tsx trước bản vá. Trong vung.tsx hiện tại: (1) trạng thái trang cuối (useState) và ref con trỏ trang cuối đã nối (tiepHienTai) cùng ref trang cuối (trangCuoi) có khởi đầu từ trangTuMayChu(dau) (hay giá trị rút từ nó) không, và mọi chỗ đặt trang cuối sau lúc khởi đầu có đi qua MỘT hàm đặt (datTrang) đổi cùng lúc trạng thái, ref trang cuối và tiepHienTai không? (2) trong hiệu ứng đọc danh sách, nhánh không đọc lại (canDocLan trả false) có còn chỗ nào đặt trang cuối hay tiepHienTai từ `dau` khi `dau` không phải trang máy chủ mới (dauMoi) — tức không còn biểu thức kiểu `khoaLuot === dau?.khoa ? dau` — và trang cuối ở nhánh ấy có chỉ đổi qua trangKhiKhongDoc không; ref tiepHienTai có luôn cùng giá trị con trỏ với trang cuối vừa đặt không? (3) so với vung-goc.tsx.txt: them() và nhánh đọc lại sau 250 ms có chỉ khác ở chỗ đặt trang cuối (gọi datTrang thay cho gán tiepHienTai rồi setTrang, cùng khoá và con trỏ), cách lấy con trỏ qua conTroXemThem và điều kiện nối qua duocNoi giữ nguyên, phần JSX được vẽ (KhungLienHe, HoSoNguoi, DanhSachLienHe và prop của chúng) cùng mọi chuỗi chữ giữ nguyên không?"
    expected: "PASS khi cả ba vế đúng trên ba tệp; FAIL nêu dòng nếu trang cuối còn được đặt từ trang máy chủ lúc mở màn ở nhánh không đọc lại, khởi đầu trang cuối không qua trangTuMayChu, tiepHienTai lệch con trỏ trang cuối, hay JSX, chữ và đường đọc khác bản trước."
    paths: ["apps/web/src/app/(app)/contacts/vung.tsx", "apps/web/src/app/(app)/contacts/xem-them.ts"]
    evidence_required: [run_id, verdict, judges, verified_at]

  - id: E4
    criterion: AC-3
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/lien-he.md", "apps/web/src/app/(app)/contacts/vung.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm lien-he"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-3
    executor: script
    cmd: config:executors.script.design_floor
    paths: ["apps/web/src/app/(app)/contacts/**"]
    expected: "exit 0; sàn thiết kế M1 không chặn tệp giao diện nào của vòng (không mã màu thô trong apps/web/src/app/(app)/contacts/)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    steps:
      - "Postgres dãy L (5571), máy chủ dev ở cổng của executors.ui-check. Đăng nhập Đầu chủ 1 của bộ mẫu; nếu Đầu chủ 1 có ít hơn 101 liên hệ trong danh sách không lọc, dựng thêm qua fetch trong trang (POST /api/v1/listings rồi PUT /api/v1/listings/{id}/owner, ownerName «[Tên] Thử xem thêm <n>», số mới 0900 000 0xx) để danh sách có hơn hai trang"
      - "Khổ 1440: mở /contacts (không bộ lọc), chờ danh sách hiện và có nút «Xem thêm»; ghi số đếm «N liên hệ» ở đầu danh sách là N1 → chụp evidence/E6-step1.png"
      - "Bấm «Xem thêm», chờ danh sách dài thêm; ghi số đếm N2 và con trỏ (tham số cursor) của yêu cầu GET /api/v1/contacts vừa gửi (nhật ký mạng) → chụp evidence/E6-step2.png"
      - "Bấm vào ô tìm, gõ «a» rồi xoá ngay (Backspace) trong vòng 250 ms; chờ 1 giây; ghi có yêu cầu GET /api/v1/contacts nào không mang cursor được gửi trong lúc ấy không"
      - "Bấm «Xem thêm» lần nữa, chờ danh sách dài thêm → chụp evidence/E6-step3.png; ghi vào observed (a) con trỏ của yêu cầu «Xem thêm» thứ hai, có khác con trỏ của yêu cầu thứ nhất không, (b) tập id liên hệ trong thân phản hồi của hai yêu cầu «Xem thêm» có rời nhau không (đọc từ nhật ký mạng), (c) số đếm «N liên hệ» ở đầu danh sách trước và sau (N3), N3 có bằng N2 cộng số dòng của phản hồi thứ hai không"
    cmd: config:executors.ui-check
    expected: "Bước 3: N2 > N1. Bước 4: không có yêu cầu đọc lại (hoặc có thì bảng đọc lại từ trang 1 và bước 5 vẫn không lặp). Bước 5: con trỏ của yêu cầu «Xem thêm» thứ hai khác con trỏ của yêu cầu thứ nhất, hai phản hồi «Xem thêm» không chung id nào, N3 = N2 + số dòng của phản hồi thứ hai — không dòng nào lặp."
    paths: ["apps/web/src/app/(app)/contacts/**"]
    evidence_required: [run_id, verifier, verified_at, screenshot, observed]
