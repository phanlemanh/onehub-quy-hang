schema_version: 1
feature_slug: man-lien-he
# Lệnh máy: `executors.test.isolation` (packages/api/test-db và packages/db/tests, DATABASE_URL tới Postgres dãy L cổng 5571),
# `executors.test.core`, `executors.test.web`, `executors.test.ui_lint`, `executors.design.khuon`. exit 0 của lệnh chung KHÔNG
# đủ: mỗi eval đòi `output` — dòng reporter liệt tên ca — và người chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok»,
# không «# SKIP»/«# TODO». Dữ liệu: bộ dựng sàn thử qua đường ghi thật (nhập lead, ghi chủ nhà, mở nhu cầu khách), số
# `0900 000 0xx`, tên «[Tên]». Mỗi lệnh ghi trong bài test-db assert mã trả về; mỗi phép quét âm tính có đối chứng dương trên
# chính giá trị đã cài.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/man-lien-he.test.ts có mặt và ok: «liên hệ: danh sách theo quyền» — sàn thử có đầu chủ 1 giữ hai chủ, đầu chủ 2 giữ một chủ, một khách của đầu khách: GET /api/v1/contacts của đầu chủ 1 trả đúng tập id hai chủ của mình (deepEqual tập viết trước), của đầu chủ 2 trả đúng một, của trưởng nhóm trả cả bốn; bảng viết trước (telesales 403, đầu khách 403, quản trị sàn không vai khác 403, không cookie 401) → mã HTTP, đếm bằng số dòng; mỗi dòng có name, contactTypes, status (lead|contact), holderName, phoneCount, openOpportunities, listingCount; thân trả không có khoá phone, phoneEnc, floorPrice, không có số đã cài và giá đáy đã cài (đối chứng dương: máy dò bắt số và giá đáy đã cài khi chèn vào chuỗi mẫu). Chiều đỏ: bỏ điều kiện người giữ khỏi đường đọc → ca đỏ nêu id thừa."
