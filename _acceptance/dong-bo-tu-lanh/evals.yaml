  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «Cần xem sửa tiếp rồi Lấy bản mới / Bỏ thay đổi / Sửa lại: lần sửa sau cùng lên, không kẹt» có mặt và ok — ba lượt viết trước (Lấy bản mới trên dung-nhau · Bỏ thay đổi trên tu-choi · Sửa lại trên tu-choi), mỗi lượt căn mới; sau lối chọn và thuNgay: sự kiện mới của căn deepEqual đúng một sự kiện là lần sửa tiếp, listPrice cuối = lần sửa tiếp, hàng đợi rỗng, canXem() []; thuNgay lần nữa không đổi gì (không kẹt). Chiều đỏ: thao tác sửa tiếp nằm lại hàng đợi hay căn quay lại Cần xem → ca đỏ nêu lối."
    paths: [apps/web/src/lib/sync/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
