    cmd: config:executors.test.web_db
    expected: "exit 0; ca «hết phiên trên API thật: hàng đợi ở lại, đăng nhập lại thì lên đúng thứ tự» có mặt và ok — người X trên API thật; hai căn; X sửa ba ô khi hàm gọi gửi không kèm cookie phiên (API thật trả 401): đếm sự kiện bằng kết nối chủ +0, hàng đợi 3, canXem() [], chỉ báo «Hết phiên · đăng nhập lại để gửi 3 thay đổi»; hàm gọi kèm lại cookie, thuNgay: đếm +3, suKienMoi từng căn deepEqual dãy viết tay theo thứ tự, canXem() []. Ca «4xx thật vẫn vào Cần xem» các ca hàng 13 trong cùng output ok."
    paths: [apps/web/src/lib/sync/**, packages/api/src/listings/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG T. Khổ 1440x900. Chờ chỉ báo «Đã đồng bộ · hh:mm». Giả trả 503 cho */api/v1/listings*; sửa giá căn đầu (+1 triệu) → chờ chỉ báo đổi → chụp evidence/E9b-may-chu.png; ghi chữ chỉ báo; mở bảng Cần xem nếu có (kỳ vọng không có). Bỏ giả trả; không bấm gì, chờ tối đa 60 giây → ghi chữ chỉ báo và giá căn đầu"
      - "Xoá cookie phiên của trang (giữ cookie sàn). Sửa giá căn đầu (+1 triệu) → chờ chỉ báo đổi → chụp evidence/E9b-het-phien.png; ghi chữ chỉ báo và đích liên kết của nó (href). Bấm chỉ báo → đăng nhập lại cùng người mẫu → về trang thử, chờ tối đa 60 giây → chụp evidence/E9b-dang-nhap-lai.png; ghi chữ chỉ báo và giá căn đầu"
      - "Chạy trong trang: IDBObjectStore.prototype.put = function () { throw new DOMException('thu', 'UnknownError') }. Sửa giá căn thứ hai → chụp evidence/E9b-kho.png; ghi chữ chỉ báo. Tải lại trang (khôi phục put) → ghi chữ chỉ báo"
      - "Khổ 375x812, ma trận viết trước năm ô (mất mạng = chặn */api/v1/* · máy chủ trục trặc = giả trả 503 cho */api/v1/listings* · hết phiên = xoá cookie phiên · bị từ chối = giả trả 403 cho GET */api/v1/listings đúng đường danh sách · lỗi kho = ghi đè IDBObjectStore.prototype.put rồi sửa giá một căn); mỗi ô: dựng trạng thái, chờ chỉ báo đổi, chụp evidence/E9b-375-<ô>.png, ghi aria-label của chỉ báo, tên lớp svg biểu tượng (lucide-…), và với ô hết phiên ghi href; gỡ trạng thái và tải lại trước ô kế. Số dòng ghi = 5"
      - "Khổ 375x812: tạo đụng nhau như E8b của hàng 13 (cửa sổ thứ hai người mẫu Trưởng nhóm sửa giá căn thứ ba; cửa sổ đầu chặn */api/v1/*, sửa giá căn thứ ba, bỏ chặn → chờ «1 căn cần xem»). Sửa tiếp giá căn thứ ba (giá X) → mở bảng Cần xem → chụp evidence/E9b-sua-them.png; ghi nội dung bảng. Bấm «Lấy bản mới» → chờ chỉ báo «Đã đồng bộ» → ghi giá căn thứ ba"
    expected: "503: chỉ báo «Máy chủ trục trặc · 1 thay đổi chờ gửi lại», không có Cần xem; bỏ giả trả thì tự về «Đã đồng bộ» và giá căn đầu là giá đã sửa. Hết phiên: chỉ báo «Hết phiên · đăng nhập lại để gửi 1 thay đổi», là liên kết tới /login; đăng nhập lại thì về «Đã đồng bộ» và giá căn đầu là giá đã sửa lần hai. Kho lỗi: chỉ báo «Lỗi kho trên máy · thay đổi chưa lưu được»; tải lại thì hết. Sửa tiếp căn Cần xem: bảng có dòng «Sửa thêm sau đó: giá X» kèm «gửi sau khi bạn chọn»; sau «Lấy bản mới» giá căn thứ ba là X và chỉ báo «Đã đồng bộ». Ma trận 375: năm aria-label đúng năm chữ của bảng thiết kế (mất mạng · hết phiên · máy chủ trục trặc · bản tải về bị từ chối · lỗi kho), năm lớp biểu tượng đôi một khác nhau (cloud-off · log-in · server-crash · shield-alert · hard-drive-download), ô hết phiên href /login. Đối chứng: chỉ báo trước và sau mỗi bước khác nhau."
    paths: [apps/web/src/lib/sync/**, apps/web/src/components/sync/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

