<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vòng đời một thay đổi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng · nhanh-tuc-thi · cổng duyệt</p>
    <h1>Bộ đồng bộ xử một thay đổi thế nào</h1>

    <svg viewBox="0 0 1280 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ========== Arrows (drawn first) ========== -->
      <!-- Sửa một ô → Lõi kiểm -->
      <line x1="160" y1="200" x2="186" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lõi kiểm → Ghi (đúng khuôn) -->
      <line x1="324" y1="200" x2="390" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lõi kiểm → Từ chối ngay (sai khuôn) -->
      <line x1="256" y1="244" x2="256" y2="298" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ghi → Gửi -->
      <line x1="568" y1="200" x2="622" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Gửi: vòng mất mạng (ra phải-trên, vào trái-trên) -->
      <path d="M752,172 V136 Q752,128 744,128 H664 Q656,128 656,136 V170" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Gửi → Máy chủ trả lời -->
      <line x1="784" y1="200" x2="814" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Máy chủ → Rời hàng đợi (Nhận) -->
      <line x1="960" y1="200" x2="1086" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Máy chủ → Rời hàng đợi (Đã cọc / Đã bán của tôi) -->
      <path d="M888,152 V120 Q888,112 896,112 H1156 Q1164,112 1164,120 V174" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Máy chủ → Đối chiếu (Lệch phiên bản / bị từ chối) -->
      <line x1="888" y1="248" x2="888" y2="306" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đối chiếu → Rời hàng đợi (có: Đã áp trước) -->
      <path d="M988,360 H1156 Q1164,360 1164,352 V226" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đối chiếu → Cần xem (không) -->
      <line x1="888" y1="412" x2="888" y2="454" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ========== Arrow labels (masked, gap above/beside line) ========== -->
      <!-- đúng khuôn -->
      <rect x="328" y="176" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="358" y="188" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đúng khuôn</text>
      <!-- sai khuôn -->
      <rect x="264" y="264" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="268" y="276" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">sai khuôn</text>
      <!-- mất mạng loop label -->
      <rect x="600" y="84" width="208" height="36" rx="2" fill="#f5f5f5"/>
      <text x="704" y="98" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mất mạng → giữ trong hàng đợi</text>
      <text x="704" y="112" fill="#636b80" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thử lại 15 giây / khi quay lại trang</text>
      <!-- Nhận -->
      <rect x="1000" y="176" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1024" y="188" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Nhận»</text>
      <!-- Đã cọc / Đã bán của tôi -->
      <rect x="936" y="68" width="176" height="36" rx="2" fill="#f5f5f5"/>
      <text x="1024" y="82" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Đã cọc / Đã bán của tôi»</text>
      <text x="1024" y="96" fill="#636b80" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lên dù phiên bản lệch</text>
      <!-- Lệch phiên bản / bị từ chối -->
      <rect x="896" y="264" width="164" height="16" rx="2" fill="#f5f5f5"/>
      <text x="900" y="276" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">«Lệch phiên bản / bị từ chối»</text>
      <!-- có: Đã áp trước -->
      <rect x="1016" y="332" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="1076" y="344" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">có → «Đã áp trước»</text>
      <!-- không -->
      <rect x="896" y="424" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="900" y="436" fill="#ba4513" font-size="10" font-family="'Geist', sans-serif">không</text>

      <!-- ========== Nodes ========== -->
      <!-- Sửa một ô (start) -->
      <rect x="40" y="176" width="120" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="40" y="176" width="120" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="100" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sửa một ô</text>

      <!-- Lõi kiểm (decision) -->
      <polygon points="256,156 324,200 256,244 188,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lõi kiểm</text>
      <text x="256" y="212" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đúng khuôn?</text>

      <!-- Từ chối ngay (end) -->
      <rect x="176" y="300" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="176" y="300" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="256" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Từ chối ngay»</text>
      <text x="256" y="336" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không xếp hàng</text>

      <!-- Ghi trên máy + xếp hàng (step) -->
      <rect x="392" y="168" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="392" y="168" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi trên máy + xếp hàng</text>
      <text x="480" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mã thao tác</text>
      <text x="480" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">phiên bản kỳ vọng</text>

      <!-- Gửi khi có mạng (step) -->
      <rect x="624" y="172" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="624" y="172" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="704" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gửi khi có mạng</text>

      <!-- Máy chủ trả lời (decision, 3 exits) -->
      <polygon points="888,152 960,200 888,248 816,200" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="888" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ</text>
      <text x="888" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trả lời</text>

      <!-- Rời hàng đợi (end) -->
      <rect x="1088" y="176" width="152" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="1088" y="176" width="152" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1164" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rời hàng đợi</text>

      <!-- Đối chiếu lịch sử căn (decision) -->
      <polygon points="888,308 988,360 888,412 788,360" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="888" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đối chiếu lịch sử căn</text>
      <text x="888" y="372" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">có sự kiện của chính mình?</text>

      <!-- Cần xem (focal) -->
      <rect x="788" y="456" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="788" y="456" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="888" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Cần xem»</text>
      <text x="888" y="502" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Giữ của tôi · Lấy bản mới</text>

      <!-- ========== Góc mã AC ========== -->
      <rect x="40" y="404" width="296" height="116" rx="6" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="56" y="428" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MÃ AC LIÊN QUAN</text>
      <text x="56" y="448" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AC-3</text>
      <text x="96" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">lõi kiểm, ghi trên máy</text>
      <text x="56" y="464" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AC-4</text>
      <text x="96" y="464" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">hàng đợi qua mất mạng</text>
      <text x="56" y="480" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AC-5</text>
      <text x="96" y="480" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đối chiếu, «Đã áp trước»</text>
      <text x="56" y="496" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AC-6</text>
      <text x="96" y="496" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">«Cần xem»</text>
      <text x="56" y="512" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AC-7</text>
      <text x="96" y="512" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">«Đã cọc» / «Đã bán» lên dù lệch</text>

      <!-- ========== Legend ========== -->
      <line x1="40" y1="556" x2="1240" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH NÓI LOẠI</text>

      <rect x="40" y="588" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="598" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>

      <rect x="216" y="588" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="248" y="598" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="320,594 332,588 344,594 332,600" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="352" y="598" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <rect x="440" y="588" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="472" y="598" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Người phải chọn lối</text>

      <line x1="616" y1="594" x2="644" y2="594" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="652" y="598" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Vòng thử lại</text>
    </svg>
  </div>
</body>
</html>
