<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 — Vùng danh mục rỗng thì làm gì</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cổng Phạm vi · Đọc vùng danh mục · Điểm quyết định</p>
    <h1>Hỏi-1 — Vùng danh mục rỗng thì làm gì?</h1>

    <svg viewBox="0 0 1088 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .tx { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 400; fill: #4f5d75; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.06em; }
          .ala { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #ba4513; letter-spacing: 0.06em; font-weight: 500; }
          .lt { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.14em; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <!-- Lối A (khuyến nghị) -->
      <path d="M232 172 L248 172 Q256 172 256 164 L256 104 Q256 96 264 96 L384 96" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Lối B -->
      <path d="M232 196 L248 196 Q256 196 256 204 L256 264 Q256 272 264 272 L384 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lối → kết cục -->
      <line x1="624" y1="96" x2="672" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="624" y1="272" x2="672" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nhãn mũi tên ===== -->
      <rect x="264" y="72" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="320" y="84" class="ala" text-anchor="middle">A · KHUYẾN NGHỊ</text>

      <rect x="308" y="248" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="320" y="260" class="al" text-anchor="middle">B</text>

      <!-- ===== Nút ===== -->
      <!-- Điểm xuất phát -->
      <rect x="32" y="148" width="200" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="32" y="148" width="200" height="72" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="132" y="180" class="nm" text-anchor="middle">Vùng dùng chung</text>
      <text x="132" y="196" class="nm" text-anchor="middle">hôm nay rỗng</text>

      <!-- Lối A -->
      <rect x="384" y="60" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="60" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="504" y="92" class="nm" text-anchor="middle">Vùng rỗng dùng gói mẫu,</text>
      <text x="504" y="108" class="nm" text-anchor="middle">có khu thật thì tắt</text>

      <!-- Lối B -->
      <rect x="384" y="236" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="236" width="240" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="504" y="268" class="nm" text-anchor="middle">Bỏ hẳn gói mẫu,</text>
      <text x="504" y="284" class="nm" text-anchor="middle">nạp mẫu qua cửa nhận</text>

      <!-- Kết cục A -->
      <rect x="672" y="48" width="384" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="48" width="384" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="688" y="76" class="nm">Giữ T2</text>
      <text x="688" y="100" class="tx">Ô Gõ mã còn dữ liệu</text>
      <text x="688" y="120" class="tx">Một sàn nạp một khu là mẫu tắt cho mọi sàn</text>

      <!-- Kết cục B -->
      <rect x="672" y="224" width="384" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="224" width="384" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="688" y="252" class="nm">Lên T3</text>
      <text x="688" y="276" class="tx">Thêm sàn vào danh sách tin và thoả thuận trên bản thật</text>
      <text x="688" y="296" class="tx">Không còn hai nguồn</text>

      <!-- ===== Dải tiêu chí liên quan ===== -->
      <line x1="32" y1="352" x2="1056" y2="352" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="376" class="lt">TIÊU CHÍ LIÊN QUAN</text>
      <text x="184" y="376" class="tx"><tspan class="nm">AC-5</tspan>  Vùng có dữ liệu thì gói mẫu tắt; vùng rỗng thì dùng gói mẫu</text>
      <text x="672" y="376" class="tx"><tspan class="nm">AC-7</tspan>  Gói mẫu chỉ còn ở một chỗ</text>
    </svg>
  </div>
</body>
</html>
