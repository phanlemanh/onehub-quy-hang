<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi đầu chủ hàng loạt</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1088px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 1rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng · Đổi đầu chủ hàng loạt · AC-3 · AC-4 · AC-5 · AC-8</p>
    <h1>Đổi đầu chủ hàng loạt: tích, xem trước, đổi, hoàn tác</h1>

    <svg viewBox="0 0 1088 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Làn chính năm bước từ trưởng nhóm tích căn đến hoàn tác, với hai khung câu hỏi đang chờ chốt: Hỏi-1 về lối gán một căn, Hỏi-2 về hoàn tác căn trước chưa có đầu chủ">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="40" y="36" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÀN CHÍNH</text>

      <!-- Khung câu hỏi (đứt nét) -->
      <rect x="248" y="280" width="384" height="180" rx="8" fill="none" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="264" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỎI-1 · LỐI GÁN MỘT CĂN · HAI LỐI</text>
      <rect x="664" y="280" width="384" height="248" rx="8" fill="none" stroke="#636b80" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="680" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HỎI-2 · HOÀN TÁC CĂN TRƯỚC CHƯA CÓ ĐẦU CHỦ</text>

      <!-- Mũi tên (vẽ trước hộp) -->
      <line x1="216" y1="112" x2="244" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="424" y1="112" x2="452" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="632" y1="112" x2="660" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="840" y1="112" x2="868" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="544" y1="168" x2="544" y2="200" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="544" y1="248" x2="544" y2="276" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="960" y1="168" x2="960" y2="276" stroke="#636b80" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Làn chính -->
      <g font-family="'Geist', sans-serif" text-anchor="middle">
        <rect x="40" y="56" width="176" height="112" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
        <text x="128" y="108" fill="#2d3142" font-size="12" font-weight="600">Trưởng nhóm tích căn</text>
        <text x="128" y="126" fill="#4f5d75" font-size="10">trên Bảng hàng</text>

        <rect x="248" y="56" width="176" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="336" y="92" fill="#2d3142" font-size="12" font-weight="600">Xem trước</text>
        <text x="336" y="112" fill="#4f5d75" font-size="10">căn đã tích + căn cùng chủ nhà,</text>
        <text x="336" y="128" fill="#4f5d75" font-size="10">đầu chủ cũ, số liên hệ</text>

        <rect x="456" y="56" width="176" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="544" y="92" fill="#2d3142" font-size="12" font-weight="600">Đổi</text>
        <text x="544" y="112" fill="#4f5d75" font-size="10">mọi căn và liên hệ</text>
        <text x="544" y="128" fill="#4f5d75" font-size="10">sang đầu chủ mới</text>

        <rect x="664" y="56" width="176" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="752" y="104" fill="#2d3142" font-size="12" font-weight="600">Thông báo 10 giây</text>
        <text x="752" y="124" fill="#2d3142" font-size="12" font-weight="600">· Hoàn tác</text>

        <rect x="872" y="56" width="176" height="112" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
        <text x="960" y="88" fill="#2d3142" font-size="12" font-weight="600">Hoàn tác</text>
        <text x="960" y="108" fill="#4f5d75" font-size="10">trả người giữ cũ,</text>
        <text x="960" y="124" fill="#4f5d75" font-size="10">bỏ qua căn/liên hệ</text>
        <text x="960" y="140" fill="#4f5d75" font-size="10">đã đổi tiếp</text>

        <!-- Ghi chú gắn Hỏi-1 -->
        <rect x="456" y="200" width="176" height="48" rx="4" fill="#f5f5f5" stroke="#636b80" stroke-width="1"/>
        <text x="544" y="228" fill="#4f5d75" font-size="11" font-style="italic">Lối gán một căn đang có</text>
      </g>

      <!-- Lối của Hỏi-1 -->
      <rect x="264" y="312" width="352" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="272" y="318" width="44" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="294" y="328" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYÊN</text>
      <text x="440" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giữ nguyên ở hàng này</text>

      <rect x="264" y="388" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đi chung hàm mới</text>

      <!-- Lối của Hỏi-2 -->
      <rect x="680" y="312" width="352" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="688" y="318" width="44" height="14" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="710" y="328" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYÊN</text>
      <text x="856" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn chưa có đầu chủ và liên hệ cùng chủ</text>
      <text x="856" y="366" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">giữ người nhận, lời riêng</text>

      <rect x="680" y="388" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="856" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loại căn chưa có đầu chủ khỏi lô</text>

      <rect x="680" y="456" width="352" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="856" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thêm dòng gán «không đầu chủ»</text>

      <!-- Chú giải -->
      <line x1="40" y1="568" x2="1048" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>
      <rect x="40" y="600" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="72" y="610" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm đầu, điểm cuối</text>
      <rect x="208" y="600" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
      <text x="240" y="610" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>
      <rect x="304" y="600" width="24" height="12" rx="2" fill="#f5f5f5" stroke="#636b80"/>
      <text x="336" y="610" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Ghi chú</text>
      <rect x="408" y="600" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="440" y="610" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Lối khuyên của câu Hỏi</text>
      <rect x="576" y="600" width="24" height="12" rx="2" fill="none" stroke="#636b80" stroke-dasharray="5,4"/>
      <text x="608" y="610" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi đang chờ chốt</text>
    </svg>
  </div>
</body>
</html>
