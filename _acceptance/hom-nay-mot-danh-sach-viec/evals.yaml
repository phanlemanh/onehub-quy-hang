schema_version: 1
feature_slug: hom-nay-mot-danh-sach-viec
# Lệnh máy: executors.test.web, executors.test.api_db (cần DATABASE_URL tới Postgres riêng), executors.design.khuon.
# ui-check mở máy dev với sàn mẫu; người chấm đối chiếu tên ca trong `expected` với dòng reporter của node --test: có mặt, ok, không SKIP.
evals:
  - id: E1
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    target: "http://localhost:3462/today"
    steps:
      - "Dựng chỗ thử: node _acceptance/hom-nay-mot-danh-sach-viec/thu/dung.mjs (Postgres 5599 nạp sàn mẫu, máy dev 3462, đủ các loại việc; dòng cuối in hàng đợi, lead, tin; cookie đăng nhập từng vai ở .acceptance-runs/hom-nay-mot-danh-sach-viec/phien.json, khoá du-vai là người đủ năm vai) — tắt bằng cờ --tat"
      - "Đăng nhập tài khoản mẫu đủ năm vai; đo ở khổ 1440 và 1912"
      - "Đếm main, h1; đo x và right của danh sách so với vùng data-vung=than; chụp E1-1440.png, E1-1912.png"
    expected: "main = 1, h1 = 1, đường dẫn ở đầu màn; không có [aria-label='Hôm nay của trưởng nhóm'], bảng Lead đã nhập, Timeline; lệch mép danh sách so với vùng nội dung = 0 px ở cả hai khổ. Chiều đỏ: dựng lại trên main cũ cho lệch 164 px."
    paths: ["apps/web/src/app/(app)/today/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

