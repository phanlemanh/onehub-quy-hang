    expected: "exit 0; dòng «mức nợ giao diện: 0/0»; bước kiểm chuẩn in «chuẩn giao diện: đạt»."
    paths: ["apps/web/src/**", "packages/api/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.script.build
    expected: "exit 0; next build hoàn tất."
    paths: ["apps/web/**", "packages/api/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-9
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; bộ kiểm đơn vị của @quy-hang/api xanh (không cần Postgres)."
    paths: ["packages/api/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
