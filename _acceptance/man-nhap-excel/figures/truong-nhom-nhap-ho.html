<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trưởng nhóm nhập hộ</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; }
  .frame { max-width: 1264px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', 'Lora', serif; font-weight: 400; font-size: 2rem; margin-bottom: 1.5rem; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Nhập Excel · AC-8</p>
  <h1>Trưởng nhóm nhập hộ</h1>

<svg viewBox="0 0 1264 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng Nhập Excel theo vai: Đầu chủ nhập cho chính mình, Trưởng nhóm nhập hộ một Đầu chủ">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Làn -->
  <rect x="16" y="72" width="1232" height="120" fill="#ececec" stroke="#bfc0c0" stroke-width="0.8"/>
  <rect x="16" y="192" width="1232" height="260" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/>
  <text x="32" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ĐẦU CHỦ</text>
  <text x="32" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRƯỞNG NHÓM</text>

  <!-- Mũi tên (vẽ trước hộp) -->
  <path d="M152 180 H184 Q192 180 192 172 V140 Q192 132 200 132 H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M152 204 H184 Q192 204 192 212 V292 Q192 300 200 300 H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="432" y1="300" x2="480" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="680" y1="300" x2="728" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="928" y1="300" x2="976" y2="300" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <path d="M828 356 V396 Q828 404 836 404 H976" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- Nhãn mũi tên -->
  <rect x="200" y="236" width="76" height="14" rx="2" fill="#f5f5f5"/>
  <text x="238" y="247" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRƯỞNG NHÓM</text>
  <rect x="200" y="164" width="52" height="14" rx="2" fill="#ececec"/>
  <text x="226" y="175" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐẦU CHỦ</text>
  <rect x="932" y="272" width="40" height="14" rx="2" fill="#f5f5f5"/>
  <text x="952" y="283" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HỢP LỆ</text>
  <rect x="868" y="378" width="80" height="14" rx="2" fill="#f5f5f5"/>
  <text x="908" y="389" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG HỢP LỆ</text>

  <!-- Bắt đầu (oval) -->
  <rect x="32" y="168" width="120" height="48" rx="24" fill="#f5f5f5"/>
  <rect x="32" y="168" width="120" height="48" rx="24" fill="#2d3142" fill-opacity="0.06" stroke="#2d3142" stroke-width="1"/>
  <text x="92" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở Nhập Excel</text>

  <!-- A: Đầu chủ -->
  <rect x="232" y="100" width="200" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="232" y="100" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.04" stroke="#2d3142" stroke-width="1"/>
  <text x="332" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dòng thuộc chính mình</text>

  <!-- B -->
  <rect x="232" y="260" width="200" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="232" y="260" width="200" height="80" rx="6" fill="#2d3142" fill-opacity="0.04" stroke="#2d3142" stroke-width="1"/>
  <text x="332" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chọn một đầu chủ của sàn</text>
  <text x="332" y="304" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">(danh sách từ máy chủ:</text>
  <text x="332" y="318" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">mã người, tên)</text>

  <!-- C -->
  <rect x="480" y="260" width="200" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="480" y="260" width="200" height="80" rx="6" fill="#2d3142" fill-opacity="0.04" stroke="#2d3142" stroke-width="1"/>
  <text x="580" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mọi dòng gửi <tspan font-family="'Geist Mono', monospace" font-size="11">agentUserId</tspan></text>
  <text x="580" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">của người được chọn</text>

  <!-- D: quyết định -->
  <polygon points="828,244 928,300 828,356 728,300" fill="#f5f5f5"/>
  <polygon points="828,244 928,300 828,356 728,300" fill="#2d3142" fill-opacity="0.04" stroke="#2d3142" stroke-width="1"/>
  <text x="828" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">máy chủ kiểm người ấy</text>
  <text x="828" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">là Đầu chủ của sàn</text>

  <!-- E: kết quả (focal) -->
  <rect x="976" y="260" width="240" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="976" y="260" width="240" height="80" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.4"/>
  <text x="1096" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hàng mới thuộc đầu chủ được chọn;</text>
  <text x="1096" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">người tạo là Trưởng nhóm</text>

  <!-- F: nhánh phụ -->
  <rect x="976" y="380" width="240" height="48" rx="6" fill="#f5f5f5"/>
  <rect x="976" y="380" width="240" height="48" rx="6" fill="#2d3142" fill-opacity="0.04" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="1096" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dòng bỏ</text>
  <text x="1096" y="416" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">«chưa có đầu chủ giữ căn»</text>

  <!-- Chú giải -->
  <line x1="32" y1="472" x2="1232" y2="472" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
  <text x="32" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
  <rect x="140" y="486" width="24" height="12" rx="6" fill="none" stroke="#2d3142" stroke-width="1"/>
  <text x="172" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">bắt đầu</text>
  <polygon points="248,486 260,492 248,498 236,492" fill="none" stroke="#2d3142" stroke-width="1"/>
  <text x="272" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">máy chủ kiểm</text>
  <rect x="372" y="486" width="24" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.4"/>
  <text x="404" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">kết quả đúng</text>
  <line x1="500" y1="492" x2="524" y2="492" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="532" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">nhánh phụ (dòng bị bỏ)</text>
</svg>
</div>
</body>
</html>
