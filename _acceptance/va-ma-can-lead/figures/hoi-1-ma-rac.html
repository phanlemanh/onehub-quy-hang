    <h1>Lead cũ mang mã căn rác: bỏ mã hay từ chối?</h1>
    <p class="subtitle">Luật mới chặn mã căn toàn dấu lúc nhập lead. Lead ghi từ trước vẫn mang mã ấy; hai đường dựng lại từ lead phải chọn cách xử.</p>
