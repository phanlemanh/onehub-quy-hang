schema_version: 1
feature_slug: khuon-nguon-danh-muc-v2
# exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi output có tên ca và ok; ma trận viết trước, số lần so đếm bằng biến tăng trong vòng lặp và so với độ dài ma trận. Gói thử lấy từ goiMauV2() của khuôn rồi sửa từng ô (round-trip qua bên viết thật), không tự dựng gói đúng khuôn.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.khuon_v2_db
    expected: "exit 0; ca «v2: nhận gói mẫu bằng phiên và bằng token» ok — hai đường vào, mỗi đường 200, số khu, toà, căn, ảnh chụp khớp đếm từ chính gói; field_confidence từng căn bằng đúng fieldConfidence của gói; catalog_market_snapshots.segments và catalog_public_listing_snapshots.listings bằng đúng phần tương ứng; agreement_id bằng thoả thuận đã dùng. Ca «v2: đẩy lại không nhân đôi» ok — created 0, số dòng ba bảng không đổi, đối chứng lần đầu created khác 0. Chiều đỏ: bản sao hàm ghi bỏ cột field_confidence thì so bằng đỏ nêu upi."
    paths: [packages/connect/src/catalog-feed*, packages/api/src/catalog/feeds*, packages/db/migrations/042_*, packages/api/test-db/khuon-v2/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.khuon_v2_db
    expected: "exit 0; bộ packages/api/test-db/catalog/nhan-goi.test.ts chạy cùng lệnh xanh; ca «v1: phản hồi giữ tập khoá cũ» ok — đúng năm khoá; ca «v1 ghi lại căn thì xoá nhãn» ok — trước khi gửi nhãn khác null (đối chứng), sau khi gửi null và giá trị đúng theo v1; ca «phiên bản lạ qua cửa nhận» ok — ma trận 0, 3, chuỗi, vắng mỗi ô 422 invalid-feed, không 500, đếm ba bảng theo khu của gói bằng 0, số ô bằng 4."
    paths: [packages/connect/src/catalog-feed*, packages/api/src/catalog/feeds*, packages/api/test-db/khuon-v2/**, packages/api/test-db/catalog/nhan-goi.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
