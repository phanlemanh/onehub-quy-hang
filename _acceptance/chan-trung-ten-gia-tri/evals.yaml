schema_version: 1
slug: chan-trung-ten-gia-tri
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/labels/**"]
    expected: "exit 0; ca «trùng tên đang hiện» trong packages/core/src/labels/labels.test.ts: ma trận viết trước mọi cặp có thứ tự (giá trị đặt tên, giá trị anh em chưa đặt) của feeInclusion (2 cặp) và withdrawnReason (6 cặp) — mỗi ô dungDongNhan trả ok:false, lỗi chứa chữ trùng và tên mặc định của giá trị kia; số ô đếm bằng 8. Đối chứng dương cùng bộ: đổi tên đó sang chữ không trùng → ok:true. Chiều đỏ: bỏ phép so với tên mặc định trong trungTenGiaTri → 8 ô đỏ, thông điệp nêu cặp."
  - id: E1b
    criterion: AC-2
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/labels/**"]
    expected: "exit 0; hai tên riêng cùng chữ trong một tập (feeInclusion, withdrawnReason) → ok:false, lỗi nêu tên trùng; đối chứng hai tên khác chữ → ok:true. Chiều đỏ: bỏ phép so riêng–riêng → ca đỏ nêu tập."
  - id: E1c
    criterion: AC-3
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/labels/**"]
    expected: "exit 0; bảng viết trước «bao   PHÍ», «  Bao Phí », «KHÔNG BAO PHÍ» với giá trị anh em tương ứng → mỗi ô ok:false; đối chứng «Bao phí trọn» → ok:true. Chiều đỏ: so bằng === thay vì bỏ hoa thường/dấu cách → các ô ấy đỏ."
  - id: E1d
    criterion: AC-4
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/labels/**"]
    expected: "exit 0; ba ca đối chứng: (a) tên không trùng → ok, dòng đúng tên; (b) gõ đúng tên mặc định của chính giá trị → ok, không dòng nào cho giá trị ấy; (c) đổi chéo (included «Không bao phí», excluded «Bao phí») → ok, dòng mang cả hai tên. Chiều đỏ: tính tên đang hiện bằng tên mặc định cho mọi giá trị (bỏ tên riêng gửi lên) → ca (c) đỏ."
  - id: E1e
    criterion: AC-5
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/labels/**"]
    expected: "exit 0; giá trị withdrawnReason đặt tên «Bao phí» (trùng tên của tập feeInclusion) → ok. Chiều đỏ: so trùng trên mọi tập gộp → ca đỏ."
  - id: E2
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/core/src/labels/**", "packages/api/src/labels/**", "packages/api/test-db/chan-trung-ten-gia-tri/**"]
    expected: "exit 0; packages/api/test-db/chan-trung-ten-gia-tri/trung-ten.test.ts trên Postgres: sàn thử qua đường ghi thật; quản trị đặt trước một tên riêng hợp lệ (withdrawnReason/unreachable «Mất liên lạc»); rồi PUT bộ có excluded «Bao phí» kèm thay đổi khác → 400, reason chứa «Bao phí»; đọc lại GET và dòng company_settings y như trước PUT (nguyên khối, không khoá nào đổi). Cùng thân với excluded «Phí ngoài» → 200, GET hiện «Phí ngoài». Chiều đỏ: gỡ kiểm trùng ở lõi → PUT trùng trả 200, ca đỏ nêu reason vắng."
  - id: E2b
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/core/src/labels/**", "packages/api/src/labels/**", "packages/api/test-db/chan-trung-ten-gia-tri/**"]
    expected: "exit 0; trên Postgres: PUT đổi chéo (included «Không bao phí», excluded «Bao phí») → 200, GET trả đúng hai tên; PUT riêng–riêng trùng (hai lý do ngừng cùng «Mất liên lạc») → 400. Chiều đỏ: chặn đổi chéo → ca 200 đỏ."
  - id: E3
    criterion: AC-6
    executor: test
    layer: unit
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/settings/labels/**", "packages/core/src/labels/**"]
    expected: "exit 0; apps/web/src/app/(app)/settings/labels/cach-goi.test.ts: bảng viết trước trên bộ thật bangNhan(TU_VUNG_RONG): ô v:feeInclusion:excluded gõ «Bao phí» → loiCuaO nêu «Bao phí» (tên mặc định của giá trị kia), coTheLuu false; ô v:feeInclusion:included trống → không lỗi; hai ô withdrawnReason cùng «Mất liên lạc» → cả hai ô lỗi; sửa ô thành «Phí ngoài» → không lỗi, coTheLuu true. Chiều đỏ: loiCuaO bỏ kiểm trùng → ca đầu đỏ nêu ô."
  - id: E4
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    target: "http://localhost:3462/settings/labels"
    paths: ["apps/web/src/app/(app)/settings/labels/**", "packages/core/src/labels/**"]
    steps:
      - "Postgres dãy B (5572, cơ sở dữ liệu postgres, đã migrate, có bộ mẫu «[Mẫu] Sàn thử»). Mở máy chủ dev ở cổng của executors.ui-check bằng: env DATABASE_URL=postgres://postgres:quyhang@localhost:5572/postgres BETTER_AUTH_SECRET=dev-b-chuoi-thu-khong-dung-o-ban-that BETTER_AUTH_URL=http://localhost:3462 npm run dev -w @quy-hang/web -- -p 3462 (ghi log ra tệp). Đăng nhập quan-tri@mau.quy-hang.test bằng email + mã 6 số: mã in ở log máy chủ dòng «[ma-dang-nhap] <email> <mã>». Tắt máy chủ khi xong (luật 43 của đợt)."
      - "Chuẩn bị (bài chụp tự đủ): trong trang, fetch PUT /api/v1/company/labels thân {fields:[],values:[]} để mọi tên về mặc định; ghi mã trả vào observed"
      - "Khổ 1440: mở /settings/labels; ô «Điều kiện phí · Không bao phí» gõ «bao phí» → chụp evidence/E4-step1.png: dưới đúng ô ấy có câu lỗi nêu «Bao phí», nút «Lưu» khoá; ô «Điều kiện phí · Bao phí» (trống) không có câu lỗi"
      - "Sửa ô ấy thành «Phí ngoài» → chụp evidence/E4-step2.png: câu lỗi mất, nút «Lưu» bấm được. Không bấm Lưu."
    expected: "step1 có câu lỗi dưới đúng ô đang sửa nêu «Bao phí», nút Lưu khoá, ô anh em trống không lỗi; step2 không còn câu lỗi, nút Lưu bấm được."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E5
    criterion: AC-7
    executor: test
    layer: unit
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/settings/labels/**", "packages/core/src/labels/**"]
    expected: "exit 0; ca «màn và máy chủ cùng luật» trong cach-goi.test.ts: với mỗi ô của bảng viết trước (≥6 bộ: trùng riêng–mặc định, riêng–riêng, hoa thường, đổi chéo, khác tập, không trùng), coTheLuu(bộ màn) === dungDongNhan(thanLuu(bộ màn)).ok; số ô đếm bằng độ dài bảng. Chiều đỏ: màn dùng luật trùng riêng (chỉ riêng–riêng) → ô trùng riêng–mặc định lệch, ca đỏ nêu bộ."
  - id: E6
    criterion: AC-8
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/labels/**", "packages/core/src/statuses/**"]
    expected: "exit 0; toàn bộ test lõi gồm labels.test.ts (tên trường, từ vựng) và statuses — các ca cũ không sửa ý, chỉ ca «hai giá trị cùng tên» đổi chữ lỗi theo câu mới."
  - id: E7
    criterion: AC-6
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/cai-dat-san.md", "apps/web/src/app/(app)/settings/**/page.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm cai-dat-san (màn Cách gọi giữ khuôn MucCaiDat sau khi thêm câu lỗi). Chiều đỏ: thay MucCaiDatKhoi của cach-goi.tsx bằng Card trần → dòng «lệch:» nêu tệp."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
