<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng mời người vào sàn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 1.5rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; margin: 0 auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Hỏi-1 + Hỏi-4 · AC-1, AC-2, AC-5</p>
    <h1>Mời người vào sàn: mọi nhánh trả cùng một câu</h1>

    <svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng quản trị sàn mời người vào sàn">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ CONNECTORS (drawn first) ============ -->
      <!-- Start -> D1 -->
      <line x1="200" y1="220" x2="250" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 -> 409 (CÓ) -->
      <line x1="340" y1="276" x2="340" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 -> D2 (KHÔNG) -->
      <line x1="430" y1="220" x2="544" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> Dùng tài khoản cũ (CÓ) -->
      <line x1="640" y1="164" x2="640" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> Tạo tài khoản (KHÔNG) -->
      <line x1="640" y1="276" x2="640" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Dùng cũ -> merge -->
      <path d="M730 92 H764 Q772 92 772 100 V216" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- Tạo -> merge -->
      <path d="M730 360 H764 Q772 360 772 352 V224" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <!-- merge -> Gắn -->
      <line x1="776" y1="220" x2="812" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Gắn -> 201 (accent) -->
      <line x1="972" y1="220" x2="1040" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- 201 -> xin mã -->
      <line x1="1140" y1="264" x2="1140" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- xin mã -> D3 -->
      <line x1="1040" y1="544" x2="980" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 -> Vào sàn A (KHÔNG) -->
      <line x1="780" y1="544" x2="708" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 -> Màn Chọn sàn (CÓ) -->
      <line x1="880" y1="492" x2="880" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ CONNECTOR LABELS ============ -->
      <rect x="348" y="300" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="362" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="464" y="198" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="488" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="648" y="134" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="662" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="648" y="296" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="672" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="720" y="522" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="744" y="534" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="888" y="468" width="28" height="16" rx="2" fill="#f5f5f5"/>
      <text x="902" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <!-- ============ NODES ============ -->
      <!-- Start oval -->
      <rect x="40" y="188" width="160" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="120" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quản trị sàn A nhập</text>
      <text x="120" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">email + vai + khu</text>
      <text x="120" y="241" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /san/thanh-vien</text>

      <!-- D1 -->
      <polygon points="340,164 430,220 340,276 250,220" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="217" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Email đã là thành</text>
      <text x="340" y="231" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">viên của sàn A?</text>

      <!-- 409 end -->
      <rect x="240" y="340" width="200" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="340" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">409 · không đổi gì</text>
      <text x="340" y="383" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">da-la-thanh-vien</text>

      <!-- D2 -->
      <polygon points="640,164 736,220 640,276 544,220" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="217" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Email đã có</text>
      <text x="640" y="231" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tài khoản?</text>

      <!-- Dùng tài khoản cũ -->
      <rect x="550" y="64" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dùng tài khoản cũ</text>
      <text x="640" y="106" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">danh tính đã có</text>

      <!-- Tạo tài khoản -->
      <rect x="550" y="332" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo tài khoản</text>
      <text x="640" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">danh tính mới</text>

      <!-- Hỏi-4 chips -->
      <rect x="550" y="36" width="196" height="16" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="558" y="47" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">Hỏi-4 · gắn người đang ở sàn khác</text>
      <rect x="550" y="396" width="160" height="16" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="558" y="407" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">Hỏi-4 · được tạo tài khoản</text>

      <!-- Merge dot -->
      <circle cx="772" cy="220" r="4" fill="#2d3142"/>

      <!-- Hỏi-1 chip -->
      <rect x="812" y="148" width="160" height="32" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="820" y="161" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">Hỏi-1 · vào ngay,</text>
      <text x="820" y="173" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">không bước nhận lời</text>

      <!-- Gắn thành viên -->
      <rect x="812" y="188" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="892" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gắn thành viên sàn A</text>
      <text x="892" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đặt vai + giao khu</text>

      <!-- 201 focal -->
      <rect x="1040" y="176" width="200" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1140" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả cùng một câu 201</text>
      <text x="1140" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">201 + { userId }</text>
      <text x="1140" y="236" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chống dò: quản trị không</text>
      <text x="1140" y="250" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">biết đã chạy nhánh nào</text>

      <!-- Xin mã -->
      <rect x="1040" y="512" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1140" y="535" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người được mời xin mã,</text>
      <text x="1140" y="549" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rồi nhập mã</text>
      <text x="1140" y="565" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đăng nhập bằng mã 6 số</text>

      <!-- D3 -->
      <polygon points="880,492 980,544 880,596 780,544" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="541" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ngoài sàn A, còn ở</text>
      <text x="880" y="555" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sàn nào khác?</text>

      <!-- Vào sàn A end -->
      <rect x="528" y="516" width="180" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="618" y="541" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vào sàn A</text>
      <text x="618" y="557" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chỉ một sàn → vào thẳng</text>

      <!-- Màn Chọn sàn end -->
      <rect x="780" y="404" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="880" y="429" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Màn Chọn sàn</text>
      <text x="880" y="445" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">đang ở sàn khác</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="624" x2="1240" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DÁNG CHỈ LOẠI NÚT</text>

      <rect x="40" y="660" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm đầu / điểm cuối</text>

      <rect x="240" y="660" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước làm</text>

      <polygon points="372,666 384,660 396,666 384,672" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="404" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi rẽ nhánh</text>

      <circle cx="564" cy="666" r="4" fill="#2d3142"/>
      <text x="576" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Các nhánh nhập lại</text>

      <rect x="716" y="660" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="748" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu trả lời chống dò</text>

      <rect x="900" y="658" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="920" y="669" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">Hỏi-n</text>
      <text x="948" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm chủ kho đã chốt (khuyến nghị)</text>
    </svg>
  </div>
</body>
</html>
