<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lô mẫu trên bản thật</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:1120px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:0.35rem; }
    .subtitle { color:var(--color-muted); font-size:0.9rem; line-height:1.5; margin-bottom:1.25rem; max-width:84ch; }
    svg { width:100%; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Hình quyết định · Cổng Phạm vi · Hỏi-1 · AC-9</p>
    <h1>Hỏi-1: gõ mã lô trên bản thật — trống hay ra lô mẫu</h1>
    <p class="subtitle">Danh mục thật chưa có dãy và lô: Invest chưa cấp dãy, lô của sàn là hàng sau. Lối A để bản thật trống và thử bằng bộ kiểm; Lối B cho bản thật trả khu thấp tầng [Mẫu] như danh mục căn hộ mẫu.</p>
    <svg viewBox="0 0 1120 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1: gõ mã lô trên bản thật — trống hay ra lô mẫu</title>
      <desc id="d">Hai cột so sánh. Lối A máy khuyên: người dùng gõ LK1-02 trên bản thật thấy danh mục chưa có khu thấp tầng, không có gì tự điền; thử bằng bộ kiểm tự đưa khu thấp tầng mẫu 42 lô vào. Cái giá: chưa ai thử gõ mã lô trên bản thật tới khi Invest cấp dãy hoặc sàn có lô của mình. Lối B: bản thật trả lô LK1-02 Mẫu, tự điền liền kề, đất 81 mét vuông, 4 tầng, mặt tiền 4,5 mét; thử ngay trên bản thật như danh mục căn hộ mẫu. Cái giá: người dùng thật có thể tự điền thuộc tính của một lô không tồn tại. Chung: đổi lối sau là đổi danh mục lô mặc định, bộ tra lô giữ nguyên.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect y="0" width="1120" height="776" fill="#f5f5f5"/>
<rect x="64" y="28" width="136" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/>
<text x="132" y="40" fill="#ba4513" font-size="9" letter-spacing="0.08em" font-family="'Geist Mono', monospace" text-anchor="middle">LỐI A · MÁY KHUYÊN</text>
<text x="64" y="72" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Bản thật chưa trả lô nào, chờ danh mục thật</text>
<rect x="64" y="92" width="464" height="356" rx="8" fill="#f5f5f5"/>
<rect x="64" y="92" width="464" height="356" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<path d="M296,228 L296,284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="88" y="116" width="416" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<circle cx="116" cy="144" r="12" fill="none" stroke="#4f5d75" stroke-width="1"/>
<text x="116" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1</text>
<text x="140" y="148" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="start">GÕ «LK1-02» TRÊN BẢN THẬT</text>
<text x="104" y="184" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">«Danh mục chưa có khu thấp tầng»</text>
<text x="104" y="206" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">không có gì tự điền — vẫn nhập tay như hôm nay</text>
<rect x="88" y="288" width="416" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<circle cx="116" cy="316" r="12" fill="none" stroke="#4f5d75" stroke-width="1"/>
<text x="116" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2</text>
<text x="140" y="320" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="start">THỬ BẰNG GÌ</text>
<text x="104" y="356" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Bộ kiểm tự đưa khu thấp tầng mẫu vào</text>
<text x="104" y="378" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">42 lô mẫu, đủ ba kết quả: thấy lô · chưa có · không đọc được</text>
<text x="88" y="432" fill="#ba4513" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="start">Bản thật không bao giờ trả một lô không có thật.</text>
<line x1="64" y1="480" x2="528" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="64" y="504" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace" text-anchor="start">CÁI GIÁ</text>
<text x="64" y="528" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">Chưa ai thử gõ mã lô trên bản thật tới khi Invest cấp dãy</text>
<text x="64" y="548" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">hoặc sàn có lô của mình trong Quỹ hàng (hàng sau).</text>
<rect x="592" y="28" width="52" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="618" y="40" fill="#4f5d75" font-size="9" letter-spacing="0.08em" font-family="'Geist Mono', monospace" text-anchor="middle">LỐI B</text>
<text x="592" y="72" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Bản thật trả khu thấp tầng [Mẫu]</text>
<rect x="592" y="92" width="464" height="356" rx="8" fill="#f5f5f5"/>
<rect x="592" y="92" width="464" height="356" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<path d="M824,228 L824,284" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="616" y="116" width="416" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<circle cx="644" cy="144" r="12" fill="none" stroke="#4f5d75" stroke-width="1"/>
<text x="644" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1</text>
<text x="668" y="148" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="start">GÕ «LK1-02» TRÊN BẢN THẬT</text>
<text x="632" y="184" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Lô LK1-02 [Mẫu] · Khu thấp tầng</text>
<text x="632" y="206" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">tự điền: liền kề · đất 81 m² · 4 tầng · mặt tiền 4,5 m</text>
<rect x="616" y="288" width="416" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<circle cx="644" cy="316" r="12" fill="none" stroke="#4f5d75" stroke-width="1"/>
<text x="644" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2</text>
<text x="668" y="320" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="start">THỬ BẰNG GÌ</text>
<text x="632" y="356" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Gõ thử ngay trên bản thật</text>
<text x="632" y="378" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">như danh mục căn hộ mẫu đang có</text>
<text x="616" y="432" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif" text-anchor="start">Lô [Mẫu] nằm cạnh hàng thật trên bản thật.</text>
<line x1="592" y1="480" x2="1056" y2="480" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="592" y="504" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace" text-anchor="start">CÁI GIÁ</text>
<text x="592" y="528" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">Người dùng thật thấy lô [Mẫu] và có thể tự điền</text>
<text x="592" y="548" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start">thuộc tính của một lô không tồn tại.</text>
<rect x="64" y="596" width="992" height="84" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
<text x="88" y="620" fill="#4f5d75" font-size="9" font-weight="500" letter-spacing="0.18em" font-family="'Geist Mono', monospace" text-anchor="start">CHUNG CHO HAI LỐI</text>
<text x="88" y="648" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Đổi lối sau là đổi một chỗ — danh mục lô mặc định; bộ tra lô giữ nguyên.</text>
<text x="88" y="668" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Hai lối dùng cùng bộ tra và cùng 42 lô mẫu; chỉ khác bản thật có trả khu mẫu cho người dùng thật hay không.</text>
<line x1="32" y1="712" x2="1088" y2="712" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="740" fill="#4f5d75" font-size="9" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="start">CHÚ GIẢI</text>
<rect x="128" y="728" width="40" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="180" y="740" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Lối máy khuyên</text>
<rect x="320" y="728" width="40" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="372" y="740" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Lối khác</text>
<circle cx="500" cy="736" r="8" fill="none" stroke="#4f5d75" stroke-width="1"/>
<text x="516" y="740" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">bước 1: người dùng thật thấy gì · bước 2: thử bằng gì</text>
    </svg>
  </main>
</body>
</html>
