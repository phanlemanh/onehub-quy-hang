schema_version: 1
feature_slug: truong-rieng-toi-thieu
# Lệnh máy: `executors.test.core`, `executors.test.web`, `executors.test.isolation` (bộ kiểm cách ly packages/db/tests VÀ
# bộ kiểm API trên cơ sở dữ liệu packages/api/test-db — cần DATABASE_URL tới Postgres dãy B, cổng 5572),
# `executors.script.ro_ri`. exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output` — dòng reporter liệt tên ca — và người
# chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO». Dữ liệu: sàn thử qua đường ghi
# thật, tên «[Tên]», số `0900 000 0xx`. Mã trường trong ca: «can_goc» (dựng từ «Căn góc»), «noi_that_ban_giao»,
# «nguon_khach», «gio_goi_duoc».
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/truong-rieng/truong.test.ts có mặt và ok: «trường riêng: tạo trường của hàng» — quản trị sàn A PUT /api/v1/company/fields với [{target:\"listing\",kind:\"bool\",label:\"Căn góc\"},{target:\"listing\",kind:\"single_select\",label:\"Nội thất bàn giao\",options:[{label:\"Cơ bản\"},{label:\"Đầy đủ\"},{label:\"Thô\"}]}] → 200; GET trả fields deepEqual hai trường {code:\"can_goc\",kind:\"bool\",options:[],dataClass:\"custom_field\",archived:false} và {code:\"noi_that_ban_giao\",options có ba mã co_ban, day_du, tho}; đọc bằng vai chủ: custom_fields của A có đúng hai dòng data_class custom_field, updated_by là quản trị A; custom_field_events thêm đúng hai sự kiện (đếm trước/sau) actor là quản trị A. Chiều đỏ: PUT lần hai cùng bộ → 0 sự kiện mới (dòng không đổi không ghi lại); bỏ trigger nhật ký trong bản sao migration → ca đỏ nêu custom_field_events."
    paths: [packages/api/src/custom-fields/**, packages/core/src/custom-fields/**, packages/db/migrations/043_truong_rieng.sql, packages/api/test-db/truong-rieng/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

