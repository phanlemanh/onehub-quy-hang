    cmd: config:executors.test.connect
    expected: "exit 0; trong packages/connect/src/catalog-confirmation.test.ts ca «khuôn v1: ba sự kiện của lõi đọc được» có mặt và ok — ba sự kiện dựng bằng dungKhungToa, dungThuocTinhCan, dungBaoSai của @quy-hang/core/confirmation (không viết tay) trên danh mục mẫu qua parseCatalogConfirmation ra ok: true và deepEqual đầu ra hàm dựng; CATALOG_CONFIRMATION_SCHEMA_VERSION === 1; ca «tệp ví dụ trùng đầu ra hàm dựng» có mặt và ok — đọc catalog-confirmation.example.json theo đường suy từ vị trí tệp kiểm, so chuỗi JSON.stringify(…, null, 2) + '\\n' của ba sự kiện dựng lại với khoá bên nhận thử cố định: bằng nhau; ca «phiên bản và loại sự kiện sai bị từ chối» có mặt và ok — ma trận viết trước schemaVersion 0, 2, vắng và eventType 'listing_status', mỗi phần tử một lần so, số lần so bằng 4: ok: false với path ['schemaVersion'] hoặc ['eventType']. Chiều đỏ: khuôn bỏ literal phiên bản → phần tử schemaVersion 2 đỏ nêu path."
    paths: [packages/connect/src/catalog-confirmation*, packages/core/src/confirmation/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

