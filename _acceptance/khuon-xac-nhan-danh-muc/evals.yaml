schema_version: 1
feature_slug: khuon-xac-nhan-danh-muc
# Lệnh máy: `executors.test.core` (lõi: thoả thuận, hàm dựng), `executors.test.connect` (khuôn), `executors.script.typecheck`
# (dấu kiểu của lõi), `executors.script.nhap_tac_tu` (migrate + bộ cách ly + test-db trên Postgres dãy G, cổng 5573).
# exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output` — dòng reporter liệt tên ca — và người chấm đối chiếu từng tên
# ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO». Mọi ma trận viết trước trong tệp kiểm, số lần so đếm
# bằng biến đếm và so với độ dài ma trận.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/agreements.test.ts ca «xác nhận danh mục: trần theo loại, bảy lớp» có mặt và ok — ma trận viết trước bảy lớp của DATA_CLASSES × specialTerms (false, true), mỗi phần tử một lần so, số lần so bằng 14: thoả thuận catalog_confirmation outbound liệt ĐỦ bảy lớp (dựng tay, như hàng lệch trong cơ sở dữ liệu) cho mayFlow ok: true chỉ ở catalog, mọi lớp khác ok: false với reason chứa «Xác nhận danh mục» (riêng source giữ lý do lớp nguồn); ca «xác nhận danh mục: lỗi cấu trúc» có mặt và ok — agreementErrors trả [] cho { outbound, [catalog], specialTerms false } (đối chứng dương); ma trận dựng bằng lặp DATA_CLASSES trừ catalog (thêm từng lớp vào [catalog]) cộng hai phần tử chiều vào và specialTerms true, số lần so bằng 8 (so với DATA_CLASSES.length − 1 + 2): mỗi lần có ít nhất một lỗi nhắc «Xác nhận danh mục» (source, company_internal được mang thêm lỗi cũ của chúng); ca «sáu loại cũ và ai_processing giữ hành vi» có mặt và ok — với mỗi loại khác catalog_confirmation trong CONNECTION_KINDS (đếm bằng CONNECTION_KINDS.length − 1), thoả thuận outbound có transaction + specialTerms true vẫn cho transaction chảy. Chiều đỏ: gỡ nhánh trần theo loại trong mayFlow → phần tử transaction/specialTerms true của ma trận đỏ, thông điệp nêu lớp ấy."
    paths: [packages/core/src/agreements.ts, packages/core/src/agreements.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.script.nhap_tac_tu
    expected: "exit 0; trong packages/db/tests/xac-nhan-danh-muc.test.mjs (chạy dưới vai quy_hang_app, đặt app.current_company_id, mỗi ca rollback) ca «xác nhận danh mục: cơ sở dữ liệu chỉ nhận lớp danh mục» có mặt và ok — ma trận viết trước sáu lớp ngoài danh mục (shareable_listing, company_internal, custom_field, source, transaction, behavior), mỗi lớp một insert data_classes = {catalog, <lớp>}, số lần so bằng 6: với shareable_listing, custom_field, transaction, behavior err.constraint đúng bằng agreements_xac_nhan_chi_danh_muc; với source, company_internal err.constraint là ràng buộc cũ (agreements_never_source, agreements_internal_stays — ghim từng tên) VÀ cùng ca, trong savepoint gỡ hai ràng buộc cũ (bằng chủ bảng), cùng insert ra err.constraint đúng bằng agreements_xac_nhan_chi_danh_muc; thêm ba phần tử: direction inbound, special_terms true, và update một dòng hợp lệ sang data_classes = {catalog, transaction} — mỗi lần err.constraint = agreements_xac_nhan_chi_danh_muc; đối chứng dương cùng ca: { catalog_confirmation, outbound, {catalog}, special_terms false } thêm được (rowCount 1). Ca «mọi loại kết nối đều thêm được» có mặt và ok — danh sách loại đọc từ thân 040 (đọc tệp theo đường suy từ vị trí tệp kiểm), mỗi loại thêm một dòng hợp lệ, số dòng thêm bằng độ dài danh sách và bằng 8. Ca «thứ tự của bản thật: áp lại 040 sau 052» có mặt và ok — trên cơ sở dữ liệu đã có mọi migration, trong giao dịch chủ bảng chạy lại nguyên thân tệp 040 (không lỗi), rồi phần tử transaction và đối chứng dương của ma trận chạy lại cho cùng kết quả. Ca «không migration nào sau 040 đổi lại ràng buộc» có mặt và ok — mọi tệp packages/db/migrations/NNN_*.sql với NNN > 040 không chứa chuỗi agreements_kind_check hay agreements_xac_nhan_chi_danh_muc; đối chứng âm cùng hàm quét: một chuỗi thử chứa agreements_kind_check bị gọi tên. Chiều đỏ: bỏ ràng buộc trong migration 040 → phần tử transaction thêm được, ca đỏ nêu lớp."
    paths: [packages/db/migrations/**, packages/db/tests/xac-nhan-danh-muc.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

