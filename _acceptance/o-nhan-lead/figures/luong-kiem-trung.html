<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng kiểm trùng lead</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng quyết định · o-nhan-lead · Cổng Phạm vi</p>
    <h1>Lead đi đâu sau khi telesales bấm gửi</h1>

    <svg viewBox="0 0 1240 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng kiểm trùng khi telesales gửi lead">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ CONNECTORS (drawn first) ============ -->
      <!-- Gửi lead -> Lõi kiểm -->
      <line x1="216" y1="120" x2="264" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lõi kiểm -> CSDL (ĐỦ) -->
      <line x1="424" y1="120" x2="472" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lõi kiểm -> Lỗi dưới ô (SAI) -->
      <line x1="344" y1="148" x2="344" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- CSDL -> D1 -->
      <line x1="712" y1="120" x2="760" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 -> Căn trùng (CÓ) — accent: căn trùng thắng -->
      <line x1="928" y1="120" x2="980" y2="120" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- D1 -> D2 (KHÔNG) -->
      <line x1="844" y1="172" x2="844" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> Chủ trùng (CÓ) -->
      <line x1="928" y1="292" x2="980" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 -> Không trùng (KHÔNG) -->
      <line x1="844" y1="344" x2="844" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ CONNECTOR LABELS (6px+ gap) ============ -->
      <rect x="436" y="96" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ĐỦ</text>

      <rect x="352" y="172" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="366" y="181" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SAI</text>

      <rect x="940" y="96" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="954" y="105" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="852" y="200" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="874" y="209" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="940" y="268" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="954" y="277" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="852" y="368" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="874" y="377" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <!-- ============ NODES ============ -->
      <!-- Start: Telesales gửi lead -->
      <rect x="40" y="92" width="176" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="40" y="92" width="176" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="128" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telesales gửi lead</text>
      <text x="128" y="132" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">(năm mục)</text>

      <!-- Step: Lõi kiểm năm mục -->
      <rect x="264" y="92" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="344" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lõi kiểm năm mục</text>

      <!-- End: Lỗi dưới ô -->
      <rect x="264" y="212" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="344" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lỗi dưới ô</text>

      <!-- Step: CSDL lấy hai dữ kiện -->
      <rect x="472" y="76" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="592" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cơ sở dữ liệu lấy hai dữ kiện</text>
      <text x="592" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trong sàn đang làm</text>
      <text x="592" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hàng mở trên căn · đầu chủ của chủ nhà</text>

      <!-- Decision 1 (accent: căn trùng thắng chủ trùng) -->
      <polygon points="844,68 928,120 844,172 760,120" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
      <text x="844" y="118" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có hàng mở</text>
      <text x="844" y="132" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">trên căn?</text>

      <!-- End: Căn trùng -->
      <rect x="980" y="76" width="240" height="88" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1100" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn trùng</text>
      <text x="1100" y="124" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">tin bổ sung cho đầu chủ của hàng</text>
      <text x="1100" y="140" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">cho «Bỏ lead này», có ghi lại</text>

      <!-- Decision 2 -->
      <polygon points="844,240 928,292 844,344 760,292" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="844" y="290" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chủ nhà đã</text>
      <text x="844" y="304" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">có đầu chủ?</text>

      <!-- End: Chủ trùng -->
      <rect x="980" y="264" width="240" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1100" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chủ trùng</text>
      <text x="1100" y="306" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">lead về đầu chủ ấy</text>

      <!-- End: Không trùng -->
      <rect x="712" y="404" width="264" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="844" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không trùng</text>
      <text x="844" y="446" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">chờ chia theo luật của sàn (hàng 25)</text>

      <!-- ============ ANNOTATIONS ============ -->
      <text x="472" y="204" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Hàng mở = Chưa đủ để rao · Đang bán</text>
      <text x="472" y="224" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">· Đang giao dịch · Tạm ngừng</text>

      <text x="40" y="420" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Telesales chỉ thấy kết quả + tên đầu chủ —</text>
      <text x="40" y="440" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">không hàng, không số (luật 21)</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="488" x2="1200" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH KHỐI MANG LOẠI</text>
      <rect x="40" y="520" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Đầu / kết quả (bầu dục)</text>
      <rect x="240" y="520" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="272" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước (chữ nhật)</text>
      <polygon points="420,526 432,520 444,526 432,532" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="452" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh (thoi)</text>
      <line x1="600" y1="526" x2="628" y2="526" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="636" y="530" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Căn trùng thắng chủ trùng — hỏi trước</text>
    </svg>
  </div>
</body>
</html>
