<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng nhãn trạng thái</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:1344px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:1.25rem; }
    svg { width:100%; min-width:960px; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Luồng dữ liệu · Hỏi-1, Hỏi-2 · AC-1, AC-3, AC-5, AC-6, AC-7, AC-9</p>
    <h1>Nhãn riêng: định nghĩa ở sàn, căn trỏ mã, ra ngoài chỉ trạng thái chuẩn</h1>

    <svg viewBox="0 0 1344 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng nhãn trạng thái từ màn Trạng thái và trình sửa ô tới bản hàng, rồi tới các màn trong sàn và qua lõi banRaNgoai ra trang khách">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Nền -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Vùng: Trong sàn -->
      <rect x="912" y="36" width="400" height="152" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
      <rect x="924" y="40" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="928" y="52" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRONG SÀN</text>

      <!-- Vùng: Ra ngoài -->
      <rect x="912" y="400" width="400" height="176" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
      <rect x="924" y="404" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="928" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RA NGOÀI</text>

      <!-- Mũi tên (vẽ trước hộp) -->
      <!-- Màn Trạng thái → PUT -->
      <line x1="192" y1="104" x2="232" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- PUT → company_settings -->
      <line x1="392" y1="104" x2="432" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="400" y="80" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="412" y="92" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GHI</text>
      <!-- company_settings → listing_events (sự kiện trỏ mã nhãn) -->
      <line x1="532" y1="160" x2="532" y2="284" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="544" y="212" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="548" y="224" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MÃ NHÃN</text>
      <!-- Trình sửa ô → POST -->
      <line x1="192" y1="332" x2="232" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- POST → listing_events -->
      <line x1="392" y1="332" x2="432" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="400" y="308" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="412" y="320" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GHI</text>
      <!-- listing_events → listings -->
      <line x1="632" y1="332" x2="672" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- listings → trong sàn -->
      <path d="M 772,284 V 128 Q 772,120 780,120 H 936" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- listings → lõi banRaNgoai (nhánh ra ngoài) -->
      <path d="M 772,380 V 488 Q 772,496 780,496 H 936" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- lõi → trang khách, bản phát hàng -->
      <line x1="1088" y1="496" x2="1128" y2="496" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Hộp -->
      <!-- 1. Màn Trạng thái -->
      <rect x="32" y="64" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="64" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="70" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="56" y="81" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÀN</text>
      <text x="112" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Màn «Trạng thái»</text>
      <text x="112" y="128" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">quản trị sàn</text>

      <!-- 2. PUT /company/statuses -->
      <rect x="232" y="64" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="64" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="70" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="256" y="81" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="312" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lưu bộ nhãn</text>
      <text x="312" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PUT /company/statuses</text>

      <!-- 3. company_settings — định nghĩa nhãn -->
      <rect x="432" y="48" width="200" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="48" width="200" height="112" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="440" y="54" width="32" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="456" y="65" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LƯU</text>
      <text x="532" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Định nghĩa nhãn</text>
      <text x="532" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">company_settings</text>
      <text x="532" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">labels.status.&lt;mã&gt;</text>
      <text x="532" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">= {label, anchor}</text>
      <text x="532" y="148" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nhật ký · luật dòng theo sàn</text>

      <!-- 4. Bảng hàng — trình sửa ô -->
      <rect x="32" y="284" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="284" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="290" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="56" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÀN</text>
      <text x="112" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng hàng</text>
      <text x="112" y="352" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trình sửa ô (đầu chủ)</text>

      <!-- 5. POST sự kiện -->
      <rect x="232" y="284" width="160" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="284" width="160" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="290" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="256" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="312" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi sự kiện</text>
      <text x="312" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /listings/{id}/events</text>
      <text x="312" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status_changed {to, label}</text>

      <!-- 6. listing_events -->
      <rect x="432" y="284" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="284" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="440" y="290" width="32" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="456" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LƯU</text>
      <text x="532" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sự kiện của căn</text>
      <text x="532" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listing_events</text>

      <!-- 7. Bản hàng listings -->
      <rect x="672" y="284" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="284" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="680" y="290" width="32" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="696" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LƯU</text>
      <text x="772" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản hàng</text>
      <text x="772" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">listings</text>
      <text x="772" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">standard_status + status_label</text>

      <!-- 8. Trong sàn: Bảng hàng, thẻ điện thoại, Hôm nay -->
      <rect x="936" y="72" width="352" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="72" width="352" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="944" y="78" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="960" y="89" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÀN</text>
      <text x="1112" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng hàng máy tính · thẻ điện thoại · Hôm nay</text>
      <text x="1112" y="140" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chữ «Giữ chỗ», màu của Đang giao dịch</text>

      <!-- 9. Lõi banRaNgoai (focal) -->
      <rect x="936" y="440" width="152" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="440" width="152" height="112" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="944" y="446" width="32" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="960" y="457" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LÕI</text>
      <text x="1012" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lõi</text>
      <text x="1012" y="500" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">banRaNgoai</text>
      <text x="1012" y="520" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chỉ availability</text>
      <text x="1012" y="534" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">của trạng thái chuẩn</text>

      <!-- 10. Trang khách, bản phát hàng -->
      <rect x="1128" y="440" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="1128" y="440" width="160" height="112" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1136" y="446" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1158" y="457" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRANG</text>
      <text x="1208" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang <tspan font-family="'Geist Mono', monospace" font-weight="500" font-size="11">/s/&lt;mã&gt;</tspan></text>
      <text x="1208" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản phát hàng</text>
      <text x="1208" y="520" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«đang giao dịch»</text>
      <text x="1208" y="534" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không chữ nhãn</text>

      <!-- Ghi chú (callout) -->
      <!-- Sàn B không thấy — cạnh company_settings -->
      <path d="M 652,56 Q 640,56 636,68" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="634" cy="72" r="2" fill="#2d3142"/>
      <text x="656" y="60" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Sàn B không thấy</text>

      <!-- đếm, lọc theo sáu trạng thái chuẩn — trên nhánh trong sàn -->
      <path d="M 792,232 Q 780,232 775,220" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="772" cy="216" r="2" fill="#2d3142"/>
      <text x="796" y="236" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">đếm, lọc theo sáu trạng thái chuẩn</text>

      <!-- không có trạng thái thứ bảy — ở bản hàng -->
      <path d="M 736,424 Q 716,412 713,386" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="712" cy="382" r="2" fill="#2d3142"/>
      <text x="748" y="440" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">không có trạng thái thứ bảy</text>

      <!-- Chú giải -->
      <line x1="32" y1="608" x2="1312" y2="608" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="640" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="120" y="628" width="24" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="152" y="640" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Cửa duy nhất ra ngoài</text>

      <rect x="304" y="628" width="24" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="336" y="640" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Lưu theo từng sàn</text>

      <rect x="464" y="628" width="24" height="16" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="496" y="640" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Người ngoài sàn xem</text>

      <line x1="640" y1="636" x2="672" y2="636" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="680" y="640" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Sự kiện trỏ mã nhãn</text>

      <line x1="816" y1="636" x2="848" y2="636" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="856" y="640" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Dữ liệu rời sàn</text>

      <path d="M 976,636 H 1008" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="1016" y="640" fill="#2d3142" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Ghi chú</text>
    </svg>
  </main>
</body>
</html>
