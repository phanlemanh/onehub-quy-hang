<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gỡ nhãn đang dùng</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:1024px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:1.25rem; }
    svg { width:100%; min-width:768px; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Lưu đồ · Hỏi-3 · AC-8</p>
    <h1>Gỡ nhãn đang dùng: máy hỏi nhãn thay cùng neo</h1>

    <svg viewBox="0 0 1024 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lưu đồ gỡ nhãn «Giữ chỗ»: không còn căn mang thì gỡ thẳng; còn căn mang thì hỏi nhãn thay, mỗi căn một sự kiện, căn vẫn Đang giao dịch">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Nền -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Vùng: Nhánh phụ -->
      <rect x="32" y="456" width="208" height="208" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
      <rect x="44" y="460" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="48" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NHÁNH PHỤ</text>

      <!-- Mũi tên (vẽ trước hộp) -->
      <!-- Bắt đầu → điểm rẽ -->
      <line x1="432" y1="80" x2="432" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- KHÔNG → gỡ thẳng -->
      <line x1="528" y1="176" x2="640" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="152" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="584" y="164" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <!-- CÓ → hộp hỏi -->
      <line x1="432" y1="232" x2="432" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="444" y="252" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="448" y="264" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÓ</text>
      <!-- hộp hỏi → PUT kèm replace -->
      <line x1="432" y1="416" x2="432" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="444" y="436" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="448" y="448" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHỌN → LƯU</text>
      <!-- PUT → sự kiện mỗi căn -->
      <line x1="432" y1="536" x2="432" y2="576" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- sự kiện → kết thúc -->
      <line x1="432" y1="680" x2="432" y2="720" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhánh phụ: PUT không replace → 409 -->
      <line x1="136" y1="552" x2="136" y2="592" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Hộp -->
      <!-- Bắt đầu -->
      <rect x="300" y="32" width="264" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="300" y="32" width="264" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="432" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quản trị bấm gỡ «Giữ chỗ»</text>

      <!-- Điểm rẽ -->
      <polygon points="432,120 528,176 432,232 336,176" fill="#f5f5f5"/>
      <polygon points="432,120 528,176 432,232 336,176" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="432" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">còn căn mang?</text>

      <!-- KHÔNG: gỡ thẳng (kết thúc) -->
      <rect x="640" y="144" width="320" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="640" y="144" width="320" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gỡ thẳng</text>
      <text x="800" y="190" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Lưu ghi <tspan font-family="'Geist Mono', monospace" font-size="9">value null</tspan> (một sự kiện nhật ký)</text>

      <!-- CÓ: hộp hỏi nhãn thay (focal) -->
      <rect x="252" y="288" width="360" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="252" y="288" width="360" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="260" y="294" width="56" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="288" y="305" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỘP HỎI</text>
      <text x="432" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">[n] căn đang là «Giữ chỗ». Chuyển chúng sang:</text>
      <!-- lựa chọn 1: nhãn mặc định -->
      <rect x="284" y="340" width="296" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <circle cx="300" cy="352" r="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="300" cy="352" r="2.5" fill="#2d3142"/>
      <text x="312" y="356" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">«Đang giao dịch»</text>
      <text x="568" y="356" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="end">nhãn mặc định</text>
      <!-- lựa chọn 2: nhãn khác cùng neo -->
      <rect x="284" y="372" width="296" height="24" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <circle cx="300" cy="384" r="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="388" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">nhãn khác cùng neo</text>

      <!-- PUT kèm replace -->
      <rect x="312" y="472" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="312" y="472" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="320" y="478" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="336" y="489" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="432" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PUT kèm replace</text>
      <text x="432" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PUT /company/statuses</text>

      <!-- Mỗi căn một sự kiện -->
      <rect x="272" y="576" width="320" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="576" width="320" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="280" y="582" width="32" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="296" y="593" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LƯU</text>
      <text x="432" y="616" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mỗi căn một sự kiện</text>
      <text x="432" y="634" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">status_changed {to: Đang giao dịch,</text>
      <text x="432" y="648" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">label: nhãn thay}</text>
      <text x="432" y="666" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ghi tên quản trị</text>

      <!-- Kết thúc -->
      <rect x="300" y="720" width="264" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="300" y="720" width="264" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="432" y="748" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn vẫn Đang giao dịch</text>

      <!-- Nhánh phụ: PUT gỡ không replace -->
      <rect x="56" y="496" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="496" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PUT gỡ không replace</text>
      <text x="136" y="536" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PUT /company/statuses</text>
      <!-- 409 -->
      <rect x="56" y="592" width="160" height="48" rx="20" fill="#f5f5f5"/>
      <rect x="56" y="592" width="160" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="620" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">409 nêu số căn</text>

      <!-- Ghi chú (callout) -->
      <!-- không sửa thẳng bản hàng -->
      <path d="M 628,624 Q 612,616 598,620" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="594" cy="620" r="2" fill="#2d3142"/>
      <text x="636" y="632" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">không sửa thẳng bản hàng</text>

      <!-- không đổi trạng thái chuẩn -->
      <path d="M 628,740 Q 600,732 570,744" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="566" cy="744" r="2" fill="#2d3142"/>
      <text x="636" y="748" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">không đổi trạng thái chuẩn</text>

      <!-- Chú giải -->
      <line x1="32" y1="800" x2="992" y2="800" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="832" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="120" y="820" width="32" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="832" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Bắt đầu · kết thúc</text>

      <polygon points="296,818 308,828 296,838 284,828" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="832" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Điểm rẽ</text>

      <rect x="384" y="820" width="24" height="16" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="416" y="832" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Bước</text>

      <rect x="472" y="820" width="24" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="504" y="832" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Ghi vào nhật ký căn</text>

      <rect x="640" y="820" width="24" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="672" y="832" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Máy hỏi người</text>

      <path d="M 792,828 H 824" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="832" y="832" fill="#2d3142" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Ghi chú</text>
    </svg>
  </main>
</body>
</html>
