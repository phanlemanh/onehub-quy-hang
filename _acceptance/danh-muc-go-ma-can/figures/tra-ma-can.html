<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Một lần tra mã căn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1184px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Cây quyết định · Gõ mã căn ra thuộc tính căn</p>
    <h1>Một lần tra mã căn: bốn kết cục, không kết cục nào điền đoán</h1>

    <svg viewBox="0 0 1184 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chuỗi gõ được chuẩn hoá, đọc theo cách đọc mã của dự án, rồi rẽ ra bốn kết cục: không đọc được, chưa có trong danh mục, khớp nhiều dự án, hoặc có trong danh mục và điền đủ thuộc tính">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Mũi tên (vẽ trước nút) -->
      <line x1="240" y1="96" x2="296" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="536" y1="96" x2="588" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ 1: không đọc được (phải) -->
      <line x1="812" y1="96" x2="904" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ 1: đọc được (xuống) -->
      <line x1="700" y1="160" x2="700" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ 2: không căn nào (trái) -->
      <line x1="588" y1="288" x2="536" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ 2: nhiều dự án (phải) -->
      <line x1="812" y1="288" x2="904" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ 2: đúng một căn (xuống, tâm điểm) -->
      <line x1="700" y1="352" x2="700" y2="416" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Nhãn mũi tên -->
      <rect x="830" y="68" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="858" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="708" y="184" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="712" y="196" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÓ</text>

      <rect x="540" y="260" width="44" height="16" rx="2" fill="#f5f5f5"/>
      <text x="562" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0 CĂN</text>

      <rect x="816" y="260" width="84" height="16" rx="2" fill="#f5f5f5"/>
      <text x="858" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NHIỀU DỰ ÁN</text>

      <rect x="708" y="376" width="92" height="16" rx="2" fill="#f5f5f5"/>
      <text x="712" y="388" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐÚNG MỘT CĂN</text>

      <!-- Ghi chú biên: cách đọc mã là dữ liệu -->
      <text x="688" y="188" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">Cách đọc mã là dữ liệu:</text>
      <text x="688" y="206" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">mỗi dự án một dòng cách đọc.</text>

      <!-- Điểm đầu: người gõ -->
      <rect x="40" y="64" width="200" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="64" width="200" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gõ mã căn</text>
      <text x="140" y="112" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mọi vai trong sàn gọi được</text>

      <!-- Bước: chuẩn hoá -->
      <rect x="296" y="56" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="56" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="416" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chuẩn hoá chuỗi gõ</text>
      <text x="416" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a 12 6 · A1206 · a/12/06</text>
      <text x="416" y="120" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cùng ra mã chuẩn A-12.06</text>

      <!-- Rẽ 1: đọc theo cách đọc của dự án -->
      <polygon points="700,32 812,96 700,160 588,96" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="92" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc được theo cách</text>
      <text x="700" y="108" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đọc mã của dự án?</text>

      <!-- Rẽ 2: danh mục có căn -->
      <polygon points="700,224 812,288 700,352 588,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="700" y="284" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Danh mục có căn</text>
      <text x="700" y="300" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mang mã chuẩn này?</text>

      <!-- Kết cục: không đọc được -->
      <rect x="904" y="56" width="240" height="80" rx="20" fill="#f5f5f5"/>
      <rect x="904" y="56" width="240" height="80" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1024" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không đọc được</text>
      <text x="1024" y="104" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">báo kèm mẫu mã của từng dự án</text>
      <text x="1024" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XYZ · A-12 · 12.06</text>

      <!-- Kết cục: chưa có trong danh mục -->
      <rect x="296" y="248" width="240" height="80" rx="20" fill="#f5f5f5"/>
      <rect x="296" y="248" width="240" height="80" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="416" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc được, chưa có trong danh mục</text>
      <text x="416" y="296" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">báo rõ, không điền thuộc tính nào</text>
      <text x="416" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">C-01.01 · A-16.01 · A-01.07</text>

      <!-- Kết cục: khớp nhiều dự án -->
      <rect x="904" y="248" width="240" height="80" rx="20" fill="#f5f5f5"/>
      <rect x="904" y="248" width="240" height="80" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1024" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Khớp căn ở nhiều dự án</text>
      <text x="1024" y="296" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">liệt ứng viên, không chọn hộ</text>
      <text x="1024" y="312" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chọn dự án thì chỉ ra căn dự án ấy</text>

      <!-- Kết cục: có trong danh mục (tâm điểm) -->
      <rect x="520" y="416" width="360" height="104" rx="20" fill="#f5f5f5"/>
      <rect x="520" y="416" width="360" height="104" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="700" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có trong danh mục: điền đủ thuộc tính</text>
      <text x="700" y="464" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dự án · toà · tầng · trục · diện tích · phòng ngủ</text>
      <text x="700" y="480" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hướng · mã căn chuẩn · mã định danh căn</text>
      <text x="700" y="502" fill="#ba4513" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trường danh mục trống → để trống, không lấy căn khác</text>

      <!-- Chú giải -->
      <line x1="40" y1="544" x2="1144" y2="544" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="132" y="560" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="570" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Điểm đầu, kết cục trả về</text>

      <rect x="324" y="560" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="356" y="570" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bước</text>

      <polygon points="412,566 424,560 436,566 424,572" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="444" y="570" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Rẽ nhánh</text>

      <rect x="524" y="560" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="556" y="570" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Kết cục điền thuộc tính — duy nhất trong bốn</text>    </svg>
  </div>
</body>
</html>
