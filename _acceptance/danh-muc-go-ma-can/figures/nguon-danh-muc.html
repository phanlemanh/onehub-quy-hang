<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nguồn danh mục căn</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1216px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Luồng hai làn · Gõ mã căn ra thuộc tính căn</p>
    <h1>Danh mục căn: vòng này chạy trên danh mục mẫu, dự án thật nối vào sau</h1>

    <svg viewBox="0 0 1216 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hai làn: vòng này dùng danh mục mẫu cho đường tra mã căn; sau này danh mục thật từ Excel của sàn thử và Invest vào bảng dùng chung rồi nối vào cùng đường tra">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Làn sau: nền rất nhạt để tách khỏi vòng này -->
      <rect x="40" y="232" width="1136" height="192" fill="rgba(45,49,66,0.025)"/>

      <!-- Ranh làn -->
      <line x1="40" y1="40" x2="1176" y2="40" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <line x1="40" y1="232" x2="1176" y2="232" stroke="#bfc0c0" stroke-width="1"/>
      <line x1="40" y1="424" x2="1176" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

      <!-- Nhãn làn -->
      <text x="40" y="108" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">VÒNG NÀY</text>
      <text x="40" y="128" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">dự án mẫu,</text>
      <text x="40" y="144" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">danh mục mẫu</text>

      <text x="40" y="300" fill="#2d3142" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SAU · HÀNG 10</text>
      <text x="40" y="320" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">dự án thật,</text>
      <text x="40" y="336" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">danh mục thật</text>

      <!-- Mũi tên (vẽ trước nút) -->
      <!-- Danh mục mẫu → lõi -->
      <line x1="472" y1="112" x2="576" y2="112" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Lõi → người gõ -->
      <line x1="832" y1="112" x2="936" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Excel + Invest → bảng dùng chung -->
      <line x1="472" y1="304" x2="576" y2="304" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Bảng dùng chung → cùng đường tra -->
      <line x1="704" y1="264" x2="704" y2="154" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Hỏi gắn vào nguồn -->
      <line x1="352" y1="152" x2="352" y2="168" stroke="#bfc0c0" stroke-width="1"/>
      <line x1="352" y1="344" x2="352" y2="360" stroke="#bfc0c0" stroke-width="1"/>

      <!-- Nhãn mũi tên (mask, cách nét 8px) -->
      <rect x="484" y="84" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="524" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NẠP MỘT LẦN</text>

      <rect x="838" y="84" width="92" height="16" rx="2" fill="#f5f5f5"/>
      <text x="884" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THUỘC TÍNH CĂN</text>

      <rect x="484" y="276" width="80" height="16" rx="2" fill="#f0f0f1"/>
      <text x="524" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NẠP VÀO</text>

      <rect x="712" y="180" width="100" height="16" rx="2" fill="#f5f5f5"/>
      <text x="716" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐỔI MỘT THAM SỐ</text>

      <!-- Làn 1 · Danh mục mẫu (nguồn) -->
      <rect x="232" y="72" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="72" width="240" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="352" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Danh mục mẫu</text>
      <text x="352" y="120" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«[Mẫu] Dự án căn hộ thử»</text>
      <text x="352" y="136" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Toà A/B · 15 tầng × 6 trục · 180 căn</text>

      <!-- Làn 1 · Lõi đọc mã + đường tra (tâm điểm) -->
      <rect x="576" y="72" width="256" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="72" width="256" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="704" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc mã căn và tra danh mục</text>
      <text x="704" y="120" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cách đọc mã là dữ liệu theo dự án</text>
      <text x="704" y="136" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chỉ đọc · không bảng mới ở vòng này</text>

      <!-- Làn 1 · Người gõ mã -->
      <rect x="936" y="72" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="936" y="72" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1056" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đầu chủ và mọi vai trong sàn</text>
      <text x="1056" y="128" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">gõ mã căn, nhận thuộc tính căn</text>

      <!-- Hỏi-1 -->
      <rect x="232" y="168" width="272" height="44" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="244" y="186" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Hỏi-1: dự án thử = dự án mẫu</text>
      <text x="244" y="202" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">(đổi được)</text>

      <!-- Làn 2 · Excel sàn thử + Invest -->
      <rect x="232" y="264" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="264" width="240" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="352" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Excel của sàn thử</text>
      <text x="352" y="312" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">+ phần Invest không đến từ S08</text>
      <text x="352" y="328" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nguồn danh mục thật</text>

      <!-- Làn 2 · Bảng danh mục dùng chung -->
      <rect x="576" y="264" width="256" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="264" width="256" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="704" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng danh mục dùng chung</text>
      <text x="704" y="312" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hàng 10 · đang chờ</text>
      <text x="704" y="328" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">thay danh mục mẫu, giữ nguyên đường tra</text>

      <!-- Hỏi-2 -->
      <rect x="232" y="360" width="272" height="44" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="244" y="378" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Hỏi-2: nguồn = Excel sàn thử + Invest</text>
      <text x="244" y="394" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">(đề xuất ở Sổ quyết định §12)</text>

      <!-- Ghi chú biên -->
      <text x="936" y="296" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Dự án thật vào: thêm một dòng</text>
      <text x="936" y="316" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">cách đọc mã, không sửa cách đọc.</text>

      <!-- Chú giải -->
      <line x1="40" y1="444" x2="1176" y2="444" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="132" y="460" width="24" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#636b80" stroke-width="1"/>
      <text x="164" y="470" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Nguồn danh mục</text>

      <rect x="284" y="460" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="316" y="470" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Dựng ở vòng này</text>

      <rect x="444" y="460" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="476" y="470" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Sau, chưa dựng</text>

      <line x1="596" y1="466" x2="620" y2="466" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="628" y="470" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Nối ở hàng sau</text>

      <rect x="756" y="460" width="24" height="12" rx="2" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
      <text x="788" y="470" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Câu hỏi đã trả lời theo khuyến nghị, đổi được ở Cổng Phạm vi</text>
    </svg>
  </div>
</body>
</html>
