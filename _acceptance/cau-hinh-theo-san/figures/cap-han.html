<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cặp hạn không áp im lặng</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sơ đồ luồng · AC-5 · luật đợt 46 (Ngoài-5 hàng 81)</p>
    <h1>Cặp hạn không áp im lặng</h1>
    <p class="subtitle">Hạn nhận không được lớn hơn hạn gọi. Lối ghi từ chối; lối đọc báo lỗi nêu cả hai khoá — không lối nào lặng lẽ áp cặp trái luật.</p>

    <svg viewBox="0 0 1040 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch-title ch-desc">
      <title id="ch-title">Cặp hạn không áp im lặng</title>
      <desc id="ch-desc">Sàn gửi hạn nhận 60 khi hạn gọi đang 30. Lối ghi: lối đổi chung PATCH trả 400 nêu hai khoá, không ghi. Lối đọc: dòng có từ trước trong bảng; bộ giải chung báo lỗi nêu hai khoá và cặp về 15/30; bộ giải chung đưa lỗi ra ở GET cấu hình; bộ đọc chia lead là câu hỏi Hỏi-1: (a, khuyến nghị) cặp về 15/30, lead vẫn chia, hoặc (b) dừng chia, lỗi nêu hai khoá. Kết: không lối nào áp 60 với 30. Nhánh phụ: gửi cả cặp 45/60 cùng lệnh thì được nhận.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1040" height="624" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <!-- Khởi đầu → nhánh phụ (so sánh) -->
      <path d="M360,60 H140 Q132,60 132,68 V150" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Khởi đầu → lối ghi -->
      <path d="M480,88 V112 Q480,120 472,120 H424 Q416,120 416,128 V150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Khởi đầu → lối đọc -->
      <path d="M560,88 V112 Q560,120 568,120 H792 Q800,120 800,128 V150" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nhánh phụ → Nhận -->
      <line x1="132" y1="216" x2="132" y2="286" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- PATCH → 400 -->
      <line x1="416" y1="216" x2="416" y2="286" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Dòng có từ trước → hai bộ đọc -->
      <path d="M760,216 V244 Q760,252 752,252 H684 Q676,252 676,260 V286" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M840,216 V244 Q840,252 848,252 H904 Q912,252 912,260 V286" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Ba lối → kết chung -->
      <path d="M416,368 V424 Q416,432 424,432 H520 Q528,432 528,440 V470" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="676" y1="400" x2="676" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M912,400 V424 Q912,432 904,432 H744 Q736,432 736,440 V470" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nhãn mũi tên (mặt nạ cách nét 6–10px) ===== -->
      <rect x="204" y="36" width="88" height="14" rx="2" fill="#f5f5f5"/>
      <text x="248" y="46" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NẾU GỬI CẢ CẶP</text>

      <rect x="140" y="244" width="52" height="14" rx="2" fill="#f5f5f5"/>
      <text x="166" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HỢP LỆ</text>

      <rect x="424" y="244" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="452" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TỪ CHỐI</text>

      <!-- ===== Nút ===== -->
      <!-- Khởi đầu -->
      <rect x="360" y="32" width="320" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="360" y="32" width="320" height="56" rx="28" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sàn gửi hạn nhận 60</text>
      <text x="520" y="74" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hạn gọi đang 30</text>

      <!-- Nhánh phụ: gửi cả cặp -->
      <rect x="32" y="152" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="152" width="200" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="132" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gửi cả cặp 45 / 60</text>
      <text x="132" y="198" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cùng lệnh</text>

      <!-- Lối ghi: PATCH -->
      <rect x="296" y="152" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="152" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="304" y="160" width="52" height="14" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="330" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI GHI</text>
      <text x="416" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lối đổi chung</text>
      <text x="416" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PATCH</text>

      <!-- Lối đọc: dòng có từ trước -->
      <rect x="680" y="152" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="152" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="160" width="52" height="14" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="714" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LỐI ĐỌC</text>
      <text x="800" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng có từ trước trong bảng</text>
      <text x="800" y="208" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dữ liệu cũ · ghi tay</text>

      <!-- Nhận -->
      <rect x="52" y="288" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="52" y="288" width="160" height="56" rx="28" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="132" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhận</text>

      <!-- 400 -->
      <rect x="296" y="288" width="240" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="296" y="288" width="240" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="416" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">400 nêu hai khoá</text>
      <text x="416" y="338" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không ghi</text>

      <!-- Bộ giải chung -->
      <rect x="576" y="288" width="200" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="288" width="200" height="112" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="676" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ giải chung</text>
      <text x="676" y="334" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">báo lỗi nêu hai khoá</text>
      <text x="676" y="350" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cặp về 15 / 30</text>
      <text x="676" y="370" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lỗi hiện ở GET cấu hình</text>

      <!-- Bộ đọc chia lead — câu hỏi cho người (Hỏi-1) -->
      <rect x="816" y="288" width="192" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="816" y="288" width="192" height="112" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="824" y="296" width="44" height="14" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="846" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-1</text>
      <text x="912" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bộ đọc chia lead</text>
      <text x="912" y="348" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(a, khuyến nghị) cặp về 15 / 30,</text>
      <text x="912" y="362" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lead vẫn chia</text>
      <text x="912" y="384" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(b) dừng chia, lỗi nêu hai khoá</text>

      <!-- Kết chung (trọng tâm) -->
      <rect x="440" y="472" width="400" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="440" y="472" width="400" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="640" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không lối nào áp 60 với 30</text>

      <!-- ===== Chú giải ===== -->
      <line x1="32" y1="560" x2="1008" y2="560" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="580" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="32" y="596" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="56" y="606" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>

      <rect x="108" y="596" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="132" y="606" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Từ chối hoặc báo lỗi</text>

      <rect x="244" y="596" width="24" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="276" y="606" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kết luận</text>

      <line x1="340" y1="602" x2="368" y2="602" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="376" y="606" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nhánh phụ để so — cặp hợp luật được nhận</text>

      <rect x="640" y="594" width="44" height="14" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="662" y="604" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-n</text>
      <text x="692" y="606" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">câu chờ người chốt</text>
    </svg>
  </main>
</body>
</html>
