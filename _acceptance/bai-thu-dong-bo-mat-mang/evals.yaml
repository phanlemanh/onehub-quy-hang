  - id: E7
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    steps:
      - "Đặt DATABASE_URL tới Postgres dãy T, chạy node _acceptance/bai-thu-dong-bo-mat-mang/thu/chay.mjs --khong-ham --cong 3477 (ghi PID, dừng bằng kill <PID>)"
      - "Mở http://localhost:3477/thu ở khổ điện thoại, chọn vai «Đầu chủ A1» → chụp evidence/E7-step1.png: bảng căn của A1, có số chủ, trạng thái «có mạng», 0 chờ đẩy"
      - "Giả lập mất mạng trên trang (window.dispatchEvent(new Event('offline')) và chặn fetch), đổi giá 3 lần → chụp evidence/E7-step2.png: «mất mạng», 3 chờ đẩy"
      - "Tải lại trang khi vẫn chặn mạng → chụp evidence/E7-step3.png: vẫn 3 chờ đẩy"
      - "Bỏ chặn, phát sự kiện online → chụp evidence/E7-step4.png: 0 chờ đẩy, giá mới hiện"
      - "Gọi GET http://localhost:3477/dem?nhat-ky=1 → có sự kiện mang (tắt, bật) và một lô day với client_seq 1,2,3 theo đúng thứ tự"
    expected: "trang hiện bảng căn theo vai, trạng thái mạng, số chờ đẩy; hàng đợi còn sau tải lại; nối mạng thì đẩy hết theo thứ tự; nhật ký có sự kiện mạng và lô đẩy"
    paths: ["_acceptance/bai-thu-dong-bo-mat-mang/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

