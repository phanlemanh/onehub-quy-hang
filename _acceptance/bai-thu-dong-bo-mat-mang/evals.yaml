evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: config:executors.script.bai_thu_dong_bo
    expected: "exit 0; ca «AC-1 kéo theo sàn» xanh trên Postgres dãy T qua máy chủ thật: ma trận viết trước 4 người mẫu × 2 bảng (căn, thay đổi) → không dòng nào mang company_id khác sàn của người; phiên không đặt sàn → 0 dòng; đối chứng dương: mỗi người nhận ≥ 1 dòng của sàn mình"
    paths: ["_acceptance/bai-thu-dong-bo-mat-mang/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    layer: backend-effect
    cmd: config:executors.script.bai_thu_dong_bo
