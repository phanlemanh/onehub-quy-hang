schema_version: 1
feature_slug: dang-nhap-theo-san
# Test cần Postgres của API (*.db.test.ts) chạy trong `npm run db:test`, nên mọi eval API đi qua
# config:executors.test.isolation (cần DATABASE_URL — dãy Q: Postgres 5545). Lệnh trùng chỉ chạy một lần ở S4.
# exit 0 của lệnh chung KHÔNG đủ: mỗi eval của lệnh này đòi `output` — dòng reporter liệt tên ca — và người chấm đối
# chiếu từng tên ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO»; số ca của *.db.test.ts > 0.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; bốn ca có mặt và ok: «xin mã: email có tài khoản nhận đúng một mã 6 chữ số» · «xin mã: email lạ không nhận mã nào» · «xin mã: trả lời như nhau dù email có tài khoản hay chưa» · «xin mã: lần thứ sáu trong 15 phút trả 429, lần thứ năm vẫn nhận mã». Chiều đỏ: bộ gửi nhận số mã khác kỳ vọng, thân/mã trạng thái hai ca khác nhau, hay lần sáu nhận mã → ca đỏ với thông điệp nêu tên ca."
    paths: [packages/api/src/auth/**, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; bốn ca xanh: mã đúng mở phiên và /me trả người đó · mã sai không mở phiên · mã quá 5 phút (đồng hồ giả) không mở phiên · lần thứ tư sau ba lần sai không mở phiên dù đúng mã. Chiều đỏ: bất kỳ ca nào nhận cookie phiên khi không được → đỏ, thông điệp nêu tên ca."
    paths: [packages/api/src/auth/**, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «một sàn: /san trả sàn A» xanh và trong cùng giao dịch current_user = quy_hang_app, app.company_id = A. Chiều đỏ: hàm đặt sàn bỏ set role hay đặt sai mã sàn → ca đỏ nêu giá trị thấy được."
    paths: [packages/api/src/auth/**, packages/api/src/db.ts, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «chưa gắn sàn: /san 403 chua-gan-san, /me sàn rỗng» xanh — thân trả không chứa tên hay mã của sàn nào có trong cơ sở dữ liệu ca dựng. Chiều đỏ: trả 200 hay lộ tên sàn → đỏ."
    paths: [packages/api/src/auth/**, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; năm ca xanh: nhiều sàn chưa chọn → 409 chon-san · chọn B → /san trả B · chọn C không thuộc → 403, /san không trả C · bỏ khỏi B sau khi chọn → lời gọi kế không vào B · cookie qh_san giả mã C → không vào C. Chiều đỏ: bất kỳ lời gọi nào vào sàn người không thuộc → đỏ nêu mã sàn."
    paths: [packages/api/src/auth/**, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «chưa đăng nhập: /me, /san, POST /me/san đều 401» và «sau đăng xuất: /me 401» xanh. Chiều đỏ: một đường trả khác 401 → đỏ nêu đường. Nửa chuyển trang về /dang-nhap đo ở E10."
    paths: [packages/api/src/auth/**, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca cách ly mới xanh: company_members bật và ép luật theo dòng (ca «mọi bảng dữ liệu» phủ) · người U thuộc A thấy thành viên A, không thấy thành viên B · U thuộc A và B, chưa đặt sàn: thấy hai dòng của chính mình và tên A, B, không thấy C · quy_hang_app thêm thành viên bị từ chối · quy_hang_app đọc identity.user bị từ chối (permission denied). Chiều đỏ (lượt phá ở S3): bỏ luật theo dòng hay cấp quyền auth trong bản sao → ca đỏ nêu bảng."
    paths: [packages/db/migrations/**, packages/db/tests/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; ca «một cửa truy vấn: mã nguồn» quét packages/api/src (trừ *.test.ts): lời gọi truy vấn chỉ ở db.ts và phần danh tính, db.ts chỉ xuất một hàm; cặp hai chiều trên cùng bộ quét — thư mục mẫu lành → 0 vi phạm, thư mục mẫu có pool.query ngoài cửa → 1 vi phạm nêu đường tệp."
    paths: [packages/api/src/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8b
    criterion: AC-8
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «một cửa truy vấn: thời chạy» có mặt và ok — pool bọc ghi mọi truy vấn chạm public qua luồng một sàn, chưa gắn sàn, nhiều sàn và luồng trọn; số truy vấn ghi được > 0 và 100% mang current_user = quy_hang_app. Đối chứng đỏ trong cùng ca: một truy vấn chạy thẳng trên pool chủ → bộ ghi đếm 1 vi phạm, thông điệp nêu câu truy vấn."
    paths: [packages/api/src/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «mở sàn» có mặt và ok: lần một tạo một sàn, một tài khoản, một thành viên · lần hai cùng tham số: số sàn, tài khoản, thành viên không đổi · cùng email, tên sàn khác: người thuộc hai sàn. Chiều đỏ: lần hai tạo thêm dòng → đỏ nêu bảng và số dòng."
    paths: [packages/db/scripts/**, packages/db/tests/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    steps:
      - "Dựng dữ liệu: Postgres dãy Q (5545) đã áp migration; `npm run van-hanh:mo-san -w @quy-hang/db -- --ten '[Sàn mẫu E10-A]' --email e10-mot-san@example.test`; chạy thêm với `--ten '[Sàn mẫu E10-A]'` và `--ten '[Sàn mẫu E10-B]'` cho e10-hai-san@example.test; tạo tài khoản e10-chua-gan@example.test rồi bỏ khỏi sàn (hoặc chèn thẳng tài khoản không thành viên bằng kết nối chủ)"
      - "Chạy dev ở cổng 3461 (luật 7 của đợt) với DATABASE_URL dãy Q, ghi nhật ký ra tệp để đọc mã `[ma-dang-nhap]`"
      - "Mở http://localhost:3461/ → phải chuyển về /dang-nhap → chụp evidence/E10-step1.png"
      - "Nhập e10-mot-san@example.test, Gửi mã → thấy «Đã gửi mã tới …» → chụp evidence/E10-step2.png"
      - "Nhập 000000 (sai) → thấy «Mã không đúng. Thử lại.» → chụp evidence/E10-step3.png"
      - "Nhập mã đúng đọc từ nhật ký → vào / thấy «Bạn đang làm ở sàn [Sàn mẫu E10-A]»; tải lại trang vẫn thấy → chụp evidence/E10-step4.png"
      - "Mở /dang-nhap khi đang đăng nhập → bị đưa về / → chụp evidence/E10-step5.png"
      - "Bấm Đăng xuất → về /dang-nhap → chụp evidence/E10-step6.png"
      - "Đăng nhập e10-hai-san@example.test → thấy /chon-san liệt hai tên sàn → chụp evidence/E10-step7.png; bấm [Sàn mẫu E10-B] → / thấy «Bạn đang làm ở sàn [Sàn mẫu E10-B]» → chụp evidence/E10-step8.png; Đăng xuất"
      - "Đăng nhập e10-chua-gan@example.test bằng mã đúng → thấy «chưa thuộc sàn nào» → chụp evidence/E10-step9.png; Đăng xuất"
      - "Xin mã cho e10-mot-san@example.test, nhập sai ba lần, lần thứ tư nhập mã đúng → thấy «Mã đã hết hạn hoặc sai quá số lần» + nút «Gửi lại mã» → chụp evidence/E10-step10.png; bấm «Gửi lại mã», nhập mã mới → vào / → chụp evidence/E10-step11.png"
    expected: "Mười một khung khớp lần lượt ST-dang-nhap-email, ST-dang-nhap-ma, ST-dang-nhap-ma-sai, ST-trang-dau-co-san, ST-trang-dau-co-san, ST-dang-nhap-email, ST-chon-san-danh-sach, ST-trang-dau-co-san (tên B), ST-chua-gan-san-trong, ST-dang-nhap-ma-het, ST-trang-dau-co-san; tên sàn là tên máy chủ trả (đặt riêng cho E10, không có trong mã nguồn web); chữ tiếng Việt; không lỗi mạng tới app ngoài 4xx đã khai của mã sai."
    paths: [apps/web/src/**, packages/api/src/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E11
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «luồng trọn qua HTTP» có mặt và ok — tự dựng sàn với tên riêng của ca, xin mã, nhập mã, gọi /san trả đúng tên ấy, đăng xuất rồi /me 401. Chiều đỏ: tên trả khác tên ca dựng → đỏ nêu hai tên."
    paths: [packages/api/src/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-11
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; cặp ca hai chiều trên cùng hàm dựng: NODE_ENV=production không bộ gửi → ném lỗi có chữ «thiếu bộ gửi mã đăng nhập» · NODE_ENV=production có bộ gửi → dựng được. Chiều đỏ: dựng được khi thiếu bộ gửi → ca đỏ."
    paths: [packages/api/src/auth/**, packages/api/src/app.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
