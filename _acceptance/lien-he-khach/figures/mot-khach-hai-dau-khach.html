<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Một khách, hai đầu khách</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
    svg .zone { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.20); stroke-width: 1; stroke-dasharray: 4,3; }
    svg .zone-head { font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 500; fill: #4f5d75; letter-spacing: 0.14em; }
    svg .box { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
    svg .box-focal { fill: rgba(235,108,54,0.08); stroke: #eb6c36; stroke-width: 1.4; }
    svg .tag { fill: transparent; stroke: rgba(45,49,66,0.40); stroke-width: 0.8; }
    svg .tag-focal { fill: transparent; stroke: rgba(235,108,54,0.60); stroke-width: 0.8; }
    svg .tag-text { font-family: 'Geist Mono', monospace; font-size: 7px; fill: #4f5d75; letter-spacing: 0.08em; }
    svg .tag-text-focal { font-family: 'Geist Mono', monospace; font-size: 7px; fill: #ba4513; letter-spacing: 0.08em; }
    svg .name { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
    svg .line { font-family: 'Geist', sans-serif; font-size: 10px; fill: #4f5d75; }
    svg .line-strong { font-family: 'Geist', sans-serif; font-size: 10px; font-weight: 600; fill: #2d3142; }
    svg .arrow { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
    svg .arrow-label { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #636b80; letter-spacing: 0.06em; }
    svg .arrow-sub { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
    svg .wall { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 500; fill: #2d3142; }
    svg .bracket { fill: none; stroke: #4f5d75; stroke-width: 1; }
    svg .bracket-text { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 500; fill: #2d3142; }
    svg .note { font-family: 'Instrument Serif', 'Lora', serif; font-style: italic; font-size: 14px; fill: #ba4513; }
    svg .note-muted { font-family: 'Instrument Serif', 'Lora', serif; font-style: italic; font-size: 14px; fill: #4f5d75; }
    svg .grid { stroke: rgba(45,49,66,0.12); stroke-width: 0.8; }
    svg .legend-head { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.14em; }
    svg .legend-text { font-family: 'Geist', sans-serif; font-size: 10px; fill: #4f5d75; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Quan hệ dữ liệu · Hỏi-1, Hỏi-2 · AC-4, AC-5, AC-6, AC-8</p>
    <h1>Một khách, hai đầu khách</h1>
    <p class="subtitle">Một người vừa là chủ nhà vừa là khách, hai số, hai đầu khách phục vụ. Vẫn một liên hệ; mỗi đầu khách làm việc qua nhu cầu khách của riêng mình.</p>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mk-title mk-desc">
      <title id="mk-title">Một khách, hai đầu khách</title>
      <desc id="mk-desc">Liên hệ ở giữa là một người, loại Chủ bán và Người mua, có số A và số B, người giữ là đầu chủ 1, và là chủ của một hàng. Đầu khách 1 tạo nhu cầu khách 1 bằng số A, đầu khách 2 tạo nhu cầu khách 2 bằng số B; cả hai nhu cầu gắn cùng liên hệ. Mỗi Lần gửi gắn một nhu cầu, người gửi là chỗ ghi công. Đầu khách không đọc liên hệ, đầu chủ không thấy nhu cầu, trưởng nhóm thấy cả hai.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="1000" height="640" fill="#f5f5f5"/>

      <!-- Ngoặc trưởng nhóm -->
      <text class="bracket-text" x="500" y="32" text-anchor="middle">Trưởng nhóm thấy cả hai — hai nhu cầu khách, hai Lần gửi và liên hệ</text>
      <path class="bracket" d="M 152,64 V 52 Q 152,44 160,44 H 840 Q 848,44 848,52 V 64"/>

      <!-- Vùng thấy được -->
      <rect class="zone" x="24" y="72" width="256" height="400" rx="8"/>
      <text class="zone-head" x="40" y="92">ĐẦU KHÁCH 1 THẤY</text>
      <rect class="zone" x="376" y="72" width="248" height="400" rx="8"/>
      <text class="zone-head" x="392" y="92">LỚP NGUỒN · ĐẦU CHỦ 1 THẤY</text>
      <rect class="zone" x="720" y="72" width="256" height="400" rx="8"/>
      <text class="zone-head" x="736" y="92">ĐẦU KHÁCH 2 THẤY</text>

      <!-- Nối (vẽ trước hộp) -->
      <!-- Lần gửi 1 → nhu cầu 1 -->
      <line class="arrow" x1="152" y1="216" x2="152" y2="264" marker-end="url(#arrow)"/>
      <rect x="160" y="232" width="32" height="12" rx="2" fill="#efeff0"/>
      <text class="arrow-label" x="164" y="241">GẮN</text>
      <!-- Lần gửi 2 → nhu cầu 2 -->
      <line class="arrow" x1="848" y1="216" x2="848" y2="264" marker-end="url(#arrow)"/>
      <rect x="856" y="232" width="32" height="12" rx="2" fill="#efeff0"/>
      <text class="arrow-label" x="860" y="241">GẮN</text>
      <!-- Hàng → liên hệ -->
      <line class="arrow" x1="500" y1="192" x2="500" y2="232" marker-end="url(#arrow)"/>
      <rect x="508" y="200" width="52" height="12" rx="2" fill="#efeff0"/>
      <text class="arrow-label" x="512" y="209">CHỦ NHÀ</text>
      <!-- Nhu cầu 1 → liên hệ (số A) -->
      <line class="arrow" x1="264" y1="320" x2="392" y2="320" marker-end="url(#arrow)"/>
      <rect x="308" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="328" y="309" text-anchor="middle">SỐ A</text>
      <rect x="284" y="328" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text class="arrow-sub" x="328" y="340" text-anchor="middle">cộng Người mua</text>
      <!-- Nhu cầu 2 → liên hệ (số B) -->
      <line class="arrow" x1="736" y1="320" x2="608" y2="320" marker-end="url(#arrow)"/>
      <rect x="652" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text class="arrow-label" x="672" y="309" text-anchor="middle">SỐ B</text>
      <rect x="628" y="328" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text class="arrow-sub" x="672" y="340" text-anchor="middle">gắn cùng người</text>

      <!-- Lần gửi 1 -->
      <rect x="40" y="112" width="224" height="104" rx="6" fill="#f5f5f5"/>
      <rect class="box" x="40" y="112" width="224" height="104" rx="6"/>
      <rect class="tag" x="52" y="124" width="48" height="16" rx="2"/>
      <text class="tag-text" x="76" y="135" text-anchor="middle">LẦN GỬI</text>
      <text class="name" x="52" y="164">Lần gửi 1</text>
      <text class="line" x="52" y="184">người gửi: đầu khách 1</text>
      <text class="line-strong" x="52" y="202">người gửi = ghi công</text>

      <!-- Nhu cầu khách 1 -->
      <rect x="40" y="264" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect class="box" x="40" y="264" width="224" height="112" rx="6"/>
      <rect class="tag" x="52" y="276" width="80" height="16" rx="2"/>
      <text class="tag-text" x="92" y="287" text-anchor="middle">NHU CẦU KHÁCH</text>
      <text class="name" x="52" y="316">Nhu cầu khách 1</text>
      <text class="line" x="52" y="336">đầu khách 1 giữ</text>
      <text class="line" x="52" y="356">tên khách «[Tên] 1» — đầu khách tự gõ</text>

      <!-- Hàng của chủ -->
      <rect x="392" y="112" width="216" height="80" rx="6" fill="#f5f5f5"/>
      <rect class="box" x="392" y="112" width="216" height="80" rx="6"/>
      <rect class="tag" x="404" y="124" width="36" height="16" rx="2"/>
      <text class="tag-text" x="422" y="135" text-anchor="middle">HÀNG</text>
      <text class="name" x="404" y="164">Hàng của chủ</text>
      <text class="line" x="404" y="180">đầu chủ 1 giữ</text>

      <!-- Liên hệ — trọng tâm -->
      <rect x="392" y="232" width="216" height="176" rx="6" fill="#f5f5f5"/>
      <rect class="box-focal" x="392" y="232" width="216" height="176" rx="6"/>
      <rect class="tag-focal" x="404" y="244" width="52" height="16" rx="2"/>
      <text class="tag-text-focal" x="430" y="255" text-anchor="middle">LIÊN HỆ</text>
      <text class="name" x="404" y="288">Một người</text>
      <text class="line" x="404" y="312">loại: Chủ bán + Người mua</text>
      <text class="line" x="404" y="332">số A · số B</text>
      <text class="line" x="404" y="352">người giữ: đầu chủ 1 (không đổi)</text>
      <text class="line" x="404" y="372">trọn liên hệ là lớp nguồn</text>
      <text class="line" x="404" y="392">không mang tên khách của đầu khách</text>

      <!-- Hai bức tường của lớp nguồn -->
      <text class="wall" x="500" y="436" text-anchor="middle">Đầu khách không đọc liên hệ</text>
      <text class="wall" x="500" y="456" text-anchor="middle">Đầu chủ không thấy nhu cầu</text>

      <!-- Lần gửi 2 -->
      <rect x="736" y="112" width="224" height="104" rx="6" fill="#f5f5f5"/>
      <rect class="box" x="736" y="112" width="224" height="104" rx="6"/>
      <rect class="tag" x="748" y="124" width="48" height="16" rx="2"/>
      <text class="tag-text" x="772" y="135" text-anchor="middle">LẦN GỬI</text>
      <text class="name" x="748" y="164">Lần gửi 2</text>
      <text class="line" x="748" y="184">người gửi: đầu khách 2</text>
      <text class="line-strong" x="748" y="202">người gửi = ghi công</text>

      <!-- Nhu cầu khách 2 -->
      <rect x="736" y="264" width="224" height="112" rx="6" fill="#f5f5f5"/>
      <rect class="box" x="736" y="264" width="224" height="112" rx="6"/>
      <rect class="tag" x="748" y="276" width="80" height="16" rx="2"/>
      <text class="tag-text" x="788" y="287" text-anchor="middle">NHU CẦU KHÁCH</text>
      <text class="name" x="748" y="316">Nhu cầu khách 2</text>
      <text class="line" x="748" y="336">đầu khách 2 giữ</text>
      <text class="line" x="748" y="356">tên khách «[Tên] 2» — đầu khách tự gõ</text>

      <!-- Ghi chú quyết định -->
      <text class="note" x="32" y="508">Hỏi-1 — khuyến nghị: mỗi đầu khách một nhu cầu riêng trên cùng liên hệ; đầu khách 2 không được báo đã có người phục vụ.</text>
      <text class="note-muted" x="32" y="528">Lối khác: báo «khách đã có đầu khách» và chặn — lộ việc của người khác, tranh khách sớm khi chưa có luật ghi công.</text>
      <text class="note-muted" x="32" y="548">Số mới hay số đã thuộc liên hệ, đầu khách nhận cùng một câu trả lời; số mới thì sinh liên hệ mới loại Người mua, không người giữ.</text>

      <!-- Chú giải -->
      <line class="grid" x1="32" y1="576" x2="968" y2="576"/>
      <text class="legend-head" x="32" y="604">CHÚ GIẢI</text>
      <rect x="120" y="592" width="24" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text class="legend-text" x="152" y="604">Một người — một liên hệ</text>
      <line class="arrow" x1="300" y1="600" x2="336" y2="600" marker-end="url(#arrow)"/>
      <text class="legend-text" x="344" y="604">Gắn vào (nhiều về một)</text>
      <rect class="zone" x="492" y="592" width="24" height="16" rx="3"/>
      <text class="legend-text" x="524" y="604">Vùng một người thấy được</text>
      <text class="legend-text" x="700" y="604">«[Tên]» — tên giả, không dữ liệu thật</text>
    </svg>
  </main>
</body>
</html>
