schema_version: 1
feature_slug: nhap-tac-tu-ke-hoach
# Lõi gói / kiểm / gộp đề xuất ở `packages/core/src/import/ai/**` (node:test của core — gồm bài số đo đọc bộ lạ và đề xuất
# ghi sẵn trong hồ sơ, theo nếp `bo-thu.test.ts` đọc `so-nen.json` của hàng 64). Bộ kiểm rò nguồn ra AI ở
# `packages/api/src/imports/ai/*.ro-ri.test.ts` (job CI `ro-ri`, bắt buộc). Đường đề xuất, bật/tắt, trần, `ai_usage` chấm trên
# Postgres dãy G qua `packages/api/test-db/imports/` (executor isolation: migrate + bộ kiểm cách ly + test-db API). Khách AI
# trong mọi ca là khách giả tiêm qua `deps` — không ca nào gọi mạng. exit 0 của lệnh chung KHÔNG đủ: người chấm đối chiếu
# từng tên ca nêu trong `expected` — có mặt, «ok», không «# SKIP»/«# TODO». Dữ liệu mẫu: `[Tên]`, `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/import/ai/do-tac-tu.test.ts ba ca có mặt và ok. Ca «bộ lạ: mọi tiêu đề ngoài từ điển» — tieuDeDaBiet() rỗng (assert) và đối chứng: thêm «Mã căn» vào một file thì hàm trả đúng [«Mã căn»] (assert). Ca «đề xuất ghi sẵn khớp gói» — với mỗi file của bộ lạ (4) và bộ thử hàng 64 (9): băm gói dựng bởi dungGoiDeXuat bằng băm ghi trong tệp đề xuất (13 assert); đối chứng đỏ: đổi một tiêu đề của gói thì so băm báo «gói đổi — ghi lại đề xuất» nêu tên file (assert). Ca «số đo có tác tử» — tính lại bằng do.ts sau kiemDeXuat + gopDeXuat + applyPlan (đồng ý mọi đề xuất) và so bằng tệp so-do-tac-tu.json đã commit (deepEqual); cộng bộ lạ ghepCot ≥ 0,95, loiLot ≤ 0,005, hoiNguoi ≤ 0,10, roNguon.tu = 0 (4 assert); từng tệp bộ thử hàng 64: ghepCot.tu ≥, loiLot.tu ≤, hoiNguoi.tu ≤ số nền trong _acceptance/nhap-loi-tat-dinh/so-nen.json (27 assert). Chiều đỏ: bỏ gopDeXuat (kế hoạch nền) → assert ghepCot ≥ 0,95 đỏ nêu «ghép cột 44,8%»."
    paths: [packages/core/src/import/**, _acceptance/nhap-tac-tu-ke-hoach/thu/**, _acceptance/nhap-tac-tu-ke-hoach/so-do-tac-tu.json, _acceptance/nhap-tac-tu-ke-hoach/de-xuat/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.script.ro_ri
    expected: "exit 0; trong packages/api/src/imports/ai/goi.ro-ri.test.ts hai ca có mặt và ok. Ca «gói đề xuất không chứa chuỗi cấm» — với mỗi file của bộ thử hàng 64 (9) và bộ lạ (4): không chuỗi nào trong dapAn.camLo có trong JSON.stringify(gói) (13 assert, mỗi assert nêu tên file và chuỗi trúng); ma trận viết tay tám lớp × hai tình trạng (đã ghép / chưa ghép): chỉ hai ô (catalog, shareable_listing) × chưa ghép mang khoá giaTri, mười bốn ô còn lại không có khoá giaTri (16 assert); cột đã ghép mang dich (assert). Ca «mồi rò»: gói dựng từ một bảng có ô «chủ [Tên] 0900 000 011» trong cột Ghi chú và cột không tiêu đề chứa số +84 90 000 0012 → không chứa «0900 000 011», «0900000011», «+84 90 000 0012» (3 assert). Chiều đỏ: cho dungGoiDeXuat gửi giá trị mọi cột → ca đầu đỏ ở ban-nguon-giau nêu chuỗi số."
    paths: [packages/core/src/import/**, packages/api/src/imports/ai/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.script.ro_ri
    expected: "exit 0; trong packages/api/src/imports/ai/quet.ro-ri.test.ts ca «máy chủ quét lại gói» có mặt và ok — ma trận viết tay: số 0900 000 0xx, 0900.000.0xx, +84 900 000 0xx, 84900000 0xx, email, số giấy tờ 9 và 12 chữ số, dáng họ tên «[Mẫu] Nguyễn Văn A»-kiểu (2–5 chữ hoa đầu) × hai chỗ (tiêu đề, giá trị) → quetGoi trúng, nêu loại (14 assert); đối chứng dương: gói sạch của mau-a (mã căn, toà, giá, phí, trạng thái) → không trúng (assert). Chiều đỏ: bỏ quét tiêu đề → 7 ô tiêu đề đỏ."
    paths: [packages/core/src/import/**, packages/api/src/imports/ai/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

