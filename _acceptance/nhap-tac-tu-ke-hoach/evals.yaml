    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/imports/ai.test.ts ca «đề xuất: chặn lần hai ở máy chủ» có mặt và ok — sàn có thoả thuận ai_processing đang hiệu lực, khách AI giả đếm lần gọi; POST /api/v1/imports/ai/plan với gói có số điện thoại trong một giá trị → 200 {cheDo: 'tat-dinh', lyDo chứa 'dữ liệu cá nhân'} (assert), khách giả 0 lần gọi (assert), đúng một dòng ai_usage result 'blocked_pii' (assert) và cột của dòng ấy (ép thành văn bản) không chứa chuỗi số (assert); gói gắn giaTri cho cột lớp source → 400 (assert), khách 0 lần; gói có khoá lạ ở gốc → 400 (assert); đối chứng: gói sạch → khách đúng 1 lần, ai_usage thêm 1 dòng 'ok' (2 assert). Chiều đỏ: bỏ quetGoi ở route → khách giả bị gọi, ca đỏ nêu «khách AI bị gọi với gói có dữ liệu cá nhân»."
    paths: [packages/api/src/imports/ai/**, packages/core/src/import/**, packages/db/migrations/035_*]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

