    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «mẫu ghi thẳng mang cột nội bộ» — chèn thẳng vào company_settings (vai chủ) khoá export.templates một mẫu có holderName và closePrice; GET /api/v1/company/templates/export → mẫu ấy không mang cột nội bộ nào (so mảng cột chỉ còn cột có khoá ra) và errors nêu khoá export.templates; xuatBang theo mẫu đọc được trên căn mồi (tên chủ, số chủ nhà 0900 000 0xx, người giữ) → không chuỗi mồi nào trong cot, dong, bai. Chiều đỏ: GET trả nguyên mẫu ghi thẳng → ca đỏ nêu «cột nội bộ ra khỏi kho mẫu»."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/mau-bang-hang-va-bai/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    target: "http://localhost:3491/settings/templates"
    preconditions:
      - "Postgres dãy L (5571), máy chủ dev ở cổng của executors.ui-check. Dựng dữ liệu qua máy chủ đang chạy: Quản trị đăng nhập; sàn có ba căn đang bán"
      - "Đăng nhập: sàn mẫu «[Mẫu] Sàn thử» đã nạp bằng packages/db/seed/nap.mjs --nap (tài khoản quan-tri@mau.quy-hang.test, dau-chu-1@mau.quy-hang.test, dau-khach@mau.quy-hang.test); xin mã ở màn đăng nhập rồi đọc mã dev ở dòng «[ma-dang-nhap] <email> <mã>» cuối tệp .acceptance-runs/web-L.log (nhật ký máy chủ dev cổng 3491)"
    steps:
