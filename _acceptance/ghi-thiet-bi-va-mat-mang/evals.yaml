schema_version: 1
feature_slug: ghi-thiet-bi-va-mat-mang
# Lệnh máy: executors.test.isolation (migrate + bộ cách ly + test-db của api — cần DATABASE_URL tới Postgres dãy D cổng
# 5575), executors.test.web (bộ đồng bộ thuần), executors.test.web_db (bộ đồng bộ nói với API thật trên Postgres),
# executors.test.core (lõi số đo). Người chấm đối chiếu tên ca nêu trong `expected` với dòng reporter của node --test: có
# mặt, ok, không SKIP. Mỗi ca có cặp hai chiều trên cùng đầu vào (chiều đỏ ghi trong expected).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «028: cột thiết bị và dấu mất mạng của sự kiện» có mặt và ok — sau migrate: insert sự kiện với device 'mobile', 'desktop', null đều được; device 'tablet' bị ràng buộc check từ chối (assert mã lỗi 23514); sự kiện không khai hai cột đọc device null, made_offline false; update hay delete một sự kiện vẫn ném lỗi su_kien_chi_them. Ca «028: khuôn lượt mất mạng» ok — ended_at trước started_at và queued_ops âm bị check từ chối; dòng thứ hai trùng sàn+người+thiết bị+giờ bắt đầu bị khoá duy nhất từ chối (23505); update và delete một lượt ném lỗi chỉ-thêm. Chiều đỏ: bỏ check của device trên bản sao migration → ca đỏ với thông điệp nêu 'tablet' được nhận."
    paths: [packages/db/migrations/028_*.sql, packages/db/tests/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca cách ly «offline_sessions: sàn khác không đọc, không ghi hộ» có mặt trong packages/db/tests/isolation.test.mjs và ok — vai quy_hang_app ở sàn A đọc đúng các lượt của A (assert số dòng), không thấy lượt của B; insert mang company_id của B hay user_id người khác bị luật theo dòng từ chối (42501); pg_class của offline_sessions có relrowsecurity và relforcerowsecurity đều true. Đối chứng dương: cùng vai ghi lượt của chính mình ở A được. Chiều đỏ: bỏ policy insert trên bản sao migration → ca ghi hộ đỏ với thông điệp nêu user_id người khác được ghi."
    paths: [packages/db/migrations/028_*.sql, packages/db/tests/isolation.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «thiết bị: đầu yêu cầu ghi vào sự kiện» có mặt trong packages/api/test-db/thiet-bi-mat-mang.test.ts và ok — ma trận viết trước bốn giá trị đầu (mobile, desktop, vắng, 'tablet') × hai đường (POST /listings, POST /listings/:id/events): cột device đọc lại từ listing_events đúng mobile, desktop, null, null (8 assert), mọi lệnh 2xx; GET /listings/:id trả device trên từng sự kiện. Ca «mất mạng: khoá madeOffline của lệnh» ok — true → made_offline true, false và vắng → false (3 assert); lệnh mang khoá lạ «offline» trả 400 invalid_payload. Chiều đỏ: bỏ đọc đầu ở đường lệnh → ca thiết bị đỏ nêu đường events trả null thay mobile."
    paths: [packages/api/src/listings/**, packages/api/test-db/thiet-bi-mat-mang.test.ts, packages/core/src/listing/events.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «lượt mất mạng: ghi một lần, gửi lại không trùng» có mặt trong packages/api/test-db/thiet-bi-mat-mang.test.ts và ok — lượt hợp lệ trả 201, đọc lại đúng một dòng với user_id của người gửi và company_id của sàn đang làm; gửi lại y hệt trả 200 và vẫn một dòng (assert đếm). Ca «lượt mất mạng: khuôn sai và chưa đăng nhập» ok — endedAt trước startedAt, device 'tablet', khoá lạ 'ownerPhone' đều 400 và bảng không thêm dòng; không cookie trả 401; người đăng nhập chưa gắn sàn trả 403 và bảng không thêm dòng. Chiều đỏ: bỏ on conflict do nothing → lần gửi lại trả 500 hoặc thêm dòng, ca đỏ nêu số dòng."
    paths: [packages/api/src/sync/**, packages/api/src/app.ts, packages/api/test-db/thiet-bi-mat-mang.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «thiết bị: cạnh ngắn màn hình, mốc 768» có mặt trong apps/web/src/lib/sync/thiet-bi.test.ts và ok — ma trận viết trước (rộng×cao màn hình): 390×844, 844×390 (điện thoại xoay ngang), 767×1024, 768×1024, 1024×768, 1440×900 → mobile, mobile, mobile, desktop, desktop, desktop (6 assert); ca «thiết bị: hàm gọi API gửi đầu» ok — goiFetch với fetch giả và màn hình giả 390×844 gửi đầu x-quy-hang-device: mobile, với 1440×900 gửi desktop, trên cả GET và POST. Chiều đỏ: đổi mốc thành <= 768 → ca đỏ nêu 768×1024 ra mobile; đo bằng cạnh rộng thay cạnh ngắn → ca đỏ nêu 844×390 ra desktop."
    paths: [apps/web/src/lib/sync/thiet-bi.ts, apps/web/src/lib/sync/goi-fetch.ts, apps/web/src/lib/sync/thiet-bi.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «mất mạng: thao tác ghi lúc mất mạng mang madeOffline» có mặt trong apps/web/src/lib/sync/mat-mang.test.ts và ok — trên máy chủ giả (may-chu-gia.test-helpers.ts): một lượt thử mất mạng, sửa căn X, có mạng lại, gửi → lệnh của X tới máy chủ mang madeOffline true; sửa căn Y lúc có mạng và gửi được → lệnh của Y không có khoá madeOffline (assert vắng khoá, không chỉ false); ca «mất mạng: máy vừa rớt mạng» ok — không dựng sẵn lượt thử lỗi: lần thử gần nhất ok, sửa căn Z, lượt gửi kế ném lỗi mạng, lượt sau có mạng → lệnh của Z tới máy chủ mang madeOffline true; các bài của dong-bo.test.ts và tu-lanh.test.ts vẫn ok. Chiều đỏ: chỉ gắn dấu theo lastAttempt lúc ghi (bỏ vế lần gửi đầu gặp mất mạng) → ca máy vừa rớt mạng đỏ nêu lệnh của Z thiếu khoá."
    paths: [apps/web/src/lib/sync/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «lượt mất mạng: mở một lần, khép khi có mạng, gửi một lần» có mặt trong apps/web/src/lib/sync/mat-mang.test.ts và ok — đồng hồ giả: 1 thao tác chờ gửi có từ trước lượt, lượt thử mất mạng ở t1, ghi 2 thao tác lúc mất mạng, mất mạng ở t2, có mạng ở t3 → máy chủ giả nhận đúng một lượt startedAt t1, endedAt t3, queuedOps 2 (assert số, không đếm thao tác có từ trước); lượt mất mạng không thao tác nào → queuedOps 0; ca «lượt mất mạng: gửi lỗi thì giữ, gửi lại không trùng» ok — đường lượt trả 503 một lần rồi 201 → lượt ở lại hộp gửi sau lần đầu, gửi ở lượt kế, máy chủ có một dòng; ca «lượt mất mạng: tải lại trang giữa lượt» ok — dựng lại bộ đồng bộ trên cùng kho khi lượt đang mở → lượt vẫn mở với startedAt t1 và khép đúng. Chiều đỏ: mở lượt ở mọi lượt thử mất mạng (không xét offlineSince) → ca đầu đỏ nêu startedAt là t2; đếm queuedOps bằng cả hàng đợi → ca đầu đỏ nêu 3."
    paths: [apps/web/src/lib/sync/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «thiết bị theo vai: đếm từng ô, không rõ để riêng» có mặt trong packages/core/src/metrics/thiet-bi-mat-mang.test.ts và ok — ma trận viết trước: 3 sự kiện điện thoại (2 của người vai listing_agent, 1 của người vai team_lead), 2 máy tính (buyer_agent), 1 không rõ, 1 điện thoại ngoài kỳ → trangThai do-duoc, kieu ti-le, tu 3 / mau 5, chiTiet mobile·listing_agent 2, mobile·team_lead 1, desktop·buyer_agent 2, khong-ro 1, tong 6 (assert deepEqual); sự kiện ngoài kỳ không vào; ma trận thứ hai cùng ca cho luật người nhiều vai và không vai: 1 sự kiện điện thoại của người hai vai listing_agent+team_lead và 1 máy tính của người không vai → tu 1 / mau 2, chiTiet mobile·listing_agent 1, mobile·team_lead 1, desktop·khong-vai 1, khong-ro 0, tong 2 (assert deepEqual). Chiều đỏ: tính mau gồm cả không rõ → ca đỏ nêu mau 6."
    paths: [packages/core/src/metrics/**, packages/core/src/listing/events.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «mất mạng điện thoại: lượt trong kỳ và thao tác lúc mất mạng» có mặt trong packages/core/src/metrics/thiet-bi-mat-mang.test.ts và ok — 2 lượt điện thoại trong kỳ (10 và 25 phút), 1 lượt máy tính trong kỳ, 1 lượt điện thoại bắt đầu đúng den, 3 sự kiện madeOffline điện thoại trong kỳ + 1 máy tính → do-duoc, kieu dem, so 2, chiTiet tongPhut 35, daiNhatPhut 25, thaoTacLucMatMang 3 (assert deepEqual); ca «chưa có sự kiện: bốn mã nói rõ thiếu gì» ok — trên đầu vào rỗng và trên bộ mẫu đúng bốn mã inquiry_to_send, sheet_publishes, customer_link_opens, customer_interest ra chua-co-su-kien, hai mã thiết bị và mất mạng ra do-duoc. Chiều đỏ: đổi lọc kỳ thành startedAt <= den → ca lượt đỏ nêu so 3."
    paths: [packages/core/src/metrics/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.web_db
    expected: "exit 0; ca «điện thoại mất mạng: sự kiện và lượt về cơ sở dữ liệu» có mặt trong apps/web/src/lib/sync/test-db/thiet-bi-mat-mang.db-test.mts và ok — bộ đồng bộ với hàm gọi qua app Hono thật trên Postgres dãy, bề rộng giả 390: một lượt thử ném lỗi mạng, sửa giá một căn, lượt kế có mạng → truy vấn listing_events của căn có đúng một sự kiện price_changed mới với device 'mobile' và made_offline true; offline_sessions của người ấy có đúng một dòng device 'mobile', queued_ops 1 (assert số). Chiều đỏ: bỏ đầu thiết bị khỏi goiFetch thử (hàm gọi của bài) → ca đỏ nêu device null."
    paths: [apps/web/src/lib/sync/**, packages/api/src/**, packages/db/migrations/028_*.sql]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
