<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 không đầu chủ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Hai lối · Hỏi-1 · AC-4</p>
    <h1>Người không có vai Đầu chủ thấy gì ở năm mục Hôm nay?</h1>
    <p class="subtitle">Hai nhánh rẽ: báo rõ · ẩn.</p>
    <svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1 không đầu chủ</title>
      <desc id="d">Đầu chung: Telesales hay trưởng nhóm mở Hôm nay, rẽ hai nhánh. Nhánh A, báo rõ, khuyến nghị: cột thứ hai vẫn có năm mục; bấm Lead mới thì đầu màn một dòng «Hàng đợi «Lead mới» chỉ có ở Hôm nay của đầu chủ», phần còn lại như cũ. Giá: thấy năm mục chỉ để đọc dòng báo, tới hàng 42. Nhánh B, ẩn: cột thứ hai không có mục hàng đợi, một dòng «Hàng đợi có ở Hôm nay của đầu chủ». Giá: sửa bảng điều hướng của lõi, thêm ca kiểm theo vai.</desc>
      <defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
      <rect width="1000" height="576" fill="#f5f5f5"/>

<!-- Connectors (drawn before boxes) -->
<line x1="500" y1="96" x2="500" y2="124" stroke="#4f5d75" stroke-width="1"/>
<path d="M 280 152 L 280 132 Q 280 124 288 124 L 712 124 Q 720 124 720 132 L 720 152" fill="none" stroke="#4f5d75" stroke-width="1"/>
<line x1="280" y1="208" x2="280" y2="232" stroke="#4f5d75" stroke-width="1"/>
<line x1="720" y1="208" x2="720" y2="232" stroke="#4f5d75" stroke-width="1"/>
<line x1="280" y1="288" x2="280" y2="336" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="288" y="304" width="88" height="14" rx="2" fill="#f5f5f5"/>
<text x="292" y="314" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">BẤM «LEAD MỚI»</text>

<!-- Root -->
<rect x="300" y="32" width="400" height="64" rx="6" fill="#f5f5f5"/><rect x="300" y="32" width="400" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="500" y="60" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telesales hay trưởng nhóm mở Hôm nay</text>
<text x="500" y="80" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không có vai Đầu chủ</text>

<!-- Branch A header (focal) -->
<rect x="80" y="152" width="400" height="56" rx="6" fill="#f5f5f5"/><rect x="80" y="152" width="400" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="92" y="170" fill="#ba4513" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">NHÁNH A · KHUYẾN NGHỊ</text>
<text x="280" y="194" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Báo rõ (khuyến nghị)</text>

<!-- Branch B header -->
<rect x="520" y="152" width="400" height="56" rx="6" fill="#f5f5f5"/><rect x="520" y="152" width="400" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="532" y="170" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">NHÁNH B</text>
<text x="720" y="194" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ẩn</text>

<!-- A1 -->
<rect x="80" y="232" width="400" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="96" y="250" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">CỘT THỨ HAI</text>
<text x="96" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Vẫn có năm mục</text>

<!-- A2 -->
<rect x="80" y="340" width="400" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="96" y="358" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">ĐẦU MÀN · MỘT DÒNG</text>
<text x="96" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">«Hàng đợi «Lead mới» chỉ có ở Hôm nay của đầu chủ»</text>
<text x="96" y="404" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Phần còn lại như cũ</text>

<!-- B1 -->
<rect x="520" y="232" width="400" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="536" y="250" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">CỘT THỨ HAI</text>
<text x="536" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Không có mục hàng đợi</text>
<text x="536" y="296" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Một dòng «Hàng đợi có ở Hôm nay của đầu chủ»</text>

<!-- Giá -->
<line x1="80" y1="444" x2="920" y2="444" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<rect x="80" y="456" width="400" height="44" rx="6" fill="rgba(235,108,54,0.04)" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
<text x="96" y="482" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start"><tspan font-weight="600">Giá:</tspan> thấy năm mục chỉ để đọc dòng báo, tới hàng 42</text>
<rect x="520" y="456" width="400" height="44" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
<text x="536" y="482" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start"><tspan font-weight="600">Giá:</tspan> sửa bảng điều hướng của lõi, thêm ca kiểm theo vai</text>

<!-- Legend -->
<line x1="32" y1="524" x2="968" y2="524" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">CHÚ GIẢI</text>
<rect x="112" y="536" width="28" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="148" y="548" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh khuyến nghị</text>
<rect x="272" y="536" width="28" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="308" y="548" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh khác</text>
<rect x="400" y="536" width="28" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="436" y="548" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Điều người ấy thấy</text>
    </svg>
  </main>
</body>
</html>
