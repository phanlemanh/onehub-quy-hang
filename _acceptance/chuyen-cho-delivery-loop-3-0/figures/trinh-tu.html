<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thứ tự trước gộp · năm bước</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame { max-width: 1440px; width: 100%; }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1440 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thứ tự trước gộp: năm bước nối tiếp, ô người khác màu ô máy">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Tiêu đề -->
      <text x="64" y="64" fill="#2d3142" font-size="32" font-family="'Instrument Serif', 'Lora', serif" letter-spacing="-0.01em">Thứ tự trước gộp</text>

      <!-- Mũi tên trước, hộp sau -->
      <g fill="none" stroke="#4f5d75" stroke-width="1.6">
        <path d="M288 176 L334 176" marker-end="url(#arrow)"/>
        <path d="M560 176 L606 176" marker-end="url(#arrow)"/>
        <path d="M832 176 L878 176" marker-end="url(#arrow)"/>
        <path d="M1104 176 L1150 176" marker-end="url(#arrow)"/>
        <path d="M1264 224 L1264 246" marker-end="url(#arrow)"/>
      </g>

      <!-- (1) Anh -->
      <rect x="64" y="128" width="224" height="256" rx="6" fill="#2d3142"/>
      <rect x="80" y="144" width="88" height="20" rx="2" fill="none" stroke="rgba(245,245,245,0.50)" stroke-width="0.8"/>
      <text x="124" y="158" fill="#f5f5f5" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01 · ANH</text>
      <text x="80" y="200" fill="#f5f5f5" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Duyệt Cổng</text>
      <text x="80" y="228" fill="#f5f5f5" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Phạm vi</text>
      <text x="80" y="264" fill="#bfc0c0" font-size="16" font-family="'Geist', sans-serif">và cài sáu plugin</text>
      <text x="80" y="288" fill="#f5f5f5" font-size="16" font-family="'Geist Mono', monospace">@delivery-loop</text>
      <text x="80" y="312" fill="#bfc0c0" font-size="16" font-family="'Geist', sans-serif">cho kho này</text>
      <text x="80" y="336" fill="#bfc0c0" font-size="16" font-family="'Geist', sans-serif">trên Mac Studio</text>

      <!-- (2) Máy -->
      <rect x="336" y="128" width="224" height="256" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="352" y="144" width="88" height="20" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="396" y="158" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02 · MÁY</text>
      <text x="352" y="200" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Sửa năm phần</text>
      <text x="352" y="236" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">sửa phép đo,</text>
      <text x="352" y="260" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">ghim lại, chấm</text>

      <!-- (3) Máy — phép thử phiên thật, ngoài phạm vi eval -->
      <rect x="608" y="128" width="224" height="256" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="6,4"/>
      <rect x="624" y="144" width="88" height="20" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="668" y="158" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03 · MÁY</text>
      <text x="624" y="200" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Chạy phép thử</text>
      <text x="624" y="228" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', sans-serif">phiên thật</text>
      <text x="624" y="264" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">trên nhánh</text>
      <text x="624" y="360" fill="#636b80" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">K6 · ngoài phạm vi eval</text>

      <!-- (4) Anh -->
      <rect x="880" y="128" width="224" height="256" rx="6" fill="#2d3142"/>
      <rect x="896" y="144" width="88" height="20" rx="2" fill="none" stroke="rgba(245,245,245,0.50)" stroke-width="0.8"/>
      <text x="940" y="158" fill="#f5f5f5" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04 · ANH</text>
      <text x="896" y="200" fill="#f5f5f5" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Ký Cổng</text>
      <text x="896" y="228" fill="#f5f5f5" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Bằng chứng</text>

      <!-- (5) Anh bảo gộp → máy gộp -->
      <rect x="1152" y="128" width="224" height="96" rx="6" fill="#2d3142"/>
      <rect x="1168" y="144" width="88" height="20" rx="2" fill="none" stroke="rgba(245,245,245,0.50)" stroke-width="0.8"/>
      <text x="1212" y="158" fill="#f5f5f5" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05 · ANH</text>
      <text x="1168" y="200" fill="#f5f5f5" font-size="20" font-weight="600" font-family="'Geist', sans-serif">Bảo gộp</text>

      <rect x="1152" y="248" width="224" height="136" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1168" y="264" width="56" height="20" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="1196" y="278" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÁY</text>
      <text x="1168" y="312" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">gộp bằng commit gộp,</text>
      <text x="1168" y="336" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">kiểm lại trên</text>
      <text x="1168" y="360" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">nhánh chính</text>

      <!-- Chú giải -->
      <line x1="64" y1="432" x2="1376" y2="432" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <rect x="64" y="456" width="16" height="16" rx="2" fill="#2d3142"/>
      <text x="92" y="469" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">anh làm</text>
      <rect x="224" y="456" width="16" height="16" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
      <text x="252" y="469" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">máy làm</text>
      <rect x="384" y="456" width="16" height="16" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="412" y="469" fill="#4f5d75" font-size="16" font-family="'Geist', sans-serif">máy làm, ngoài phạm vi eval</text>
      <text x="1376" y="469" fill="#636b80" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-4 · AC-7</text>
    </svg>
  </div>
</body>
</html>
