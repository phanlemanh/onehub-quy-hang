schema_version: 1
feature_slug: chuyen-cho-delivery-loop-3-0
# Bài đo của vòng: tệp node:test `_acceptance/chuyen-cho-delivery-loop-3-0/thu/chuyen-cho.test.mjs` (executors.script.cc30_thu)
# và bài đối chứng hai kit `rang/doi-chung.mjs` (executors.script.cc30_doi_chung, lấy kit từ GitHub theo thẻ, kiểm commit
# ghim). exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output`, người chấm đối chiếu tên ca nêu trong `expected` — có mặt,
# «ok», không «# SKIP»/«# TODO». Mỗi ca là một cặp hai chiều trên cùng hàm đọc: vật thật xanh, bản phá đỏ đúng thông điệp.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-1 «hai luồng kéo delivery-loop v3.0.0»: vật thật xanh, năm bản phá đỏ đúng thông điệp» ok — ci.yml và ghim-lai-ban-that.yml qua hàm kiemLuong: đúng một KIT_TAG v3.0.0, fetch từ phanlemanh/delivery-loop theo thẻ, CLAUDE_PLUGIN_ROOT=$RUNNER_TEMP/kit/plugins/acceptance-gate, không dòng $CLAUDE_PLUGIN_ROOT/feature-loop/, và ghim-lai-ban-that.yml có đúng một dòng gọi $CLAUDE_PLUGIN_ROOT/../feature-loop/scripts/repin-lane.mjs (vế dương; bản phá xoá dòng ấy → «bước Ghim lại không gọi …» ); năm bản phá (thẻ cũ, kho cũ, lõi ở gốc kit, chú thích tên kho cũ, làn ghim lại theo bố cục cũ) mỗi bản ném đúng thông điệp ghim. Ca «AC-1 «không tệp nào dưới .github/ còn tên kho kit cũ»» ok, quét ≥ 3 tệp."
    paths: [.github/**, _acceptance/chuyen-cho-delivery-loop-3-0/thu/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1c
    criterion: AC-1
    executor: script
    cmd: config:executors.script.cc30_duong
    expected: "exit 0; in «duong-kit: <n> đường của hai luồng có trên cây kit v3.0.0 (c16d25db)» với n ≥ 4 — mọi chuỗi $CLAUDE_PLUGIN_ROOT/<đường> và $RUNNER_TEMP/kit/<đường> trong ci.yml và ghim-lai-ban-that.yml được phân giải trên cây kit lấy theo thẻ (CLAUDE_PLUGIN_ROOT = $RUNNER_TEMP/kit/plugins/acceptance-gate) và tồn tại; chiều đỏ trong cùng lượt: đường cũ $CLAUDE_PLUGIN_ROOT/feature-loop/scripts/repin-lane.mjs phân giải ra «không tồn tại» và lượt in «duong-kit: đối chứng — đường bố cục cũ không có trên cây 3.0»; và in «duong-kit: 14 tên lệnh mới của bảng có trên cây kit v3.0.0, 0 tên cũ còn» — mỗi tên mới <plugin>:<lệnh> có plugins/<plugin>/commands/<lệnh>.md hay plugins/<plugin>/skills/<lệnh>/SKILL.md, mỗi tên cũ không có; đối chứng: in «duong-kit: đối chứng — dispatch:khong-co không có trên kit»."
    paths: [.github/workflows/**, _acceptance/chuyen-cho-delivery-loop-3-0/rang/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-2 «phiên khai chợ delivery-loop cùng bản CI, bật sáu plugin»: vật thật xanh, bốn bản phá đỏ» ok (còn chợ cũ · ref lệch CI · thiếu knowledge · roadmap tắt, mỗi bản đúng thông điệp ghim); ca «AC-2 «phần còn lại của .claude/settings.json giữ nguyên so với nhánh chính»» ok — mọi khoá ngoài enabledPlugins/extraKnownMarketplaces bằng bản merge-base, khoá plugin ngoài kit giữ giá trị, đối chứng thêm một quyền bị thấy."
    paths: [.claude/settings.json, .github/workflows/ci.yml, _acceptance/chuyen-cho-delivery-loop-3-0/thu/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-3 «tắt đích danh đúng sáu plugin chợ cũ»: vật thật xanh, ba bản phá đỏ» ok — sáu khoá @acceptance-gate-kit đều false, không khoá chợ cũ lạ; bản phá một khoá true · xoá một khoá · khoá lạ, mỗi bản đúng thông điệp ghim."
    paths: [.claude/settings.json, _acceptance/chuyen-cho-delivery-loop-3-0/thu/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

