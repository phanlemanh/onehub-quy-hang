    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-4 «tim-kit.mjs chọn bản cài acceptance-gate@delivery-loop, bỏ qua chợ cũ»» ok — sổ cài tạm có mục chợ mới → in đúng đường bản cài; cùng mục dưới khoá chợ cũ → in rỗng. Ca «AC-4 «trên máy này, kit tim-kit tìm được là acceptance-gate 3.0.0 và có đủ script các lệnh executor gọi»» ok — plugin.json version 3.0.0, có product-map.mjs, design-floor-s4.mjs, design-floor-khuon.mjs, pre-merge-check.sh, evidence-core.cjs, eval-yaml.cjs."
    paths: [packages/ui-lint/tim-kit.mjs, _acceptance/chuyen-cho-delivery-loop-3-0/thu/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-5 «không tệp sống nào gọi tên lệnh cũ hay giữ khoá chợ cũ»: vật thật 0 chỗ, bản cấy đỏ đúng tệp:dòng» ok — danh sách tệp là MỌI tệp của git ls-files trừ tệp bị một luật loại trừ có tên bắt; luật viết trước: ho-so-da-ky (_acceptance/<slug>/**, trừ config.yaml và README), mang-ngay (tên hay thư mục mở đầu YYYY-MM-DD), nhat-ky (CHANGELOG*), tai-lieu-tho (docs/tri-thuc/raw/**), tep-sinh (LO-TRINH.html, PRODUCT-MAP.md, package-lock.json), nhi-phan (có byte NUL), lien-ket (liên kết tượng trưng — đích của nó được quét ở chỗ thật); mỗi tệp bị bỏ đều khớp đúng một luật có tên, số tệp quét > 200 và gồm cả .sh, .yml, .ts, tệp không đuôi dưới .githooks/ (kho không có .cjs sống nào ngoài hồ sơ); bảng 14 tên lệnh cũ → mới chép từ migration/chay-thu-phien/bang-ten.json của kho delivery-loop, và ca «AC-5 «tên mới trong bảng có trên kit 3.0.0»» của E1c đối chiếu bảng với cây kit theo thẻ; kết quả quét rỗng; bản cấy cho đúng bốn dòng «docs/x.md:2 dieu-phoi:mo-dot → dispatch:open», «tools/y.mjs:1 khoá …@acceptance-gate-kit», «.githooks/z:1 road-map:xem → roadmap:status», «scripts/w.sh:1 tri-thuc:kiem → knowledge:health», tên mới không bị bắt. Ca «AC-5 «AGENTS.md và Tham chiếu nói đúng kit và thẻ CI đang dùng»: vật thật xanh, ba bản phá đỏ» ok."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cc30_doi_chung
    expected: "exit 0; in hai dòng: «doi-chung: merge-base <sha> --recheck-all — kit v2.39.0 và v3.0.0 cùng 0 VIOLATION, cùng <n> hồ sơ OK» và «doi-chung: HEAD <sha> --recheck-all kit v3.0.0 — <m> hồ sơ OK (đủ <n> của nền), VIOLATION ngoài vòng 0, của vòng <k>». Kit lấy theo thẻ và kiểm commit ghim (0c4e503b, c16d25db). Hàm so ở chiều đỏ: ca «AC-6 «hàm so đối chứng»» của E6b."
    paths: [_acceptance/**, .github/workflows/**, .claude/settings.json]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-6 «hàm so đối chứng»: cùng tập OK xanh; lệch, VIOLATION, không chạy luật đều đỏ đúng thông điệp» ok — trên văn bản tổng hợp: lệch tập OK, VIOLATION trên merge-base, kit không chạy luật, hồ sơ thôi OK trên HEAD, VIOLATION ngoài vòng, mỗi ca đúng thông điệp ghim; VIOLATION [PR] của vòng không làm đỏ."
    paths: [_acceptance/chuyen-cho-delivery-loop-3-0/rang/**, _acceptance/chuyen-cho-delivery-loop-3-0/thu/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-7 «phân loại ghim lại khớp hợp đồng, trên đúng cây HEAD»» ok — evidence/phan-loai-ghim.json có sha mà cây ngoài _acceptance/ bằng cây HEAD, đủ 36 ứng viên viết trước, kit HEAD c16d25db và kit nhánh chính 0c4e503b đặt qua CLAUDE_PLUGIN_ROOT; so theo TỪNG eval: eval đỏ trên HEAD mà không đỏ ở nhánh chính chỉ được chấp nhận khi xanh trên bản sau gộp giả (sha ghi trong tệp) và bản giả không đỏ eval nào ngoài tập đỏ của nhánh chính; hồ sơ không có eval mới đỏ là «do-ca-hai», có thì «doi-nhanh»; ba tập «ghim», «doi-nhanh», «do-ca-hai» của mục «Ghim lại — kết quả» bằng đúng ba tập suy từ tệp; hồ sơ «ghim» không còn eval đỏ nào trên HEAD; đối chứng: cấy eval «EX» đỏ vào một hồ sơ «do-ca-hai» của bản sao → «đỏ trên HEAD mà xanh trên nhánh chính: <tên> (EX)»; cấy eval đỏ vào hồ sơ ghim → «hồ sơ ghim lại còn đỏ trên HEAD». Ca «AC-7 «hồ sơ ghim lại giữ chữ ký, dòng ghim khớp verified_commit»» ok — với mỗi hồ sơ «ghim»: dòng repin cuối có sha bằng verified_commit, evals_exit khác rỗng và toàn 0, evidence-report cite run_id, human_signoff bằng bản merge-base, verified_commit khác bản merge-base; bản sao mang sha khác và bản sao đổi human_signoff bị bắt đúng thông điệp."
    paths: ["_acceptance/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.cc30_thu
    expected: "exit 0; ca «AC-8 «diff từ nhánh chính chỉ chạm tệp của việc chuyển chợ»: vật thật 0 tệp lạ, bản cấy đỏ» ok — mọi tệp của git diff merge-base...HEAD khớp danh sách viết trước; danh sách tệp đo được phép của hồ sơ ghim lại rút từ mục «Ghim lại — kết quả» của hợp đồng (không ghi cứng); bản cấy thêm packages/core/src/agreements.ts, contract của một hồ sơ khác, contract, evals.yaml của hồ sơ ghim lại → cả bốn bị liệt."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

