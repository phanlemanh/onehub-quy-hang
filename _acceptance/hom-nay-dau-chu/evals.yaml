schema_version: 1
feature_slug: hom-nay-dau-chu
# Lệnh máy: executors.test.core (lõi hàng đợi), executors.test.web (lý do bằng chữ, nhóm màn — thuần), executors.test.isolation
# (API trên Postgres dãy G, cổng 5564 — cần DATABASE_URL), executors.script.lint / giao_dien. Người chấm đối chiếu tên ca nêu
# trong `expected` với dòng reporter: có mặt, ok, không SKIP. Ui-check chạy trên máy dev dãy G (cổng 3484, Postgres 5564),
# dữ liệu dựng bằng _acceptance/hom-nay-dau-chu/thu/dung-g.mjs (in mã căn, lead của từng nhóm).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «bộ mặc định: năm nhóm đúng thứ tự» (packages/core/src/today/hang-doi.test.ts) có mặt và ok — BO_NHOM_MAC_DINH có đúng 5 nhóm, mã theo thứ tự lead-moi, ep-gia, goi-lai, thieu-tin, moi-doi, ngưỡng 10 và 14; ca «bộ mặc định: mỗi căn đúng một nhóm» ok — ma trận viết trước đếm đúng 16 tổ hợp (assert số) của bốn điều kiện ép giá · gọi lại · thiếu tin · mới đổi bật/tắt trên căn Đang bán mình giữ: mỗi tổ hợp ra đúng nhóm thắng theo thứ tự ép giá > gọi lại > thiếu tin > mới đổi > null; ca «bộ mặc định: căn không vào nhóm» ok — ma trận 4 (người khác giữ, chưa ai giữ, Đã bán, Ngừng bán) mỗi ca bật cả bốn điều kiện vẫn ra null; ca «bộ mặc định: luật mốc ép giá» ok — theo luật chốt ở Hỏi-1, ma trận 4 (xác nhận trước/sau mốc đổi giá × qua ngưỡng có/không) assert số; ca «bộ mặc định: mốc giá lùi về lúc lên Đang bán» ok — căn lên Đang bán 11 ngày, chưa đổi giá, chưa xác nhận → ep-gia; cùng căn lên Đang bán 3 ngày → null; ca «bộ mặc định: khoá ngưỡng cũ» ok — queue.call_back_after_days 21 và queue.price_negotiation_after_days 12 đổi ngưỡng bộ mặc định; 6, 31, 15 bị bỏ, giữ 14/10; khi có queue.groups thì khoá cũ hết tác dụng (ca khoá cũ 12 + bộ sàn ép giá 8 → ngưỡng 8). Chiều đỏ: đảo thứ tự gọi lại trước ép giá → tổ hợp (ép giá+gọi lại) đỏ."
    paths: [packages/core/src/today/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «điều kiện: ma trận từ vựng đóng» có mặt và ok — ma trận viết trước, mỗi loại điều kiện (trang-thai, qua-ngay × 4 mốc, thieu-tin, nguoi-khac-doi × hom-qua/hom-nay, loai-hinh, nac-lead) một ca đúng một ca sai, đếm đúng 20 ca (assert số); ca «điều kiện: ranh giới ngày» ok — qua-ngay 14: đúng 14 ngày → true, 13 → false; mốc chưa có → true; ca «điều kiện: hôm qua giờ Việt Nam» ok — bayGio 2026-11-02T03:00:00Z và 2026-11-01T18:00:00Z (01:00 ngày 02/11 giờ VN): đổi lúc 2026-10-31T17:00:00Z → true, 2026-10-31T16:59:59Z → false (ma trận 4, assert số), bộ chạy dưới TZ=UTC và TZ=Asia/Ho_Chi_Minh cho cùng kết quả; ca «điều kiện: đổi giá và đổi trạng thái xét riêng» ok — người khác đổi giá hôm qua, mình đổi trạng thái hôm nay → nguoi-khac-doi đúng; mình đổi giá → sai; ca «điều kiện: căn ngoài danh mục» ok — loai-hinh với căn không có trong danh mục → sai. Ca «loại hình qua ghép danh mục» (apps/web, executors.test.web) ok — căn dựng qua ghepDanhMuc thật của Bảng hàng với danh mục mẫu có một căn Townhouse: nhóm loai-hinh ['Townhouse'] nhận đúng căn ấy, căn Condominium không. Ca «lý do: chữ mới đổi» (apps/web, executors.test.web) ok — từ lastPriceChange {from:3100000000,to:2950000000,byRoles:['team_lead'],at:hôm qua} ra đúng '3,10 → 2,95 tỷ — Trưởng nhóm, hôm qua'."
    paths: [packages/core/src/today/**, apps/web/src/app/(app)/today/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «bộ của sàn: ghi đè trọn bộ» có mặt và ok — bộ của sàn tắt thieu-tin, đổi tên goi-lai thành 'Gọi xác nhận', đưa moi-doi lên trước goi-lai, đổi ngưỡng ep-gia 7, thêm nhóm 'Nhà phố lâu chưa gọi' (loai-hinh Townhouse + qua-ngay xac-nhan 7) đứng đầu: ma trận viết trước 6 căn mẫu (assert số) ra đúng nhóm mới — căn chỉ thiếu tin ra null, căn vừa gọi lại vừa mới đổi ra moi-doi, căn nhà phố 8 ngày ra nhóm nhà phố, căn căn hộ 8 ngày ra null; danhSachNhom trả đúng tên mới và thứ tự mới. Chiều đỏ: trộn bộ của sàn với bộ mặc định thay vì thay trọn → căn chỉ thiếu tin ra thieu-tin, ca đỏ."
    paths: [packages/core/src/today/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «settings/queue: đọc bộ của sàn» (packages/api/test-db/hom-nay.test.ts) có mặt và ok — sàn chưa đặt → nguon 'mac-dinh', 5 nhóm; ghi company_settings queue.groups một bộ hợp lệ cho sàn A → GET trả nguon 'san' và đúng bộ ấy; sàn B cùng lúc vẫn trả bộ mặc định; chưa đăng nhập → 401."
    paths: [packages/api/src/today/**, packages/core/src/today/**, packages/api/test-db/hom-nay.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «bộ của sàn: hỏng thì về mặc định» có mặt và ok — ma trận viết trước đếm đúng 11 (assert số): khoá lạ trong nhóm, điều kiện loai 'bieu-thuc', qua-ngay ngoài khoảng theo Hỏi-4 (ép giá 6 và 15), hành động 'goi-tu-dong', loai-hinh 'Nhà phố' (ngoài tập mã), hai nhóm trùng mã, không nhóm lead, nhóm căn + nac-lead, nhóm căn + hành động 'nhan', nhóm lead + thieu-tin, nhóm căn trang-thai chỉ Closed; mỗi ca docBoNhom trả bộ mặc định, nguon 'mac-dinh', loi khác rỗng và chứa tên chỗ sai (khoá, loai, ngay, hanhDong, loai-hinh, ma, lead, doiTuong, trang-thai); ca «bộ hỏng: ngưỡng của bộ mặc định» ok — khoá cũ ép giá 12 + queue.groups hỏng → bộ mặc định với ngưỡng 12; đối chứng dương cùng fixture: bộ hợp lệ → nguon 'san', loi rỗng. Chiều đỏ: áp nửa bộ (bỏ nhóm hỏng, giữ nhóm lành) → ca khoá lạ đỏ."
    paths: [packages/core/src/today/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4b
    criterion: AC-4
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «settings/queue: ghi bộ nhóm» có mặt và ok — quản trị sàn PUT bộ hợp lệ → 200, GET trả nguon 'san'; PUT bộ có hành động 'goi-tu-dong' → 400, thân nêu 'hanhDong', bộ cũ giữ nguyên (GET như trước); PUT nhóm căn mang hành động 'nhan' → 400 nêu 'doiTuong'; PUT loai-hinh 'Nhà phố' → 400 nêu 'loai-hinh'; đầu chủ PUT → 403; ghi thẳng company_settings một bộ hỏng → GET trả nguon 'mac-dinh' kèm loi."
    paths: [packages/api/src/today/**, packages/api/test-db/hom-nay.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «listings: người giữ và mốc đổi» (packages/api/test-db/hom-nay.test.ts) có mặt và ok — trên sàn tạm: hàng H1 gán đầu chủ A, đổi giá bởi B (vai trưởng nhóm) rồi đổi trạng thái bởi A; GET /api/v1/listings trả H1 với listAgentKey=A, priceChangeTimestamp = occurredAt của price_changed, statusChangeTimestamp = occurredAt của status_changed, lastPriceChange = {byUserId:B, byRoles chứa team_lead, from: giá cũ, to: giá mới}, lastStatusChange = {byUserId:A, from, to}; hàng H2 chưa ai giữ, chưa đổi → các trường null; findSourceLeaks trên toàn thân trả rỗng. Chiều đỏ: lấy mốc từ created thay vì price_changed → ca đỏ."
    paths: [packages/api/src/listings/**, packages/api/test-db/hom-nay.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «kéo về: giữ trường hàng đợi, chặn khoá nguồn» (apps/web/src/lib/sync/*.test.ts) có mặt và ok — keoVe với hàm gọi giả trả hai hàng mang listAgentKey, priceChangeTimestamp, statusChangeTimestamp, lastPriceChange, lastStatusChange: kho sau kéo có đủ năm trường đúng giá trị (so sâu); đối chứng dương cùng fixture: thêm khoá ownerPhone vào một hàng → keoVe ném LoiKeo với thông điệp chứa 'mang nguồn' và kho không đổi."
    paths: [apps/web/src/lib/sync/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «leads/assigned: chỉ lead giao cho tôi đang chờ gọi» có mặt và ok — dữ liệu: lead giao A ở nấc Đã gửi, Đã nhận, Đã gọi, Trả lại, Bỏ; lead giao B; lead sàn khác giao người cùng tên vai. A nhận đúng hai lead hợp nhóm lead mặc định (Đã gửi, Đã nhận — so tập id; lead bị trả lại và lead đã bỏ không ra), mỗi lead có buildingName, unitNumber, nhu cầu, câu giá, createdAt, acceptDueAt, callDueAt và KHÔNG khoá nào chứa phone (findSourceLeaks rỗng); B nhận đúng lead của B; người hai vai (Đầu chủ và telesales) nhận đúng lead giao cho mình, 200; telesales không vai Đầu chủ → 403. Chiều đỏ: bỏ lọc matched_agent_user_id → A thấy lead của B, ca đỏ."
    paths: [packages/api/src/leads/**, packages/api/src/today/**, packages/api/test-db/hom-nay.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    target: "Máy dev dãy G (cổng 3484, Postgres 5564), sàn «[Mẫu] Sàn thử», dữ liệu dựng bằng node _acceptance/hom-nay-dau-chu/thu/dung-g.mjs (in mã căn và lead của từng nhóm cho dau-chu-1)"
    steps:
      - "Đăng nhập dau-chu-1@mau.quy-hang.test (mã ở nhật ký máy dev). Khổ 1440x900. Mở /today, chờ nhóm hiện → chụp evidence/E7-1440.png; ghi tên nhóm theo thứ tự, số của mỗi nhóm, và từng dòng (mã căn hay toà-căn, lý do, giá)"
      - "Đối chiếu với danh sách dung-g.mjs in: mỗi mã căn xuất hiện đúng một lần và ở đúng nhóm in ra; căn của dau-chu-2 và căn Đã bán không xuất hiện"
      - "Đăng nhập telesales@mau.quy-hang.test, mở /today → chụp evidence/E7-telesales.png; đăng nhập truong-nhom@mau.quy-hang.test (không vai Đầu chủ) mở /today → chụp evidence/E7-truong-nhom.png"
      - "Quản trị sàn (quan-tri@mau.quy-hang.test) PUT /api/v1/company/settings/queue bộ: tắt Thiếu thông tin, đổi tên Cần gọi lại thành 'Gọi xác nhận', đưa Mới đổi lên trước (fetch trong trang); đăng nhập lại dau-chu-1, mở /today → chụp evidence/E7-bo-san.png; ghi tên nhóm theo thứ tự; sau đó PUT lại bộ mặc định"
      - "Đăng nhập tài khoản hai vai dung-g.mjs in (Đầu chủ + telesales), mở /today → chụp evidence/E7-hai-vai.png; ghi thứ tự hai vùng và số dòng mỗi vùng"
    expected: "Đầu chủ: nhóm theo đúng thứ tự Lead mới · Nên gọi ép giá · Cần gọi lại · Thiếu thông tin · Mới đổi, số nhóm bằng số dòng, mỗi căn một lần ở đúng nhóm dung-g.mjs in; lý do là chữ (vd «Chưa xác nhận 16 ngày», «Giá giữ 12 ngày», «Thiếu: pháp lý, tài chính», «… → … — Trưởng nhóm, hôm qua»); giá kèm «Bao phí»/«Không bao phí». Không căn của dau-chu-2, không căn Đã bán. Với bộ của sàn: không còn nhóm Thiếu thông tin, có 'Gọi xác nhận', Mới đổi đứng trước 'Gọi xác nhận'. Telesales thấy vùng «Lead đã nhập»; trưởng nhóm thấy chỗ tạm; người hai vai thấy Hôm nay của đầu chủ trước, vùng Lead đã nhập sau, mỗi vùng đúng số dòng dung-g.mjs in."
    paths: ["apps/web/src/app/(app)/today/**", packages/core/src/today/**]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E8
    criterion: AC-8
    executor: ui-check
    layer: backend-effect
    target: "Như E6, đăng nhập dau-chu-1"
    steps:
      - "Ghi số nhóm Cần gọi lại. Gọi GET /api/v1/listings/<căn C1 dung-g.mjs in cho nhóm Cần gọi lại> trong trang → ghi số sự kiện owner_confirmed"
      - "Bấm «Còn · giữ giá» trên dòng C1 → chụp evidence/E8-sau-bam.png; ghi dòng C1 còn trong nhóm không, số nhóm"
      - "Chờ chỉ báo đồng bộ về «đã gửi» rồi gọi lại GET /api/v1/listings/<C1> → ghi số sự kiện owner_confirmed và lastConfirmedAt"
      - "Bật offline (DevTools), bấm «Còn · giữ giá» trên căn C2 (Nên gọi ép giá) → ghi dòng rời nhóm không và chỉ báo; bật mạng, chờ gửi, GET /api/v1/listings/<C2> → ghi số owner_confirmed"
      - "Bấm «Đổi giá, trạng thái…» trên căn C3 → chụp evidence/E8-ho-so.png; ghi mã căn ở đầu cột hồ sơ"
    expected: "Sau bấm C1 rời nhóm ngay, số nhóm giảm 1; máy chủ có đúng thêm một owner_confirmed cho C1, lastConfirmedAt mới. Offline: C2 rời nhóm, chỉ báo nói mất mạng; có mạng lại thì máy chủ có đúng một owner_confirmed mới cho C2. «Đổi giá, trạng thái…» mở cột hồ sơ của đúng C3."
    paths: ["apps/web/src/app/(app)/today/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E9
    criterion: AC-9
    executor: ui-check
    layer: backend-effect
    target: "Như E6, đăng nhập dau-chu-1; dung-g.mjs in ba lead L1 (Đã gửi), L2 (Đã nhận), L3 (Đã gửi) giao dau-chu-1 và lead L4 đã lên bảng"
    steps:
      - "Bấm «Nhận» trên L1 → ghi dòng L1 còn trong nhóm và chữ nấc; GET /api/v1/leads/assigned → ghi acceptedAt của L1"
      - "Bấm «Đã gọi» trên L2 → ghi L2 còn trong nhóm không; trong trang gọi GET /api/v1/leads/assigned → L2 có trong kết quả không"
      - "Bấm «Trả lại · Số không liên lạc được» trên L3 → ghi L3 còn không; chụp evidence/E9-sau.png"
      - "Trong trang gọi POST /api/v1/leads/<L4>/return (fetch) → ghi mã lỗi; rồi giả lập dòng trả 409 bằng cách bấm «Trả lại» trên một lead mà telesales vừa gửi lại (dung-g.mjs in L5) → chụp evidence/E9-409.png, ghi chữ báo"
    expected: "L1 ở lại nhóm với nấc «Đã nhận», acceptedAt có giá trị; L2 rời nhóm và không còn trong /leads/assigned; L3 rời nhóm; lỗi 409 hiện lý do bằng chữ (vd «Lead đã lên bảng, không trả lại được»), dòng giữ nguyên."
    paths: ["apps/web/src/app/(app)/today/**", packages/api/src/leads/**]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    target: "Máy dev dãy G; dau-chu-2 sau khi dung-g.mjs --trong (không việc nào)"
    steps:
      - "Đăng nhập dau-chu-2, mở /today 1440 → chụp evidence/E10-trong.png; bấm nút trên khối trống → ghi URL"
      - "Đăng nhập dau-chu-1, chặn GET /api/v1/leads/assigned và GET /api/v1/company/settings/queue (DevTools block request), tải lại /today → chụp lúc tải evidence/E10-dang-tai.png và sau evidence/E10-loi.png; bỏ chặn, bấm «Thử lại» → ghi nhóm Lead mới hiện lại không"
      - "Quản trị sàn PUT bộ tắt Thiếu thông tin; dau-chu-1 mở /today một lần (bộ được lưu); bật offline, tải lại /today → chụp evidence/E10-mat-mang.png; ghi tên nhóm và chữ báo; bật mạng, PUT lại bộ mặc định"
      - "Khổ 375x812 /today → chụp evidence/E10-375.png; ghi scrollWidth vs innerWidth"
    expected: "Trống: «Hôm nay không còn việc» và nút đưa tới /inventory. Đang tải: Skeleton theo bố cục nhóm. Lỗi: nói tải lead không được, nút «Thử lại» làm nhóm Lead mới hiện lại; các nhóm căn vẫn hiện. Mất mạng: không có nhóm Thiếu thông tin, đúng tên và thứ tự của bộ sàn, có chữ «bộ nhóm lưu lúc …». 375: một cột, scrollWidth ≤ innerWidth."
    paths: ["apps/web/src/app/(app)/today/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.lint
    expected: "exit 0; stdout có 'khuôn: 9 nhóm · 0 lỗi đọc · 0 lệch' (hay nhiều nhóm hơn nếu main đã thêm) và dòng 'ba lối: ' đếm ≥ 3 trang, ≥ 1 dựng bằng lệnh; 'chuẩn giao diện: đạt'."
    paths: [design/patterns/**, _acceptance/hom-nay-dau-chu/ba-loi/**]
