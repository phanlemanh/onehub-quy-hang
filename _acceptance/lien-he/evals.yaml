schema_version: 1
feature_slug: lien-he
# Lệnh máy: `executors.test.core` (kiểm thuần packages/core) và `executors.test.isolation` (bộ cách ly + packages/api/test-db,
# cần DATABASE_URL tới Postgres dãy L, cổng 5563). exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output` — dòng reporter
# liệt tên ca — và người chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO». Người,
# hàng, lead lấy từ bộ mẫu hàng 5 qua đường ghi thật; số là số mẫu `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/contacts/contacts.test.ts có mặt và ok: «liên hệ: thực đơn loại theo RESO» — CONTACT_TYPES deepEqual [Seller, Landlord, Buyer, Tenant], CONTACT_TYPE_LABELS deepEqual bảng viết trước; «liên hệ: loại theo nhu cầu» — bảng viết trước ba dòng sale/lease/sale_or_lease → loại, đếm ba lần so; «liên hệ: lớp nguồn» — bảng viết trước mọi tập con không rỗng của bốn loại (15 dòng) → isOwnerContact đúng khi có Seller hay Landlord, đếm 15; «liên hệ: Lead hay Liên hệ» — bảng viết trước (không có mốc gọi, không hàng → lead; có mốc gọi trên một lead → contact; có hàng gắn → contact; lead có mốc gọi nhưng đã trả lại → contact) → deepEqual, đếm bốn lần so; «liên hệ: bản xem không số» — contactView trên bản ghi có phoneEnc, phoneHash cho người không được xem ra đúng {visible:false}, cho người giữ ra Object.keys deepEqual danh sách viết trước không có khoá số. Chiều đỏ: bỏ Landlord khỏi isOwnerContact → dòng «Landlord» và «Landlord+Buyer» đỏ nêu tên dòng."
    paths: [packages/core/src/contacts/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/db/tests/isolation.test.mjs các ca của hàng 85 có mặt và ok: «liên hệ: hai bảng mới nằm trong phép kiểm luật theo dòng» (relrowsecurity, relforcerowsecurity deepEqual bảng); «liên hệ: sàn B không đọc, không ghi liên hệ và số của sàn A» với đối chứng dưới A có dòng; «liên hệ: một dấu vết một liên hệ» — chèn dấu vết trùng trong cùng sàn bị ràng buộc từ chối, cùng dấu vết ở sàn khác được; «liên hệ: nhãn số và số chính» — nhãn ngoài Home/Mobile/Work/Other bị từ chối, số chính thứ hai của cùng liên hệ bị ràng buộc từ chối, đối chứng: số phụ thứ hai được; «liên hệ: vai API không đọc ba cột số, không ghi thẳng hai bảng» — select, insert, update đều permission denied; «liên hệ: ai đọc liên hệ chủ nhà» — bảng viết trước (người giữ còn vai Đầu chủ, người giữ đã mất vai, trưởng nhóm, đầu chủ khác, telesales, quản trị, và liên hệ chưa có người giữ × đầu chủ, trưởng nhóm, telesales) → thấy/không thấy, liên hệ chưa có người giữ chỉ trưởng nhóm thấy, đếm bằng số dòng; «liên hệ: chỗ trường riêng giữ rỗng» — ghi custom khác {} bị ràng buộc từ chối; ca có sẵn «lược đồ: mọi cột chữ tên chứa phone bị ràng buộc is null» vẫn ok. Chiều đỏ: bỏ điều kiện người giữ trong luật đọc → dòng «đầu chủ khác» thấy, ca đỏ nêu dòng."
    paths: [packages/db/migrations/016_*.sql, packages/db/tests/isolation.test.mjs]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/lien-he.test.ts có mặt và ok: «liên hệ: nhập lead tạo liên hệ theo nhu cầu» — ba lead số mới với nhu cầu Bán, Cho thuê, Cả hai: đọc thẳng bảng thấy ba liên hệ mới, loại deepEqual bảng viết trước, mỗi liên hệ một số, lead mang đúng contact_id; «liên hệ: số đã có thì gắn liên hệ có sẵn» — lead thứ hai cùng số: đếm liên hệ của sàn không đổi, contact_id bằng lead đầu; «liên hệ: telesales không đọc liên hệ» — GET /api/v1/contacts/{id} của telesales người nhập → 404; thân trả của POST và GET /api/v1/leads không có khoá contactId, contact_id, ownerPhone, matchedListingId và máy dò chín chữ số cuối không bắt số nào, đối chứng dương cùng máy dò bắt chuỗi cài sẵn. Chiều đỏ: tạo liên hệ mới cho mọi lead → ca «số đã có» đỏ nêu số đếm."
    paths: [packages/api/src/leads/**, packages/api/src/contacts/**, packages/db/migrations/016_*.sql, packages/api/test-db/lien-he.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «liên hệ: chủ hai số ra cùng đầu chủ» có mặt và ok — sàn có đầu chủ 1, đầu chủ 2; đầu chủ 1 ghi chủ nhà số A cho một hàng; telesales nhập lead số B, nhịp chia về đầu chủ 1; gộp A và B vào một liên hệ bằng lối gửi lại (lead số A trả lại rồi gửi lại số B) hay hàm của migration; bảng viết trước năm dòng (số B, số A, số của liên hệ do đầu chủ 2 giữ, số chưa thuộc ai, số của liên hệ đã thôi người giữ vì lead trả lại) → (outcome, người nhận, cùng liên hệ hay không) deepEqual, dòng cuối ra new không về đầu chủ đã trả, đếm năm lần so. Chiều đỏ: vế chủ của app.lead_dedupe_facts quay về so dấu vết trên hai bảng (bỏ đi qua liên hệ) → dòng «số B» ra new, ca đỏ nêu dòng."
    paths: [packages/db/migrations/016_*.sql, packages/api/src/leads/**, packages/api/test-db/lien-he.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «liên hệ: chủ nhà của hàng gắn liên hệ» có mặt và ok — đầu chủ 1 PUT chủ nhà số mới → listing_owners.contact_id trỏ liên hệ mới mang Seller, người giữ = đầu chủ 1; hàng thứ hai cùng số → cùng liên hệ, giá đáy mỗi hàng giữ riêng (deepEqual hai giá); «Mở số» của hai hàng ra đúng số và đếm owner_phone_reveals tăng đúng hai; ca «liên hệ: người giữ chỉ đặt khi chưa có» — trưởng nhóm giao lại hàng cho đầu chủ 2 rồi đầu chủ 2 ghi lại chủ nhà: người giữ liên hệ vẫn là đầu chủ 1. Bộ ca owners.test.ts, ma-hoa-so-chu.test.ts của hàng 11, 62 vẫn ok. Chiều đỏ: đặt người giữ mỗi lần ghi chủ nhà → ca «người giữ chỉ đặt khi chưa có» đỏ nêu tên người giữ."
    paths: [packages/api/src/owners/**, packages/db/migrations/016_*.sql, packages/api/test-db/lien-he.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «liên hệ: gửi lại thêm số vào cùng người» có mặt và ok — lead số A trả lại, gửi lại số B chưa thuộc ai: lead mới cùng contact_id, đếm số của liên hệ = 2; ca «liên hệ: gửi lại số của người khác» — số mới đã thuộc liên hệ khác: lead mới mang contact_id của số mới, hai liên hệ vẫn tách (đếm liên hệ không đổi, số của liên hệ cũ không đổi); ca «liên hệ: trả lại bỏ người giữ khi hết liên kết» — bảng viết trước hai dòng: liên hệ chỉ có lead trả lại → người giữ null; liên hệ còn một hàng → người giữ giữ nguyên, đếm hai lần so. Bộ ca leads-mine.test.ts của hàng 27: tập tên ca trước và sau deepEqual, mọi ca ok; chỉ thân các ca có tên ở dòng sổ «ca hàng 27 đổi theo AC-7» được đổi (git diff của tệp chỉ chạm các ca ấy). Chiều đỏ: lead gửi lại tạo liên hệ mới → ca «thêm số vào cùng người» đỏ nêu số đếm."
    paths: [packages/api/src/leads/**, packages/db/migrations/016_*.sql, packages/api/test-db/lien-he.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «liên hệ: tạo hàng từ lead» có mặt và ok — bảng ca viết trước (người gọi, trạng thái lead, mã HTTP, mã lỗi): đầu chủ của lead 201 và đọc thẳng bảng thấy listings.origin_lead_id = lead, toà và căn bằng lead, listing_owners.contact_id = contact_id của lead, đầu chủ giữ căn là đầu chủ của lead; lần hai 409; đầu chủ khác 404; trưởng nhóm 404; lead trả lại 409; lead căn trùng 409; không cookie 401; đếm bằng số dòng; ca «liên hệ: lên bảng là dữ kiện» — bảng viết trước ba hàng: hàng mang mã lead sang Active → boardAt bằng occurred_at; hàng cùng số không mang mã lead sang Active → không lên bảng; chuỗi Z trả lại → Z' gửi lại → hàng mang mã Z' Active → Z' lên bảng và app.lead_board_metric tính từ lúc nhập Z; đếm ba lần so. Chiều đỏ: app.lead_board_at_all quay về suy theo dấu vết số → dòng «cùng số không mang mã» ra lên bảng, ca đỏ nêu dòng."
    paths: [packages/api/src/leads/**, packages/db/migrations/016_*.sql, packages/api/test-db/lien-he.test.ts, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «liên hệ: một người nhiều loại» có mặt và ok — người giữ PATCH thêm Buyer: đếm liên hệ của sàn không đổi, contact_types deepEqual [Seller, Buyer], số của liên hệ không đổi; GET của người giữ Object.keys deepEqual danh sách viết trước (không khoá số), phoneCount bằng số dòng số; ca «liên hệ: ai xem, ai sửa» — bảng viết trước (người giữ, trưởng nhóm, đầu chủ khác, telesales, quản trị, người sàn khác, không cookie, và liên hệ chưa có người giữ × đầu chủ, trưởng nhóm) × (GET, PATCH) → mã HTTP, đếm bằng số ô; ca «liên hệ: khuôn sửa loại» — bảng viết trước: khoá lạ 400, loại ngoài thực đơn 400, mảng rỗng 400; rồi (còn hàng, còn lead mở, không còn liên kết) × (bỏ Seller, bỏ Landlord, bỏ cả hai giữ Buyer) → mã HTTP viết trước (400 khi còn liên kết mà không còn loại chủ nhà, 200 khi không còn liên kết), đếm bằng số ô. Chiều đỏ: bỏ kiểm người giữ ở lối PATCH → ô «đầu chủ khác × PATCH» ra 200, ca đỏ nêu ô."
    paths: [packages/api/src/contacts/**, packages/core/src/contacts/**, packages/db/migrations/016_*.sql, packages/api/test-db/lien-he.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/lien-he-chuyen.test.ts ca «liên hệ: chuyển dữ liệu cũ» có mặt và ok — dựng hai sàn bằng đường ghi thật: chủ nhà của ba hàng (hai hàng cùng số, khác đầu chủ, mốc gán khác nhau), bốn lead (một cùng số với hàng); dựng lại trạng thái trước 016 bằng kết nối chủ: xoá mọi dòng contacts và contact_phones của hai sàn, đặt contact_id của listing_owners và leads về null, chụp từng byte cột số, dấu vết của listing_owners và leads; chạy hàm chuyển của migration (app.lien_he_chuyen_du_lieu) hai lần: số liên hệ của từng sàn deepEqual số dấu vết riêng; mọi listing_owners và leads có contact_id; từng dòng contact_phones.enc_context deepEqual ngữ cảnh gốc viết trước (listing_owners:<sàn>:<hàng> hay leads:<sàn>:<lead>); liên hệ gộp từ hai đầu chủ có người giữ là đầu chủ có mốc gán mới nhất và có mặt trong app.lien_he_gop_nhieu_dau_chu() của trưởng nhóm — đối chứng: sàn thứ hai dựng y hệt nhưng đảo thứ tự mốc gán thì người giữ đổi theo; lần chạy hai không đổi số dòng; không liên hệ nào gom số của hai sàn; cột số, dấu vết của listing_owners và leads sau chuyển deepEqual ảnh chụp từng byte; «Mở số» sau chuyển ra đúng số của hàng và giải được số của lead qua ngữ cảnh gốc. Chiều đỏ: hàm chuyển chép ngữ cảnh mới contact_phones:… thay ngữ cảnh gốc → ca đỏ nêu dòng; gộp không lọc sàn → ca đỏ nêu sàn."
    paths: [packages/db/migrations/016_*.sql, packages/api/test-db/lien-he-chuyen.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «liên hệ: tài liệu khớp lõi» trong packages/core/src/contacts/contacts.test.ts có mặt và ok — đọc docs/product/tham-chieu.md: có tiêu đề mục «Tri thức ngành và RESO» và bảng của mục có dòng cho Liên hệ, Loại liên hệ, Lead, Chủ nhà của hàng mang tên RESO Contacts, ContactType, ContactListings; đọc CONTEXT.md: có dòng «Liên hệ», «Loại liên hệ», «Người giữ», dòng «Lead» không còn chữ «hàng ở nấc đầu» và có «hai chiều» cùng «cơ hội», mỗi nhãn của CONTACT_TYPE_LABELS có mặt nguyên văn; đọc docs/adr/0021-*.md: có câu nhắc hàng 47 và ADR-0018 quyết định 8. Chiều đỏ: đổi một nhãn trong lõi → ca đỏ nêu nhãn thiếu trong CONTEXT.md."
    paths: [docs/product/tham-chieu.md, CONTEXT.md, docs/adr/0021-*.md, packages/core/src/contacts/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
