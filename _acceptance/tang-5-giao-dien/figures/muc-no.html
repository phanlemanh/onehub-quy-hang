<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mức nợ giao diện đếm gì?</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .frame { max-width: 900px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hỏi-1 · Bộ chuẩn giao diện · AC-7</p>
    <h1>Mức nợ giao diện đếm gì?</h1>
    <p class="sub">Một chỗ vi phạm đi một trong ba đường. Hai phương án chỉ khác nhau ở một điểm: ngoại lệ đã ghi lý do có bị tính vào nợ hay không.</p>

    <svg viewBox="0 0 880 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Hai khung phương án (nền, vẽ trước) -->
      <rect x="40" y="320" width="384" height="292" rx="8" fill="#f5f5f5"/>
      <rect x="40" y="320" width="384" height="292" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="456" y="320" width="384" height="292" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

      <!-- Mũi tên (vẽ trước hộp) -->
      <!-- Gốc → ba đường -->
      <path d="M400 72 V88 Q400 96 392 96 H128 Q120 96 120 104 V120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="72" x2="440" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M480 72 V88 Q480 96 488 96 H732 Q740 96 740 104 V120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Sửa ngay → không thành nợ -->
      <line x1="120" y1="168" x2="120" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Hai đường gộp → câu hỏi -->
      <line x1="440" y1="168" x2="440" y2="180" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M740 168 V176 Q740 184 732 184 H444" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="440" y1="188" x2="440" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Câu hỏi → A / B -->
      <path d="M360 244 H240 Q232 244 232 252 V320" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M520 244 H640 Q648 244 648 252 V320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trong A -->
      <line x1="140" y1="456" x2="140" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="140" y1="528" x2="140" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="324" y1="456" x2="324" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="324" y1="528" x2="324" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Trong B -->
      <line x1="556" y1="456" x2="556" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="456" x2="740" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="520" x2="740" y2="540" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Nhãn mũi tên -->
      <rect x="260" y="220" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="300" y="232" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHƯƠNG ÁN A</text>
      <rect x="540" y="220" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="580" y="232" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHƯƠNG ÁN B</text>

      <!-- Gốc -->
      <rect x="320" y="24" width="240" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="24" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="44" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Một chỗ vi phạm luật giao diện</text>
      <text x="440" y="60" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đi một trong ba đường</text>

      <!-- Ba đường vào -->
      <rect x="40" y="120" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sửa ngay</text>
      <text x="120" y="156" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trong cùng thay đổi</text>

      <rect x="340" y="120" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="340" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cho qua hàng loạt</text>
      <text x="440" y="156" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">bỏ qua cả loạt, không ghi lý do</text>

      <rect x="640" y="120" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ngoại lệ ghi tay</text>
      <text x="740" y="156" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">kèm lý do ở từng chỗ</text>

      <!-- Sửa ngay → kết thúc -->
      <rect x="40" y="208" width="160" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="40" y="208" width="160" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không thành nợ</text>
      <text x="120" y="244" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">như nhau ở A và B</text>

      <!-- Điểm gộp + câu hỏi -->
      <circle cx="440" cy="184" r="4" fill="#2d3142"/>
      <polygon points="440,208 520,244 440,280 360,244" fill="#f5f5f5"/>
      <polygon points="440,208 520,244 440,280 360,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mức nợ đếm gì?</text>

      <!-- Phương án A -->
      <text x="56" y="344" fill="#ba4513" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PHƯƠNG ÁN A · KHUYẾN NGHỊ</text>
      <text x="56" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Nợ chỉ gồm chỗ cho qua hàng loạt</text>
      <text x="140" y="396" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CHO QUA HÀNG LOẠT</text>
      <text x="324" y="396" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NGOẠI LỆ CÓ LÝ DO</text>

      <rect x="56" y="408" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tính vào nợ</text>
      <text x="140" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mức nợ tăng thêm 1</text>
      <rect x="56" y="480" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vượt trần 0</text>
      <text x="140" y="516" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trần nợ hiện là 0</text>
      <rect x="56" y="552" width="168" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CI đỏ</text>

      <rect x="240" y="408" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đếm và in riêng</text>
      <text x="324" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không cộng vào nợ</text>
      <rect x="240" y="480" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng lý do được in ra</text>
      <text x="324" y="516" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">người duyệt PR đọc được</text>
      <rect x="240" y="552" width="168" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="576" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CI xanh</text>

      <!-- Phương án B -->
      <text x="472" y="344" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PHƯƠNG ÁN B</text>
      <text x="472" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Nợ gồm cả ngoại lệ có lý do</text>
      <text x="556" y="396" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CHO QUA HÀNG LOẠT</text>
      <text x="740" y="396" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NGOẠI LỆ CÓ LÝ DO</text>

      <rect x="472" y="408" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="556" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tính vào nợ</text>
      <text x="556" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mức nợ tăng thêm 1</text>
      <rect x="472" y="480" width="168" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="556" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CI đỏ</text>

      <rect x="656" y="408" width="168" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tính vào nợ</text>
      <text x="740" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dù đã ghi lý do</text>
      <rect x="656" y="480" width="168" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="740" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CI đỏ</text>

      <rect x="472" y="540" width="352" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="648" y="564" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ngoại lệ thật chỉ còn một đường</text>
      <text x="648" y="580" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tắt luật theo tệp trong cấu hình lint</text>

      <!-- Chú giải -->
      <line x1="40" y1="632" x2="840" y2="632" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="120" y="648" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BƯỚC</text>

      <rect x="200" y="648" width="32" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KẾT CỤC</text>

      <polygon points="320,648 332,656 320,664 308,656" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="340" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CÂU HỎI CẦN CHỐT</text>

      <circle cx="456" cy="656" r="4" fill="#2d3142"/>
      <text x="468" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HAI ĐƯỜNG GỘP</text>

      <rect x="572" y="648" width="24" height="16" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="604" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HỆ QUẢ</text>

      <rect x="672" y="648" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="704" y="660" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KHUYẾN NGHỊ</text>
    </svg>
  </div>
</body>
</html>
