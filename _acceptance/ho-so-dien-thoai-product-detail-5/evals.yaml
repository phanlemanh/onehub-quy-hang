schema_version: 1
feature_slug: ho-so-dien-thoai-product-detail-5
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hồ sơ rẽ khổ qua đúng hàm khổ của kho (useDienThoai/khoCuaSo của today/mobile/kho.ts) — ma trận viết trước 5 khổ 375 · 390 · 767 · 768 · 1440 × 2 chỗ (toàn màn · trong Bảng hàng thẻ) = 10 ô, mỗi ô chọn đúng thân (điện thoại / cột) bằng hàm chọn thân mà CotHoSo gọi; chiều đỏ: bản sao hàm chọn thân dùng mốc 1024 → bộ so nêu đúng ô 768px."
    paths: ["apps/web/src/app/(app)/units/ho-so/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; thân điện thoại dựng thật (renderToStaticMarkup) từ căn mẫu: thứ tự khối đọc theo thuộc tính data-khoi trên đầu ra = [anh, ten, gia, muc…] đúng như AC-2; hàng thông số mang đúng ba nhãn Diện tích · Phòng ngủ · Hướng với giá trị của căn; ảnh nằm trong khung cuộn có điểm dừng (snap); chiều đỏ: bản sao đặt hộp giá trước ảnh → bộ so nêu vị trí lệch (deepEqual lời lệch)."
    paths: ["apps/web/src/app/(app)/units/ho-so/dien-thoai/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ma trận viết trước 10 mục (mức đủ · thuộc tính · chữ khoá · báo sai · lần rao · các lần rao · lịch sử · ảnh · mở toàn màn · đóng hồ sơ) × 3 vai (không thấy nguồn · thấy nguồn giữ căn · thấy nguồn không giữ) × 2 chỗ (toàn màn · trong Bảng hàng thẻ) = 60 ô viết trước, mỗi ô ghi mục ấy CÓ hay KHÔNG ở thân cột cho ca đó; mỗi ô khẳng định thân cột dựng thật đúng như bảng (đối chứng dương, tập không rỗng), rồi thân điện thoại dựng từ cùng dữ liệu có đúng mục ấy; cộng ca căn chưa có mã có ô gắn mã; chiều đỏ: bản sao thân điện thoại bỏ «Đóng hồ sơ» ở chỗ Bảng hàng thẻ → bộ so nêu đúng «trong Bảng hàng thẻ · <vai> · đóng hồ sơ»."
    paths: ["apps/web/src/app/(app)/units/ho-so/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; thân điện thoại dựng cho vai không thấy nguồn với cờ lấy từ lopPhuHoSo thật (@quy-hang/core/access) và dữ liệu căn mẫu: đầu ra không chứa ngăn Nội bộ, ổ khoá, mồi số chủ 0900 000 092, mồi tên chủ, giá đáy; đối chứng dương: cùng dữ liệu cho vai thấy nguồn thì có ngăn Nội bộ; chiều đỏ: bản sao bỏ qua cờ noiBo → bộ so nêu mồi lộ ra."
    paths: ["apps/web/src/app/(app)/units/ho-so/dien-thoai/**", "apps/web/src/app/(app)/units/ho-so/cot-ho-so.tsx"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hàm nút chính của thân điện thoại với ma trận viết trước 4 ca (không thấy nguồn · thấy nguồn giữ căn · thấy nguồn không giữ · căn chưa có mã): đúng một nút dính đáy hay không nút — không thấy nguồn → nút hỏi đầu chủ (NutHoiDauChu, chỉ gọi bảng chia sẻ của máy), thấy nguồn → «Ghi cuộc gọi» href /units/call?hang=<id>, chưa mã → không nút; nút dựng có lớp dính đáy và kín bề ngang; chiều đỏ: bản sao luôn trả «Ghi cuộc gọi» → ô nêu vai."
    paths: ["apps/web/src/app/(app)/units/ho-so/dien-thoai/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; thân điện thoại dựng thật ở 5 trạng thái viết trước: đang tải → ChoTai đúng dáng (data-cho-tai), không thấy → «Không thấy căn» + liên kết /inventory, lỗi → «Thử lại», mất mạng → bản đã tải kèm giờ đồng bộ, chưa ảnh → khung ảnh có lời «Chưa có ảnh»; đối chứng: có dữ liệu → không trạng thái nào; chiều đỏ: bản sao trả khung rỗng khi lỗi → ô nêu trạng thái."
    paths: ["apps/web/src/app/(app)/units/ho-so/dien-thoai/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.design.khuon
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm ho-so-can"
    paths: ["design/patterns/ho-so-can.md", "apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/app/(app)/proto/ho-so-dien-thoai/**"]
