    criterion: AC-7
    executor: script
    cmd: config:executors.design.floor
    status: not-run
    reason: "Lệnh kho executors.design.floor dựa vào biến CLAUDE_PLUGIN_ROOT, lượt chấm không có biến ấy nên lệnh không chạy (lượt 1, E8 cannot_run); kho cấm sửa _acceptance/config.yaml ở hàng — đã báo giám sát. AC-7 vẫn có E7 (khuôn) và bộ lint của kho (mức nợ, mã màu thô)."
    expected: "exit 0; không mã màu thô trên tệp giao diện vòng chạm"
    paths: ["apps/web/src/app/(app)/units/ho-so/**", "apps/web/src/app/(app)/proto/ho-so-dien-thoai/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    expected: "375×812 đầu khách: ảnh lớn đầu màn, tên + thông số + giá trong màn đầu, nút hỏi đầu chủ dính đáy, không ngăn Nội bộ; 375×812 đầu chủ giữ căn: nút «Ghi cuộc gọi» dính đáy, có ngăn Nội bộ; cuộn tới cuối nút vẫn ở đáy; 1440×900: vẫn là thân cột hôm nay; mỗi cảnh một ảnh."
    steps:
      - "Dựng chỗ thử dãy H (Postgres 5574, dev 3494) bằng _acceptance/ho-so-dien-thoai-product-detail-5/thu/ (kịch bản dựng và chụp của vòng); nạp căn mẫu có ảnh do dau-chu-1 giữ, số chủ 0900 000 092; in PID, tắt bằng --tat"
      - "Đăng nhập dau-khach-1, mở /units/<mã mẫu> ở 375×812: chụp E9-dau-khach.png, đối chiếu thứ tự khối và không có Nội bộ; cuộn tới cuối, chụp E9-dau-khach-cuoi.png, nút còn ở đáy"
      - "Đăng nhập dau-chu-1, mở cùng căn ở 375×812: chụp E9-dau-chu.png, nút «Ghi cuộc gọi» trỏ /units/call?hang=<id>"
      - "Mở cùng căn ở 1440×900: chụp E9-may-tinh.png, thân cột hôm nay"
      - "Ở 375×812: mở một mã không có (chụp E9-khong-thay.png, «Không thấy căn» + về Bảng hàng), một căn mẫu chưa có ảnh (E9-chua-anh.png, khung «Chưa có ảnh»), và chặn mạng rồi mở lại căn đã xem (E9-mat-mang.png, bản trong kho trên máy)"
    paths: ["apps/web/src/app/(app)/units/**"]
    evidence_required: [screenshot, observed, verifier, verified_at]

  - id: E10
    criterion: AC-4
    executor: ui-check
    layer: backend-effect
    cmd: config:executors.ui-check
    expected: "Trên chỗ thử, ghi mọi phản hồi mạng khi dau-khach-1 mở /units/<mã mẫu> ở 375×812: không phản hồi nào chứa mồi số chủ 0900000092, tên chủ mẫu hay giá đáy mẫu; gọi thẳng lối mở số chủ của căn bằng phiên dau-khach-1 bị từ chối và không trả mồi. Đối chứng dương trên cùng bộ ghi: dau-chu-1 mở cùng căn rồi gọi lối mở số chủ → phản hồi mở số chứa 0900000092 (bộ dò bắt được mồi). Ghi tệp E10-mang-<vai>.txt."
    steps:
      - "Dùng chỗ thử của E9; dau-khach-1 mở /units/<mã mẫu>, ghi phản hồi mạng, dò ba mồi; rồi gọi POST /api/v1/listings/<id>/owner/phone-reveal bằng phiên ấy: mong bị từ chối, thân không chứa mồi"
      - "dau-chu-1 mở cùng căn, ghi phản hồi mạng; gọi cùng lối mở số chủ: mong phản hồi chứa 0900000092 — đối chứng dương của bộ dò"
    paths: ["apps/web/src/app/(app)/units/**"]
    evidence_required: [screenshot, observed, verifier, verified_at]
