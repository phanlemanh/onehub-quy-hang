# Bộ đo va-cai-dat-mat-viec. Chỗ thử dãy D: Postgres 5575/postgres, máy dev 3495. Một lệnh đo chạy cả tám ca và in mỗi ca một
# dòng JSON {"ca":…, "dat":…}; thoát 0 khi mọi ca đạt, 1 khi có ca đỏ (nêu tên ca), 2 khi không dựng được chỗ thử hay thiếu axe.
# Chiều đỏ chung: cùng lệnh trên mã trước khi sửa cho L1, L2, L8, L13 đỏ, nhật ký ở evidence/truoc-sua.log.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    layer: backend-effect
    cmd: node _acceptance/va-cai-dat-mat-viec/thu/kiem-man.mjs
    expected: "exit 0; dòng ca giu-nhan: dat true; nhãn sau còn, Lưu không khoá; sau Lưu đọc đường GET nhãn của màn: nhãn đầu mất, nhãn sau còn; đọc cơ sở dữ liệu: căn của nhãn đầu mang nhãn thay, căn của nhãn sau giữ nhãn. Chiều đỏ: truoc-sua.log có dòng ca giu-nhan dat false."
    paths: ["apps/web/src/app/(app)/settings/statuses/**", "_acceptance/va-cai-dat-mat-viec/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
