<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa mở số chủ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sơ đồ luồng · Hỏi-1 · AC-7, AC-8</p>
    <h1>Cửa mở số chủ: lối duy nhất ra số đầy đủ</h1>
    <p class="subtitle">Số chủ chỉ ra qua một cửa. Cửa xét ba điều, đạt thì ghi một lần mở số rồi mới trả số; không đạt thì không trả, không ghi gì.</p>

    <svg viewBox="0 0 1000 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cms-title cms-desc">
      <title id="cms-title">Cửa mở số chủ</title>
      <desc id="cms-desc">Đầu chủ giữ căn hoặc trưởng nhóm bấm Mở số. Cửa mở số xét cùng sàn, được thấy chủ nhà, đã có số. Đạt cả ba thì ghi một lần mở số rồi trả số đầy đủ. Không đạt thì không trả số và không ghi gì. Đọc thẳng số đã lưu, không qua cửa, bị từ chối quyền.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1000" height="712" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <!-- Bấm → Cửa -->
      <line x1="480" y1="88" x2="480" y2="118" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Số đã lưu → Cửa -->
      <line x1="280" y1="148" x2="378" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cửa → Xét 1 -->
      <line x1="480" y1="176" x2="480" y2="214" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Xét 1 → Xét 2 (CÓ) -->
      <line x1="480" y1="296" x2="480" y2="326" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Xét 2 → Xét 3 (CÓ) -->
      <line x1="480" y1="408" x2="480" y2="438" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Xét 3 → Ghi rồi trả (CÓ) -->
      <line x1="480" y1="520" x2="480" y2="550" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Ba lối KHÔNG → Dừng -->
      <line x1="580" y1="256" x2="678" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="368" x2="678" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="480" x2="678" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Nhánh bên: đọc thẳng → bị chặn trước khi tới số đã lưu -->
      <line x1="180" y1="248" x2="180" y2="196" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <line x1="164" y1="192" x2="196" y2="192" stroke="#2d3142" stroke-width="2"/>

      <!-- Nhãn mũi tên (mặt nạ cách nét 6–10px) -->
      <rect x="292" y="126" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="330" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHỈ CỬA ĐỌC</text>

      <rect x="488" y="304" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
      <rect x="488" y="416" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
      <rect x="488" y="528" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="540" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>

      <rect x="604" y="232" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="628" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <rect x="604" y="344" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="628" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>
      <rect x="604" y="456" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="628" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG</text>

      <rect x="188" y="204" width="108" height="16" rx="2" fill="#f5f5f5"/>
      <text x="242" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BỊ TỪ CHỐI QUYỀN</text>

      <!-- ===== Nút ===== -->
      <!-- Bắt đầu: bấm Mở số -->
      <rect x="340" y="32" width="280" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="340" y="32" width="280" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đầu chủ giữ căn hoặc trưởng nhóm</text>
      <text x="480" y="74" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">bấm «Mở số» trên một căn</text>

      <!-- Trọng tâm: Cửa mở số -->
      <rect x="380" y="120" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="120" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="480" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cửa mở số</text>
      <text x="480" y="162" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lối duy nhất ra số đầy đủ</text>

      <!-- Nơi lưu: số chủ -->
      <rect x="80" y="120" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="120" width="200" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="180" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Số chủ đã lưu</text>
      <text x="180" y="162" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không ai đọc thẳng được</text>

      <!-- Nhánh bên: đọc thẳng -->
      <rect x="80" y="248" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="80" y="248" width="200" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="180" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đọc thẳng, bỏ qua cửa</text>
      <text x="180" y="290" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">kể cả đầu chủ giữ căn</text>

      <!-- Xét 1: cùng sàn -->
      <polygon points="480,216 580,256 480,296 380,256" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="254" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn thuộc</text>
      <text x="480" y="268" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">sàn đang làm?</text>

      <!-- Xét 2: được thấy chủ nhà -->
      <polygon points="480,328 580,368 480,408 380,368" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người bấm được</text>
      <text x="480" y="380" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">thấy chủ nhà?</text>

      <!-- Xét 3: đã có số -->
      <polygon points="480,440 580,480 480,520 380,480" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="480" y="478" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn đã có</text>
      <text x="480" y="492" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">số chủ?</text>

      <!-- Đạt: ghi rồi trả -->
      <rect x="352" y="552" width="256" height="72" rx="32" fill="#f5f5f5"/>
      <rect x="352" y="552" width="256" height="72" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="480" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi một lần mở số, rồi trả số</text>
      <text x="480" y="596" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ghi ai mở, vai lúc mở, lúc nào</text>
      <text x="480" y="610" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">bấm n lần = n lần ghi</text>

      <!-- Không đạt: dừng -->
      <rect x="680" y="200" width="256" height="336" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="200" width="256" height="336" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="700" y="224" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KHÔNG TRẢ SỐ · KHÔNG GHI GÌ</text>
      <text x="700" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Như không có căn này</text>
      <text x="700" y="276" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">sàn khác không biết căn có thật</text>
      <line x1="696" y1="312" x2="920" y2="312" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="700" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Từ chối</text>
      <text x="700" y="388" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">đầu chủ khác, đầu khách, telesales,</text>
      <text x="700" y="402" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">quản trị sàn</text>
      <line x1="696" y1="424" x2="920" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="700" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Báo căn chưa có số</text>
      <text x="700" y="500" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">chưa ai ghi số chủ cho căn</text>

      <!-- Chú thích Hỏi-1 (lề phải, trên) -->
      <path d="M 616 112 Q 600 132 584 140" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="584" cy="140" r="2" fill="#eb6c36"/>
      <text x="624" y="108" fill="#ba4513" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Hỏi-1 · Tách hàng (khuyến nghị): số đã nằm sau cửa này;</text>
      <text x="624" y="126" fill="#ba4513" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">mã hoá về sau chỉ thay ruột cửa — giải mã ngay tại đây.</text>
      <text x="624" y="148" fill="#ba4513" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Làm ngay: chủ kho sinh và cất khoá trước khi lên bản</text>
      <text x="624" y="166" fill="#ba4513" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">thật; thiếu khoá thì bản thật không ghi được số.</text>

      <!-- ===== Chú giải ===== -->
      <line x1="32" y1="652" x2="968" y2="652" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="676" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="120" y="664" width="28" height="16" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="156" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>
      <rect x="272" y="664" width="28" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="308" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Cửa mở số</text>
      <polygon points="412,672 428,664 444,672 428,680" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="452" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Điều cửa xét</text>
      <rect x="548" y="664" width="28" height="16" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="584" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Nơi lưu</text>
      <line x1="660" y1="672" x2="688" y2="672" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <line x1="692" y1="664" x2="692" y2="680" stroke="#2d3142" stroke-width="2"/>
      <text x="704" y="676" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Lối bị chặn, không có đường vòng</text>
    </svg>
  </main>
</body>
</html>
