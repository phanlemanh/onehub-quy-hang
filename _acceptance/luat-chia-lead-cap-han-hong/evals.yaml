schema_version: 1
feature_slug: luat-chia-lead-cap-han-hong
# Lệnh máy: executors.test.api_db (Postgres dãy D 5575), executors.test.web, executors.script.design_floor.
# Bộ kiểm máy chủ: packages/api/test-db/luat-chia-lead-cap-han-hong.test.ts — sàn, người, lead dựng qua lối API thật; dòng
# «có từ trước» chèn thẳng bằng kết nối chủ (không qua lối kiểm), như ca E5c của cau-hinh-theo-san.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/api/test-db/luat-chia-lead-cap-han-hong.test.ts", "packages/api/src/settings/**", "packages/core/src/config/**"]
    expected: "exit 0; ca «cặp hạn hỏng: sửa hạn gọi khi hạn nhận hỏng» có mặt và ok — chèn thẳng lead_routing.accept_minutes = 60; đối chứng trước: GET có đúng một errors và hai hạn đọc 15/30; PATCH {lead_routing.first_call_minutes: 40} → 200; GET sau: errors rỗng, hai hạn 15/40, bảng company_settings có accept 15 và first_call 40; nhật ký thêm đúng hai dòng (first_call 40, accept 15), mỗi dòng actor là quản trị và actor_roles có company_admin; lead nhập mới qua nhịp chia mang accept 15, first_call 40. Chiều đỏ ghim: bỏ bước ghi thêm hạn kia thì assert «hai hạn đọc ra 15/40» đỏ với thông điệp nêu «cặp vẫn hỏng sau lưu»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/api/test-db/luat-chia-lead-cap-han-hong.test.ts", "packages/api/src/settings/**", "packages/core/src/config/**"]
    expected: "exit 0; ca «cặp hạn hỏng: sửa hạn nhận khi hạn gọi hỏng» có mặt và ok — chèn thẳng lead_routing.first_call_minutes = 10; đối chứng trước: hai hạn đọc 15/30 kèm một errors; PATCH {lead_routing.accept_minutes: 5} → 200; GET sau: hai hạn 5/30 (assert riêng: hạn gọi khác 10, thông điệp «giá trị cũ ẩn có hiệu lực»), errors rỗng; lead mới mang 5/30."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/api/test-db/luat-chia-lead-cap-han-hong.test.ts", "packages/api/src/settings/**"]
    expected: "exit 0; ca «cặp hạn hỏng: ra cặp trái luật thì 400, không ghi» có mặt và ok — chèn thẳng accept 60; PATCH {lead_routing.first_call_minutes: 10} → 400, reason mở đầu «lead_routing.first_call_minutes » và có «lead_routing.accept_minutes»; bảng company_settings của sàn giữ đúng một dòng accept 60 (không dòng first_call), nhật ký không thêm dòng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/api/test-db/luat-chia-lead-cap-han-hong.test.ts", "packages/api/src/settings/**"]
    expected: "exit 0; ca «cặp không hỏng: lưu một hạn chỉ ghi hạn ấy» có mặt và ok — sàn mới (không dòng nào): PATCH {lead_routing.first_call_minutes: 45} → 200, bảng có đúng một dòng first_call 45, không có dòng accept, nhật ký thêm đúng một dòng; sàn đã lưu cặp hợp lệ 20/40 qua lối chung: PATCH {first_call 45} → bảng accept vẫn 20 với updated_at không đổi, nhật ký thêm đúng một dòng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/settings/lead-routing/**"]
    expected: "exit 0; ca «luật chia lead: kết quả lưu» trong luat.test.ts có mặt và ok — ketQuaLuu(doi, ban) theo ma trận viết trước bốn ca: errors nhắc lead_routing.first_call_minutes và doi có khoá ấy → kind loi, câu nêu «Hạn gọi lần đầu» và «chưa áp», không phải câu Đã lưu; errors rỗng, doi có điểm hiệu lực mới → kind ok, câu «Đã lưu · áp cho lead mới từ bây giờ»; errors rỗng, doi chỉ có ngưỡng hàng đợi → «Đã lưu»; errors nhắc khoá không có trong doi → kind ok (đối chứng: lỗi cũ của dòng khác không chặn báo lưu)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.design_floor
    paths: ["apps/web/src/app/(app)/settings/lead-routing/**"]
    expected: "exit 0; không mã màu thô trên tệp giao diện vòng chạm"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3b
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.api_db
    paths: ["packages/api/test-db/luat-chia-lead-cap-han-hong.test.ts", "packages/api/src/settings/**", "packages/core/src/config/**"]
    expected: "exit 0; ca «cặp hạn hỏng: hạn gọi hỏng, hạn nhận ra cặp trái luật» có mặt và ok — chèn thẳng lead_routing.first_call_minutes = 10; PATCH {lead_routing.accept_minutes: 40} → 400, reason mở đầu «lead_routing.first_call_minutes » và có «lead_routing.accept_minutes»; bảng giữ đúng một dòng first_call 10 (không dòng accept), nhật ký không thêm dòng; đối chứng dương cùng ca: PATCH {accept 20} → 200 và hai hạn đọc 20/30 (thông điệp ghim «kiểm so với giá trị lưu hỏng thay vì giá trị đang áp» khi 400 oan)."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    steps:
      - "node _acceptance/luat-chia-lead-cap-han-hong/thu/chay-ui.mjs --ra _acceptance/luat-chia-lead-cap-han-hong/evidence — chỗ thử dãy D (Postgres 5575, máy dev 3495 của cây này, phiên quản trị sàn mẫu); trước mỗi khung chỗ thử chèn thẳng dòng hạn nhận 60 như dòng có từ trước, sau khung dọn hai dòng hạn"
      - "Khung 1 (dòng cap-ok): mở /settings/lead-routing, đầu khung có báo «đang chạy theo mặc định», gõ Hạn gọi lần đầu 40, Lưu → toast «Đã lưu · áp cho lead mới từ bây giờ»; sau khi tải lại, ô Hạn nhận lead 15, ô Hạn gọi lần đầu 40, không còn báo «đang chạy theo mặc định»; GET thật errors rỗng"
      - "Khung 2 (dòng cap-400): gõ Hạn gọi lần đầu 10, Lưu (qua CDP Fetch thả nút kiểm ô nếu màn khoá Lưu: sửa thân PATCH đi ra) → dòng Hạn gọi lần đầu có báo lỗi nêu hạn nhận, không có toast «Đã lưu»"
      - "Khung 3 (dòng cap-con-loi): qua CDP Fetch trả phản hồi 200 của PATCH với errors ['lead_routing.first_call_minutes: … — cặp về mặc định'] → đầu khung có báo nêu «Hạn gọi lần đầu» và «chưa áp», không có toast «Đã lưu»; đối chứng: khung 1 có toast"
    target: "http://localhost:3495/settings/lead-routing"
    expected: "Sửa một nửa cặp hỏng thì màn lưu và hiện đúng cặp mới; ra cặp trái luật thì báo lỗi ở dòng, không «Đã lưu»; phản hồi còn lỗi thì báo «chưa áp», không «Đã lưu». Ảnh E7-cap-ok.png, E7-cap-400.png, E7-cap-con-loi.png."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
