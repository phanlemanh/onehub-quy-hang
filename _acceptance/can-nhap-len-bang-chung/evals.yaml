    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.script.nhap_tac_tu
    expected: "exit 0; trong packages/api/test-db/imports/can-nhap-len-bang-chung.test.ts ca «điền dần mục thiếu, căn ở lại Đang bán» có mặt và ok — sau lần nhập như E2 (căn Active, thiếu pháp lý, tình trạng sử dụng), đầu chủ giữ căn gửi lần lượt qua POST /api/v1/listings/{id}/events: details_changed {legalStatus}, price_changed {listPrice, feeInclusion}, details_changed {occupantType}: mỗi lệnh 200 (3 assert), standardStatus vẫn 'Active' sau mỗi bước (3 assert); completeness.missing sau bước một không chứa 'legalStatus' mà chứa 'occupantType' (2 assert), sau bước ba không chứa cả hai (assert). Chiều đỏ: bắt lệnh không đổi trạng thái xét lại missingFor của trạng thái hiện tại → bước một 400, ca đỏ."
