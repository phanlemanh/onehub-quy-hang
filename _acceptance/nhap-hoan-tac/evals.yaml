schema_version: 1
feature_slug: nhap-hoan-tac
# Kế hoạch hoàn tác là hàm thuần ở `packages/core/src/listing/**` (node:test của core); đường ghi ở
# `packages/api/src/imports/undo/**` chấm trên Postgres dãy qua bộ kiểm `packages/api/test-db/imports/` (executor isolation);
# màn ở `apps/web/src/lib/nhap/**` (node:test của web, không DOM) và màn đang chạy (ui-check).
# exit 0 của lệnh chung KHÔNG đủ: người chấm đối chiếu từng tên ca nêu trong `expected` — có mặt, «ok», không
# «# SKIP»/«# TODO». Lần nhập trong mọi ca test-db ghi bằng đường thật (POST /imports rồi POST /imports/{id}/rows), không
# chèn dòng `import_rows` hay sự kiện bằng tay — trừ chỗ ghi rõ. Dữ liệu mẫu: `[Tên]`, `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/imports/hoan-tac.test.ts hai ca có mặt và ok. Ca «hoàn tác: gỡ hàng lần nhập tạo» — sàn mới, Đầu chủ mới ghi một lần nhập ba dòng tạo hàng (hai ở Chưa đủ để rao, một Tạm ngừng — trạng thái đọc lại từ bảng listings trước khi hoàn tác, assert; lần nhập không lên được Đang bán vì không ghi pháp lý, hiện trạng); đếm sự kiện từng hàng trước (n_i); POST /api/v1/imports/{id}/undo → mỗi hàng có đúng n_i + 1 sự kiện, sự kiện cuối voided payload {} (3×2 assert), các sự kiện cũ giống hệt trước (deepEqual, 3 assert), standard_status không đổi (3 assert), voided = true (3 assert); GET /api/v1/listings không còn ba id (3 assert); đối chứng: hàng tạo tay vẫn ở Bảng hàng (assert). Ca «hoàn tác: căn đã gỡ ra khỏi Hôm nay, Đã gửi, trang khách» — hai căn Đang bán đã gửi trong một link của đầu khách; gỡ một căn qua cửa voidListing của store hàng (cùng cửa đường hoàn tác gọi) → đầu vào Hôm nay của đầu khách (docVaoDungTin) không còn căn đã gỡ, còn căn kia (2 assert); chi tiết Đã gửi chỉ còn căn kia (deepEqual, assert); trang khách của link báo «unavailable» cho căn đã gỡ (assert). Chiều đỏ: bỏ lọc voided ở GET /listings → ca đầu đỏ nêu id hàng."
    paths: [packages/api/src/imports/**, packages/api/src/listings/**, packages/api/src/today-buyer/**, packages/api/src/da-gui/**, packages/api/src/public/**, packages/core/src/listing/**, packages/db/migrations/025_*]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «hoàn tác: trả giá cũ cho hàng có sẵn» có mặt và ok — hàng có sẵn của Đầu chủ (tạo tay, giá 3 tỷ, excluded, đã xác nhận lúc T0); lần nhập cập nhật căn ấy giá 3,2 tỷ, included, không cột ngày; hoàn tác → sự kiện cuối của hàng là price_changed {listPrice: 3000000000, feeInclusion: 'excluded'} (deepEqual, assert), confirmed_with_owner = false (assert), import_id null (assert), listings.last_confirmed_at = T0 (assert), listings.list_price = 3000000000 (assert). Đối chứng: lần nhập thứ hai cho hàng khác có cột ngày → owner_confirmed của lần nhập giữ nguyên, last_confirmed_at không đổi sau hoàn tác (assert) và kết quả có dòng «Độ tươi theo ngày trong file vẫn giữ» (assert). Chiều đỏ: sự kiện bù để confirmedWithOwner mặc định → ca đỏ nêu last_confirmed_at."
    paths: [packages/api/src/imports/**, packages/api/src/listings/**, packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «kế hoạch hoàn tác: đã sửa sau thì không gỡ» có mặt và ok trong packages/core/src/listing/hoan-tac-nhap.test.ts — dãy sự kiện dựng bằng hàm gấp thật (foldListing trên dãy tạo bằng tay theo khuôn validatePayload, mỗi sự kiện qua validatePayload, assert rỗng lỗi); ma trận viết tay hai hành động (tạo, cập nhật đổi giá) × bốn loại sự kiện sau lần nhập (details_changed, price_changed, status_changed sang Closed, owner_confirmed) × hai người ghi (người nhập, người khác) → mỗi ô kết cục da-sua-sau, lyDo «Đã có người sửa sau lần nhập» (16 assert); đối chứng dương: hai hành động không có sự kiện sau → go và tra-gia (2 assert); đếm = 18. Chiều đỏ: chỉ coi sự kiện của người khác là sửa sau → 8 ô người nhập đỏ, thông điệp nêu «người nhập»."
    paths: [packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3b
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «hoàn tác: căn sửa sau lần nhập được liệt kê, không gỡ» có mặt và ok — lần nhập tạo hai hàng H1, H2 và đổi giá hàng có sẵn H3; sau lần nhập chính người nhập (Hỏi-4: sửa của người nhập cũng là sửa sau; hàng H1 «Chỉ tôi» nên người khác không đọc được) đổi chi tiết H1 và đổi giá H3 qua lệnh hàng thường; hoàn tác → H1, H3 không có sự kiện mới (đếm trước = sau, 2 assert), H2 có voided (assert); kết quả liệt kê đúng hai dòng {toà, mã căn, lyDo: 'Đã có người sửa sau lần nhập'} cho H1, H3 (deepEqual, assert). Chiều đỏ: bỏ kiểm phiên bản → ca đỏ nêu H1."
    paths: [packages/api/src/imports/**, packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «kế hoạch hoàn tác: phần không hoàn tác được» có mặt và ok — ma trận viết tay bốn dòng: supplement (lead_id có) → tin-bo-sung «Tin bổ sung đã gửi — không thu lại»; update chỉ owner_confirmed → khong-doi «Độ tươi theo ngày trong file vẫn giữ»; update đổi giá khi dãy tới listing_version_before không có price_changed → khong-tra-duoc «Trước lần nhập căn chưa có giá»; skip → bo-qua, không vào danh sách liệt kê (4 assert kết cục + 3 assert lý do nguyên văn + 1 assert danh sách liệt kê đúng 3 dòng); không kết cục nào trong bốn sinh lệnh ghi (assert lenh rỗng ×4); đếm = 12. Chiều đỏ: update đổi giá không kiểm giá trước → ca đỏ nêu «chưa có giá»."
    paths: [packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4b
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «hoàn tác: phần không hoàn tác được qua đường ghi thật» có mặt và ok — hàng có sẵn H1 chưa có giá (tạo tay) và H2 có giá do Đầu chủ khác giữ (để dòng thành tin bổ sung); lần nhập ghi bằng POST /imports rồi /rows bốn dòng: tin bổ sung cho H2, dòng cho căn của người nhập chỉ có cột ngày (không giá), dòng đổi giá cho H1, một dòng bỏ qua (thiếu toà); đọc import_rows trước hoàn tác: action lần lượt supplement, update, update, skip (assert); POST /undo → danh sách liệt kê deepEqual ba dòng với lý do nguyên văn «Tin bổ sung đã gửi — không thu lại», «Độ tươi theo ngày trong file vẫn giữ», «Trước lần nhập căn chưa có giá» (assert), không dòng nào của dòng bỏ qua (assert), tổng sự kiện của sàn trước = sau (assert), lead của tin bổ sung còn nguyên (assert). Chiều đỏ: kế hoạch không kiểm giá trước lần nhập → H1 nhận price_changed, ca đỏ nêu «chưa có giá»."
    paths: [packages/api/src/imports/**, packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «hoàn tác: xem thử không ghi, ghi khớp xem thử» có mặt và ok — lần nhập có hai dòng tạo, một dòng đổi giá, một tin bổ sung; POST /undo {dryRun:true} → {go:2, traGia:1, khongDuoc:1, danhSach:[1 dòng]} (deepEqual, assert), tổng số sự kiện của sàn trước = sau (assert), imports.status vẫn committed (assert); POST /undo → kết quả có cùng go, traGia, khongDuoc và cùng danh sách căn (deepEqual với xem thử, assert), tổng sự kiện tăng đúng 3 (assert). Chiều đỏ: dryRun ghi rồi không rollback → ca đỏ nêu «trước = sau»."
    paths: [packages/api/src/imports/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «hoàn tác: một lần, gọi lại được, chỉ người nhập» có mặt và ok — (a) đứt giữa chừng: lần nhập ba dòng tạo; bộ kiểm làm đứt lần ghi sau dòng 2 bằng móc thử của store (biến thử, không đổi mã đường ghi thật) → H1, H2 có voided, H3 chưa, imports.status committed (4 assert); gọi lại → H3 có voided, H1, H2 vẫn đúng một voided (đếm voided mỗi hàng = 1, 3 assert), imports.status undone, undone_by = người nhập (2 assert); gọi lại lần ba → không sự kiện mới (tổng trước = sau, assert), kết quả deepEqual lần hai (assert); (b) người: Đầu chủ khác cùng sàn và Trưởng nhóm cùng sàn gọi /undo và /undo dryRun → 404 (4 assert); Đầu chủ sàn B → 404 (assert); Đầu khách sàn A → 403 import-role-required (assert); đếm = 15; ca «hoàn tác: lần nhập nhiều gói đứt giữa chừng rồi làm tiếp» — 120 dòng tạo, đứt sau dòng 70 → đúng 70 hàng đã gỡ (gói 50 và 20 dòng của gói hai giữ nguyên), gọi lại → mọi hàng đã gỡ, status undone. Chiều đỏ: bỏ điều kiện status in (committed, undone) khi đọc lần nhập → lần nhập chỉ xem thử (planned) hoàn tác được, ca đỏ nêu 404."
    paths: [packages/api/src/imports/**, packages/db/migrations/025_*]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «sự kiện voided: cờ khi gấp, không phải trạng thái» có mặt và ok — ma trận sáu trạng thái chuẩn × một dãy kết thúc bằng voided → foldListing giữ standardStatus (6 assert) và voided true (6 assert); dãy không voided → voided false (assert); validatePayload('voided', {}) rỗng lỗi, ('voided', {x:1}) báo khoá lạ (2 assert); TRANSITIONS không có khoá hay giá trị 'voided' (assert); đếm = 16. Chiều đỏ: gấp voided thành standardStatus 'Withdrawn' → ca đỏ nêu trạng thái đầu bị đổi."
    paths: [packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7b
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «voided: gấp lại bảng, lệnh thường không ghi được, kiểm trùng» có mặt và ok — sau hoàn tác một lần nhập: chụp listings của sàn, xoá trắng rồi gấp lại từ sự kiện (đường gấp lại có sẵn của bộ kiểm hàng lõi) → deepEqual bản chụp kể cả cột voided (assert); POST lệnh {type:'voided'} qua đường sửa thường → 4xx, không sự kiện mới (2 assert); lần nhập mới cùng toà, mã căn của hàng đã gỡ → import_rows.action = create và listing_id khác id đã gỡ (2 assert). Chiều đỏ: hangMo không lọc voided → dòng thành update, ca đỏ nêu «create»."
    paths: [packages/api/src/listings/**, packages/api/src/imports/**, packages/db/migrations/025_*]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7d
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «voided: lệnh sửa lên hàng đã gỡ bị từ chối như hàng không có» có mặt và ok — lần nhập tạo hai hàng; ghi nhớ phiên bản từng hàng trước khi hoàn tác; hoàn tác; POST /api/v1/listings/{id}/events (details_changed, expectedVersion = phiên bản sau hoàn tác) cho từng hàng → 404 not-found (2 assert), không sự kiện mới (đếm trước = sau, 2 assert); GET /api/v1/listings/{id} → 404 (2 assert); đối chứng dương: hàng tạo tay của sàn nhận cùng lệnh → 200 (assert). Chiều đỏ: applyCommand không xét voided → ca đỏ nêu hàng đầu."
    paths: [packages/api/src/listings/**, packages/api/src/imports/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7c
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «đồng bộ trên máy: hàng đã gỡ ra khỏi máy» có mặt và ok — kho máy có hai hàng và một lệnh sửa đang chờ gửi cho hàng 1; máy chủ giả (may-chu-gia) trả GET /api/v1/listings chỉ có hàng 2 và 404 cho lệnh lên hàng 1; chạy một vòng đồng bộ thật (dong-bo) → danh sách hàng của máy chỉ còn hàng 2 (assert), lịch sử hàng 1 bị bỏ (assert), lệnh chờ của hàng 1 rời hàng đợi gửi sang «cần xem» với lý do «căn không còn đọc được» và không gửi lặp ở vòng kế (3 assert); đối chứng: hàng 2 giữ nguyên (assert). Chiều đỏ: máy chủ giả vẫn trả hàng 1 trong danh sách → ca đỏ nêu hàng 1."
    paths: [apps/web/src/lib/sync/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «màn nhập: lần nhập gần đây và nút hoàn tác» có mặt và ok — hàm thuần của lib/nhap dựng danh sách từ thân GET /api/v1/imports giả (12 lần, lộn thứ tự, hai lần undone) → 10 dòng mới nhất trước (assert số và thứ tự), dòng undone có nhãn «Đã hoàn tác» và coNut false (2 assert), dòng còn lại coNut true (assert); bốn trạng thái danh sách (đang tải, trống, lỗi, có dòng) ra đúng khoá trạng thái (4 assert); bước 5 sau ghi xong có hanhDong «Hoàn tác lần nhập này» (assert); hàm gọi API huyHoanTac/xemThuHoanTac gửi đúng địa chỉ /api/v1/imports/{id}/undo và thân {dryRun:true} (2 assert); hộp xác nhận (hàm thuần trạng thái hộp): kế hoạch go=0, traGia=0 → nút xác nhận tắt và chữ «Không có căn nào hoàn tác được» (2 assert), đang ghi → nút khoá (assert), lỗi giữa chừng → chữ nguyên văn «Hoàn tác chưa xong — bấm lại để làm tiếp» và nút mở lại (2 assert), huỷ → không lời gọi /undo nào ngoài xem thử (assert trên danh sách địa chỉ đã gọi). Chiều đỏ: không sắp theo ngày → ca đỏ nêu dòng đầu."
    paths: ["apps/web/src/app/(app)/imports/**", apps/web/src/lib/nhap/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8b
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    expected: "Trên màn đang chạy của dãy G (Postgres 5573, máy dev 3493), sàn mới và Đầu chủ mới: (1) /imports/new bước 1 trống → «Chưa có lần nhập nào»; (2) ghi một lần nhập mau-b.xlsx → bước 5 có nút «Hoàn tác lần nhập này»; bấm → hộp xác nhận hiện «Gỡ N căn khỏi Quỹ hàng · Trả giá cũ cho 0 căn · 0 căn không hoàn tác được» với N = số dòng tạo; (3) xác nhận → báo xong, Bảng hàng (/inventory) không còn các căn ấy; (4) quay /imports/new → danh sách «Lần nhập gần đây» có dòng ấy mang nhãn «Đã hoàn tác», không nút; (5) ghi lần nhập thứ hai, sửa một căn ở Bảng hàng rồi mở hộp hoàn tác → danh sách K căn có căn đã sửa với «Đã có người sửa sau lần nhập»; (6) lỗi giữa chừng (chặn đường /undo ở trình duyệt lúc bấm Hoàn tác — như mất mạng giữa lời gọi) → hộp hiện «Hoàn tác chưa xong — bấm lại để làm tiếp»; gỡ chặn, bấm «Hoàn tác tiếp» thì xong. Chụp mỗi khung ở 1440 và 375 vào _acceptance/nhap-hoan-tac/evidence/E8b-*.png."
    steps:
      - "Dựng chỗ thử dãy G: node _acceptance/man-nhap-excel/thu/dung-g.mjs (dừng bằng --tat khi chấm xong, không pkill)"
      - "Chạy node _acceptance/nhap-hoan-tac/thu/chup-hoan-tac.mjs --ca trong, --ca sau-ghi, --ca xac-nhan, --ca da-hoan-tac, --ca da-sua-sau, --ca loi-giua-chung ở --kho 1440 và --kho 375 — lệnh tự đăng nhập người mẫu, in mỗi khung một dòng JSON và chụp E8b-*.png"
      - "Đối chiếu từng dòng JSON với expected và xem từng ảnh ở hai khổ"
    paths: ["apps/web/src/app/(app)/imports/**", apps/web/src/lib/nhap/**]
    evidence_required: [screenshot, observed]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.web
