# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # chuẩn thiết lập kho 29/10
gap_probe: required          # nang-kit-2-36-0 (31/10): 10/10 hồ sơ T2/T3 đã có phản biện — đội đã quen
recheck: strict              # kho mới, không có báo cáo cũ
# Chưa khai ui_standards_skill / ds_skill / design / design_floor: chưa có màn — làm cùng màn đầu tiên (tầng 5).
# tang-5-giao-dien (30/10): đã khai feature_loop.ui_standards_skill, design.surface_globs (bậc M1), executors.design.floor.
executors:
  test:
    core: "npm test -w @quy-hang/core"            # suy từ: packages/core/package.json
    api: "npm test -w @quy-hang/api"              # suy từ: packages/api/package.json
    connect: "npm test -w @quy-hang/connect"      # suy từ: packages/connect/package.json
    isolation: "npm run db:migrate && npm run db:test"   # suy từ: package.json, ci.yml job isolation — cần DATABASE_URL (AGENTS.md)
    ui_lint: "npm test -w @quy-hang/ui-lint"      # tang-5-giao-dien: mười luật quy-hang-ui, mức nợ, kiểm chuẩn, phạm vi cấu hình
    luoi_nguong: "node --test \"_acceptance/bai-thu-luoi-5000-dong/thu/*.test.mjs\""   # bai-thu-luoi-5000-dong: ngưỡng, kết luận, main sạch
    web: "npm test -w @quy-hang/web"               # nhanh-tuc-thi: bộ đồng bộ trên máy, kiểm thuần (N-14)
    web_db: "npm run test:db -w @quy-hang/web"     # nhanh-tuc-thi: bộ đồng bộ nói với API thật trên Postgres dãy — cần DATABASE_URL (N-14)
    nap_mau: "node --env-file-if-exists=.env.local --import tsx --test \"packages/db/seed/*.test.ts\""   # nap-mau-ban-that: bộ nạp mẫu bản thật trên Postgres dãy — cần DATABASE_URL
    nap_mau_yml: "node --test packages/db/seed/nap-mau-yml.test.mjs"   # nap-mau-ban-that AC-8: đọc tệp workflow nút nạp
    typecheck_db: "node --test packages/db/seed/typecheck-db.test.mjs"   # va-nap-mau E6: gói db nằm trong npm run typecheck của gốc, chiều đỏ trên chính lệnh ấy
    du_lieu_mau_tsx: "node --env-file-if-exists=.env.local --import tsx --test \"packages/db/seed/*.test.mjs\""   # nap-mau-ban-that E10: như du_lieu_mau nhưng có tsx — bộ kiểm hàng 5 nhập packages/connect (TypeScript) từ hàng 10
  script:
    hooks: "npm run test:hooks"                   # suy từ: package.json — phải in «TỔNG: ĐẠT»
    # Kit nằm ngoài kho: CI đặt CLAUDE_PLUGIN_ROOT = bản kit tải theo tag; ở máy, export CLAUDE_PLUGIN_ROOT
    # trỏ bản cài (tìm bằng feature-loop/scripts/resolve-plugin.mjs --plugin acceptance-gate). Không ghi đường cache.
    product_map: "node \"${CLAUDE_PLUGIN_ROOT}/scripts/product-map.mjs\" --root . --check"
    bai_thu_zalo: "node --test \"_acceptance/bai-thu-zalo/thu/*.test.mjs\""   # mã thử hàng 3 (luật đợt 5) — duyệt ở yêu cầu T-3
    bai_thu_dong_bo: "node --test \"_acceptance/bai-thu-dong-bo-mat-mang/thu/*.test.mjs\""   # mã thử hàng 2 (luật đợt 5), cần DATABASE_URL tới Postgres dãy — duyệt ở yêu cầu T-6
    luoi_do_lai: "node _acceptance/bai-thu-luoi-5000-dong/thu/do-lai.mjs"   # bai-thu-luoi-5000-dong: dựng nhánh thử từ tag, đo, so ngưỡng — cổng riêng 3468
    luoi_trang: "node _acceptance/bai-thu-luoi-5000-dong/thu/do-lai.mjs --chi-trang --cong 3466"   # cổng và worktree riêng: chạy song song với luoi_do_lai khi chấm
    luoi_main_sach: "node _acceptance/bai-thu-luoi-5000-dong/thu/main-sach.mjs"
    du_lieu_mau: "node --env-file-if-exists=.env.local --import tsx --test \"packages/db/seed/*.test.mjs\""   # du-lieu-mau-san-thu: sinh tất định, không dữ liệu thật, nhãn mẫu, nạp và xoá — cần DATABASE_URL tới Postgres dãy (duyệt ở yêu cầu T-9)
    # moi-truong-that (ADR-0009): kiểm môi trường thật từ bên ngoài, chỉ đọc. Cần DATABASE_URL vai chủ tới Supabase thật,
    # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (moi_truong_that); APP_URL (suc_khoe_that). Không chạy trong suite_keys.
    moi_truong_that: "node _acceptance/moi-truong-that/thu/kiem-moi-truong.mjs"
    cai_dat_tai_lieu: "node --test \"_acceptance/cai-dat-hop-nhat/thu/*.test.mjs\""   # cai-dat-hop-nhat AC-9: ba quyết định đã niêm có mục sửa đổi, không viết đè
    suc_khoe_that: "node _acceptance/moi-truong-that/thu/kiem-moi-truong.mjs --suc-khoe"
    suc_khoe_xem_truoc: "cd \"$VERCEL_LINK_DIR\" && npx -y vercel@latest curl /api/v1/health --deployment \"$APP_URL\" -- -fsS"   # moi-truong-that AC-8: bản xem trước có Vercel Authentication — vercel curl vượt bảo vệ bằng phiên CLI; VERCEL_LINK_DIR là thư mục ngoài kho đã `vercel link`
    cach_ly_that: "npm run test:isolation -w @quy-hang/db"   # moi-truong-that: chỉ bộ kiểm cách ly (mỗi ca rollback) — DATABASE_URL trỏ cơ sở dữ liệu thật
    kiem_ci: "node _acceptance/moi-truong-that/thu/kiem-ci.mjs"   # moi-truong-that AC-7: job deploy và vercel.json
    typecheck: "npm run typecheck"                # tang-5-giao-dien
    lint: "npm run lint"                          # eslint + directive trần + mức nợ giao diện + kiểm chuẩn — job check của CI
    build: "npm run build"
    giao_dien: "node packages/ui-lint/kiem-chuan.mjs"   # trạng thái cây của bộ chuẩn giao diện
    san_m1: "CLAUDE_PLUGIN_ROOT=\"${CLAUDE_PLUGIN_ROOT:-$(node packages/ui-lint/tim-kit.mjs)}\" node packages/ui-lint/thu-san.mjs"   # bài thử sàn M1 — kit từ CLAUDE_PLUGIN_ROOT, vắng thì từ sổ plugin đã cài
    design_floor: "R=\"${CLAUDE_PLUGIN_ROOT:-$(node packages/ui-lint/tim-kit.mjs)}\" && node \"$R/scripts/design-floor-s4.mjs\" --root ."   # vo-ung-dung: như design.floor, kit vắng CLAUDE_PLUGIN_ROOT thì tìm như san_m1 (lượt chấm không có biến này)
    nang_kit: "node --test \"_acceptance/nang-kit-2-36-0/thu/*.test.mjs\""   # nang-kit-2-36-0: mỗi nấc kit một cặp hai chiều; kit từ CLAUDE_PLUGIN_ROOT, vắng thì tim-kit.mjs
    ho_so_vong_giao_dien: "node _acceptance/vong-giao-dien-qua-ban-do/thu/kiem-ho-so.mjs && node --test \"_acceptance/vong-giao-dien-qua-ban-do/thu/*.test.mjs\""   # vong-giao-dien-qua-ban-do E9: hồ sơ tự áp số đo và trang đối chiếu, cặp hai chiều
    product_map_kit: "R=\"${CLAUDE_PLUGIN_ROOT:-$(node packages/ui-lint/tim-kit.mjs)}\" && node \"$R/scripts/product-map.mjs\" --root . --check"   # như product_map, chạy được ở lượt chấm (không có CLAUDE_PLUGIN_ROOT)
    ro_ri: "npm run test:ro-ri"   # luat-an-va-kiem-ro-ri: bộ kiểm rò rỉ của luật ẩn — cùng lệnh job CI ro-ri (E9)
    lint_bo_qua: "node --test \"_acceptance/luat-an-va-kiem-ro-ri/thu/*.test.mjs\""   # luat-an-va-kiem-ro-ri: lint bỏ qua thư mục đợt, CI nối ro-ri, phá thử trên bản sao lõi (E9b, E10)
  ui-check: "npm run dev -w @quy-hang/web -- -p 3462"   # tang-5-giao-dien: máy chủ dev mà eval ui-check mở (E4) — người chấm bài nhìn giao diện
  design:
    floor: "node \"${CLAUDE_PLUGIN_ROOT}/scripts/design-floor-s4.mjs\" --root ."   # S4: chặn mã màu thô trên tệp giao diện vòng chạm
    khuon: "R=\"${CLAUDE_PLUGIN_ROOT:-$(node packages/ui-lint/tim-kit.mjs)}\" && node \"$R/scripts/design-floor-khuon.mjs\" --kiem --root ."   # hàng 32: lưới khuôn S4 của kit 2.37.0 (giám sát duyệt B-0311-2)
feature_loop:
  ui_standards_skill: quy-hang-ui   # tang-5-giao-dien: .agents/skills/quy-hang-ui (nạp qua .claude/skills/quy-hang-ui)
  # nang-kit-2-36-0 (Mạnh duyệt 31/10, Hỏi-2): máy tự ghi định tuyến mục ngoài hợp đồng mà chính nó đề xuất known-limits/
  # wont-fix, chỉ ở hồ sơ T2 · PASS · 0 UNCERTAIN; T3 và «mở hợp đồng mới» vẫn của người. Đảo một mục: lệnh in trên thẻ.
  ngoai_n_tu_dinh_tuyen: true
  # Bộ kiểm chạy ở đường nền S1 và lượt S4 của mọi hàng (giám sát đợt nen-dau 30/10). Không gồm
  # test.isolation (cần Postgres riêng từng dãy — luật 2 của đợt và job isolation của CI vẫn gác) và
  # script.product_map (cần CLAUDE_PLUGIN_ROOT).
  suite_keys:
    - executors.test.core
    - executors.test.api
    - executors.test.connect
    - executors.script.hooks
    - executors.test.ui_lint
    - executors.script.typecheck
    - executors.script.lint
design:
  surface_globs:                  # bậc M1 của design-floor (tang-5-giao-dien)
    - "apps/web/src/app/**"
    - "apps/web/src/components/**"
risk_tiers:
  t1_skip_globs:
    - "docs/**"                     # tài liệu sản phẩm, kiến trúc, ADR
    - "AGENTS.md"                   # hướng dẫn agent
    - "CLAUDE.md"
    - "CONTEXT.md"                  # từ vựng nhãn ↔ code
    - "README.md"
    - ".claude/rules/**"            # luật theo đường dẫn cho agent
    - ".github/workflows/ci.yml"    # workflow chứa job gate — ĐÍCH DANH, không .github/** (GUIDE §5.3 bước 3)
    # Bản đồ sản phẩm — máy sinh, commit cùng chữ ký (ADR 0007). Chỉ an toàn vì CI chạy product_map --check.
    - "PRODUCT-MAP.md"
    - "LO-TRINH.html"
  # t3_paths không khai _acceptance/config.yaml: lưới gộp bỏ qua tệp hồ sơ trước khi đối chiếu, còn hầu hết vòng thêm lệnh
  # kiểm vào tệp ấy — khai thì chặn nhầm định tuyến máy (nang-kit-2-36-0, Cổng Bằng chứng lượt 1, Ngoài-1).
  t3_paths:
    - "packages/db/**"                        # migration, luật cách ly theo dòng (bất biến 1)
    - "packages/core/src/data-classes.ts"     # trần lớp dữ liệu, source không rời công ty (bất biến 2)
    - "packages/core/src/agreements.ts"       # mọi kết nối là một thoả thuận
    - "packages/connect/**"                   # khuôn dữ liệu cấp vào từ Invest
    - ".claude/settings.json"                 # quyền cấm và hook của agent
    - ".claude/hooks/**"
    - ".githooks/**"                          # chặn commit main, gitleaks
    - ".gitattributes"                        # nang-kit-2-36-0: driver gộp tệp sinh
signoff:
  required_for: [T2, T3]
  approvers: ["Manh Phan"]   # suy từ: git config user.name — thông tin, cổng không cưỡng chế
dev_server:
  start: "npm run dev"                 # suy từ: package.json, .claude/launch.json
  url: "http://localhost:3460"         # suy từ: apps/web/package.json (next dev -p 3460)
# capture: bỏ — chưa có bằng chứng giao diện.
lo_trinh:
  tep: docs/plan/lo-trinh.json
  chan: true   # nang-kit-2-36-0 (Mạnh duyệt 31/10, Hỏi-1): hồ sơ mới phải thuộc một hàng; mở bằng câu mô tả thì máy tự thêm hàng
tri_thuc:
  noi: docs/tri-thuc   # gốc tri thức trong kho; kho riêng tư nên tài liệu thô nằm trong kho (không khai cong_khai, không kho riêng)
dieu_phoi:
  goi_dot: docs/plan/dot-{ten}   # gói đợt Điều phối – Thợ; mở bằng /dieu-phoi:mo-dot <tên> (Mạnh 30/10)
design_pass:
  proto_route: http://localhost:3460/proto/{slug}
  ds_skill: quy-hang-ui
