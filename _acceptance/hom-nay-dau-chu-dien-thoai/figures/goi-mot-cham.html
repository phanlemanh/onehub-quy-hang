    <h1>Ngăn «Kết quả cuộc gọi» mở ngay khi chạm «Gọi», hay chỉ khi trang hiện lại</h1>
    <p class="subtitle">Hai nhánh chung ba bước đầu và cùng kết thúc ở «Đã gọi». Khác nhau ở lúc ngăn xuất hiện — và vì thế ở điều xảy ra khi cuộc gọi bị huỷ hay app bị dừng ở nền.</p>

<desc id="d">Bước chung: thẻ [Mẫu] Lead 1, Lead mới, còn 12 phút; chạm Gọi; máy chủ mở số rồi máy mở cuộc gọi. Nhánh A, khuyến nghị, mở ngay: ngăn Kết quả cuộc gọi mở cùng lần chạm và nhớ trên máy; quay lại app, kể cả khi trang tải lại, ngăn vẫn ở đó; chạm Đã gọi. Giá: huỷ cuộc gọi vẫn thấy ngăn, chạm Không nghe máy để đóng. Nhánh B, mở khi hiện lại: lúc chạm chưa có ngăn; quay lại app, trang hiện lại thì mở ngăn; chạm Đã gọi. Giá: huỷ trước khi rời app hay app bị dừng ở nền rồi tải lại thì không có ngăn, phải tìm lại thẻ.</desc>
