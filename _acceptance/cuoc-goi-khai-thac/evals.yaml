schema_version: 1
feature_slug: cuoc-goi-khai-thac
# Lệnh máy: executors.test.core (giá về tay, so giá toà, danh sách hỏi), executors.test.web (máy tính, phím, mức đủ trên
# máy — thuần), executors.test.isolation (API trên Postgres dãy D, cổng 5565 — cần DATABASE_URL), executors.script.lint.
# Người chấm đối chiếu tên ca nêu trong `expected` với dòng reporter: có mặt, ok, không SKIP. Ui-check chạy trên máy dev
# dãy D (cổng 3485, Postgres 5565), sàn «[Mẫu] Sàn thử»; dữ liệu dựng bằng
# node --env-file-if-exists=.env.local --import tsx _acceptance/cuoc-goi-khai-thac/thu/dung-d.mjs (in mã lead, mã căn).
# Đăng nhập người mẫu không cần đọc nhật ký máy dev: node --env-file=.env.local --import tsx
# _acceptance/cuoc-goi-khai-thac/thu/phien.mts <email> in cookie phiên — đặt `qh.session_token` và `qh_san` cho localhost.
# Dữ liệu đã dựng sẵn: chạy lại dung-d.mjs chỉ in lại mã (giữ ở .acceptance-runs/cuoc-goi-khai-thac/dung-d.json).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «leads/assigned/{id}: một lead của tôi bất kể nhóm» (packages/api/test-db/cuoc-goi-khai-thac.test.ts) có mặt và ok — dữ liệu: lead L1 giao A ở nấc Đã nhận, L2 giao A đã ghi gọi đầu (rời nhóm Lead mới), L3 giao B, L4 giao A đã trả lại, L5 giao A đã có hồ sơ căn tạo từ lead; A GET L1 → 200 với id, buildingName, unitNumber, need, priceText, listPrice (số), feeInclusion, stage, listingId null; A GET L2 → 200 stage 'called'; A GET L5 → listingId bằng id hồ sơ tạo từ lead; A GET L3 → 404; A GET L4 → 404; L6 giao A đã bỏ → 404; findSourceLeaks trên mọi thân trả rỗng và không khoá nào chứa 'phone'; ma trận đếm đúng 6 ca (assert số). Chiều đỏ: bỏ điều kiện matched_agent_user_id → A GET L3 ra 200, ca đỏ ghim 'lead của người khác'."
    paths: [packages/api/src/today/**, packages/api/test-db/cuoc-goi-khai-thac.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-1
    executor: ui-check
    layer: ui-observed
    target: "Máy dev dãy D (cổng 3485, Postgres 5565), sàn «[Mẫu] Sàn thử», dữ liệu dựng bằng dung-d.mjs (in lead L1 có mã căn, L6 chỉ biết toà, L3 của dau-chu-2)"
    steps:
      - "Đăng nhập dau-chu-1@mau.quy-hang.test (mã ở nhật ký máy dev). Khổ 1440x900. Mở /today, trên dòng lead L1 bấm «Gọi» → ghi URL; chờ chế độ cuộc gọi hiện → chụp evidence/E1b-1440.png; ghi chữ thẻ lead: toà · căn, thuộc tính tự điền, nhu cầu, giá chủ muốn, giờ nhập, nấc"
      - "Mở /units/call?lead=<L6> → chụp evidence/E1b-chi-toa.png; ghi dòng toà · căn và có thuộc tính căn không"
      - "Mở /units/call?lead=<L3> (lead của dau-chu-2) → chụp evidence/E1b-khong-thay.png; bấm nút trên khối báo → ghi URL"
      - "Khổ 1280x800 mở lại L1 → chụp evidence/E1b-1280.png; ghi scrollWidth so với innerWidth"
    expected: "URL là /units/call?lead=<L1>; thẻ lead nêu toà và mã căn L1, thuộc tính căn (loại căn, diện tích, hướng, tầng) đúng danh mục, nhu cầu, giá kèm «bao phí»/«không bao phí», giờ nhập, nấc. L6: «chỉ biết toà», không dòng thuộc tính. L3: «Không thấy lead này trong việc của bạn», nút đưa về /today. 1280: ba cột, scrollWidth ≤ innerWidth."
    paths: ["apps/web/src/app/(app)/units/call/**", "apps/web/src/app/(app)/today/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E1c
    criterion: AC-1
    executor: script
    cmd: config:executors.script.lint
    expected: "exit 0; stdout có dòng 'khuôn: ' với 0 lỗi đọc · 0 lệch và số nhóm tăng một so với nhánh chính (nhóm cuoc-goi); 'chuẩn giao diện: đạt'; dòng 'ba lối: ' đếm thêm trang của cuoc-goi-khai-thac dựng bằng lệnh."
    paths: [design/patterns/**, "apps/web/src/app/(app)/units/call/**", _acceptance/cuoc-goi-khai-thac/ba-loi/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: ui-check
    layer: backend-effect
    target: "Như E1b, dau-chu-1; dung-d.mjs in lead L11, L12 (Đã nhận, chưa gọi, chưa hồ sơ — riêng cho bài này) và L7 (sẽ bị trả lại bởi lệnh dung-d.mjs --tra <L7>)"
    steps:
      - "Mở /units/call?lead=<L11>; trong trang gọi GET /api/v1/leads/assigned/<L11> → ghi stage"
      - "Gõ phím G → chụp evidence/E2-da-goi.png; ghi chữ nấc và nút «Đã gọi» còn không"
      - "Gọi lại GET /api/v1/leads/assigned/<L11> → ghi stage; tải lại trang → ghi thẻ còn hiện không"
      - "Mở /units/call?lead=<L12>, chỉ dùng phím: Tab tới Tình trạng sử dụng, gõ 1, rồi Ctrl+Enter (không bấm «Đã gọi»); GET /api/v1/leads/assigned/<L12> → ghi stage; chọn thêm một câu trả lời ở lead ấy rồi GET lại → ghi stage có đổi không"
      - "Mở /units/call?lead=<L7>; chạy dung-d.mjs --tra <L7> trong terminal; bấm «Đã gọi» → chụp evidence/E2-409.png; ghi chữ báo và nấc"
    expected: "Trước: stage 'accepted'. Sau phím G: nấc «Đã gọi», nút ẩn; API trả stage 'called'; tải lại vẫn mở được chế độ cuộc gọi của L11 (lead đã rời nhóm Lead mới). L12: sau câu trả lời đầu tiên stage 'called' dù không bấm «Đã gọi»; câu trả lời thứ hai không gây lỗi, stage giữ 'called'. L7: thẻ nói lý do bằng chữ (không mã lỗi trần), nấc giữ nguyên."
    paths: ["apps/web/src/app/(app)/units/call/**", packages/api/src/routing/**, packages/api/src/today/**]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E2b
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «mốc gọi đầu: ghi đúng một lần» (apps/web/src/app/(app)/units/call/goi-dau.test.ts) có mặt và ok — với hàm gọi giả, ma trận viết trước 5 ca (assert số): lead chưa mốc + câu trả lời đầu tiên → gọi POST /leads/<id>/first-call đúng một lần; hai câu trả lời liền nhau khi chưa mốc → vẫn một lần; lead đã có mốc (firstCalledAt khác null hay stage 'called') + câu trả lời → không gọi; phím G khi chưa mốc → gọi một lần, khi đã mốc → không gọi; POST trả 409 → trạng thái giữ nấc cũ và câu lý do bằng chữ (không mã lỗi trần). Đối chứng đỏ: bỏ kiểm mốc có sẵn → ca lead đã có mốc gọi tên 'first-call thừa'."
    paths: ["apps/web/src/app/(app)/units/call/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «về tay: bảng viết trước» (packages/core/src/pricing/ve-tay.test.ts) có mặt và ok — bảng viết tay trước bộ tính đếm đúng 8 dòng (assert số): 2.750.000.000 bao phí → về tay 2.653.750.000, ba khoản 55.000.000 · 13.750.000 · 27.500.000 theo thứ tự thue_tncn · le_phi_truoc_ba · moi_gioi; 2.750.000.000 không bao phí → 2.750.000.000, không khoản; giá lẻ 1.234.567.891 bao phí → mỗi khoản làm tròn tới đồng; tỉ lệ môi giới 150 phần vạn; tỉ lệ môi giới 0; ca «về tay: tính ngược» ok — với 2.000 số về tay sinh theo hạt giống cố định, g = giaBaoPhiTuVeTay(n): tinhVeTay(g).veTay ≥ n và tinhVeTay(g−1).veTay < n; ca «về tay: số nguyên» ok — mọi khoản và về tay là Number.isSafeInteger. Đối chứng đỏ cùng bảng: bộ tính dùng số thực không làm tròn từng khoản → dòng giá lẻ bị gọi tên; bộ tính trừ phí cả với không bao phí → dòng 2.750.000.000 không bao phí bị gọi tên."
    paths: [packages/core/src/pricing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «máy tính: hai chiều» (apps/web/src/app/(app)/units/call/may-tinh.test.ts) có mặt và ok — trạng thái máy tính: gõ chữ «2,75 tỷ» + bao phí → về tay 2.653.750.000 và ba dòng khoản; gõ về tay «2,65 tỷ» → giá bao phí bằng giaBaoPhiTuVeTay(2.650.000.000) của lõi; đổi môi giới 1 → 1,5 → về tay giảm đúng 13.750.000; chữ «abc» → trạng thái 'chua-hieu', số cũ không đổi; không bao phí → về tay bằng giá, không dòng khoản; ma trận đếm 5 ca (assert số). Đối chứng đỏ: máy tính tự giữ tỉ lệ riêng thay vì đọc TI_LE_BAO_PHI_MAC_DINH → ca đổi tỉ lệ lõi bị gọi tên."
    paths: ["apps/web/src/app/(app)/units/call/**", packages/core/src/pricing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4b
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    target: "Như E1b, dau-chu-1, lead L5 đã có hồ sơ H5 (dung-d.mjs in)"
    steps:
      - "Mở /units/call?lead=<L5>; trong trang đếm sự kiện của H5 (GET /api/v1/listings/<H5>, đếm lịch sử) → ghi số n0; chọn một lựa chọn chưa có ở danh sách hỏi, chờ gửi, đếm lại → n1 (đối chứng dương)"
      - "Ở khối tính giá gõ «2,75 tỷ», chọn Bao phí → chụp evidence/E4-bao-phi.png; ghi về tay và ba dòng khoản"
      - "Sửa ô về tay thành «2,6 tỷ» → ghi ô giá bao phí; sửa môi giới 1 → 1,5 → ghi về tay"
      - "Gõ «abc» vào ô giá → chụp evidence/E4-chua-hieu.png; ghi chữ báo"
      - "Chờ 5 giây, đếm lại sự kiện của H5 → n2; GET /api/v1/listings và đếm hồ sơ của toà · căn L5"
    expected: "2,75 tỷ bao phí → về tay 2,65375 tỷ (hay viết gọn 2,65 tỷ kèm số đủ), dòng thuế thu nhập cá nhân 55 triệu · lệ phí trước bạ 13,75 triệu · môi giới 27,5 triệu; dòng «Tỉ lệ mặc định của sàn»; sửa về tay thì giá bao phí tính lại; môi giới 1,5% thì về tay giảm 13,75 triệu; «abc» báo chưa hiểu dưới ô; n1 = n0 + 1 (đối chứng dương), n2 = n1 (máy tính không ghi gì), vẫn đúng một hồ sơ của L5."
    paths: ["apps/web/src/app/(app)/units/call/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «so giá: ma trận chọn căn» (packages/core/src/pricing/so-gia.test.ts) có mặt và ok — ma trận viết trước 10 căn mẫu (assert số): cùng toà cùng 2PN Đang bán bao phí, cùng toà cùng 2PN Đang giao dịch không bao phí, cùng toà 1PN Đang bán, toà khác 2PN, cùng toà 2PN Đã bán, cùng toà 2PN Chưa đủ để rao, cùng toà 2PN Tạm ngừng, cùng toà 2PN chưa có giá, cùng toà 2PN thiếu điều kiện phí, chính căn đang gọi → đúng 2 căn được so; lead chỉ biết toà → thêm căn 1PN (3 căn) và co 'ca-toa'; ca «so giá: dải về tay» ok — dải thấp/giữa/cao là min/trung vị/max của về tay (không của giá), căn đang gọi lệch phần trăm so với giữa làm tròn một số lẻ; ca «so giá: không đề xuất» ok — kết quả chỉ có khoá dai, dong, viTri, caToa (assert tập khoá). Đối chứng đỏ: so trên giá thay vì về tay → căn bao phí đứng sai chỗ, ca dải gọi tên căn ấy."
    paths: [packages/core/src/pricing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    target: "Như E1b; dung-d.mjs dựng ở toà của L1 năm căn cùng số phòng ngủ (Đang bán/Đang giao dịch, bao phí và không) và một căn Đã bán, in giá về tay mong đợi; L8 ở toà không có căn nào khác"
    steps:
      - "Mở /units/call?lead=<L1> → chụp khối «Cùng loại trong toà» evidence/E5-toa.png; ghi từng dòng Mã · Giá · Phí · Trạng thái · Xác nhận, dải thấp – giữa – cao và dòng vị trí căn đang gọi"
      - "Đọc toàn văn khối so giá → ghi mọi câu có chữ «nên», «đề xuất», «ép»"
      - "Mở /units/call?lead=<L8> → chụp evidence/E5-trong.png; ghi chữ khối"
    expected: "Đúng năm căn dung-d.mjs in (không căn Đã bán, không căn L1), Phí ghi BP/N; dải là giá về tay khớp số dung-d.mjs in; vị trí nêu về tay của L1 và phần trăm lệch so với giữa; không câu nào gợi ý mức nên ép; L8: «Toà chưa có căn cùng loại có giá»."
    paths: ["apps/web/src/app/(app)/units/call/**", packages/core/src/pricing/**]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ca «danh sách hỏi: khớp mức đủ» (packages/core/src/listing/danh-sach-hoi.test.ts) có mặt và ok — khoá các mục của DANH_SACH_HOI bằng đúng COMPLETENESS_ITEMS theo thứ tự (so sâu); mỗi mục ngoài giá có ≥ 2 lựa chọn, nhãn khác nhau, mã RESO đúng tập của Hỏi-2 (occupantType Owner/Tenant/Vacant, furnished Furnished/Partially/Unfurnished); đối chứng đỏ cùng fixture: thêm mục 'parking' vào bản sao → ca khớp gọi tên 'parking'."
    paths: [packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «phím: ma trận» (apps/web/src/app/(app)/units/call/phim.test.ts) có mặt và ok — bảng viết trước đếm đúng 10 ca (assert số): Tab ở nhóm cuối về nhóm đầu, Shift+Tab ở nhóm đầu về nhóm cuối, '2' ở nhóm nội thất ra lệnh ghi {furnished: lựa chọn thứ hai}, '9' khi nhóm chỉ có 3 lựa chọn không ra lệnh, Delete ra lệnh ghi {<mục>: null}, '1' khi con trỏ ở ô chữ không ra lệnh, Ctrl+Enter ra 'xong', con trỏ ở ô giá + Alt+1 → chọn điều kiện phí 'included' và chữ ô giá giữ nguyên, Alt+1 khi con trỏ ở ô môi giới không ra lệnh, Esc ở ô giá → con trỏ về danh sách và phím số chọn lại được; ca «giá trị ngoài bộ» ok — furnished 'Nội thất cao cấp' → hàng lựa chọn có thêm dòng giá trị hiện có đánh dấu ngoài bộ, không lựa chọn nào đang chọn. Đối chứng đỏ: bỏ kiểm ô chữ → ca con trỏ ở ô chữ gọi tên."
    paths: ["apps/web/src/app/(app)/units/call/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6c
    criterion: AC-6
    executor: ui-check
    layer: backend-effect
    target: "Như E1b; lead L5 đã có hồ sơ căn (dung-d.mjs in mã hồ sơ H5)"
    steps:
      - "Mở /units/call?lead=<L5>; trong trang gọi GET /api/v1/listings/<H5> (hồ sơ kèm lịch sử sự kiện) → ghi số sự kiện details_changed"
      - "Bấm Tab tới nhóm Nội thất, gõ 2 → chụp evidence/E6-noi-that.png; chờ chỉ báo đồng bộ «đã gửi»; ghi lại số sự kiện và giá trị furnished trên máy chủ"
      - "Gõ Delete ở nhóm ấy → chờ gửi → ghi furnished trên máy chủ"
      - "Bấm vào ô giá rồi gõ 1 → ghi ô giá có chữ '1' không và số sự kiện có đổi không"
      - "Ghi thứ tự năm nhóm và chữ từng lựa chọn"
    expected: "Năm nhóm theo thứ tự Giá và phí · Nội thất · Pháp lý · Tài chính · Tình trạng sử dụng (thứ tự của lõi); gõ 2 ở Nội thất → đúng một details_changed mới, furnished = lựa chọn thứ hai; Delete → một details_changed mới, furnished null; phím trong ô giá chỉ gõ chữ, không thêm sự kiện."
    paths: ["apps/web/src/app/(app)/units/call/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; ca «giá trong danh sách hỏi» (apps/web/src/app/(app)/units/call/gia.test.ts) có mặt và ok — ma trận viết trước 5 ca (assert số): hồ sơ chưa giá + lead 2,75 tỷ bao phí → ô gợi '2,75 tỷ' và điều kiện 'included'; gõ '2,8 tỷ' trên giá cũ 2,75 bao phí → lệnh ghi price_changed {listPrice: 2800000000, feeInclusion: 'included'} không hỏi lại; gõ '3,5 tỷ' (> 20%) → 'hoi-lai' kèm cũ → mới và phần trăm; đổi điều kiện phí → 'hoi-lai'; 'abc' → 'chua-hieu', không lệnh. Đối chứng đỏ: bỏ qua canHoiLai → ca 3,5 tỷ gọi tên."
    paths: ["apps/web/src/app/(app)/units/call/**", packages/core/src/pricing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7b
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    target: "Như E1b, lead L13 chưa có hồ sơ (dung-d.mjs in, riêng cho bài này)"
