schema_version: 1
feature_slug: bai-thu-zalo
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-1 thẻ Open Graph» xanh trên trang gọi không JS (host thường và host sau đường hầm); ca phá thử bỏ og:image trong bản sao HTML phải đỏ với thông điệp «thiếu og:image»"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-2 ảnh xem trước» xanh: chữ ký PNG, IHDR 1200×630, content-type image/png, cỡ dưới 300 KB; ca phá thử đổi cỡ trong IHDR phải đỏ với thông điệp «cỡ ảnh khác 1200×630»"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-3 tải mà không báo thì không mở» xanh qua máy chủ thật: tải trang + tải ảnh với UA trình duyệt, không báo → mở = 0; một lượt báo → 1; hai lượt báo cùng phiên → 1; hai phiên → 2"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-4 lượt báo của máy bị loại» xanh: ma trận viết trước mọi mẫu của lớp máy (bot, crawler, spider, preview, facebookexternalhit, curl, wget, python-, node-fetch, headless, đầu prefetch) → bị loại kèm lý do, và đối chứng UA Safari iPhone, Chrome Android, trình duyệt trong Zalo → tính; mỗi lượt tải trang có ua và lop trong nhật ký"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-7
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-7 một lệnh» xanh: chạy chay.mjs --khong-ham ở cổng trống → in link /s/A, /s/I, /s/K, /chia-se, /keo-anh; nhật ký dưới .acceptance-runs/ và tom-tat.json không chứa IP thô — gồm 127.0.0.1, ::1 và 203.0.113.7 gửi qua x-forwarded-for, cf-connecting-ip (ca phá thử ghi đầu x-forwarded-for vào bản sao nhật ký phải đỏ với thông điệp «có IP thô»); SIGINT → tom-tat.json có bảng đếm; ca chọn đường hầm: có cloudflared → cloudflared, không có → ssh localhost.run, không có cả hai → lời báo «không mở được đường hầm»"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-8
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-8 chỉ dữ liệu mẫu» xanh: HTML của /s/<mã>, /chia-se, /keo-anh có nhãn «Mẫu», không khớp mẫu số điện thoại Việt Nam, không chữ «giá đáy», «chủ nhà», «sổ»; ca phá thử chèn 0912 345 678 vào bản sao phải đỏ với thông điệp «có số điện thoại»"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-5
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-5 nhánh chia sẻ» xanh: hàm chọn cách chia sẻ trả «tep» khi canShare({files}) đúng, «link» khi chỉ có share, «khong-ho-tro» khi không có share; POST /ghi với kết cục chia-se ghi đúng một dòng nhật ký"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    steps:
      - "Chạy máy chủ thử trên máy: node _acceptance/bai-thu-zalo/thu/chay.mjs --khong-ham --cong 3473 (ghi PID, dừng bằng kill <PID> khi xong)"
      - "Mở http://localhost:3473/keo-anh → chụp evidence/E8-step1.png (ô thả trống, nhãn «Mẫu»)"
      - "Trong trang, dựng DataTransfer chứa một File PNG nhỏ rồi phát sự kiện drop lên ô thả → chụp evidence/E8-step2.png: ảnh hiện, dòng ghi kiểu image/png và cỡ"
      - "Phát sự kiện drop chỉ mang text/plain → chụp evidence/E8-step3.png: dòng «không có tệp ảnh» kèm kiểu text/plain"
      - "Mở http://localhost:3473/chia-se trong khổ điện thoại → chụp evidence/E8-step4.png: nút «Gửi ảnh + tin» và dòng cho biết cách chia sẻ trình duyệt này dùng"
      - "Trên /chia-se, thay navigator.canShare bằng bản giả trả true và navigator.share bằng bản giả ghi đối số; bấm «Gửi ảnh + tin» bốn lần, bản giả lần lượt: trả xong, ném AbortError, ném TypeError; lần bốn xoá navigator.share → chụp evidence/E8-step5.png sau lần cuối; đối số lần một có files gồm 1 tệp image/png và có text"
      - "Gọi GET http://localhost:3473/dem?nhat-ky=1 → hai sự kiện nhan-anh (một có tệp, một «không có tệp ảnh») và bốn sự kiện chia-se với ket_cuc da-gui, huy, loi, khong-ho-tro"
    expected: "ảnh thả vào hiện trên trang; thả chữ thì báo «không có tệp ảnh»; trang chia sẻ hiện nút và cách chia sẻ; nút «Gửi ảnh + tin» gọi share với 1 tệp image/png kèm tin; nhật ký có đúng hai sự kiện nhan-anh và bốn sự kiện chia-se mang bốn kết cục"
    paths: ["_acceptance/bai-thu-zalo/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.bai_thu_zalo
    expected: "exit 0; ca «AC-9 luật kết luận» xanh: nhật ký dựng bằng máy chủ thật (gọi HTTP đủ ma trận: K chỉ tải trang + ảnh; K tải mà có báo mở; A, I có báo mở; báo mở của UA máy; quan-sat từng câu; chia-se bốn kết cục; nhan-anh có và không tệp) → bảng đếm của tom-tat.mjs bằng /dem của máy chủ, và kết luận từng vế đúng bảng viết trước (vế 2 đỏ khi K mở = 1 hoặc K không có lượt tải nào); ca «AC-9 kết quả khớp nhật ký» xanh: phần giữa hai mốc <!-- dem --> của ket-qua.md bằng đúng đầu ra tom-tat.mjs trên nhat-ky-zalo.jsonl, tệp này không có khoá ip_bam và không khớp mẫu IPv4/IPv6; ca phá thử sửa một số trong bản sao ket-qua.md phải đỏ với thông điệp «bảng đếm lệch nhật ký», ca chèn 203.0.113.7 vào bản sao nhật ký phải đỏ với «có IP thô»"
    paths: ["_acceptance/bai-thu-zalo/thu/**", "_acceptance/bai-thu-zalo/ket-qua.md", "_acceptance/bai-thu-zalo/nhat-ky-zalo.jsonl"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: judgment
    question: "ADR của bài thử có ở trạng thái «đề xuất» (không tự chốt), và với đủ bốn việc — cách đếm lượt mở, thẻ và cỡ ảnh xem trước, cách chia sẻ trên iPhone, cách nhận ảnh từ Zalo máy tính — có nêu khuyến nghị, lối khác và giá, mỗi điều trỏ đúng số có trong ket-qua.md không? Vế nào ket-qua.md kết luận không đạt thì ADR có nêu các đường đi vòng để chủ kho chọn không? ADR có giữ bất biến «người luôn là người bấm gửi» của AGENTS.md không?"
    inputs: [_acceptance/bai-thu-zalo/ket-qua.md, docs/adr/0003-bai-thu-zalo.md, _acceptance/bai-thu-zalo/opportunity.md, AGENTS.md]
    evidence_required: [judged_by, verdict, rationale]
