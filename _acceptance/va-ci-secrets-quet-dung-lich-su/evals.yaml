# Bộ đo của hàng va-ci-secrets-quet-dung-lich-su. Chỉ đọc cây kho; kho tạm và báo cáo ở thư mục tạm của hệ điều hành.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.va_ci_secrets_ma_tran
    paths: [".github/workflows/ci.yml", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT M2 …» và «ĐẠT M10 …»: lệnh của ci.yml thoát 1, tập commit phát hiện đúng bằng commit mang khoá. Chiều đỏ: lệnh ci.yml bỏ phạm vi hoặc quét sai ref thì dòng in «HỎNG M2 …: lệnh ci.yml thoát <m> (mong 1), phát hiện […]» và KẾT: HỎNG."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.va_ci_secrets_ma_tran
    paths: [".github/workflows/ci.yml", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT M3 …», «ĐẠT M6 …», «ĐẠT M7 …»: thoát 1, phát hiện đúng commit mang khoá; «ĐẠT M11 …»: cùng kho M3 với HEAD sai về đỉnh nhánh PR thoát 0. Chiều đỏ: quét theo khoảng commit (không phủ lịch sử main) thì «HỎNG M3 …» hoặc «HỎNG M6 …»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.va_ci_secrets_ma_tran
    paths: [".github/workflows/ci.yml", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT M4 …», «ĐẠT M5 …», «ĐẠT M8 …»: lệnh của ci.yml thoát 0, 0 phát hiện; lệnh trước bản vá thoát 1 trên cùng kho. Chiều đỏ: trên cây trước hàng, lệnh của ci.yml chính là lệnh cũ nên «HỎNG M4 …: lệnh ci.yml thoát 1 (mong 0)»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.va_ci_secrets_ma_tran
    paths: [".github/workflows/ci.yml", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT M1 …» và «ĐẠT đối số git log: lệnh ci.yml «log -p -U0 --full-history --diff-filter=tuxdb HEAD», lệnh cũ «log -p -U0 --full-history --all --diff-filter=tuxdb», chỉ khác --all và HEAD». Chiều đỏ: «HỎNG đối số git log …» kèm hai danh sách đo được."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.va_ci_secrets_ma_tran
    paths: [".github/workflows/ci.yml", ".gitleaksignore", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT M9 …» (thoát 0) cạnh «ĐẠT M10 …» (cùng giá trị, thoát 1), và «ĐẠT .gitleaksignore còn đủ 9/9 dấu vân tay của fb62d52e», «ĐẠT không commit nào của hàng chạm .gitleaksignore (<n> commit)». Chiều đỏ: «HỎNG .gitleaksignore thiếu <dòng>», «HỎNG commit <sha> chạm .gitleaksignore»."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.va_ci_secrets_that
    paths: [".github/workflows/ci.yml", ".gitleaksignore", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT mốc fc0dab7b + ref 66b6521d: lệnh cũ thoát 1, phát hiện theo commit {66b6521d: 6}; lệnh ci.yml thoát 0», «ĐẠT mốc 001ae667 + ref f848f717: lệnh cũ thoát 1, phát hiện theo commit {f848f717: 3}; lệnh ci.yml thoát 0», «ĐẠT HEAD cây đang chấm: lệnh ci.yml thoát 0». Mỗi mốc là kho tạm chỉ có đúng ref đã khai, mượn đối tượng của kho. Chiều đỏ: trên cây trước hàng in «HỎNG mốc fc0dab7b …: lệnh ci.yml thoát 1». Cần lịch sử đầy đủ của kho; chạy khoảng hai phút."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.va_ci_secrets_tinh
    paths: [".github/workflows/ci.yml", ".githooks/pre-commit", "_acceptance/va-ci-secrets-quet-dung-lich-su/thu/**"]
    expected: "exit 0; «ĐẠT ci.yml thật: đủ 7/7 vế của rào» (V1–V7 của AC-7), mười một dòng «ĐẠT phá thử «<ca>» → hỏng đúng «<vế>»» so TẬP vế hỏng với tập viết trước, «ĐẠT commit của hàng chỉ đổi job secrets (<n> commit)», «ĐẠT đối chứng: đổi job gate → hỏng «ngoài job secrets»», «ĐẠT đối chứng: đổi khối chú thích liền trên job secrets → vẫn trong job secrets», «ĐẠT hook pre-commit gọi gitleaks trên phần đã stage», «ĐẠT không có tệp cấu hình gitleaks ở gốc kho». Chiều đỏ: «HỎNG ci.yml thật: hỏng <vế>», «HỎNG phá thử … (hỏng: …)», trên cây trước hàng hỏng V4."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
