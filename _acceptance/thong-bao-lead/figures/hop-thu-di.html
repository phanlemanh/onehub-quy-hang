<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi qua hộp thư đi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1240px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sơ đồ luồng trái → phải · AC-3, AC-5</p>
    <h1>Gửi qua hộp thư đi</h1>
    <p class="subtitle">Mỗi lối giao lead ghi một dòng «cần báo» trong cùng giao dịch giao lead; giao dịch ghi xong mới gửi. Lỗi gửi không làm hỏng việc giao.</p>

    <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="htd-title htd-desc">
      <title id="htd-title">Gửi qua hộp thư đi</title>
      <desc id="htd-desc">Lead về đầu chủ (nhịp chia / trưởng nhóm giao / nhập lead). Cùng giao dịch: ghi lead và ghi dòng hộp thư đi. Nếu giao dịch ghi xong thì gửi tới mọi thiết bị của người nhận; nếu giao dịch quay lui thì không có dòng, không gửi. Kết quả gửi rẽ ba: thành công thì ghi mốc gửi; 404·410 thì gỡ đăng ký; lỗi tạm thì nhịp chia phút sau gửi lại, tối đa 3 lần, trong 15 phút.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1200" height="480" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <!-- Luồng chính -->
      <line x1="224" y1="200" x2="262" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="488" y1="200" x2="526" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="656" y1="200" x2="694" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Quay lui -->
      <line x1="592" y1="248" x2="592" y2="318" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Rẽ ba từ «Gửi tới mọi thiết bị» — ba điểm bám tách nhau 16px -->
      <path d="M896,184 H912 Q920,184 920,176 V96 Q920,88 928,88 H958" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="896" y1="200" x2="958" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M896,216 H932 Q940,216 940,224 V312 Q940,320 948,320 H958" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Gửi lại ở nhịp chia phút sau -->
      <path d="M960,344 H804 Q796,344 796,336 V234" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- ===== Nhãn mũi tên (mặt nạ cách nét 6–10px) ===== -->
      <rect x="656" y="172" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="674" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">XONG</text>

      <rect x="604" y="276" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="636" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUAY LUI</text>

      <rect x="724" y="276" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="756" y="288" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GỬI LẠI</text>

      <!-- ===== Nút ===== -->
      <!-- Bắt đầu: lead về đầu chủ (oval) -->
      <rect x="32" y="152" width="192" height="96" rx="20" fill="#f5f5f5"/>
      <rect x="32" y="152" width="192" height="96" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="128" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead về đầu chủ</text>
      <text x="128" y="208" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(nhịp chia / trưởng nhóm giao</text>
      <text x="128" y="224" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">/ nhập lead)</text>

      <!-- Trọng tâm: cùng giao dịch -->
      <rect x="264" y="156" width="224" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="156" width="224" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="272" y="164" width="40" height="16" rx="2" fill="transparent" stroke="rgba(186,69,19,0.50)" stroke-width="0.8"/>
      <text x="292" y="176" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-3</text>
      <text x="376" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cùng giao dịch:</text>
      <text x="376" y="222" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">ghi lead + ghi dòng hộp thư đi</text>

      <!-- Quyết định: giao dịch ghi xong -->
      <polygon points="528,200 592,152 656,200 592,248" fill="#f5f5f5"/>
      <polygon points="528,200 592,152 656,200 592,248" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="592" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giao dịch</text>
      <text x="592" y="212" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ghi xong</text>

      <!-- Nhánh phụ: quay lui -->
      <rect x="480" y="320" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="320" width="224" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="592" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giao dịch quay lui</text>
      <text x="592" y="366" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">→ không có dòng, không gửi</text>

      <!-- Gửi tới mọi thiết bị -->
      <rect x="696" y="168" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="696" y="168" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="796" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gửi tới mọi thiết bị</text>
      <text x="796" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">của người nhận</text>

      <!-- Kết quả: thành công -->
      <rect x="960" y="56" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="56" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1064" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Thành công: ghi mốc gửi</text>
      <text x="1064" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sent_at</text>

      <!-- Kết quả: 404·410 -->
      <rect x="960" y="168" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="168" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1064" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">404·410: gỡ đăng ký</text>
      <text x="1064" y="214" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đăng ký chết</text>

      <!-- Trọng tâm: lỗi tạm -->
      <rect x="960" y="280" width="208" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="280" width="208" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="968" y="288" width="40" height="16" rx="2" fill="transparent" stroke="rgba(186,69,19,0.50)" stroke-width="0.8"/>
      <text x="988" y="300" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AC-5</text>
      <text x="1064" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lỗi tạm:</text>
      <text x="1064" y="332" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nhịp chia phút sau gửi lại</text>
      <text x="1064" y="348" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(tối đa 3 lần, trong 15 phút)</text>

      <!-- ===== Chú giải ===== -->
      <line x1="32" y1="416" x2="1168" y2="416" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="32" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <line x1="124" y1="444" x2="164" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="176" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">luồng chính</text>

      <line x1="284" y1="444" x2="324" y2="444" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="336" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">nhánh phụ: quay lui</text>

      <line x1="484" y1="444" x2="524" y2="444" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="536" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">gửi lại</text>

      <rect x="628" y="436" width="16" height="16" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="652" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">bắt đầu</text>

      <polygon points="724,444 732,436 740,444 732,452" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="748" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">rẽ</text>

      <rect x="788" y="436" width="16" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="812" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">trọng tâm của AC</text>
    </svg>
  </main>
</body>
</html>
