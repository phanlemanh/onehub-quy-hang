    expected: "exit 0; trong packages/core/src/import/ai/o-la/do-o-la.test.ts ba ca có mặt và ok. Ca «bộ ô lạ có đủ bốn nhóm» — bộ của _acceptance/nhap-o-la/thu/bo-o-la.ts có ≥ 8 ô mỗi nhóm giá dải, về tay (giá và phí), trạng thái lạ, và ≥ 4 ô đối chứng (4 assert); mỗi ô của bộ qua applyPlan ra 'needs_person' by 'normalize' (assert). Ca «đề xuất ghi sẵn khớp gói và lời nhắc» — với mỗi mô hình (opus-5-5, haiku-5-5): tệp _acceptance/nhap-o-la/de-xuat-o-la/<mô hình>.json có băm gói bằng băm gói dựng bởi dungGoiOLa (assert), băm lời nhắc bằng bamLoiNhacOLa() (assert), mang dấu «lập bởi tác tử context sạch (<mô hình>)» (assert); đối chứng đỏ: đổi một chữ của lời nhắc → báo «lời nhắc đổi — ghi lại đề xuất» (assert). Ca «số đo ô lạ» — tính lại bằng thu/do-o-la.ts (kiemDeXuatOLa rồi chấm theo đáp án) và so bằng _acceptance/nhap-o-la/so-do-o-la.json đã commit (deepEqual); MO_HINH_O_LA === 'claude-opus-5-5' (assert, theo Hỏi-1); bộ của MO_HINH_O_LA đạt phủ ≥ 0,90, đúng ≥ 0,95, bịa = 0, tự ghi = 0, rò nguồn = 0 (5 assert); so-do-o-la.json có đủ năm số cho cả hai mô hình (assert); ca dưới ngưỡng: datNguongOLa với số phủ 0,89 hay đúng 0,94 hay bịa 1 → trả lỗi nêu đúng số và ngưỡng bị hụt (3 assert), đối chứng số 0,90/0,95/0 → không lỗi (assert). Chiều đỏ: cho bộ chấm coi đề xuất ở ô đối chứng là đúng → assert bịa = 0 đỏ nêu tên ô."
