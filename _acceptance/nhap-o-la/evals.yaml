schema_version: 1
feature_slug: nhap-o-la
# Lõi gói / quét / kiểm / số đo ô lạ ở `packages/core/src/import/ai/o-la/**` (node:test của core — bài số đo đọc bộ ô lạ và
# đề xuất ghi sẵn trong hồ sơ, theo nếp `do-tac-tu.test.ts` của hàng 68). Bộ kiểm rò nguồn ra AI ở
# `packages/api/src/imports/ai/cells/*.ro-ri.test.ts` (job CI `ro-ri`, bắt buộc). Đường ô lạ, cửa, trần, `ai_usage` chấm trên
# Postgres dãy G qua `packages/api/test-db/imports/o-la.test.ts` (executor script.nhap_tac_tu — migrate + cách ly + test-db
# API). Ca xem thử từ trạng thái màn qua API thật ở `apps/web/src/lib/nhap/test-db/o-la.db-test.mts` (test.web_db, DATABASE_URL
# dãy G 5573). Trạng thái màn ở `apps/web/src/lib/nhap/o-la.test.ts` (test.web). Khách AI trong mọi ca là khách giả tiêm qua `deps`
# hay `QH_AI_GIA` — không ca nào gọi mạng. exit 0 của lệnh chung KHÔNG đủ: người chấm đối chiếu từng tên ca nêu trong
# `expected` — có mặt, «ok», không «# SKIP»/«# TODO». Dữ liệu mẫu: `[Tên]`, `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/import/ai/o-la/goi.test.ts ca «gói ô lạ: chỉ ô được mở» có mặt và ok — ma trận khai bằng Record<ColumnClass, …> (thêm lớp mới vào ColumnClass thì kiểm kiểu đỏ) sáu lớp × bốn dấu (keep, fixed, needs_person, blocked) trên cùng một bảng: chỉ hai ô (catalog, shareable_listing) × needs_person vào gói, 22 ô còn lại không (24 assert); ô needs_person do luật cấp dòng (by fee_from_price, catalog, duplicate) không vào gói (3 assert); cột lớp catalog ghép vào keep_as_note hay custom: không vào gói (assert); mười dòng cùng chữ «đang đàm phán» ở một cột → một ô (assert), cùng chữ ở hai cột → hai ô (assert); 320 ô khác nhau → đúng 300 ô, theo thứ tự cột rồi dòng (2 assert); ô «0900 000 011» ở cột giá và ô dáng họ tên ở cột trạng thái không vào gói (2 assert); mỗi ô mang đúng sáu khoá id, cot, tieuDe, truong, giaTri, lyDoMa và lyDoMa bằng reason của ô với đoạn chép chữ ô thay bằng «ô» (2 assert); ô có họ tên giữa câu («chủ Nguyễn Văn An giữ», «chủ [Tên] giữ») không vào gói, đối chứng «giữ chỗ» vào (assert); gói 300 ô dài nhất của bộ thử (mỗi giaTri 200 ký tự) có JSON ≤ 96 KB (assert). Chiều đỏ: bỏ lọc lớp → ô của cột source vào gói, ca đỏ nêu «cột lớp source»."
    paths: [packages/core/src/import/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

