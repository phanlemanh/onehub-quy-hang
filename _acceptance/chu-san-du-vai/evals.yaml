# Bộ đo của hàng chu-san-du-vai. Lệnh có Postgres dùng Postgres của dãy Q (cổng 5577, mật khẩu thử của AGENTS.md).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: node --import tsx --test packages/core/src/access/goi-vai.test.ts
    paths: ["packages/core/src/access/goi-vai.*"]
    expected: "exit 0; ma trận viết trước đủ năm vai × bật, tắt × đã có, chưa có vai kéo theo đều đạt; đối chứng đỏ: bản sao bảng có mã vai lạ hay thiếu một vai kéo theo của Quản trị sàn thì ca «bảng hợp lệ» hỏng với thông điệp nêu mã."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: node _acceptance/chu-san-du-vai/thu/chay-db.mjs mo-san
    paths: ["packages/db/scripts/mo-san.mjs", "packages/db/tests/mo-san.test.mjs", "packages/core/src/access/goi-vai.json", "_acceptance/chu-san-du-vai/thu/**"]
    expected: "exit 0; bộ kiểm packages/db/tests/mo-san.test.mjs đạt: sàn mới đúng năm vai lấy từ goi-vai.json, chạy lại không đổi, người của sàn đang chạy giữ nguyên; đối chứng đỏ: ca chạy với bản bảng thiếu một vai thì so vai hỏng với thông điệp nêu vai thiếu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    steps:
      - "node _acceptance/chu-san-du-vai/thu/chay-ui.mjs --e3 --ra _acceptance/chu-san-du-vai/evidence — chỗ thử dựng Postgres dãy Q nạp sàn mẫu và máy dev 3497; mỗi ca in một dòng JSON và chụp ảnh."
      - "Đối chiếu từng dòng JSON với expected rồi tắt máy dev: node _acceptance/chu-san-du-vai/thu/dung-q.mjs --tat. Xem ảnh E3-chua-tich-1440, E3-tich-san-1440, E3-go-bot-1440, E3-danh-sach-1440, E3-tich-san-375."
    target: "http://localhost:3497/settings/users"
    paths: ["apps/web/src/app/(app)/settings/users/**", "apps/web/src/components/khoi/solution-users-8/member-dialog.tsx", "packages/core/src/access/goi-vai.*"]
    expected: "Dòng ST-hopvai-chua-tich: năm ô false, moTa đúng chữ «Tích Quản trị sàn hay Trưởng nhóm là tích sẵn các vai đi kèm; bỏ tích vai nào không cần.». ST-hopvai-tich-san: năm ô true. ST-hopvai-go-bot: Telesales false, bốn ô kia true. moi-luu: db đúng [buyer_agent, company_admin, listing_agent, team_lead], dòng người có bốn nhãn vai ấy. sua-them: moHop chỉ Telesales true; db đúng [buyer_agent, listing_agent, team_lead, telesales]. sua-go-bot: db đúng [company_admin]. kho-375: năm ô true, trongKhung true. Ảnh: hộp không vỡ ở cả hai khổ."
    evidence_required: [screenshot, observed, verified_at]

  - id: E3b
    criterion: AC-3
    executor: test
    cmd: node --import tsx --test "apps/web/src/app/(app)/settings/users/vai-trong-hop.test.ts"
    paths: ["apps/web/src/app/(app)/settings/users/**", "packages/core/src/access/goi-vai.*"]
    expected: "exit 0; trạng thái ô vai sau chuỗi thao tác của hộp (tích Quản trị → bỏ Telesales → lưu) cho đúng mảng vai gửi lên API; mở hộp Sửa mà không tích gì thì mảng không đổi."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3c
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: node _acceptance/chu-san-du-vai/thu/chay-db.mjs api
    paths: ["apps/web/src/app/(app)/settings/users/**", "packages/api/src/thanh-vien.ts", "packages/api/test-db/chu-san-du-vai/**", "packages/core/src/access/goi-vai.*", "_acceptance/chu-san-du-vai/thu/**"]
    expected: "exit 0; ca «chuỗi thao tác của hộp tới cơ sở dữ liệu» của packages/api/test-db/chu-san-du-vai đạt: mảng vai dựng bằng chính hàm của hộp (tích Quản trị → bỏ Telesales; người chỉ Telesales tích Trưởng nhóm; người đủ năm vai bỏ bốn vai) gửi qua API thật, đọc lại trên Postgres đúng từng mảng; đối chứng đỏ: bản giả hàm hộp không gọi kéo theo thì ca hỏng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: node _acceptance/chu-san-du-vai/thu/chay-db.mjs api
    paths: ["packages/api/src/thanh-vien.ts", "packages/api/test-db/chu-san-du-vai/**", "_acceptance/chu-san-du-vai/thu/**"]
    expected: "exit 0; ca «lưu đúng mảng đã gửi» của packages/api/test-db/chu-san-du-vai đạt cho POST [company_admin], POST đủ năm vai, và PATCH từ năm vai xuống [company_admin] đọc lại đúng một vai; đối chứng đỏ có thông điệp ghim: bản giả tự thêm vai và bản giả gộp mảng cũ đều làm ca hỏng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: node --import tsx --test packages/core/src/access/nguoi-du-vai.test.ts
    paths: ["packages/core/src/navigation.ts", "packages/core/src/access/nguoi-du-vai.test.ts"]
    expected: "exit 0; người đủ năm vai có đúng sáu nhà và ba nút tạo; người chỉ company_admin chỉ có Cài đặt và không nút tạo."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    steps:
      - "node _acceptance/chu-san-du-vai/thu/chay-ui.mjs --e5b --ra _acceptance/chu-san-du-vai/evidence — chỗ thử chạy công cụ mở sàn thật cho một sàn «[Thử] đủ vai», đăng nhập người đầu tiên và người chỉ mang Quản trị sàn."
      - "Đối chiếu từng dòng JSON với expected rồi tắt máy dev: node _acceptance/chu-san-du-vai/thu/dung-q.mjs --tat. Xem ảnh E5b-dau-tien-1440, E5b-menu-tao-1440, E5b-bang-hang-1440, E5b-chi-cau-hinh-1440."
    target: "http://localhost:3497/today"
    paths: ["packages/core/src/navigation.ts", "packages/db/scripts/mo-san.mjs", "packages/core/src/access/goi-vai.*"]
    expected: "dau-tien-nha: nha đúng [today, inventory, shares, contacts, team, settings], url /today. dau-tien-nut: chinh chứa «Lead»; menu chứa «Nhập Excel» và «Xuất bảng hàng» (đo từ nhóm «Tạo» và các mục menu, không đo chữ cả trang). dau-tien-bang-hang: url /inventory, tieuDe chứa «Bảng hàng», khongThay false. doi-chung-khong-thay: khongThay true (đối chứng dương). chi-cau-hinh-nha: nha đúng [settings], coNhomTao false. Ảnh khớp các dòng, đã hết khung chờ."
    evidence_required: [screenshot, observed, verified_at]

  - id: E5c
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: node _acceptance/chu-san-du-vai/thu/chay-db.mjs api
    paths: ["packages/db/scripts/mo-san.mjs", "packages/api/src/me/**", "packages/core/src/navigation.ts", "packages/api/test-db/chu-san-du-vai/**", "_acceptance/chu-san-du-vai/thu/**"]
    expected: "exit 0; ca «mở sàn rồi đọc lại quyền» của packages/api/test-db/chu-san-du-vai đạt: chạy công cụ mở sàn thật trên Postgres, API /me của người đầu tiên trả đủ năm vai và bảng nhà, nút dựng từ đó có đúng sáu nhà, ba nút tạo; đối chứng: người chỉ company_admin có một nhà Cài đặt, không nút tạo."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: node _acceptance/chu-san-du-vai/thu/chay-db.mjs api
    paths: ["packages/api/test-db/chu-san-du-vai/**", "packages/core/src/access/can-see-source.ts", "_acceptance/chu-san-du-vai/thu/**"]
    expected: "exit 0; ca «đủ vai thấy chủ nhà, mỗi lần mở số một vết» và ca «chỉ cấu hình bị từ chối, không vết» của packages/api/test-db/chu-san-du-vai đạt; đếm dòng vết trước và sau mỗi lần mở số; người chỉ cấu hình nhận đúng 404 mã not-found của đường đọc nguồn (đọc lại mã thật khi viết ca, ghim vào assert) và cùng phiên đọc được GET /company/members 200 làm đối chứng dương; đối chứng đỏ: bản giả cho vai ấy xem nguồn thì ca hỏng."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: node _acceptance/chu-san-du-vai/thu/kiem-tai-lieu.mjs
    paths: ["docs/product/tham-chieu.md", "docs/adr/0010-lop-truong-nguon.md", "docs/adr/0011-nhap-du-lieu-tac-tu.md", "packages/db/migrations/**", "_acceptance/chu-san-du-vai/thu/**"]
    expected: "exit 0; «ĐẠT không có migration mới so nhánh chính», «ĐẠT Tham chiếu không còn ‹chưa dựng› cho Quản trị sàn», «ĐẠT Tham chiếu §12 có dòng dựng hàng chu-san-du-vai», «ĐẠT ADR-0010 có mục sửa đổi cách B», «ĐẠT ADR-0011 có mục sửa đổi cách B»; đối chứng đỏ trên bản sao tài liệu còn chữ cũ và trên diff giả có tệp migration."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/cai-dat-san.md", "apps/web/src/app/(app)/settings/**/page.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm cai-dat-san"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-8
    executor: script
    cmd: config:executors.design.floor
    paths: ["apps/web/src/app/(app)/settings/users/**", "apps/web/src/components/khoi/solution-users-8/**"]
    expected: "exit 0; không có mã màu thô trên tệp giao diện vòng chạm"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
