schema_version: 1
feature_slug: mau-api-ten-truong-tieng-anh
# Khuôn mẫu (ghi chặt tên mới, đọc khoan dung hai dạng) chấm thuần ở packages/core. Đường API, dòng company_settings, quyền
# và cách ly chấm trên Postgres dãy qua API thật (packages/api/test-db/mau-api-ten-truong-tieng-anh/). Hộp Xuất, màn Gửi và
# màn Mẫu chấm thuần ở apps/web. Màn không đổi gì nhìn thấy: không ui-check (sổ S1). Dữ liệu mẫu: `[Tên]`, `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/mau-api-ten-truong-tieng-anh/ ca «đọc mẫu bảng ra tên mới» có mặt và ok — Quản trị PUT hai mẫu bằng name, columns → GET /api/v1/company/templates/export: mỗi phần tử có Object.keys sắp xếp bằng đúng [columns, id, name] (so mảng), không khoá ten, cot. Chiều đỏ: kho trả thêm khoá ten → ca đỏ nêu «khoá tiếng Việt trong đáp»."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/mau-api-ten-truong-tieng-anh/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-1
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; bài của packages/api đọc tài liệu OpenAPI của app: schema ExportTemplates có templates.items.properties với khoá sắp xếp đúng [columns, id, name], PostTemplates có properties của zalo và facebook đúng [closing, opening] (so mảng). Chiều đỏ: schema còn khoá ten → ca đỏ nêu tên khoá."
    paths: [packages/api/src/mau-san/**, packages/api/src/app.test.ts, packages/api/src/mau-san/*.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «đọc mẫu bài ra tên mới» — Quản trị PUT zalo và facebook bằng opening, closing → GET /posts: mỗi kênh có Object.keys sắp xếp bằng đúng [closing, opening], không khoá dau, cuoi; lời trả về bằng chữ đã gửi. Chiều đỏ: kho trả dau → ca đỏ nêu khoá."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/mau-api-ten-truong-tieng-anh/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «lưu bằng tên mới» — sau hai PUT 200, đọc thẳng company_settings (vai chủ bảng) khoá export.templates và share.post_templates: mọi khoá ở mọi mức của value thuộc tập {id, name, columns} hay {zalo, facebook, opening, closing} (so tập bằng duyệt đệ quy), giá trị bằng đúng thân đã gửi. Chiều đỏ: kho lưu thêm khoá ten → ca đỏ nêu «dòng lưu còn tên cũ»."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/mau-api-ten-truong-tieng-anh/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/export/ bảng ca viết trước cho kiemMauBang, kiemMauBai: mỗi tên cũ ten, cot, dau, cuoi một khoá lạ («mau») và một mẫu lẫn {id, name, ten, columns} đặt trong mẫu thứ hai → ok false, lyDo chứa khoá sai và (với tên cũ) đúng tên mới tương ứng (name, columns, opening, closing); đếm 6 ca bằng số dòng bảng; đối chứng dương: cùng thân chỉ tên mới → ok true. Chiều đỏ: kiểm bỏ qua khoá lạ → ca đỏ nêu khoá lọt."
    paths: [packages/core/src/export/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4b
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «ghi bằng tên cũ bị từ chối» — Quản trị PUT export một mẫu name đúng và một mẫu {id, ten, cot} → 400, typeof reason string, reason chứa «ten» và «name»; PUT posts {zalo: {dau, cuoi}} → 400 nêu «opening»; GET sau đó bằng đúng GET trước (so sâu). Chiều đỏ: kho ghi mẫu đúng rồi mới từ chối → ca đỏ nêu «lần lưu bị từ chối vẫn ghi một phần»."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/mau-api-ten-truong-tieng-anh/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; bảng ca viết trước cho docMauBang, docMauBai: dạng cũ {id, ten, cot} và {dau, cuoi} → đầu ra tên mới cùng tên, cùng mảng cột theo thứ tự, cùng lời, loi rỗng; dòng có cả ten lẫn name khác nhau → lấy name; dòng sai khuôn dạng cũ (ten trống) vẫn bị bỏ kèm lỗi nêu khoá name. Chiều đỏ: đọc chỉ tên mới → ca dạng cũ đỏ nêu «mẫu dạng cũ bị bỏ»."
    paths: [packages/core/src/export/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «mẫu dạng cũ đã lưu vẫn đọc được» — fixture dạng cũ là bản ghi nguyên văn mà đường ghi cũ thật (kiemMauBang, kiemMauBai ở main 9f7df527, trước vòng này) trả cho một thân PUT đã biết, chụp vào tệp fixture có ghi commit nguồn — không viết tay theo khuôn bên đọc; ghi thẳng bản ấy vào company_settings (vai chủ bảng) → GET hai đường so sâu với thân PUT cũ đã đổi tên (đủ 2 mẫu, name, columns theo thứ tự, opening, closing), errors là mảng rỗng. Chiều đỏ: bỏ đường đọc dạng cũ → ca đỏ nêu số mẫu thiếu."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/mau-api-ten-truong-tieng-anh/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bài thuần của apps/web: moHopVoiMau với máy chủ giả trả mẫu đã qua docMauBang từ dạng cũ → xuất xlsx theo mẫu có tiêu đề cột đúng thứ tự (so mảng), bài Zalo bằng bocBai(baiZalo(...), lời đã đọc) chứa lời mở đầu và lời kết; tinMacDinh của màn Gửi với mauZalo đọc từ dạng cũ chứa hai lời. Chiều đỏ: hộp đọc trường cũ m.ten → ca đỏ nêu «mẫu dạng cũ không ra cột»."
    paths: ["apps/web/src/app/(app)/inventory/**", "apps/web/src/app/(app)/shares/new/**", packages/core/src/export/**, packages/core/src/sharing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; xuatBang với mauBai đọc từ dạng cũ và soanTin với mauZalo đọc từ dạng cũ cho đúng chuỗi như khi đọc từ dạng mới cùng lời (so chuỗi, bảng hai ca: Zalo, Facebook, cộng tin Gửi = 3). Chiều đỏ: bocBai đọc loi.dau → ca đỏ nêu lời mất."
    paths: [packages/core/src/export/**, packages/core/src/sharing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6c
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bài dựng màn (renderToStaticMarkup) ô «Cột theo» của hộp Xuất với mẫu đọc qua docMauBang từ fixture dạng cũ của E5b và từ cùng mẫu dạng mới: chữ hiển thị (tên mẫu theo thứ tự) bằng nhau và chứa đủ tên mẫu (so mảng); màn Gửi dựng ô tin bằng tinMacDinh từ hai dạng cho cùng chuỗi. Chiều đỏ: tệp tsx đọc m.ten → tên mẫu trống, ca đỏ nêu «màn đổi theo dạng lưu»."
    paths: ["apps/web/src/app/(app)/inventory/**", "apps/web/src/app/(app)/shares/new/**", packages/core/src/export/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «lưu lại chuyển sang tên mới» — ghi thẳng fixture dạng cũ của E5b → GET → dựng thân bằng thanPutBang, thanPutBai của màn Mẫu (apps/web settings/templates/mau-san.ts) từ đáp GET → PUT 200 → dòng company_settings chỉ còn khoá mới (duyệt đệ quy) và GET sau bằng đúng GET trước (so sâu, đủ số mẫu). Chiều đỏ: thân dựng từ trường cũ → ca đỏ nêu «lưu lại làm mất mẫu»."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, "apps/web/src/app/(app)/settings/templates/**", packages/api/test-db/mau-api-ten-truong-tieng-anh/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7b
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bài thuần của màn Mẫu: thanPutBang, thanPutBai, xemTruocBai và lyDoChoNguoi dùng tên mới — thân PUT có khoá sắp xếp đúng [columns, id, name] và [closing, opening]; lyDoChoNguoi dịch lý do «export.templates[0].name: … đã có trong sàn» và «share.post_templates.zalo.opening: tối đa 500 ký tự» ra câu cho người như trước (so chuỗi, 2 ca). Chiều đỏ: thân còn khoá ten → ca đỏ nêu khoá."
    paths: ["apps/web/src/app/(app)/settings/templates/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7c
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; bài dựng màn (renderToStaticMarkup) BangMauBang và BangMauBai của màn Mẫu với dữ liệu đọc từ fixture dạng cũ và từ dạng mới cùng nội dung: HTML hai bên bằng nhau, chứa tên mẫu, nhãn cột theo thứ tự và hai lời (so chuỗi và so mảng tên). Chiều đỏ: vung-mau-bang.tsx đọc m.ten → ca đỏ nêu «màn Mẫu mất tên mẫu dạng cũ»."
    paths: ["apps/web/src/app/(app)/settings/templates/**", packages/core/src/export/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; bộ ca DB của mau-bang-hang-va-bai (đổi sang tên mới) vẫn ok: vai khác Quản trị PUT → 403 ở cả hai đường; sàn B GET không thấy mẫu sàn A; cộng bộ kiểm cách ly đầy đủ. Chiều đỏ: bỏ kiểm aiDoi → ca đỏ nêu vai ghi lọt."
    paths: [packages/api/src/mau-san/**, packages/core/src/export/**, packages/api/test-db/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8b
    criterion: AC-8
    executor: script
    cmd: config:executors.script.ro_ri
    expected: "exit 0; bộ kiểm rò rỉ của mẫu (packages/core/src/redaction/mau-san.ro-ri.test.ts, đổi sang tên mới) cộng ca mẫu dạng cũ mang mọi cột của COT_BANG_HANG qua docMauBang rồi xuatBang × hai người nhận: không chuỗi mồi nào trong cot, dong, bai. Chiều đỏ: đọc dạng cũ giữ cột nội bộ → ca đỏ nêu chuỗi mồi lọt."
    paths: [packages/core/src/export/**, packages/core/src/sharing/**, packages/core/src/redaction/**, "apps/web/src/app/(app)/settings/templates/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8c
    criterion: AC-8
    executor: script
    cmd: config:executors.design.khuon
    expected: "exit 0 hay đúng mã đã khai của lưới khuôn; màn Mẫu, hộp Xuất và màn Gửi vẫn theo khuôn của nhóm mình, không lệch mới — vòng chỉ đổi tên trường. Chiều đỏ: tệp giao diện chạm mà rời khuôn → lưới nêu tệp."
    paths: ["apps/web/src/app/(app)/settings/templates/**", "apps/web/src/app/(app)/inventory/**", "apps/web/src/app/(app)/shares/new/**", "design/patterns/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
