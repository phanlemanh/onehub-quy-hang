    executor: test
    cmd: config:executors.test.web
    layer: backend-effect
    expected: "exit 0; cell-edit/hoan-tac.test.ts: ma trận viết trước — hoàn tác đổi giá (giá A, phí X → giá B, phí Y) dựng đúng MỘT lệnh price_changed {listPrice:A, feeInclusion:X}; hoàn tác lần đặt giá đầu (cũ chưa có giá) → «không hoàn tác được»; với MỌI chuyển trạng thái của bảng ADR-0008: hoàn tác được ⟺ chiều ngược có trong bảng (Đang bán↔Tạm ngừng, Đang bán↔Đang giao dịch, Chưa đủ để rao→* và →Đã bán/Ngừng hẳn không) — lệnh hoàn tác là status_changed {to:<cũ>}; hàm «không hoàn tác được» là cùng hàm trình sửa dùng để bật câu «Không hoàn tác được» trong hộp hỏi lại. Đối chứng đỏ: coi Đã bán → Đang bán là hoàn tác được thì ca ma trận đỏ."
