      - "Khổ 375x812: mở /inventory → ghi có lưới không và thử nhấp đúp vào bất kỳ ô giá nào nếu có → ghi có mở sửa không"
      - "Khổ 1440: bật giả lập mất mạng (CDP Network.emulateNetworkConditions offline) → sửa ô Giá của hàng A-06.01 (hay hàng có giá khác, ghi mã) trong ngưỡng → ghi ô có đổi không và chỉ báo chờ gửi; tắt giả lập → chờ 10 giây → fetch events → sự kiện cuối"
