      - "Sửa ô Giá trong ngưỡng 20% → Enter → ghi Xác nhận của hàng; fetch events → sự kiện cuối: type, confirmedWithOwner, occurredAt"
      - "Sửa ô Trạng thái của một hàng Đang bán khác sang Tạm ngừng → fetch events của hàng đó → confirmedWithOwner"
    expected: "Trước khi sửa Xác nhận khác «Hôm nay»; sau khi sửa giá Xác nhận «Hôm nay»; sự kiện price_changed confirmedWithOwner true, occurredAt hôm nay; sự kiện status_changed confirmedWithOwner true. Mỗi mục một đạt/trượt."
    paths: ["apps/web/src/app/(app)/inventory/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.web
    layer: backend-effect
    expected: "exit 0; cell-edit/hoan-tac.test.ts: ma trận viết trước — hoàn tác đổi giá (giá A, phí X → giá B, phí Y) dựng đúng MỘT lệnh price_changed {listPrice:A, feeInclusion:X}; hoàn tác lần đặt giá đầu (cũ chưa có giá) → «không hoàn tác được»; với MỌI chuyển trạng thái của bảng ADR-0008: hoàn tác được ⟺ chiều ngược có trong bảng (Đang bán↔Tạm ngừng, Đang bán↔Đang giao dịch, Chưa đủ để rao→* và →Đã bán/Ngừng hẳn không) — lệnh hoàn tác là status_changed {to:<cũ>}; hàm «không hoàn tác được» là cùng hàm trình sửa dùng để bật câu «Không hoàn tác được» trong hộp hỏi lại. Đối chứng đỏ: coi Đã bán → Đang bán là hoàn tác được thì ca ma trận đỏ."
    paths: ["apps/web/src/app/(app)/inventory/cell-edit/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

