schema_version: 1
feature_slug: sua-tren-o
# Dựng chung cho mọi eval ui-check (gọi là «DỰNG B» trong steps) — chỗ thử dãy B của hàng 14:
#   node _acceptance/bang-hang-kieu-sheet/thu/dung-b.mjs
#   → Postgres dãy B (cổng 5561) đã migrate; sàn và người mẫu của hàng 5; 40 hàng mẫu nạp qua API; máy chủ dev cổng
#     3481, nhật ký .acceptance-runs/bang-hang-kieu-sheet/web-b.log. In bảng email ↔ số hàng mỗi người thấy.
#   Phiên đăng nhập: _acceptance/bang-hang-kieu-sheet/thu/cdp.mjs (cookieCua) giữ phiên ở .acceptance-runs.
#   Lịch sử sự kiện của một hàng: GET /api/v1/listings/<id>/events (fetch trong trang, cùng phiên).
#   Bài nhìn GHI dữ liệu: mỗi bài chốt mã căn riêng (Đang bán có giá lúc dựng hồ sơ, 01/11) — E2 B-03.04 · E4u B-08.02
#   · E6u B-13.02, B-14.04 · E7 B-14.05, A-13.01 · E8u B-14.06 · E9 B-15.01, B-15.05 — không bài nào ghi hàng của bài khác.
#   Hàng đã đổi ở lượt chấm trước (không còn Đang bán) thì ghi trạng thái gặp được rồi dùng hàng Đang bán có giá chưa bài
#   nào dùng ở Toà A, ghi mã thay. Mỗi bài ghi thêm: sự kiện của hàng mình có tác giả lạ không (actorUserId khác phiên).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; pricing/doc-gia.test.ts: bảng chữ viết trước ≥ 20 dòng chữ → số đồng (gồm «4,65 tỷ»=4650000000, «4.65 tỷ», «4,65t», «4 tỷ 650»=4650000000, «4ty65», «950 triệu»=950000000, «950tr», «950 tr», «4650000000», «4.650.000.000», «1,2 tỷ»=1200000000), mỗi dòng một assert; bảng ≥ 8 dòng mơ hồ/sai («», «abc», «12», «4,65 tỷ 3 triệu 2», «-5 tỷ», «1001 tỷ», «4,65 đô», «tỷ») mỗi dòng assert ra «chưa hiểu» (không phải một số). Đối chứng đỏ trong tệp: một bộ đọc giả coi số trần là tỷ thì dòng «12» đỏ với thông điệp gọi tên dòng."
    paths: ["packages/core/src/pricing/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG B. Khổ 1440x900. Đăng nhập dau-chu-1, mở http://localhost:3481/inventory, Nhóm = Không nhóm, lọc Mã căn = B-03.04 (gọi là M) — ghi giá, phí, Xác nhận hiện tại; fetch GET /api/v1/listings/<id>/events → ghi số sự kiện (n0)"
      - "Nhấp đúp ô Giá → chụp evidence/E2-mo-sua.png; ghi các phần trong trình sửa (ô gõ, hai nút phí và nút nào đang chọn, dòng chữ dưới ô, có nút «Lưu» không)"
      - "Gõ «abc» → chụp evidence/E2-chua-hieu.png; ghi dòng chữ dưới ô; bấm Enter → ghi ô còn mở không; fetch số sự kiện (phải vẫn n0); bấm Esc → ghi giá trên ô"
      - "Mở lại ô Giá, gõ giá cao hơn giá cũ dưới 20% (vd giá cũ × 1,1, viết theo tỷ, hai số lẻ) → ghi dòng «Hiểu là: …» → Enter → chụp evidence/E2-da-doi.png; ghi giá trên ô, Xác nhận của hàng, chữ thông báo góc màn, chân bảng"
      - "Fetch lại events → ghi số sự kiện (n1) và sự kiện cuối: type, payload, confirmedWithOwner"
    expected: "Trình sửa có ô gõ + hai nút «Bao phí / Không bao phí» (nút của điều kiện hiện tại đang chọn), dòng «Tính là vừa xác nhận với chủ nhà», không nút Lưu. «abc» → «Chưa hiểu «abc» — gõ như 4,65 tỷ hoặc 950 triệu», Enter không đóng ô, số sự kiện vẫn n0, Esc trả giá cũ. Giá trong ngưỡng: «Hiểu là: <giá>, <điều kiện phí>» khớp chữ đã gõ; Enter ghi thẳng (không hộp hỏi lại); ô hiện giá mới; Xác nhận «Hôm nay»; thông báo «Đã đổi giá M · Hoàn tác». n1 = n0 + 1; sự kiện cuối type price_changed, payload đúng hai khoá listPrice (bằng số đã gõ) và feeInclusion, confirmedWithOwner true. Mỗi mục một đạt/trượt."
    paths: ["apps/web/src/app/(app)/inventory/**", "packages/core/src/pricing/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E2b
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    layer: backend-effect
    expected: "exit 0; cell-edit/lenh.test.ts: hàm dựng lệnh từ trình sửa Giá (giá cũ, phí cũ, chữ gõ, phí chọn) → đúng MỘT lệnh {type:'price_changed', payload:{listPrice, feeInclusion}} với số đồng của bộ đọc, payload đúng hai khoá; lệnh qua validatePayload của lõi không lỗi. Đối chứng đỏ: payload thiếu feeInclusion thì validatePayload báo «feeInclusion thiếu» và assert gọi tên khoá."
    paths: ["apps/web/src/app/(app)/inventory/cell-edit/**", "packages/core/src/pricing/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; cell-edit/lenh.test.ts: với mọi dòng «chưa hiểu» của bảng E1, hàm dựng lệnh trả kết quả lỗi mang chữ «Chưa hiểu «<chữ>» — gõ như 4,65 tỷ hoặc 950 triệu» và KHÔNG lệnh nào (danh sách lệnh rỗng). Đối chứng đỏ: dựng lệnh bỏ kiểm bộ đọc thì ca «abc» sinh lệnh và assert đỏ."
    paths: ["apps/web/src/app/(app)/inventory/cell-edit/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.web
    layer: backend-effect
    expected: "exit 0; cell-edit/lenh.test.ts: ma trận viết trước — (a) sửa Phí trên hàng có giá → một lệnh price_changed với listPrice cũ + feeInclusion mới; (b) sửa Phí trên hàng chưa có giá → không lệnh, kết quả «mở trình sửa Giá»; (c) trình sửa Giá trên hàng chưa có giá, chưa chọn phí → không lệnh, lỗi «Chọn Bao phí hay Không bao phí»; (d) quét mọi đường dựng lệnh của cell-edit: mọi lệnh price_changed có cả hai khoá. Đối chứng đỏ: ca (a) dựng lệnh chỉ có feeInclusion thì assert đỏ gọi tên khoá listPrice."
    paths: ["apps/web/src/app/(app)/inventory/cell-edit/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4u
    criterion: AC-4
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG B. Khổ 1440x900. dau-chu-1, /inventory, Không nhóm. Lọc Mã căn = B-08.02 — ghi giá, phí; fetch events → n0"
      - "Nhấp đúp ô Phí → chụp evidence/E4-phi.png; chọn điều kiện còn lại → ghi hộp hỏi lại có hiện không (đổi phí luôn hỏi) và chữ của hộp → bấm «Đổi» → fetch events → ghi sự kiện cuối (type, payload)"
      - "Mở ô Giá, gõ giá cũ × 1,5 → Enter → chụp evidence/E4-hoi-lai.png; ghi chữ hộp hỏi lại (giá cũ, giá mới, phần trăm) → bấm «Thôi» → ghi giá trên ô; fetch events → số sự kiện"
      - "Tìm một hàng chưa có giá (Giá = «—», ghi mã) → nhấp đúp ô Phí → ghi trình sửa nào mở; nhấp đúp ô Giá, gõ «3 tỷ» không chọn phí → Enter → ghi chữ báo và số sự kiện của hàng đó"
    expected: "Đổi phí → hộp hỏi lại hiện, «Đổi» ghi price_changed với listPrice bằng giá cũ, feeInclusion bằng điều kiện mới. Giá × 1,5 → hộp hiện giá cũ → giá mới và «+50%»; «Thôi» giữ giá cũ, số sự kiện không tăng. Hàng chưa có giá: ô Phí mở trình sửa Giá; Enter khi chưa chọn phí báo «Chọn Bao phí hay Không bao phí», không sự kiện mới. Mỗi mục một đạt/trượt."
    paths: ["apps/web/src/app/(app)/inventory/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; pricing/hoi-lai.test.ts: hằng ngưỡng xuất từ pricing bằng 20; ma trận viết trước canHoiLai(cũ, mới) — cùng phí: +20% → không hỏi, +20,01% → hỏi, −20% → không, −20,01% → hỏi, bằng nhau → không; đổi phí cùng số → hỏi; cũ chưa có giá → không hỏi; mỗi ca một assert, kèm phần trăm làm tròn hiển thị (+50%, −25%). Đối chứng đỏ: hàm dùng ≥ thay > thì ca đúng 20% đỏ với tên ca. Kiểm tĩnh trong tệp: dòng khai hằng có chú thích chứa «mặc định của sàn» và chỉ một chỗ trong packages/core/src khai số 20 cho ngưỡng này."
    paths: ["packages/core/src/pricing/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    layer: backend-effect
    expected: "exit 0; cell-edit/trang-thai.test.ts: ma trận viết trước sáu trạng thái hiện tại × danh sách nấc trình sửa đưa ra, so với bảng viết tay trong tệp (Chưa đủ để rao → Đang bán, Tạm ngừng, Ngừng hẳn; Đang bán → Đang giao dịch, Đã bán, Tạm ngừng, Ngừng hẳn; Đang giao dịch → Đang bán, Đã bán, Ngừng hẳn; Tạm ngừng → Đang bán, Ngừng hẳn; Đã bán, Ngừng hẳn → rỗng); dựng lệnh: Đã bán thiếu giá chốt → lỗi, có giá chốt «4,5 tỷ» + ngày → status_changed {to:'Closed', closePrice:4500000000, closeDate}; Ngừng hẳn thiếu lý do → lỗi, có lý do → withdrawnReason đúng; Đang bán trên hàng thiếu pháp lý → lỗi gọi tên phần thiếu, không lệnh. Đối chứng đỏ: thêm nấc Đã bán → Đang bán vào trình sửa thì ca ma trận đỏ."
    paths: ["apps/web/src/app/(app)/inventory/cell-edit/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6u
    criterion: AC-6
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG B. Khổ 1440x900. dau-chu-1, /inventory, Không nhóm. Lọc Mã căn = B-13.02 — ghi trạng thái; nhấp đúp ô Trạng thái → chụp evidence/E6-nac.png; ghi danh sách nấc"
      - "Chọn «Tạm ngừng» → ghi có hộp hỏi lại không → ghi trạng thái mới; fetch events → sự kiện cuối"
      - "Tìm hàng Chưa đủ để rao thiếu pháp lý (ghi mã) → ô Trạng thái → chọn «Đang bán» → chụp evidence/E6-thieu.png; ghi chữ báo; fetch số sự kiện hàng đó trước/sau"
      - "Hàng B-14.04 → ô Trạng thái → chọn «Đã bán» → chụp evidence/E6-da-ban.png; ghi các ô hỏi thêm và ngày mặc định; gõ giá chốt «4,5 tỷ» → ghi «Hiểu là…» → xác nhận (hộp «Không hoàn tác được») → fetch events → sự kiện cuối"
    expected: "Danh sách nấc của hàng đã chọn đúng bảng ADR-0008 cho trạng thái hiện tại (ghi rõ trạng thái và danh sách). Tạm ngừng ghi status_changed {to:'Hold'}. Đang bán thiếu điều kiện: báo «Chưa lên Đang bán được: thiếu …» gọi tên phần thiếu, không sự kiện mới. Đã bán hỏi giá chốt + ngày bán (mặc định hôm nay), đọc lại «Hiểu là: 4,5 tỷ», hộp có «Không hoàn tác được», ghi status_changed {to:'Closed', closePrice:4500000000, closeDate hôm nay}. Mỗi mục một đạt/trượt."
    paths: ["apps/web/src/app/(app)/inventory/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

