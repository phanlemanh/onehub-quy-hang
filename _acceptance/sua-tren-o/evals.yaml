    expected: "Hoàn tác trên thông báo: ô về đúng giá và phí cũ; n = n0 + 2, sự kiện cuối price_changed mang giá và phí cũ, sự kiện sửa vẫn còn. Ctrl/Cmd+Z: ô về giá trước, thêm một sự kiện bù. Ngừng hẳn: hộp hỏi lại có «Không hoàn tác được»; thông báo sau khi ghi không có nút Hoàn tác. Mỗi mục một đạt/trượt."
