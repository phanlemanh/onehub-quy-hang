schema_version: 1
feature_slug: lead-bon-nac
# Lệnh máy: `executors.test.core` (kiểm thuần packages/core) và `executors.test.isolation` (bộ cách ly + packages/api/test-db,
# cần DATABASE_URL tới Postgres dãy L, cổng 5563). exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output` — dòng reporter
# liệt tên ca — và người chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO». Người,
# hàng, chủ nhà, lead lấy từ bộ mẫu hàng 5 qua đường ghi thật; số chủ là số mẫu `0900 000 0xx`. Đồng hồ của nhịp do bộ kiểm
# truyền (`runLeadTick(pool, now, sàn)`).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/dedupe/lead-stage.test.ts có mặt và ok: «nấc: bảng viết trước» — bảng viết tay mỗi dòng một bộ dữ kiện (outcome, có người, accepted, called, lên bảng, trả lại, gửi lại, bỏ) và nấc hay trạng thái phụ mong đợi bằng deepEqual, phủ đủ bốn nấc, bốn trạng thái phụ, dấu «chờ chia», và từng cặp ưu tiên (gửi lại thắng bỏ… gọi thắng nhận), đếm số lần so bằng đúng số dòng; «nấc: nhãn tiếng Việt» — LEAD_STAGE_LABELS deepEqual bảng viết trước; «nấc: bản của telesales không có số, không hàng» — myLeadView trên bản ghi có ownerPhone và matchedListingId ra đối tượng không có hai khoá ấy, Object.keys deepEqual danh sách viết trước. Chiều đỏ: đổi thứ tự trả lại và lên bảng → dòng «trả lại rồi hàng lên bảng» đỏ nêu tên dòng."
    paths: [packages/core/src/dedupe/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/leads-mine.test.ts có mặt và ok: «lead của tôi: chỉ lead mình nhập, mới nhất trước» — telesales 1 nhập ba lead, telesales 2 nhập một lead cùng sàn: GET /api/v1/leads của telesales 1 ra đúng ba mã theo thứ tự nhập ngược (deepEqual), của telesales 2 ra đúng một; mỗi dòng có đủ khoá viết trước (Object.keys deepEqual) và không có ownerPhone, owner_phone, matchedListingId; «lead của tôi: chưa đăng nhập» — 401. Chiều đỏ: bỏ điều kiện người nhập trong truy vấn → telesales 1 thấy bốn dòng, ca đỏ nêu số đếm."
    paths: [packages/api/src/leads/**, packages/core/src/dedupe/**, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «lead của tôi: bốn nấc đi qua đời lead thật» có mặt và ok — sàn thử của bộ mẫu (đầu chủ 1 phụ trách Toà A): telesales nhập L-04 qua POST /api/v1/leads; đọc GET /api/v1/leads sau mỗi bước, nấc và tên đầu chủ deepEqual bảng viết trước: sau nhập → sent + chờ chia; sau runLeadTick → sent + đầu chủ 1; sau accept của đầu chủ 1 → accepted; sau first-call → called; sau khi đầu chủ 1 tạo hàng Toà A, đặt chủ nhà mang số của L-04 và đưa hàng sang Active qua đường ghi thật → on_board; mỗi mốc giờ trong dòng bằng mốc của bước ấy đọc thẳng ở bảng (cột của lead, sự kiện của hàng). Chiều đỏ: hàm lên bảng bỏ điều kiện status Active → nấc on_board xuất hiện ngay khi tạo hàng, ca đỏ ở bước «sau first-call»."
    paths: [packages/api/src/leads/**, packages/db/migrations/015_lead_bon_nac.sql, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «trả lại: chỉ đầu chủ của lead, khi chưa lên bảng» có mặt và ok — bảng ca viết trước, mỗi dòng (người gọi, trạng thái lead, mã HTTP, mã lỗi): đầu chủ của lead chưa gọi 200 rồi lần hai 409 already-returned; đầu chủ của lead đã ghi gọi lần đầu nhưng chưa lên bảng 200 (Hỏi-4); đầu chủ của lead đã lên bảng (hàng của chính đầu chủ, chủ nhà cùng số, sang Active qua đường ghi thật) 409 already-on-board; đầu chủ khác 404; trưởng nhóm 404; telesales người nhập 404; lead căn trùng 404; không cookie 401; sau 200 đọc thẳng bảng thấy returned_at và returned_by là đầu chủ, GET /api/v1/leads của người nhập ra nấc returned với lý do «Số không liên lạc được»; đếm số lần so bằng số dòng. Chiều đỏ: bỏ điều kiện «chưa lên bảng» trong app.return_lead → dòng «đã lên bảng» ra 200, ca đỏ nêu dòng; thêm điều kiện «chưa ghi gọi» → dòng «đã gọi chưa lên bảng» ra 409, ca đỏ nêu dòng."
    paths: [packages/api/src/leads/**, packages/db/migrations/015_lead_bon_nac.sql, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «trả lại: lead rời việc của đầu chủ» có mặt và ok — lead chia cho đầu chủ 1 ở nhịp T rồi trả lại: nhịp ở T+15:00 và T+30:00 không sinh lời báo nào cho lead ấy trong khi lead đối chứng cùng nhịp có lời báo; app.lead_routing_candidates đếm lead đang mở của đầu chủ 1 không tính lead trả lại (so trước và sau trả lại); lead không trở lại hàng chờ (matched giữ nguyên, nhịp sau routed 0 cho nó); ca «trả lại: số đã trả không neo chủ nhà» — telesales nhập lead khác cùng số của lead đã trả lại: outcome 'new', không phải 'owner_has_agent' về đầu chủ 1, đối chứng: lead cùng số với một lead chưa trả lại ra 'owner_has_agent'; ca «trả lại: nhịp chia không trả lead cùng số về đầu chủ đã trả» — sàn có đầu chủ 1 và đầu chủ 2 cùng phụ trách Toà A, lượt chia kế trỏ về đầu chủ 2: nhập lead cùng số với lead đầu chủ 1 đã trả lại rồi chạy runLeadTick → người nhận là đầu chủ 2 (deepEqual); đối chứng dương ở sàn thứ hai dựng y hệt nhưng lead trước chưa trả lại → người nhận là đầu chủ 1. Bộ ca của hàng 24, 25, 62 (leads.test.ts, routing.test.ts, ma-hoa-so-chu.test.ts) vẫn ok. Chiều đỏ: bỏ điều kiện «chưa trả lại» trong app.lead_deadline_facts → có 'accept_overdue' cho lead trả lại, ca đỏ; bỏ điều kiện «chưa trả lại» trong app.lead_routing_queue (giữ kiểm trùng) → lead cùng số về đầu chủ 1, ca nhịp chia đỏ nêu tên người nhận."
    paths: [packages/db/migrations/015_lead_bon_nac.sql, packages/api/src/jobs/**, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «gửi lại: lead mới chép các mục, kiểm trùng như lead mới» có mặt và ok — lead đã trả lại; người nhập POST /api/v1/leads/{id}/resubmit { ownerPhone: số mới } → 201, thân là bản của telesales của lead mới với outcome của kiểm trùng; đọc thẳng bảng: lead mới có toà, căn, nhu cầu, giá, điều kiện phí, thời gian bằng lead cũ (deepEqual), dấu vết số khác lead cũ; lead cũ có resubmitted_at và resubmitted_lead_id = mã lead mới; GET /api/v1/leads ra lead cũ nấc resubmitted trỏ lead mới và lead mới đứng đầu; ca «gửi lại: số mới vẫn qua kiểm trùng» — bảng viết trước: số mới trùng chủ nhà mà đầu chủ 2 đang giữ (lead trước chưa trả lại) → 201, outcome 'owner_has_agent', tên đầu chủ 2, nhịp kế không chia lại lead ấy (routed 0 cho nó); căn của lead đã có hàng mở từ sau khi nhập lead cũ → 201, outcome tin bổ sung (supplement); ca «gửi lại: các ca từ chối» — bảng viết trước: số sai định dạng 400; lead chưa trả lại 409 not-returned; gửi lại lần hai 409 already-resubmitted; đầu chủ hay telesales khác 404; không cookie 401; mỗi ca từ chối không tạo lead mới (đếm lead của sàn trước và sau). Chiều đỏ: không ghi resubmitted_lead_id → gửi lại lần hai ra 201, ca đỏ; gán outcome 'new' cố định cho lead gửi lại → hai dòng kiểm trùng đỏ."
    paths: [packages/api/src/leads/**, packages/db/migrations/015_lead_bon_nac.sql, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «gửi lại: lead mới đi như lead mới» có mặt và ok — sàn có đầu chủ 1 và đầu chủ 2 cùng phụ trách Toà A; lead Toà A chia cho đầu chủ 1, đầu chủ 1 trả lại, telesales gửi lại với số mới không trùng: lead mới outcome 'new', nhịp kế đóng dấu và chia theo cách chia của sàn (theo vùng lần lượt → đầu chủ 2, người lâu chưa được chia nhất), routed_at bằng mốc nhịp; nhịp ở routed_at + 15:00 có 'accept_overdue' cho lead mới. Chiều đỏ: lối gửi lại gán thẳng đầu chủ cũ → lead mới về đầu chủ 1, ca đỏ."
    paths: [packages/api/src/leads/**, packages/db/migrations/015_lead_bon_nac.sql, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «lên bảng: bảng hàng viết trước» có mặt và ok — một lead của đầu chủ 1 với số S; năm hàng dựng qua đường ghi thật (tạo, đặt chủ nhà, đổi trạng thái): (a) đầu chủ 1, chủ nhà số S, sang Active sau lúc nhập lead → lên bảng; (b) đầu chủ 2, chủ nhà số S, Active sau lúc nhập → không; (c) đầu chủ 1, chủ nhà số S, đã Active trước lúc nhập lead → không; (d) đầu chủ 1, chủ nhà số S, còn Incomplete → không; (e) đầu chủ 1, chủ nhà số khác, Active sau lúc nhập → không; mỗi dòng dựng ở một sàn riêng rồi gọi app.lead_board_dates qua GET /api/v1/leads, kết quả (có mốc hay không) deepEqual bảng, đếm năm lần so; dòng (a) mốc bằng occurred_at của sự kiện sang Active. Chiều đỏ: bỏ điều kiện đầu chủ của hàng → dòng (b) ra lên bảng, ca đỏ nêu (b)."
    paths: [packages/db/migrations/015_lead_bon_nac.sql, packages/api/src/leads/**, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/db/tests/isolation.test.mjs các ca của hàng 27 có mặt và ok — dưới ngữ cảnh sàn B: app.return_lead và app.mark_resubmitted trên lead của A ném P0002 và đọc lại bằng kết nối chủ thấy dòng của A không đổi, lời gọi đối chứng cùng tham số dưới A đổi đúng một dòng; app.lead_board_dates với mã lead của A không trả dòng nào, đối chứng dưới A trả dòng; app.lead_board_dates trả đúng hai cột lead_id và board_at; vai quy_hang_app update trên bốn cột mới của leads bị từ chối quyền; trong packages/api/test-db/leads-mine.test.ts ca «cách ly: người của B không chạm lead của A» — GET /api/v1/leads của B không có mã lead nào của A; return và resubmit của B trên lead của A ra 404 và bảng không đổi; ca «rò: không số chủ» — thân GET /api/v1/leads, thân trả của return và resubmit có ít nhất một dòng; bỏ mọi ký tự không phải chữ số rồi tìm chín chữ số cuối của từng số chủ của ca (phủ dạng 0, 84, +84) — không thấy; không có khoá matchedListingId, listingId, ownerPhone, owner_phone; đối chứng dương cùng hàm dò: chuỗi cài sẵn «+84 900 000 012» và một thân có ownerPhone bị bắt, ca ghi số lần bắt (2). Chiều đỏ: bỏ lọc sàn trong app.lead_board_dates → ca B đỏ."
    paths: [packages/db/migrations/015_lead_bon_nac.sql, packages/db/tests/isolation.test.mjs, packages/api/src/leads/**, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    target: "Máy dev của dãy L (cổng 3483, Postgres 5563) với sàn «[Mẫu] Sàn thử»: telesales mẫu đã nhập lead đủ các nấc (chờ chia, đã nhận, đã gọi, lên bảng, trả lại, đã gửi lại, tin bổ sung) qua lối thật và nhịp chia"
    steps: "Đăng nhập telesales@mau.quy-hang.test (mã ở nhật ký máy dev). Mở /today ở 1440 rồi 375, sáng rồi tối; chụp. Trên dòng bị trả lại nhập số mới 0900 000 0xx chưa dùng, bấm «Sửa số và gửi lại»; chụp. Mở /leads/mine; chụp. Đăng nhập dau-chu-1, mở /today; chụp. Với sàn trống lead (telesales của một sàn mới) mở /today; chụp. Chặn mạng lối GET /api/v1/leads (DevTools) rồi tải lại /today; chụp lúc tải và lúc lỗi, bấm «Thử lại» sau khi mở mạng; chụp."
    expected: "Ở 1440 và 375, sáng và tối: danh sách theo khối đã chọn ở trang ba lối, mỗi dòng có toà, căn, nhu cầu, giá, tên đầu chủ, một Badge nấc đúng nhãn lõi và giờ; dòng trả lại có lý do, ô số mới và nút «Sửa số và gửi lại»; gửi xong dòng đó thành «Đã gửi lại» và một lead mới đứng đầu; /leads/mine cùng nội dung; đầu chủ thấy chỗ tạm Hôm nay như trước; sàn trống có đúng một hành động «+ Lead»; đang tải là Skeleton cùng bố cục dòng; lỗi có «Thử lại» và thử lại xong ra danh sách; chữ đọc được ở cả hai nền, không tràn ngang ở 375."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E11
    criterion: AC-11
    executor: ui-check
    layer: ui-observed
    target: "Như E10, sau khi danh sách đã hiện lead của sàn mẫu"
    steps: "Trên /today và /leads/mine của telesales: lấy toàn bộ chữ của trang (innerText) và thân mọi phản hồi mạng trang đã tải — tài liệu HTML, gói dữ liệu màn (text/x-component, RSC) và /api/v1/* (read_network_requests + thân từng phản hồi); bỏ mọi ký tự không phải chữ số khỏi từng chuỗi; tìm chín chữ số cuối của từng số chủ của các lead mẫu đã nhập (phủ dạng 0, 84, +84). Trước đó chạy cùng máy dò trên chuỗi cài sẵn «+84 900 000 012» và trên một thân JSON có ownerPhone mẫu."
    expected: "Có ít nhất một dòng lead trên màn; máy dò bắt cả hai chuỗi cài sẵn (đối chứng dương, ghi số lần bắt); đã quét ít nhất một tài liệu HTML, một gói RSC và một phản hồi /api/v1/* (ghi số lượng từng loại); không chuỗi nào chứa chín chữ số cuối của số chủ nào; không thân phản hồi nào có khoá matchedListingId, listingId, ownerPhone hay owner_phone."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E12
    criterion: AC-12
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/leads-mine.test.ts ca «số đo: ngày lead → Sẵn sàng bán trên bộ mẫu» có mặt và ok — sàn mẫu với telesales 1 và telesales 2: lead X (telesales 1) lên bảng ở ngày 3; lead Y (telesales 2) lên bảng ở ngày 5; lead Z (telesales 1) bị trả lại ở ngày 1, gửi lại thành Z' và Z' lên bảng ở ngày 6; lead W lên bảng ngoài khoảng đo; một sàn khác có lead lên bảng trong khoảng; đồng hồ do bộ kiểm đặt khi ghi sự kiện. Gọi app.lead_board_metric(sàn mẫu, từ, đến) bằng kết nối chủ: các dòng (mã lead, lúc nhập lead đầu chuỗi, lúc lên bảng, số ngày) deepEqual bảng viết trước — X 3, Y 5, Z' 6 tính từ lúc nhập Z, không W, không lead của sàn khác; tập khoá của dòng deepEqual [lead_id, first_created_at, board_at, days] (không số chủ, không mã hàng); vai quy_hang_app gọi hàm → lỗi quyền. Chiều đỏ: bỏ bước đi ngược resubmitted_lead_id → dòng Z' ra 5 ngày, ca đỏ nêu dòng."
    paths: [packages/db/migrations/015_lead_bon_nac.sql, packages/api/test-db/leads-mine.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
