<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ nhớ mẫu nhập ở đâu</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono',ui-monospace,monospace;
    }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:.66rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hai nhánh · Hỏi-1</p>
    <h1>Bộ nhớ mẫu nhập đặt ở đâu?</h1>

    <svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- panels -->
      <rect x="40" y="220" width="420" height="250" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="540" y="220" width="420" height="250" rx="8" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="56" y="244" fill="#2d3142" font-size="12" font-weight="600">Máy khuyên — từ lần nhập đã ghi</text>
      <text x="556" y="244" fill="#2d3142" font-size="12" font-weight="600">Lối khác — bảng import_templates</text>

      <!-- connectors (before boxes) -->
      <line x1="500" y1="80" x2="500" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M472 160 V182 A8 8 0 0 1 464 190 H258 A8 8 0 0 0 250 198 V220" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M528 160 V182 A8 8 0 0 0 536 190 H742 A8 8 0 0 1 750 198 V220" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="250" y1="352" x2="250" y2="384" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="750" y1="352" x2="750" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M250 440 V506 A8 8 0 0 0 258 514 H464 A8 8 0 0 1 472 522 V540" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M750 440 V506 A8 8 0 0 1 742 514 H536 A8 8 0 0 0 528 522 V540" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- arrow labels -->
      <rect x="312" y="494" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="360" y="503" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MẪU TỪ IMPORTS</text>
      <rect x="592" y="494" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="503" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MẪU BẢNG MỚI</text>

      <!-- tags -->
      <rect x="60" y="256" width="380" height="24" rx="2" fill="transparent" stroke="#ba4513" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="250" y="271" fill="#ba4513" font-size="9" text-anchor="middle">không migration · T2 · hàng 50 dựng bảng mẫu sau</text>
      <rect x="560" y="256" width="380" height="24" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
      <text x="750" y="271" fill="#4f5d75" font-size="9" text-anchor="middle">T3 · Cổng 1.5 · vượt vùng hàng 67</text>

      <!-- head nodes -->
      <rect x="420" y="32" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="32" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="61" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Tệp mới</text>
      <rect x="420" y="112" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="112" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="141" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Màn đọc mẫu</text>

      <!-- left nodes -->
      <rect x="90" y="296" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="90" y="296" width="320" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="320" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Bảng imports (có sẵn)</text>
      <text x="250" y="338" fill="#4f5d75" font-size="9" text-anchor="middle">chỉ lấy lần nhập đã ghi (committed)</text>
      <rect x="90" y="384" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="90" y="384" width="320" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="408" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Mới nhất theo từng tiêu đề</text>
      <text x="250" y="426" fill="#4f5d75" font-size="9" text-anchor="middle">thành mẫu của sàn</text>

      <!-- right nodes -->
      <rect x="590" y="296" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="590" y="296" width="320" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="750" y="320" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Migration mới</text>
      <text x="750" y="338" fill="#4f5d75" font-size="9" text-anchor="middle">luật theo dòng + ca cách ly</text>
      <rect x="590" y="384" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="590" y="384" width="320" height="56" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
      <text x="750" y="408" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ghi mẫu khi ghi lần nhập</text>
      <text x="750" y="426" fill="#4f5d75" font-size="9" text-anchor="middle">thành mẫu của sàn</text>

      <!-- merge node -->
      <rect x="420" y="540" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="540" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="500" y="569" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Ghép sẵn</text>

      <!-- legend -->
      <line x1="30" y1="612" x2="970" y2="612" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="30" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="633" x2="140" y2="633" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="148" y="636" fill="#4f5d75" font-size="9">Máy khuyên</text>
      <line x1="240" y1="633" x2="270" y2="633" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="278" y="636" fill="#4f5d75" font-size="9">Lối khác</text>
      <text x="970" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">AC-1 · AC-4 · AC-5</text>
    </svg>
  </div>
</body>
</html>
