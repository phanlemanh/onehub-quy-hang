schema_version: 1
feature_slug: va-pool-ket-noi
# Lệnh máy: executors.test.web (apps/web/src/lib/api.test.ts), executors.script.va_pool_ket_noi
# (_acceptance/va-pool-ket-noi/thu/pham-vi.test.mjs), typecheck, lint, build, design_floor, executors.design.khuon. Người chấm
# đối chiếu tên ca nêu trong `expected` với dòng reporter: có mặt, ok, không SKIP.
# Dựng cho eval ui-check (gọi là «DỰNG SỰ CỐ» trong steps):
#   node _acceptance/va-pool-ket-noi/thu/dung-su-co.mjs --dung   → Postgres riêng của hồ sơ (container quy-hang-db-pool-V,
#     cổng 5598) đã migrate và nạp nền mẫu, một phiên thật của Đầu chủ mẫu 1, công tắc mạng ở cổng 5599 bật ở trạng thái
#     TẮT; in JSON {cookie:{name,value,domain,path}}. `--mo` / `--tat` bật tắt công tắc; `--don` dọn khi xong.
#   rồi mở máy dev bằng cấu hình `web-su-co-pool` của .claude/launch.json (cổng 3499, DATABASE_URL → 5599) qua công cụ xem
#   trước của phiên. MỌI địa chỉ của bài nhìn dùng http://127.0.0.1:3499 (không dùng localhost — cookie không tách theo
#   cổng, máy dev của các dãy khác trên localhost để lại cookie phiên cùng tên); cookie đặt cho domain 127.0.0.1.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; các ca «5xx của /me là lỗi hạ tầng: ném LoiDocPhien, không trả null như «chưa đăng nhập»» và «401 thường là chưa đăng nhập (null); 401 máy bị báo mất trả mã người; 200 trả người» có mặt và ok. Ca thứ nhất là ma trận viết trước 500, 502, 503 — mỗi mã một assert ném LoiDocPhien mang đúng mã. Ca thứ hai ba assert: 401 unauthenticated → null, 401 device_reported_lost + userId → {biBao}, 200 → {me}. Chiều đỏ (phá-thử ở S3): bỏ dòng 5xx khỏi docPhanHoiMe thì ca thứ nhất đỏ với thông điệp «5xx của /me (HTTP 500): phải ném LoiDocPhien, không trả null»."
    paths: ["apps/web/src/lib/api.ts", "apps/web/src/lib/api.test.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; các ca «cỡ pool: số phiên bản dự kiến × cỡ mỗi phiên bản + khách khác nhỏ hơn hẳn trần 15 của pooler» và «hai pool dựng đúng cỡ và cả hai gắn attachDatabasePool» có mặt và ok. Ca thứ nhất assert TRAN_POOLER = 15 và bất đẳng thức chặt SO_PHIEN_BAN_DU_KIEN (3) × (POOL_DANH_TINH.max + POOL_UNG_DUNG.max) + KHACH_KHAC (2) < 15, cùng idle 0 < x ≤ 10000 và chờ kết nối > 0 cho cả hai pool. Ca thứ hai dựng pool thật qua dungPools với hàm gắn giả, assert hàm gắn nhận đúng [pool danh tính, pool ứng dụng], max/idleTimeoutMillis/connectionTimeoutMillis của mỗi pool bằng hằng POOL_DANH_TINH (2 · 5000 · 10000) và POOL_UNG_DUNG (2 · 5000 · 10000), options của pool danh tính là «-c search_path=identity», của pool ứng dụng là undefined. Chiều đỏ (phá-thử ở S3): đổi max ứng dụng thành 10 thì ca thứ nhất đỏ với thông điệp bắt đầu «cỡ pool: 3 phiên bản ×»; bỏ attach(appPool) thì ca thứ hai đỏ «attachDatabasePool: thiếu pool chưa gắn»."
    paths: ["apps/web/src/lib/api.ts", "apps/web/src/lib/api.test.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG SỰ CỐ (công tắc TẮT). Khổ 1280x800. Chưa đặt cookie: mở http://127.0.0.1:3499/today → ghi địa chỉ cuối (phải là /login)."
      - "Đặt cookie in ra (qh.session_token, domain 127.0.0.1, path /). Mở http://127.0.0.1:3499/login → ghi văn bản trang → chụp evidence/E3-login.png."
      - "Mở lần lượt http://127.0.0.1:3499/today, /inventory, /, /select-company; mỗi đường chờ 3 giây, ghi location.pathname và văn bản trang → chụp evidence/E3-today.png, E3-inventory.png, E3-goc.png, E3-chon-san.png."
      - "Về http://127.0.0.1:3499/today (trang lỗi). Chạy trong trang: window.__dauThuLai = 'con'. Chạy `node _acceptance/va-pool-ket-noi/thu/dung-su-co.mjs --mo`. Bấm «Thử lại», chờ 6 giây. Ghi location.pathname, giá trị window.__dauThuLai và văn bản trang → chụp evidence/E3-hoi-phuc.png."
      - "Chạy `node _acceptance/va-pool-ket-noi/thu/dung-su-co.mjs --don`."
    expected: "Không cookie: /today về /login. Có cookie, công tắc tắt: /login hiện ô đăng nhập («Đăng nhập Quỹ hàng», ô Email), không phải trang lỗi; /today, /inventory, / và /select-company mỗi đường giữ đúng địa chỉ của mình (/ giữ là /), trang ghi «Không mở được trang này» và có nút «Thử lại», không có ô đăng nhập. Công tắc mở rồi bấm «Thử lại»: địa chỉ vẫn /today, window.__dauThuLai vẫn là 'con' (không tải lại cả trang), trang hiện màn Hôm nay của sàn mẫu (có chữ «[Mẫu] Sàn thử» và vùng «Hôm nay»), không còn chữ «Không mở được trang này»."
    paths: ["apps/web/src/lib/api.ts", "apps/web/src/app/error.tsx", "apps/web/src/app/(app)/error.tsx", "apps/web/src/app/(auth)/login/page.tsx", "apps/web/src/app/page.tsx", "apps/web/src/app/(auth)/select-company/page.tsx", "apps/web/src/components/shell/shell-layout.tsx", "apps/web/src/proxy.ts", "apps/web/src/lib/session-refresh.ts", "_acceptance/va-pool-ket-noi/thu/dung-su-co.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.va_pool_ket_noi
    expected: "exit 0; bốn ca «phạm vi: đối chứng dương — danh sách chỉ gồm lớp web thì không đường nào ngoài phạm vi», «phạm vi: chiều đỏ — migration, luật cách ly hay API trong danh sách thì bị gọi tên», «phạm vi: cây thật — không tệp nào ngoài lớp web đổi so với điểm rẽ khỏi main» và «phạm vi: config.yaml — chỉ một dòng thêm khoá va_pool_ket_noi; đổi ngưỡng cổng bị gọi tên» có mặt và ok. Danh sách cho phép đích danh: apps/web/**, package-lock.json, .claude/launch.json, _acceptance/va-pool-ket-noi/**, _acceptance/config.yaml, docs/superpowers/specs/2026-11-06-va-pool-ket-noi-design.md, docs/superpowers/plans/2026-11-06-va-pool-ket-noi.md, docs/plan/lo-trinh.json, PRODUCT-MAP.md, LO-TRINH.html. Chiều đỏ gọi tên đủ năm đường: migration 051, packages/api/src/db.ts, isolation.test.mjs, .claude/hooks/chan-migration.sh, _acceptance/hang-khac/contract.md. Ca config.yaml: một dòng thêm khoá va_pool_ket_noi → hợp lệ; đổi gap_probe hay thêm khoá khác → lỗi «config.yaml đổi ngoài khoá executor»; diff thật của config.yaml từ điểm rẽ → hợp lệ. Ca cây thật còn assert diff chứa apps/web/src/lib/api.ts (chống đo nhầm cây)."
    paths: ["_acceptance/va-pool-ket-noi/thu/pham-vi.test.mjs", "packages/**", ".claude/**", "_acceptance/config.yaml"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.typecheck
    expected: "exit 0 trên mọi gói."
    paths: ["apps/web/src/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-5
    executor: script
    cmd: config:executors.script.lint
    expected: "exit 0; dòng «mức nợ giao diện: 0/0»; bài quét khuôn in dòng «khuôn: <n> nhóm · 0 lỗi đọc · 0 lệch» (có mặt, không SKIP); bước kiểm chuẩn in «chuẩn giao diện: đạt»."
    paths: ["apps/web/src/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-5
    executor: script
    cmd: config:executors.script.build
    expected: "exit 0; next build hoàn tất (bảng tuyến có dòng «ƒ Proxy (Middleware)»)."
    paths: ["apps/web/**", "package-lock.json"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-5
    executor: script
    cmd: config:executors.script.design_floor
    expected: "exit 0; không mã màu thô trên tệp giao diện vòng chạm."
    paths: ["apps/web/src/app/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-5
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/trang-thai.md", "apps/web/src/app/**/*.tsx", "apps/web/src/components/shell/*.tsx"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm trang-thai"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-6
    executor: script
    cmd: config:executors.script.va_pool_ket_noi
    expected: "exit 0; hai ca «nơi gọi: cây thật — đúng ba nơi đọc thẳng /api/v1/me, chỉ màn đăng nhập bắt LoiDocPhien, không ai nuốt lỗi đọc phiên» và «nơi gọi: chiều đỏ — nơi đọc lạ, bắt lỗi lạ và nuốt lỗi lạ đều bị gọi tên» có mặt và ok. Ca cây thật quét mọi .ts/.tsx dưới apps/web/src trừ bài kiểm, bỏ dòng chú thích, assert tập nơi đọc thẳng /api/v1/me bằng đúng [apps/web/src/app/(app)/me/toi-that.tsx, apps/web/src/lib/api.ts, apps/web/src/lib/session-refresh.ts], tập nơi bắt LoiDocPhien ngoài màn đăng nhập rỗng, tập nơi gắn .catch ngay sau readMe/readMeHayBiBao ngoài màn đăng nhập rỗng. Ca chiều đỏ trên tệp dựng trong bộ nhớ gọi tên đúng nơi đọc lạ, nơi bắt lạ, nơi nuốt lạ, và không gọi tên /api/v1/me/devices hay dòng chú thích. Chiều đỏ trên cây thật (phá-thử ở S3): thêm .catch(() => null) sau readMe ở select-company/page.tsx thì ca cây thật đỏ «nơi gọi: .catch sau readMe ngoài màn đăng nhập: apps/web/src/app/(auth)/select-company/page.tsx»."
    paths: ["apps/web/src/**", "_acceptance/va-pool-ket-noi/thu/noi-goi.test.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
