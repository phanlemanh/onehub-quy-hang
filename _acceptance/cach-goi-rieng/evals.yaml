    expected: "exit 0; ca «cách gọi: gỡ tên riêng đang được căn dùng» trong packages/api/test-db/cach-goi-rieng/nhan.test.ts có mặt và ok — sàn A có hai căn feeInclusion included (dựng qua đường ghi thật) và tên riêng «BP»; đọc bằng vai chủ trước: số dòng và giá trị feeInclusion của hai căn; PUT đổi «BP» thành «Bao phí SC» → 200, rồi PUT bỏ giá trị riêng ấy → 200; sau mỗi lượt: hai căn vẫn feeInclusion included, số sự kiện của hàng (listing_events) của hai căn không đổi, Lần gửi nhóm môi giới của một căn trả tuVung.giaTri.feeInclusion.included lần lượt \"Bao phí SC\" rồi vắng, can[0].feeInclusion vẫn \"included\". Chiều đỏ: PUT ghi lại giá trị của căn theo tên riêng → ca đỏ nêu số sự kiện hàng."
