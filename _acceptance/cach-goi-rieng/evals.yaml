schema_version: 1
feature_slug: cach-goi-rieng
# Lệnh máy: `executors.test.core`, `executors.test.web`, `executors.test.isolation` (bộ kiểm cách ly packages/db/tests VÀ
# bộ kiểm API trên cơ sở dữ liệu packages/api/test-db — cần DATABASE_URL tới Postgres dãy B, cổng 5572),
# `executors.script.ro_ri`. exit 0 của lệnh chung KHÔNG đủ: mỗi eval đòi `output` — dòng reporter liệt tên ca — và người
# chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok», không «# SKIP»/«# TODO». Dữ liệu: sàn thử qua đường ghi
# thật, tên «[Tên]», số `0900 000 0xx`.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/cach-goi-rieng/nhan.test.ts có mặt và ok: «cách gọi: đổi tên trường» — quản trị sàn A PUT /api/v1/company/labels với fields feeInclusion «Phí CN» → 200; GET trả phần tử feeInclusion deepEqual {field:\"feeInclusion\",label:\"Phí CN\",default:\"Điều kiện phí\",custom:true}; đọc bằng vai chủ: company_settings của A có đúng dòng key labels.field.feeInclusion value \"Phí CN\" data_class company_internal; company_settings_events có thêm đúng một sự kiện cho khoá ấy với actor_user_id là quản trị A (đếm trước/sau). Đối chứng: các trường khác vẫn custom:false. Chiều đỏ: PUT ghi khoá hai đoạn labels.feeInclusion → ca đỏ nêu khoá."
    paths: [packages/api/src/labels/**, packages/core/src/labels/**, packages/db/migrations/039_*.sql, packages/api/test-db/cach-goi-rieng/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

