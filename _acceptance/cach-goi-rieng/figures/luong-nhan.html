<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng nhãn riêng</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:1344px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:1.25rem; }
    svg { width:100%; min-width:960px; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Luồng dữ liệu · Hỏi-2, Hỏi-3 · AC-1, AC-4 … AC-8</p>
    <h1>Tên riêng của sàn: lưu một chỗ, ra ngoài chỉ qua cửa lõi</h1>

    <svg viewBox="0 0 1344 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng nhãn riêng từ màn Cách gọi tới bảng hàng trong sàn và tới trang khách qua cửa lõi">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <!-- Nền -->
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Vùng: Trong sàn -->
      <rect x="852" y="36" width="464" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
      <rect x="864" y="40" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="868" y="52" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TRONG SÀN</text>

      <!-- Vùng: Ra ngoài (qua cửa lõi) -->
      <rect x="852" y="268" width="464" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
      <rect x="864" y="272" width="168" height="16" rx="2" fill="#f5f5f5"/>
      <text x="868" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RA NGOÀI (QUA CỬA LÕI)</text>

      <!-- Mũi tên (vẽ trước hộp) -->
      <!-- Màn → API -->
      <line x1="192" y1="236" x2="232" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- API → cài đặt -->
      <line x1="392" y1="236" x2="432" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="400" y="212" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="412" y="224" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GHI</text>
      <!-- cài đặt → từ vựng -->
      <line x1="632" y1="236" x2="672" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="640" y="212" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="652" y="224" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỌC</text>
      <!-- từ vựng → Bảng hàng (nhánh trong sàn) -->
      <path d="M 752,196 V 116 Q 752,108 760,108 H 872" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- từ vựng → cửa ra (nhánh ra ngoài) -->
      <path d="M 752,276 V 392 Q 752,400 760,400 H 872" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- cửa ra → bản phát hàng -->
      <path d="M 1072,384 H 1084 Q 1092,384 1092,376 V 348 Q 1092,340 1100,340 H 1112" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- cửa ra → trang khách -->
      <path d="M 1072,416 H 1084 Q 1092,416 1092,424 V 460 Q 1092,468 1100,468 H 1112" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Hộp -->
      <!-- 1. Màn Cách gọi -->
      <rect x="32" y="196" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="196" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="202" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="56" y="213" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÀN</text>
      <text x="112" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Màn «Cách gọi»</text>
      <text x="112" y="260" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">quản trị sàn đặt tên</text>

      <!-- 2. API lưu -->
      <rect x="232" y="196" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="196" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="202" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="256" y="213" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="312" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lưu một khối</text>
      <text x="312" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PUT /company/labels</text>

      <!-- 3. Cài đặt của sàn -->
      <rect x="432" y="188" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="432" y="188" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="440" y="194" width="32" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="456" y="205" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LƯU</text>
      <text x="532" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cài đặt của sàn</text>
      <text x="532" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">company_settings</text>
      <text x="532" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">labels.field.* · labels.value.*</text>
      <text x="532" y="276" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nhật ký · luật dòng theo sàn</text>

      <!-- 4. Từ vựng của sàn -->
      <rect x="672" y="196" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="196" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="202" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="696" y="213" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LÕI</text>
      <text x="752" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Từ vựng của sàn</text>
      <text x="752" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">boTuVung</text>

      <!-- 5. Bảng hàng (trong sàn) -->
      <rect x="872" y="68" width="420" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="872" y="68" width="420" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="880" y="74" width="32" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="896" y="85" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MÀN</text>
      <text x="1082" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng hàng · thẻ điện thoại</text>
      <text x="1082" y="128" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tên riêng cả 15 trường · tên riêng phí, lý do ngừng</text>

      <!-- 6. Cửa ra của lõi (focal) -->
      <rect x="872" y="352" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="872" y="352" width="200" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="880" y="358" width="32" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="896" y="369" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LÕI</text>
      <text x="972" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cửa ra của lõi</text>
      <text x="972" y="412" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tuVungRaNgoai</text>
      <text x="972" y="428" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chỉ trường có khoá ra</text>
      <text x="972" y="442" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không có lý do ngừng</text>

      <!-- 7. Bản phát hàng -->
      <rect x="1112" y="300" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="1112" y="300" width="180" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1120" y="306" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1140" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">XUẤT</text>
      <text x="1202" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản phát hàng</text>
      <text x="1202" y="364" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">gửi nhóm môi giới</text>

      <!-- 8. Trang khách -->
      <rect x="1112" y="420" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="1112" y="420" width="180" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="1120" y="426" width="44" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="1142" y="437" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRANG</text>
      <text x="1202" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trang khách</text>
      <text x="1202" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/s/&lt;mã&gt;</text>
      <text x="1202" y="496" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khách riêng · nhóm môi giới</text>

      <!-- Ghi chú (callout) -->
      <!-- Sàn khác không thấy — dưới Cài đặt của sàn -->
      <path d="M 532,332 Q 524,312 532,288" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="532" cy="286" r="2" fill="#2d3142"/>
      <text x="532" y="352" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Sàn khác không thấy</text>

      <!-- Lọc, đếm theo giá trị chuẩn — trên nhánh Bảng hàng -->
      <path d="M 712,132 Q 736,132 750,148" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="752" cy="152" r="2" fill="#2d3142"/>
      <text x="704" y="136" fill="#2d3142" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">Lọc, đếm theo giá trị chuẩn</text>

      <!-- Chú giải -->
      <line x1="32" y1="556" x2="1312" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>

      <rect x="120" y="576" width="24" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="152" y="588" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Cửa duy nhất cho nhãn ra ngoài</text>

      <rect x="340" y="576" width="24" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="372" y="588" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Lưu theo từng sàn</text>

      <rect x="500" y="576" width="24" height="16" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="532" y="588" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Người ngoài sàn xem</text>

      <line x1="680" y1="584" x2="712" y2="584" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="720" y="588" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Dữ liệu rời sàn</text>

      <path d="M 840,584 H 872" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="880" y="588" fill="#2d3142" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Ghi chú</text>
    </svg>
  </main>
</body>
</html>
