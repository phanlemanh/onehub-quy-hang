schema_version: 1
feature_slug: phien-dang-nhap-30-ngay
# Hai lệnh máy: `executors.test.api` (kiểm thử không cần cơ sở dữ liệu của packages/api) và `executors.test.isolation`
# (bộ cách ly + packages/api/test-db, cần Postgres của dãy — DATABASE_URL tới cổng 5552). exit 0 của lệnh chung KHÔNG đủ:
# người chấm đối chiếu từng tên ca nêu trong `expected` trong `output` — có mặt, «ok», không «# SKIP»/«# TODO».
# Tuổi phiên giả bằng cách dời `expiresAt` của dòng phiên qua kết nối chủ (như ca «mã quá hạn» của ADR-0005).
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «phiên: đăng nhập đặt cookie và hạn 30 ngày» có mặt và ok — cookie qh.session_token mang Max-Age=2592000; expiresAt của dòng phiên cách lúc đăng nhập 30 ngày ± 2 phút. Chiều đỏ: bỏ khai session ở createAuth → ca đỏ nêu Max-Age=604800 nhận được."
    paths: [packages/api/src/auth/**, packages/api/test-db/session.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «phiên: dùng lại sau hơn một ngày thì trượt cả hai nơi» có mặt và ok — dời expiresAt về now + 30 ngày − 25 giờ; GET /api/v1/auth/get-session trả 200, có Set-Cookie qh.session_token Max-Age=2592000, expiresAt mới cách bây giờ 30 ngày ± 2 phút. Chiều đỏ: updateAge = 2 ngày → ca đỏ nêu «không có Set-Cookie»."
    paths: [packages/api/src/auth/**, packages/api/test-db/session.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «phiên: dùng lại trong ngày không ghi gì» có mặt và ok — dời expiresAt về now + 30 ngày − 1 giờ; get-session trả phiên của đúng email (đối chứng dương), không có Set-Cookie session_token, expiresAt và updatedAt của dòng phiên (đọc qua kết nối chủ) sau lời gọi bằng đúng giá trị trước. Chiều đỏ: updateAge = 0 → ca đỏ nêu expiresAt đã đổi."
    paths: [packages/api/src/auth/**, packages/api/test-db/session.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «phiên: quá hạn thì như chưa đăng nhập» có mặt và ok — cùng phiên trước khi dời hạn: GET /api/v1/me 200 (đối chứng dương); dời expiresAt về quá khứ: /api/v1/me 401 và get-session trả null. Chiều đỏ: không dời hạn → ca đỏ nêu mã 200."
    paths: [packages/api/src/auth/**, packages/api/test-db/session.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «mở trang: bước chặn đầu đặt lại cookie khi phiên đã hơn một ngày» có mặt và ok — chạy hàm làm mới mà apps/web/src/proxy.ts dùng thật, với NextRequest mang cookie phiên đã dời 25 giờ: phản hồi có Set-Cookie qh.session_token cùng giá trị token đã gửi, Max-Age=2592000, HttpOnly, SameSite=Lax, Path=/; expiresAt dời về 30 ngày ± 2 phút; phiên vừa làm mới: không Set-Cookie phiên (đối chứng); không cookie: proxy() chuyển về /login. Ca «mở trang: bản https đặt lại cookie __Secure-» có mặt và ok — API dựng với baseURL https, cookie __Secure-qh.session_token đã dời 25 giờ: phản hồi có Set-Cookie đúng tên có tiền tố, Secure, HttpOnly, Max-Age=2592000. Chiều đỏ: proxy không chép Set-Cookie → ca đỏ nêu «trang không đặt lại cookie»; dò tên cứng qh.session_token → ca https đỏ; dựng lại cookie chỉ với maxAge → ca đỏ nêu thuộc tính thiếu."
    paths: [apps/web/src/proxy.ts, apps/web/src/lib/session-refresh.ts, packages/api/src/auth/**, packages/api/test-db/session.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; ca «phiên: createAuth khai 30 ngày, làm mới mỗi ngày» có mặt và ok — SESSION_EXPIRES_SEC = 2592000, SESSION_UPDATE_AGE_SEC = 86400, createAuth(...).options.session có expiresIn và updateAge bằng đúng hai hằng. Chiều đỏ: đổi SESSION_EXPIRES_SEC → ca đỏ nêu số ghim 2592000."
    paths: [packages/api/src/auth/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.api
    expected: "exit 0; ca «phiên: ADR-0005 và Tham chiếu ghi đúng số của mã» có mặt và ok — ADR-0005 có câu nêu thời hạn phiên 30 ngày và làm mới mỗi ngày, số ngày suy từ SESSION_EXPIRES_SEC / 86400; Tham chiếu §12 có dòng 31/10 nhắc phiên đăng nhập 30 ngày. Chiều đỏ: ADR ghi 7 ngày → ca đỏ nêu tệp và số mong."
    paths: [packages/api/src/auth/**, docs/adr/0005-dang-nhap-theo-san.md, docs/product/tham-chieu.md]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
