<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường của việc mới</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 1.5rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; margin: 0 auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.3;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Hỏi-1 + Hỏi-2 · AC-6, AC-7</p>
    <h1>Việc mới luôn thuộc một hàng lộ trình; mục ngoài hợp đồng dễ thì máy tự ghi</h1>

    <svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hai làn: mở việc mới qua lộ trình, và định tuyến mục ngoài hợp đồng ở Cổng Bằng chứng">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ LANES ============ -->
      <rect x="24" y="24" width="1232" height="268" rx="8" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
      <text x="40" y="48" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÀN 1 · MỞ VIỆC</text>

      <rect x="24" y="316" width="1232" height="284" rx="8" fill="none" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
      <text x="40" y="340" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LÀN 2 · CỔNG BẰNG CHỨNG</text>

      <!-- ============ CONNECTORS (drawn first) ============ -->
      <!-- Lane 1 -->
      <line x1="216" y1="164" x2="264" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="488" y1="164" x2="536" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="728" y1="164" x2="784" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond -> Gộp được (CÓ) -->
      <path d="M880 108 V100 Q880 92 888 92 H1048" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond -> Chặn gộp (KHÔNG) -->
      <path d="M880 220 V228 Q880 236 888 236 H1048" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Lane 2 -->
      <line x1="216" y1="464" x2="280" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond -> Máy ghi (CÓ) -->
      <path d="M400 400 V388 Q400 380 408 380 H936" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Diamond -> Chủ kho (KHÔNG) -->
      <path d="M400 528 V548 Q400 556 408 556 H936" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond … condition card (annotation, no arrowhead) -->
      <line x1="520" y1="464" x2="576" y2="464" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- ============ CONNECTOR LABELS ============ -->
      <rect x="944" y="68" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="960" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>

      <rect x="936" y="212" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="960" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>

      <rect x="736" y="356" width="168" height="16" rx="2" fill="#f5f5f5"/>
      <text x="820" y="368" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ · ĐỦ CẢ BỐN</text>

      <rect x="704" y="532" width="216" height="16" rx="2" fill="#f5f5f5"/>
      <text x="812" y="544" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG · THIẾU MỘT ĐIỀU</text>

      <!-- ============ NODES — LANE 1 ============ -->
      <!-- Start -->
      <rect x="40" y="132" width="176" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="40" y="132" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="128" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Câu mô tả việc mới</text>
      <text x="128" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">người gõ một câu</text>

      <!-- Hỏi-1 chip -->
      <rect x="264" y="100" width="200" height="16" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="272" y="111" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">Hỏi-1 · chặn việc ngoài lộ trình</text>

      <!-- Step A (focal) -->
      <rect x="264" y="124" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="264" y="124" width="224" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="376" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy thêm một hàng</text>
      <text x="376" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vào lộ trình</text>
      <text x="376" y="188" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">không thêm lượt gọi người</text>

      <!-- Step B -->
      <rect x="536" y="132" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="632" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ mở, thuộc hàng</text>
      <text x="632" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nối sẵn với hàng vừa thêm</text>

      <!-- Decision -->
      <polygon points="880,108 976,164 880,220 784,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="880" y="161" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lưới gộp:</text>
      <text x="880" y="175" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hồ sơ có hàng?</text>

      <!-- End: Gộp được -->
      <rect x="1048" y="68" width="176" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1136" y="97" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qua, gộp được</text>

      <!-- End: Chặn -->
      <rect x="1048" y="208" width="176" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1136" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chặn gộp</text>
      <text x="1136" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nêu tên hồ sơ thiếu hàng</text>

      <!-- ============ NODES — LANE 2 ============ -->
      <!-- Start -->
      <rect x="40" y="432" width="176" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="128" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mục ngoài hợp đồng</text>
      <text x="128" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">máy đã đề xuất hướng xử</text>

      <!-- Decision -->
      <polygon points="400,400 520,464 400,528 280,464" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="461" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đủ bốn điều kiện</text>
      <text x="400" y="475" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">để máy tự ghi?</text>

      <!-- Hỏi-2 chip -->
      <rect x="576" y="400" width="200" height="16" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="584" y="411" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace">Hỏi-2 · máy tự định tuyến</text>

      <!-- Condition card -->
      <rect x="576" y="424" width="288" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="592" y="444" fill="#4f5d75" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BỐN ĐIỀU KIỆN</text>
      <text x="592" y="462" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">1 · Hồ sơ hạng T2</text>
      <text x="592" y="476" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">2 · Kết quả chấm: đạt</text>
      <text x="592" y="490" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">3 · Không còn mục chưa chắc</text>
      <text x="592" y="504" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">4 · Máy đề xuất ghi giới hạn hoặc chấp nhận</text>

      <!-- End: Máy ghi (focal) -->
      <rect x="936" y="348" width="288" height="64" rx="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1080" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy ghi, thẻ in sẵn lệnh đảo</text>
      <text x="1080" y="392" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chủ kho không bị hỏi từng mục</text>

      <!-- End: Chủ kho quyết -->
      <rect x="936" y="528" width="288" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1080" y="552" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chủ kho quyết như hôm nay</text>
      <text x="1080" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hạng T3 · mở hợp đồng mới · còn chưa chắc</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="624" x2="1240" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH DÁNG CHỈ LOẠI NÚT</text>

      <rect x="40" y="660" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm đầu / điểm cuối</text>

      <rect x="220" y="660" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước làm</text>

      <polygon points="340,666 352,660 364,666 352,672" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Câu hỏi rẽ nhánh</text>

      <line x1="488" y1="666" x2="512" y2="666" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="520" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điều kiện của câu hỏi</text>

      <rect x="660" y="660" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="692" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chỗ máy gánh thay người (mới)</text>

      <rect x="880" y="658" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1"/>
      <text x="900" y="669" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">Hỏi-n</text>
      <text x="928" y="670" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm chủ kho chốt (khuyến nghị)</text>
    </svg>
  </div>
</body>
</html>
