# Bài đo của vòng: một tệp node:test `_acceptance/nang-kit-2-36-0/thu/nac.test.mjs`, chạy bằng `executors.script.nang_kit`
# (kit từ CLAUDE_PLUGIN_ROOT, vắng thì từ sổ cài qua packages/ui-lint/tim-kit.mjs). exit 0 của lệnh chung KHÔNG đủ: mỗi
# eval đòi `output` và người chấm đối chiếu tên ca nêu trong `expected` — có mặt, «ok», không «# SKIP»/«# TODO». Mọi ca
# dựng trên bản sao tạm (worktree hay kho git tạm ngoài cây), không ghi vào cây kho.
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.nang_kit
    expected: "exit 0; ca «kit dùng để đo là 2.36.0» ok — gốc kit mà bài đo định vị (CLAUDE_PLUGIN_ROOT, vắng thì sổ cài) có .claude-plugin/plugin.json khai version 2.36.0; chiều đỏ: gốc giả khai 2.35.0 bị bắt, thông điệp nêu bản thấy được và đường gốc. Ca «CI lấy kit thẻ v2.36.0» ok — mọi tệp .github/workflows/*.yml có đúng một dòng KIT_TAG và nó là v2.36.0, không dòng nào chứa v2.35.0; chiều đỏ trên cùng hàm đọc: văn bản workflow cấy `KIT_TAG: v2.35.0` bị bắt, thông điệp nêu thẻ thấy được. Ca «lưới trước-gộp sạch với cấu hình mới» ok — worktree tạm ở HEAD bỏ thư mục hồ sơ của vòng, chạy pre-merge-check.sh của kit với --base origin/main --no-t1-escape: dòng cuối `pre-merge-check: clean`, không dòng VIOLATION; chiều đỏ cùng worktree: đặt `gap_probe: requird` → có dòng `VIOLATION [config]` nêu gap_probe."
    paths: [.github/workflows/**, _acceptance/config.yaml, _acceptance/nang-kit-2-36-0/thu/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

