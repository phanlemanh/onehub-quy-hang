    question: "Mục «Rào của kho» trong AGENTS.md có nói driver gộp `tep-sinh` cho PRODUCT-MAP.md và LO-TRINH.html, rằng nó bật tự động khi `npm install` (khớp script `prepare` trong package.json và hai dòng của .gitattributes), và rằng job gate lấy kit theo KIT_TAG (khớp dòng KIT_TAG của ci.yml) không? Bảng §12 của docs/product/tham-chieu.md có một dòng ngày 31/10 ghi các nấc đã bật (bản kit 2.36.0, gộp không dừng ở tệp sinh, phản biện bắt buộc, chặn việc ngoài lộ trình, máy tự định tuyến mục ngoài hợp đồng) và các nấc cố ý chưa bật kèm lý do ngắn, khớp khoá thật trong _acceptance/config.yaml và mục 3 của bản thiết kế không?"
    expected: "PASS khi cả ba vế đúng; FAIL nêu vế thiếu hay chỗ lệch giữa tài liệu và cấu hình."
