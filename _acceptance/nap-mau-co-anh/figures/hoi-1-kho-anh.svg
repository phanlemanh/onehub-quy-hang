<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1136 536" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .nm { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .dm { font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
          .tg { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.08em; }
          .al { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.06em; }
          .ala { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #ba4513; letter-spacing: 0.06em; font-weight: 500; }
          .co { font-family: 'Instrument Serif', 'Lora', serif; font-style: italic; font-size: 14px; fill: #2d3142; }
          .lg { font-family: 'Geist', sans-serif; font-size: 9px; fill: #4f5d75; }
          .lt { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; letter-spacing: 0.18em; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước, nằm dưới nút) ===== -->
      <line x1="216" y1="260" x2="248" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="260" x2="448" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Lối A (khuyến nghị) -->
      <path d="M528 212 L528 156 Q528 148 536 148 L680 148" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Lối B -->
      <path d="M528 308 L528 404 Q528 412 536 412 L680 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A: đủ khoá → Storage -->
      <line x1="840" y1="148" x2="900" y2="148" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- A: thiếu khoá → dừng -->
      <line x1="760" y1="196" x2="760" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B: Postgres → kết cục -->
      <line x1="840" y1="412" x2="900" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Dây chú thích -->
      <line x1="1000" y1="176" x2="1000" y2="204" stroke="#636b80" stroke-width="0.8" stroke-dasharray="3,3"/>

      <!-- ===== Nhãn mũi tên ===== -->
      <rect x="548" y="124" width="120" height="16" rx="2" fill="#f5f5f5"/>
      <text x="608" y="136" class="ala" text-anchor="middle">A · KHUYẾN NGHỊ</text>

      <rect x="596" y="388" width="24" height="16" rx="2" fill="#f5f5f5"/>
      <text x="608" y="400" class="al" text-anchor="middle">B</text>

      <rect x="852" y="124" width="36" height="16" rx="2" fill="#f5f5f5"/>
      <text x="870" y="136" class="ala" text-anchor="middle">ĐỦ</text>

      <rect x="772" y="208" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="808" y="220" class="al" text-anchor="middle">THIẾU KHOÁ</text>

      <!-- ===== Nút ===== -->
      <!-- Bắt đầu -->
      <rect x="32" y="228" width="184" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="32" y="228" width="184" height="64" rx="32" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="124" y="252" class="nm" text-anchor="middle">Chủ kho bấm nút</text>
      <text x="124" y="268" class="nm" text-anchor="middle">Nạp dữ liệu mẫu</text>
      <text x="124" y="282" class="sb" text-anchor="middle">trên GitHub</text>

      <!-- Bước: đọc khoá -->
      <rect x="248" y="232" width="168" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="232" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="258" class="nm" text-anchor="middle">Bộ nạp đọc</text>
      <text x="332" y="274" class="nm" text-anchor="middle">khoá kho ảnh</text>

      <!-- Rẽ: Hỏi-1 -->
      <polygon points="528,212 608,260 528,308 448,260" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="528" y="254" class="tg" text-anchor="middle">HỎI-1</text>
      <text x="528" y="272" class="dm" text-anchor="middle">Ghi ảnh vào đâu?</text>

      <!-- Lối A: rẽ đủ khoá -->
      <polygon points="760,100 840,148 760,196 680,148" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="144" class="dm" text-anchor="middle">Đủ ba khoá</text>
      <text x="760" y="160" class="dm" text-anchor="middle">kho ảnh?</text>

      <!-- Kết cục A — trọng tâm -->
      <rect x="900" y="120" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="900" y="120" width="200" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1000" y="146" class="nm" text-anchor="middle">Ảnh vào Storage</text>
      <text x="1000" y="162" class="sb" text-anchor="middle">bản thật hiện ảnh</text>

      <!-- Kết cục A: thiếu khoá -->
      <rect x="672" y="236" width="176" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="672" y="236" width="176" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="760" y="262" class="nm" text-anchor="middle">Dừng trước mọi câu ghi</text>
      <text x="760" y="278" class="sb" text-anchor="middle">báo thiếu khoá, không ghi gì</text>

      <!-- Chú thích: việc của chủ kho -->
      <text x="884" y="220" class="co">Việc của chủ kho: thêm ba secret</text>
      <text x="884" y="238" class="co">ở environment production</text>
      <text x="884" y="256" class="sb">một lần, cùng giá trị bản thật đang dùng</text>

      <!-- Lối B: luôn ghi Postgres -->
      <rect x="680" y="384" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="384" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="410" class="nm" text-anchor="middle">Luôn ghi Postgres</text>
      <text x="760" y="426" class="sb" text-anchor="middle">không cần khoá</text>

      <!-- Kết cục B -->
      <rect x="900" y="376" width="200" height="72" rx="36" fill="#f5f5f5"/>
      <rect x="900" y="376" width="200" height="72" rx="36" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1000" y="404" class="nm" text-anchor="middle">Nạp xong, nhưng 29 căn</text>
      <text x="1000" y="420" class="nm" text-anchor="middle">mẫu hiện ô ảnh vỡ</text>
      <text x="1000" y="436" class="sb" text-anchor="middle">bản thật đọc ảnh từ Storage</text>

      <!-- ===== Chú giải ===== -->
      <line x1="32" y1="476" x2="1104" y2="476" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="496" class="lt">CHÚ GIẢI · HÌNH MANG LOẠI</text>

      <rect x="32" y="508" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="64" y="518" class="lg">Bắt đầu / kết cục</text>

      <rect x="188" y="508" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="518" class="lg">Bước</text>

      <polygon points="296,514 308,508 320,514 308,520" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="328" y="518" class="lg">Rẽ nhánh</text>

      <line x1="412" y1="514" x2="440" y2="514" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="448" y="518" class="lg">Lối khuyến nghị</text>

      <line x1="560" y1="514" x2="588" y2="514" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="596" y="518" class="lg">Lối khác</text>

      <text x="1104" y="518" class="tg" text-anchor="end">CĂN CỨ · AC-4 · AC-7</text>
    </svg>