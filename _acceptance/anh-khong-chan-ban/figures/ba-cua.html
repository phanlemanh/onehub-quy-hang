<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ba cửa vào Đang bán</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1184px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Thiếu ảnh không chặn bán · Hỏi-6</p>
    <h1>Ba cửa vào Đang bán, một bước kiểm ở máy chủ: số ảnh tối thiểu lấy từ sàn, sàn chưa lưu thì mặc định mới là 0</h1>

    <svg viewBox="0 0 1184 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ba cửa: nút Sẵn sàng bán ở hồ sơ căn, ô Trạng thái và sửa hàng loạt ở Bảng hàng, nhập file dòng còn hàng, cùng đi vào một bước kiểm ở máy chủ đếm ảnh thật gửi được và so với số tối thiểu của sàn. Sàn đã lưu số riêng thì dùng số ấy: dưới số ấy bị từ chối thiếu ảnh thật, đủ số ấy thì vào Đang bán. Sàn chưa lưu thì mặc định mới 0, luôn đủ, đây là Hỏi-6. Đủ: Đang bán, đầu khách thấy, mục Ảnh thật còn thiếu ở mức đủ, việc Bổ sung ảnh ở Hôm nay.">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Nhãn cột -->
      <text x="40" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BA CỬA VÀO</text>
      <text x="320" y="200" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MÁY CHỦ</text>
      <text x="912" y="32" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">KẾT CỤC</text>

      <!-- Mũi tên (vẽ trước nút) -->
      <!-- Cửa 1 → Kiểm -->
      <path d="M256 168 H280 A8 8 0 0 1 288 176 V232 A8 8 0 0 0 296 240 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cửa 2 → Kiểm -->
      <line x1="256" y1="264" x2="320" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cửa 3 → Kiểm -->
      <path d="M256 360 H280 A8 8 0 0 0 288 352 V296 A8 8 0 0 1 296 288 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Kiểm → Rẽ -->
      <line x1="544" y1="264" x2="576" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ: đã lưu (lên) -->
      <line x1="672" y1="192" x2="672" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Rẽ: chưa lưu (xuống) -->
      <line x1="672" y1="336" x2="672" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đã lưu: dưới số ấy → Thiếu -->
      <line x1="768" y1="100" x2="912" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Đã lưu: đủ số ấy → Đủ -->
      <path d="M768 132 H800 A8 8 0 0 1 808 140 V392 A8 8 0 0 0 816 400 H912" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Chưa lưu: luôn đủ → Đủ -->
      <line x1="768" y1="440" x2="912" y2="440" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Nhãn mũi tên -->
      <rect x="680" y="160" width="60" height="16" rx="2" fill="#f5f5f5"/>
      <text x="684" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐÃ LƯU</text>

      <rect x="680" y="348" width="68" height="16" rx="2" fill="#f5f5f5"/>
      <text x="684" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHƯA LƯU</text>

      <rect x="784" y="76" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="840" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DƯỚI SỐ ẤY</text>

      <rect x="816" y="256" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="820" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐỦ SỐ ẤY</text>

      <rect x="784" y="416" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="840" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LUÔN ĐỦ (≥ 0)</text>

      <!-- Cửa 1 -->
      <rect x="40" y="136" width="216" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="136" width="216" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="148" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nút «Sẵn sàng bán»</text>
      <text x="148" y="184" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ở hồ sơ căn</text>

      <!-- Cửa 2 -->
      <rect x="40" y="232" width="216" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="232" width="216" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="148" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ô Trạng thái · sửa hàng loạt</text>
      <text x="148" y="280" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ở Bảng hàng</text>

      <!-- Cửa 3 -->
      <rect x="40" y="328" width="216" height="64" rx="20" fill="#f5f5f5"/>
      <rect x="40" y="328" width="216" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="148" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhập file</text>
      <text x="148" y="376" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dòng «còn hàng»</text>

      <!-- Bước kiểm ở máy chủ -->
      <rect x="320" y="216" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="216" width="224" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="432" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kiểm ở máy chủ</text>
      <text x="432" y="264" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đếm ảnh thật gửi được</text>
      <text x="432" y="280" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(không ảnh mẫu, chưa gỡ)</text>
      <text x="432" y="296" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">so với số tối thiểu của sàn</text>

      <!-- Rẽ -->
      <polygon points="672,192 768,264 672,336 576,264" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="672" y="260" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sàn đã lưu số</text>
      <text x="672" y="276" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">tối thiểu riêng?</text>

      <!-- Sàn đã lưu -->
      <rect x="576" y="72" width="192" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="72" width="192" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="672" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dùng số sàn đã lưu</text>
      <text x="672" y="120" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">0–20 do quản trị sàn đặt</text>
      <text x="672" y="136" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">sàn đã lưu 1 thì giữ 1</text>

      <!-- Sàn chưa lưu — Hỏi-6 -->
      <rect x="576" y="376" width="192" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="376" width="192" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="672" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mặc định mới: 0</text>
      <text x="672" y="424" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">sàn đang chạy lật theo 0</text>
      <text x="672" y="440" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">hay giữ 1? — Hỏi-6</text>

      <!-- Kết cục: thiếu -->
      <rect x="912" y="48" width="232" height="128" rx="20" fill="#f5f5f5"/>
      <rect x="912" y="48" width="232" height="128" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1028" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Từ chối · thiếu ảnh thật</text>
      <text x="1028" y="96" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nút, ô Trạng thái: căn vào «Cần xem»</text>
      <text x="1028" y="112" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nhập file: dòng ở «Chưa đủ để rao»</text>
      <text x="1028" y="128" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lý do ghi «ảnh thật», không mã thô</text>
      <text x="1028" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-2 · AC-3</text>

      <!-- Kết cục: đủ (tâm điểm) -->
      <rect x="912" y="352" width="232" height="144" rx="20" fill="#f5f5f5"/>
      <rect x="912" y="352" width="232" height="144" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1028" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vào «Đang bán»</text>
      <text x="1028" y="400" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đầu khách của sàn thấy căn</text>
      <text x="1028" y="416" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mức đủ 5/6: «Ảnh thật» còn thiếu</text>
      <text x="1028" y="432" fill="#ba4513" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">việc «Bổ sung ảnh» ở Hôm nay</text>
      <text x="1028" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">của đầu chủ giữ căn</text>
      <text x="1028" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-2 · AC-3 · AC-5 · AC-6</text>

      <!-- Chú giải -->
      <line x1="40" y1="536" x2="1144" y2="536" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="132" y="556" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="566" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Cửa vào, kết cục</text>

      <rect x="284" y="556" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="566" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Bước ở máy chủ</text>

      <polygon points="436,562 448,556 460,562 448,568" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="468" y="566" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Rẽ theo cấu hình sàn</text>

      <rect x="612" y="556" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="644" y="566" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Còn chờ người chốt (Hỏi-6)</text>

      <line x1="824" y1="562" x2="852" y2="562" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="860" y="566" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Đường vào Đang bán — tâm điểm</text>
    </svg>
  </div>
</body>
</html>
