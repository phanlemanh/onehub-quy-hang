schema_version: 1
feature_slug: anh-khong-chan-ban
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/listing/status.test.ts ca «số ảnh thật tối thiểu mặc định 0» có mặt và ok — ma trận viết trước: tối thiểu {0,1,2,20} × số ảnh {0, k−1, k} trên căn đủ giá kèm điều kiện phí, pháp lý, tình trạng sử dụng, mã căn: tối thiểu 0 và 0 ảnh → missingFor rỗng (assert), mỗi k ≥ 1 với k−1 ảnh → deepEqual ['realPhoto'], với k ảnh → rỗng (6 assert); MAC_DINH_ANH_THAT_TOI_THIEU === 0 (assert); trong packages/core/src/config ca «điểm 33: 0–20, mặc định 0» — so.ts và hang-so.ts cùng min 0, max 20, macDinh 0 (3 assert) và docCauHinhSanSang trả 0 khi vắng dòng, trả 2 khi dòng 2, về 0 với −1, 21, 1.5 (5 assert). Chiều đỏ: đặt lại macDinh 1 → ca 0 ảnh đỏ với thông điệp nêu 'realPhoto'."
    paths: [packages/core/src/listing/**, packages/core/src/config/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.script.nhap_tac_tu
    expected: "exit 0 (DATABASE_URL tới Postgres dãy G 5573); trong packages/api/test-db/anh-khong-chan-ban.test.ts ca «ba cửa nhận căn 0 ảnh» và packages/api/test-db/imports/lan-nhap.test.ts ca «ảnh không còn chặn ở cửa nhập» (cửa c) có mặt và ok — sàn mới chưa đặt tối thiểu, các căn đủ điều kiện khác, 0 ảnh thật: (a) lệnh status_changed Active như nút «Sẵn sàng bán» gửi, (b) lệnh như gói đồng bộ ô Trạng thái gửi (madeOffline: false và true) → ba căn status Active (3 assert), mỗi căn đúng một sự kiện status_changed tới Active (3 assert), đầu khách của sàn đọc GET /api/v1/listings thấy cả ba (assert đếm 3); (c) một lần nhập file dòng «còn hàng» → lý do dòng không chứa «ảnh thật» (assert) — dòng vẫn ở Incomplete vì cửa nhập chưa đọc pháp lý, tình trạng sử dụng (chủ kho 07/11); ca «tối thiểu 2 thì luật cũ» — PATCH settings listing.ready_min_real_photos = 2, căn 1 ảnh: (a)(b) trả 400 missingRequirement với missing ['realPhoto'] (2 assert), (c) dòng nhập ở Incomplete với reason chứa «ảnh thật» và không chứa 'realPhoto' (2 assert), sàn khác vẫn nhận căn 0 ảnh (assert); ca «sàn đã lưu dòng từ trước» — chèn thẳng dòng company_settings listing.ready_min_real_photos = 1 như sàn đã lưu trước hàng: căn 0 ảnh bị từ chối missing ['realPhoto'] (assert); sàn có dòng cấu hình khác (khoá khác) nhưng vắng khoá này đi theo quyết định Hỏi-6 ghi ở Cổng Phạm vi (assert một chiều đúng theo câu chốt). Chiều đỏ: đưa mặc định về 1 → ca ba cửa đỏ ở cửa (a) với missing realPhoto."
    paths: [packages/api/src/listings/**, packages/api/src/imports/**, packages/core/src/listing/**, packages/core/src/config/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: DATABASE_URL="${DATABASE_URL:-postgres://postgres:quyhang@localhost:5573/postgres}" npm run test:db -w @quy-hang/web
    expected: "exit 0; trong apps/web/src/lib/sync/test-db/san-sang-ban.db-test.mts ca «ô Trạng thái đưa căn 0 ảnh lên Đang bán» có mặt và ok — bộ đồng bộ thật nói với API thật: dungLenhTrangThai cho căn 0 ảnh, gửi → hàng trên máy status Active (assert), Cần xem rỗng (assert), máy chủ có status Active (assert); ca «sàn đặt tối thiểu 1» cùng căn → Cần xem có đúng một mục, lý do chứa «thiếu ảnh thật» (2 assert). Ca sửa hàng loạt (xetDoiTrangThai → gửi) cho hai căn 0 ảnh → cả hai Active, Cần xem rỗng (2 assert). Chiều đỏ: đặt mặc định 1 → ca đầu đỏ, Cần xem có mục."
    paths: [apps/web/src/lib/sync/**, "apps/web/src/app/(app)/inventory/**", packages/api/src/listings/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.script.nhap_tac_tu
    expected: "exit 0; trong packages/api/test-db/anh-khong-chan-ban.test.ts ca «photosCount và mục ảnh của mức đủ» có mặt và ok — căn có 2 ảnh ngăn Gửi được, 1 ảnh Nội bộ, 1 ảnh mẫu, 1 ảnh đã gỡ: GET /api/v1/listings và /{id} cùng photosCount 2 (2 assert); completeness.total 6, 'photos' không trong missing (2 assert); căn 0 ảnh: photosCount 0, missing chứa 'photos' (2 assert); photosCount bằng đúng số mà máy chủ dùng xét Đang bán — sàn đặt tối thiểu 2 thì căn photosCount 2 lên được, căn photosCount 1 bị từ chối (2 assert); bộ khoá của bản xem không có trường nguồn (so tập khoá với danh sách viết trước, assert). Trong packages/core/src/listing/completeness.test.ts ca «mục ảnh» — không truyền ảnh: total 5, COMPLETENESS_ITEMS không có 'photos' (2 assert); truyền {photosCount:0}: total 6, missing chứa 'photos' (2 assert); {photosCount:1}: 'photos' không thiếu (assert). Chiều đỏ: đếm cả ảnh Nội bộ → photosCount 3, assert đầu đỏ."
    paths: [packages/api/src/listings/**, packages/api/src/photos/**, packages/core/src/listing/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trong apps/web các ca «mức đủ có ảnh» có mặt và ok — hồ sơ căn (units/ho-so) với căn 0 ảnh đủ năm mục: mức đủ 5/6, mục thiếu đúng ['Ảnh thật'] (2 assert); cột «Mức đủ» của Bảng hàng (inventory/cot.ts) giá trị 5 trên tổng 6 và nhãn thiếu «Ảnh thật» (2 assert); màn cuộc gọi muc-du hiện «Ảnh thật» thiếu (assert); danh sách hỏi của màn cuộc gọi vẫn deepEqual năm mục mô tả (assert, ca của packages/core danh-sach-hoi giữ nguyên); số đo mucDuCaoNhat của packages/core không đổi trên bộ mẫu (assert ở test core). Chiều đỏ: bỏ truyền photosCount ở hồ sơ → mức đủ 5/5, ca đầu đỏ."
    paths: ["apps/web/src/app/(app)/units/**", "apps/web/src/app/(app)/inventory/**", packages/core/src/listing/**, packages/core/src/metrics/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5b
    criterion: AC-5
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core: ca của danh-sach-hoi.test.ts giữ danh sách hỏi bằng COMPLETENESS_ITEMS năm mục (assert) và ca «mức đủ cao nhất» của metrics so-do.test.ts giữ con số trên bộ mẫu như trước hàng (assert) — cả hai ca có mặt và ok."
    paths: [packages/core/src/listing/**, packages/core/src/metrics/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; trong packages/core/src/today/hang-doi.test.ts ca «Bổ sung ảnh» có mặt và ok — bộ mặc định có nhóm code 'add_photos', nhãn «Bổ sung ảnh», điều kiện [{kind:'missing_photo'}] cộng trạng thái mở, hành động ['open_record'] (4 assert); ma trận viết trước trạng thái {Incomplete, Active, Pending, Hold, Closed, Withdrawn} × photosCount {0, 1}: vào nhóm đúng bốn ô (mở, 0 ảnh) và không vào tám ô còn lại (12 assert); căn chỉ thiếu ảnh không vào 'missing_info' (assert); kiem.ts chấp nhận {kind:'missing_photo'} và từ chối {kind:'missing_photo', x:1} với lỗi nêu khoá lạ (2 assert); bộ nhóm sàn đã lưu không có add_photos thì bộ đọc trả nguyên bộ ấy (deepEqual). Chiều đỏ: đếm photosCount undefined là 0 → căn chưa có số ảnh (máy cũ) vào nhóm, assert đỏ."
    paths: [packages/core/src/today/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trong apps/web/src/app/(app)/today/ly-do.test.ts ca «Bổ sung ảnh cho căn mình giữ» có mặt và ok — Hôm nay của đầu chủ X trên kho mẫu: căn X giữ Active 0 ảnh vào nhóm add_photos (assert), căn X giữ có ảnh không (assert), căn đầu chủ Y giữ 0 ảnh không (assert), căn X giữ Closed 0 ảnh không (assert); cùng căn không nằm ở 'missing_info' khi đủ năm mục (assert)."
    paths: ["apps/web/src/app/(app)/today/**", packages/core/src/today/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6c
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: DATABASE_URL="${DATABASE_URL:-postgres://postgres:quyhang@localhost:5573/postgres}" npm run test:db -w @quy-hang/web
    expected: "exit 0; trong apps/web/src/lib/sync/test-db (tệp của hàng) ca «số ảnh tới máy qua đồng bộ» có mặt và ok — kéo về bằng bộ đồng bộ thật: hàng trên máy có photosCount 0 (assert), Hôm nay dựng từ kho trên máy có căn trong nhóm add_photos (assert), mức đủ 5/6 (assert); tải một ảnh ngăn Gửi được qua API ảnh rồi kéo lại: photosCount 1 (assert), căn rời nhóm add_photos (assert), mức đủ 6/6 (assert); tải thêm một ảnh ngăn Nội bộ: photosCount vẫn 1 (assert). Chiều đỏ: bỏ photosCount khỏi bản lưu trên máy → assert đầu đỏ với thông điệp nêu photosCount."
    paths: [apps/web/src/lib/sync/**, packages/api/src/listings/**, "apps/web/src/app/(app)/today/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trong apps/web/src/app/(app)/units/ready/san-sang.test.ts ca «số tối thiểu của sàn» có mặt và ok — kiemSanSang với tối thiểu 0, căn 0 ảnh đủ điều kiện khác: không có 'Ảnh thật' trong thiếu (assert), sẵn sàng (assert); tối thiểu 2, 1 ảnh: thiếu đúng ['Ảnh thật'] (assert); bamSanSang lúc mất mạng với tối thiểu 0 gửi lệnh, không trả 'can-mang' (assert), với tối thiểu 2 vẫn trả 'can-mang' (assert); hồ sơ đọc tối thiểu từ cấu hình sàn, vắng thì 0 (assert)."
    paths: ["apps/web/src/app/(app)/units/ready/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.script.nhap_tac_tu
    expected: "exit 0; trong packages/api/test-db/anh-khong-chan-ban.test.ts ca «số ảnh tối thiểu qua lối chung» có mặt và ok — GET /api/v1/company/settings của sàn mới trả listing.ready_min_real_photos 0 (assert); quản trị PATCH 0 và 20 → 200 (2 assert); PATCH 21 và −1 → 400 invalidSettings với reason nêu khoảng 0–20 (2 assert); đầu chủ PATCH → 403 adminRequired (assert)."
    paths: [packages/api/src/settings/**, packages/core/src/config/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8b
    criterion: AC-8
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    expected: "Trên màn đang chạy của dãy G (Postgres 5573, máy dev 3493): đăng nhập Quản trị sàn, Cài đặt sàn › Trạng thái có ô «Số ảnh thật tối thiểu để căn vào Đang bán» đang hiện 0, câu nghĩa «0 — căn lên Đang bán khi chưa có ảnh; ảnh hiện là việc cần bổ sung»; đổi 2, lưu → báo đã lưu, tải lại vẫn 2; gõ 21, lưu → câu lỗi nêu khoảng 0–20; đăng nhập Đầu chủ không thấy ô. Hôm nay của Đầu chủ có nhóm «Bổ sung ảnh» với căn 0 ảnh và nút «Mở hồ sơ»; hồ sơ căn đó hiện mức đủ 5/6 với mục «Ảnh thật» còn thiếu; Bảng hàng cột «Mức đủ» của căn hiện 5/6. Chụp mỗi khung ở 1440 và 375 vào _acceptance/anh-khong-chan-ban/evidence/."
    steps:
      - "Dựng chỗ thử dãy G: node _acceptance/anh-khong-chan-ban/thu/dung.mjs — máy dev 3493 đang chạy thì tắt trước bằng --tat; chấm xong tắt bằng --tat (không pkill, luật 8, 43)"
      - "Chạy node _acceptance/anh-khong-chan-ban/thu/chup.mjs --kho 1440 rồi --kho 375 — lệnh tự dựng sàn và căn 0 ảnh, đăng nhập người mẫu, in mỗi khung một dòng JSON và chụp ảnh"
      - "Đối chiếu từng dòng JSON với expected và xem từng ảnh ở hai khổ"
    paths: ["apps/web/src/app/(app)/settings/statuses/**", "apps/web/src/app/(app)/today/**", "apps/web/src/app/(app)/units/**", "apps/web/src/app/(app)/inventory/**"]
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trong apps/web/src/app/s/[code]/trang.test.ts ca «căn không ảnh» có mặt và ok — dựng thẻ căn và chi tiết căn với photos [] không ném (2 assert), có ô ảnh trống (icon thay ảnh) ở cả hai (2 assert); căn có ảnh vẫn hiện ảnh đầu (assert, đối chứng)."
    paths: ["apps/web/src/app/s/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: script
    cmd: config:executors.script.ro_ri
    expected: "exit 0; bộ kiểm rò rỉ (npm run test:ro-ri) xanh và có ca mới «ảnh Nội bộ không ra qua số đếm» — căn có ảnh ngăn Nội bộ gắn chuỗi mồi: dữ liệu trang khách và bản xem không chứa mồi (2 assert, thông điệp nêu trường), ảnh Gửi được vẫn có mặt (đối chứng dương, assert)."
    paths: [packages/core/src/redaction/**, "apps/web/src/app/s/**", packages/api/src/listings/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9c
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.script.nhap_tac_tu
    expected: "exit 0; trong packages/api/test-db/anh-khong-chan-ban.test.ts ca «gửi căn 0 ảnh» có mặt và ok — căn Active 0 ảnh: đầu khách tạo lần gửi có căn ấy → 2xx (assert); đọc dữ liệu trang khách theo mã → có căn (assert), photos là mảng rỗng (assert); đối chứng: căn có một ảnh Gửi được trả đúng một ảnh (assert)."
    paths: [packages/api/src/public/**, packages/api/src/listings/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-5
    executor: script
    cmd: config:executors.design.khuon
    paths: ["design/patterns/cai-dat-san.md", "design/patterns/hom-nay-dau-chu.md", "apps/web/src/app/(app)/settings/statuses/**", "apps/web/src/app/(app)/today/**"]
    expected: "exit 0; bước chấm khuôn không in dòng «lệch:» nào cho tệp thuộc nhóm cai-dat-san và hom-nay-dau-chu."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
