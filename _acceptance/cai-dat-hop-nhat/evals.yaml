schema_version: 1
feature_slug: cai-dat-hop-nhat
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; ma trận viết trước 7 tổ hợp vai (telesales · đầu chủ · đầu khách · trưởng nhóm · quản trị · quản trị + đầu chủ · telesales + đầu chủ) × navigationFor: mọi tổ hợp có cột nhà mang «settings» ở cuối homes, telesales một mình homes rỗng; HOME_LABEL.settings = «Cài đặt»; số assert = 7 + 1; chiều đỏ: bản sao bảng HOMES bỏ «settings» khỏi đầu chủ → ô «đầu chủ» đỏ nêu tên vai."
    paths: ["packages/core/src/navigation.ts", "packages/core/src/navigation.test.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hàm thuần dựng cột Cài đặt (nhóm, mục) gọi với 6 tổ hợp vai × tên sàn mẫu «[Mẫu] Sàn A»: mọi tổ hợp có nhóm «Cá nhân» một mục /settings/personal; chỉ tổ hợp có company_admin có nhóm «Sàn [Mẫu] Sàn A» với đúng bảy mục theo thứ tự Người dùng · Cách gọi · Trường riêng · Trạng thái · Luật chia lead · Thuế phí · Mẫu nhập; số assert = 6; cột thứ hai dựng từ chính hàm này (bài quét mã nguồn second-column.tsx gọi nó); chiều đỏ: bản sao hàm trả nhóm sàn cho đầu chủ → ô đỏ nêu vai."
    paths: ["apps/web/src/components/shell/**", "apps/web/src/app/(app)/settings/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.core
    expected: "exit 0; lối vào Cài đặt theo vai: hàm đích của nhà Cài đặt trả /settings/users cho mọi tổ hợp có company_admin, /settings/personal cho tổ hợp khác (ma trận 6 ô, số assert = 6); TAB_PATH.me = /settings/personal; nhãn tab me giữ «Tôi»; chiều đỏ: bản sao hàm trả /settings/users cho trưởng nhóm → ô đỏ nêu vai."
    paths: ["packages/core/src/navigation.ts", "packages/core/src/navigation.test.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3b
    criterion: AC-3
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hàm mục menu tài khoản theo vai: mọi vai có «Cá nhân» href /settings/personal, chỉ tổ hợp có company_admin có thêm «Cài đặt sàn» href /settings/users (6 tổ hợp, số assert = 6), menu không còn href /me; trang /me chỉ gọi redirect('/settings/personal'); trang /settings chuyển theo hàm đích của lõi (không tự rẽ theo tên vai); hàm chọn tab của người chỉ quản trị (tab settings + me) ma trận 4 đường × 2 tab viết trước: /settings/personal → me sáng, settings tắt · /settings/users → settings sáng, me tắt · /settings/labels → settings sáng · /me → me sáng (số assert = 8); nhãn tab settings = «Cài đặt sàn», nhãn nhà settings = «Cài đặt»; chiều đỏ: bản sao hàm chọn tab so tiền tố /settings → ô /settings/personal đỏ nêu «cả hai tab sáng»."
    paths: ["apps/web/src/components/shell/**", "apps/web/src/app/(app)/me/**", "apps/web/src/app/(app)/settings/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; trang /settings/personal dựng ManToi/ToiThat của me/ (nhập, không chép), đường dẫn đầu màn [Cài đặt, Cá nhân]; nhomDong vẫn trả sáu nhóm theo thứ tự hồ sơ · sàn · cài · thông báo · máy · đăng xuất (bài kiểm hàng 38 giữ xanh); không tệp nào ngoài me/ định nghĩa lại NHAN_NHOM; chiều đỏ: bản sao trang tự dựng danh sách dòng → bài quét đỏ nêu tệp."
    paths: ["apps/web/src/app/(app)/settings/personal/**", "apps/web/src/app/(app)/me/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; hàm chặn mục sàn ở máy chủ (vai, đường) → null hay /settings/personal?chi-quan-tri=1; ma trận viết trước 5 vai không quản trị × 2 đường (/settings/users, /settings/labels) = 10 ô ra /settings/personal?chi-quan-tri=1, và quản trị × 2 đường ra null; số assert = 12; trang Cá nhân có tham số ấy thì dựng câu báo «Mục này chỉ quản trị sàn mở được» (TrangThai báo), không tham số thì không; mọi page.tsx dưới settings/ trừ personal gọi hàm chặn (bài quét liệt kê tệp, không danh sách tay); chiều đỏ: bản sao bỏ lời gọi ở users/page.tsx → bài quét đỏ nêu tệp."
    paths: ["apps/web/src/app/(app)/settings/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; chữ phạm vi rút từ một bảng: mục Cá nhân «Áp cho tài khoản của bạn ở mọi sàn», mục sàn «Chỉ áp cho sàn [Mẫu] Sàn A» khi tên sàn mẫu, đường dẫn [Cài đặt, Sàn [Mẫu] Sàn A, <mục>]; mô tả dòng cài và thông báo chứa «trên máy này», dòng hồ sơ và máy không chứa; chiều đỏ: bảng đổi chữ mục sàn → ô đỏ nêu mục; bài quét: mọi page.tsx dưới settings/ lấy câu phạm vi từ chính bảng ấy (liệt kê tệp bằng máy, không danh sách tay), chiều đỏ: bản sao một trang bỏ lời gọi → bài quét đỏ nêu tệp."
    paths: ["apps/web/src/app/(app)/settings/**", "apps/web/src/app/(app)/me/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

