  - id: E11
    criterion: AC-7
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    steps:
      - "Dựng chỗ thử dãy H: node _acceptance/cai-dat-hop-nhat/thu/dung-h.mjs (Postgres 5574, máy dev 3494; in PID — dừng bằng --tat khi chấm xong, không pkill)"
      - "Chạy node _acceptance/cai-dat-hop-nhat/thu/chay-ui.mjs --ra _acceptance/cai-dat-hop-nhat/evidence — Chrome không đầu, mỗi bước in một dòng JSON và chụp ảnh E11-*.png"
      - "Đối chiếu dòng e11-ca-nhan-1440: duongDan = [Cài đặt, Cá nhân], phamVi = «Áp cho tài khoản của bạn ở mọi sàn», dòng cài và thông báo chứa «trên máy này», beRongThan ≤ 768, lechTrai ≤ 1 (mép trái thân sát vùng nội dung), khoangNhanNut ≤ 768, cot có «Cá nhân» và không có nhóm «Sàn», soLanBam (từ /today qua biểu tượng Cài đặt) ≤ 2; xem ảnh E11-ca-nhan-1440.png"
      - "Đối chiếu e11-doc-1440: với /leads/new (Ô nhận lead), /settings/users (quản trị) và một trang tạm (/settings/labels), mỗi màn beRongThan ≤ 768 và lechTrai ≤ 1; xem ba ảnh E11-doc-*.png"
      - "Đối chiếu e11-quan-tri-1440 (tài khoản quản trị mẫu: biểu tượng Cài đặt mở /settings/users, cột có «Cá nhân» và «Sàn [Mẫu]…» bảy mục, đầu màn «Chỉ áp cho sàn …»), e11-chan (đầu chủ mở /settings/users về /settings/personal, câu báo «Mục này chỉ quản trị sàn mở được»), e11-menu (đầu chủ: menu tài khoản chỉ «Cá nhân», soLanBam ≤ 2; quản trị: menu có «Cá nhân» và «Cài đặt sàn», tới /settings/users soLanBam ≤ 2); xem ảnh tương ứng"
      - "Đối chiếu e11-dien-thoai-390: tab «Tôi» đang chọn ở /settings/personal, sáu nhóm dòng, beRongThan = bề rộng màn trừ lề; e11-quan-tri-390: người chỉ quản trị có tab «Cài đặt sàn» và «Tôi», ở /settings/personal chỉ «Tôi» sáng, ở /settings/users chỉ «Cài đặt sàn» sáng; xem ảnh E11-dien-thoai-390.png và E11-quan-tri-390-*.png"
    expected: "Trên máy tính 1440×900 với đầu chủ mẫu: biểu tượng Cài đặt ở đáy cột nhà mở «Cá nhân», đường dẫn «Cài đặt › Cá nhân», sáu nhóm dòng, thân không rộng quá 768px và sát cột mục lục, cột chỉ nhóm «Cá nhân»; với quản trị mẫu: biểu tượng mở Người dùng, cột có hai nhóm; đầu chủ gõ /settings/users về Cá nhân; menu tài khoản «Cá nhân» mở Cá nhân; trên điện thoại 390×844 tab «Tôi» mở Cá nhân và đang chọn; mỗi cảnh một ảnh."
