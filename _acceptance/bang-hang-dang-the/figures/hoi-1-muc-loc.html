    <h1>Ngăn lọc theo nhu cầu: năm mục hay chín mục</h1>
    <p class="subtitle">Năm mục (khuyến nghị) đúng bằng các trường thẻ căn trình, nên lọc xong là kiểm được bằng mắt trên danh sách. Chín mục thêm Nội thất, Pháp lý, Tầng, Tình trạng sử dụng — bốn mục không hiện trên thẻ.</p>
