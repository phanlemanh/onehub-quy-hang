<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 bản xem trước</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Cây quyết định · Hỏi-1 · AC-10</p>
    <h1>Bản xem trước có nhận khoá thật không?</h1>
    <p class="subtitle">Bản xem trước của Vercel dùng chung cơ sở dữ liệu thật và chạy mã của mọi nhánh. Câu này chỉ chủ kho quyết: nó là cam kết ra ngoài kho.</p>
    <svg viewBox="0 0 1000 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1 bản xem trước</title>
      <desc id="d">Gốc: bản xem trước của Vercel có nhận khoá số chủ thật không. Nhánh 1, máy khuyên: không, chỉ bản thật; bản xem trước không dựng API, mất gần như không gì vì bản xem trước chưa đăng nhập được; mã nhánh chưa duyệt không đọc được số. Nhánh 2: có, bản xem trước cùng khoá; bản xem trước chạy đủ, đổi lại mọi nhánh đọc được số chủ thật khi có dữ liệu thật.</desc>

<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
      <rect width="1000" height="472" fill="#f5f5f5"/>

<line x1="280" y1="220" x2="280" y2="240" stroke="#4f5d75" stroke-width="1"/>

<line x1="720" y1="220" x2="720" y2="240" stroke="#4f5d75" stroke-width="1"/>
<rect x="260" y="32" width="480" height="72" rx="6" fill="#f5f5f5"/><rect x="260" y="32" width="480" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="500" y="60" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản xem trước của Vercel có nhận khoá số chủ thật?</text>
<text x="500" y="80" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">OWNER_PHONE_KEY</text>

<text x="92" y="178" fill="#ba4513" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">NHÁNH 1 · MÁY KHUYÊN</text>
<text x="280" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không — chỉ bản thật</text>
<text x="280" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Production</text>
<rect x="80" y="240" width="400" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
<text x="96" y="264" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">ĐƯỢC</text>
<text x="96" y="284" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">· Mã nhánh chưa duyệt không đọc được số chủ</text>
<text x="96" y="300" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">· Khoá chỉ ở một nơi</text>
<text x="96" y="328" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">ĐỔI LẠI</text>
<text x="96" y="348" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">· Bản xem trước không dựng máy chủ API</text>
<text x="96" y="364" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">· Mất gần như không gì: bản xem trước</text>
<text x="104" y="380" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">chưa đăng nhập được (ADR-0009)</text>

<text x="532" y="178" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">NHÁNH 2</text>
<text x="720" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có — bản xem trước cùng khoá</text>
<text x="720" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Preview + Production</text>
<rect x="520" y="240" width="400" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
<text x="536" y="264" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">ĐƯỢC</text>
<text x="536" y="284" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">· Bản xem trước chạy đủ</text>
<text x="536" y="312" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">ĐỔI LẠI</text>
<text x="536" y="332" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">· Mọi nhánh, kể cả mã chưa duyệt, chạy trên</text>
<text x="544" y="348" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">cơ sở dữ liệu thật đọc được số chủ</text>
<text x="544" y="364" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">khi có dữ liệu thật</text>
<line x1="32" y1="424" x2="968" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="32" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">CHÚ GIẢI</text>
<rect x="112" y="436" width="28" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
<text x="148" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh máy khuyên</text>
<rect x="272" y="436" width="28" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="308" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh khác</text>
<text x="408" y="448" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start"></text>
    </svg>
  </main>
</body>
</html>
