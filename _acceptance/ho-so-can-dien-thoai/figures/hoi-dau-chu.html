<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi đầu chủ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Lora',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .frame { max-width:720px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.25; margin-bottom:0.35rem; }
    .subtitle { color:var(--color-muted); font-size:0.9rem; line-height:1.5; margin-bottom:1.25rem; max-width:72ch; }
    svg { width:100%; display:block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sơ đồ luồng · Hỏi-1 · AC-4, AC-5</p>
    <h1>Chạm «Hỏi đầu chủ» thì điều gì xảy ra</h1>
    <p class="subtitle">Từ hồ sơ căn trên điện thoại, Đầu khách chạm nút hỏi. Máy có bảng chia sẻ thì mở bảng chia sẻ với tin soạn sẵn (cam); không có thì chép tin; căn chưa ai giữ thì nút mờ. Ở mọi lối, người tự chọn người nhận và tự bấm gửi.</p>
    <svg viewBox="0 0 720 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1: chạm nút hỏi đầu chủ làm gì</title>
      <desc id="d">Hồ sơ căn của Đầu khách, chạm nút «Hỏi đầu chủ · tên», rẽ ba lối. Máy có bảng chia sẻ: bảng chia sẻ của máy mở với tin «Hỏi về căn A-04.06 · Toà A» kèm đường hồ sơ, người chọn Zalo và chọn đầu chủ, người bấm Gửi. Máy không có bảng chia sẻ: chép tin, báo «Đã chép tin hỏi», người dán vào ứng dụng nhắn tin. Căn chưa ai giữ: nút mờ «Căn chưa có đầu chủ giữ». Không gửi gì tự động; tin không chở tên, số chủ nhà.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="720" height="656" fill="#f5f5f5"/>

      <!-- Connectors (drawn before boxes) -->
      <path d="M360,72 L360,110" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- (a) có bảng chia sẻ -->
      <path d="M288,176 L288,200 Q288,208 280,208 L144,208 Q136,208 136,216 L136,262" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="144" y="224" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="192" y="236" fill="#ba4513" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ BẢNG CHIA SẺ</text>
      <!-- (b) không bảng chia sẻ -->
      <path d="M360,176 L360,262" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="224" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="424" y="236" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG BẢNG CHIA SẺ</text>
      <!-- (c) căn chưa ai giữ -->
      <path d="M432,176 L432,200 Q432,208 440,208 L576,208 Q584,208 584,216 L584,262" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="592" y="224" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="640" y="236" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CĂN CHƯA AI GIỮ</text>
      <!-- row 1 → row 2 -->
      <path d="M136,344 L136,382" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M360,344 L360,382" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- row 2 → row 3 -->
      <path d="M136,448 L136,486" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- annotation leader -->
      <path d="M240,512 L260,512" fill="none" stroke="#636b80" stroke-width="0.8" stroke-dasharray="2,2"/>

      <!-- Start -->
      <rect x="232" y="24" width="256" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="232" y="24" width="256" height="48" rx="24" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ căn (Đầu khách)</text>

      <!-- Tap -->
      <rect x="216" y="112" width="288" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="112" width="288" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chạm «Hỏi đầu chủ · &lt;tên&gt;»</text>
      <text x="360" y="158" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nút dính đáy hồ sơ</text>

      <!-- (a) row 1 -->
      <rect x="32" y="264" width="208" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="264" width="208" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="290" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bảng chia sẻ của máy</text>
      <text x="136" y="310" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tin «Hỏi về căn A-04.06 · Toà A»</text>
      <text x="136" y="326" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">+ đường hồ sơ</text>

      <!-- (b) row 1 -->
      <rect x="256" y="264" width="208" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="264" width="208" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chép tin</text>
      <text x="360" y="318" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">báo «Đã chép tin hỏi»</text>

      <!-- (c) row 1 — end -->
      <rect x="480" y="264" width="208" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="264" width="208" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="584" y="298" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nút mờ</text>
      <text x="584" y="318" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Căn chưa có đầu chủ giữ»</text>

      <!-- (a) row 2 -->
      <rect x="32" y="384" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="384" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="136" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người chọn Zalo,</text>
      <text x="136" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chọn đầu chủ</text>

      <!-- (b) row 2 — end -->
      <rect x="256" y="384" width="208" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="256" y="384" width="208" height="64" rx="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người dán vào</text>
      <text x="360" y="430" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ứng dụng nhắn tin</text>

      <!-- (a) row 3 — end, focal -->
      <rect x="32" y="488" width="208" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="32" y="488" width="208" height="48" rx="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="136" y="516" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Người bấm Gửi</text>

      <!-- Annotations -->
      <text x="268" y="516" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="start">không gửi gì tự động</text>
      <text x="488" y="384" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="start">Tin ở hai lối đầu</text>
      <text x="488" y="404" fill="#4f5d75" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="start">không chở tên, số chủ nhà</text>

      <!-- Legend -->
      <line x1="32" y1="584" x2="688" y2="584" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="616" fill="#4f5d75" font-size="9" letter-spacing="0.14em" font-family="'Geist Mono', monospace" text-anchor="start">CHÚ GIẢI</text>
      <path d="M112,612 L144,612" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="156" y="616" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">lối suôn sẻ</text>
      <rect x="240" y="604" width="40" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="616" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">điểm ra — người làm</text>
      <rect x="432" y="604" width="40" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="484" y="616" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">nút không bấm được</text>
    </svg>
  </main>
</body>
</html>
