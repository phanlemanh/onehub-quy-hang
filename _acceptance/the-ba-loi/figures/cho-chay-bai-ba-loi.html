<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỏi-1 chỗ chạy bài ba lối</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Luồng · Hỏi-1 · AC-5 · AC-6 · AC-7 · AC-9</p>
    <h1>Bài «bỏ bước phân kỳ thì đỏ» chạy ở đâu?</h1>
    <p class="subtitle">Chỉ ô chưa có khuôn mới cần trang ba lối. Trang đi qua năm bước của vòng; câu hỏi là bài kiểm đặt ở bước chấm hay thêm vào CI.</p>
    <svg viewBox="0 0 1200 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Hỏi-1 chỗ chạy bài ba lối</title>
      <desc id="d">Vòng giao diện mở. Hỏi: có ô chưa có khuôn không (nhóm mới, đổi khối đích, chỗ hở mới). Không: đi khuôn sẵn, không cần trang. Có: dựng trang ba lối, gửi kèm thẻ Cổng Phạm vi, rồi bước chấm. Hỏi-1 có hai nhánh: khuyên chạy ở bước chấm của vòng kèm lint bắt trang đã mở mà thiếu hay sai; lối khác là thêm bước CI so nhánh gốc mỗi PR, chậm hơn và phải sửa ci.yml.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1200" height="472" fill="#f5f5f5"/>

      <!-- ===== Connectors (drawn before boxes) ===== -->
      <!-- Mở vòng → hỏi -->
      <line x1="176" y1="120" x2="214" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Có → dựng trang -->
      <line x1="408" y1="120" x2="454" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="420" y="100" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="432" y="109" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CÓ</text>
      <!-- Không → khuôn sẵn -->
      <line x1="312" y1="184" x2="312" y2="230" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="320" y="200" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="324" y="209" fill="#636b80" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">KHÔNG</text>
      <!-- Dựng trang → gửi thẻ -->
      <line x1="696" y1="120" x2="734" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Gửi thẻ → bước chấm -->
      <line x1="936" y1="120" x2="974" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Hỏi-1 nhánh 1 (khuyên) -->
      <path d="M 1040 156 L 1040 200 Q 1040 208 1032 208 L 654 208 Q 646 208 646 216 L 646 278" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="816" y="188" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="197" fill="#ba4513" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHUYÊN</text>
      <!-- Hỏi-1 nhánh 2 -->
      <path d="M 1104 156 L 1104 224 Q 1104 232 1096 232 L 1032 232 Q 1024 232 1024 240 L 1024 278" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- ===== Nodes ===== -->
      <!-- Mở vòng (oval) -->
      <rect x="32" y="92" width="144" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="32" y="92" width="144" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="104" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vòng giao diện mở</text>

      <!-- Hỏi: ô chưa có khuôn (diamond) -->
      <text x="312" y="44" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">nhóm mới · đổi khối đích · chỗ hở mới</text>
      <polygon points="312,56 408,120 312,184 216,120" fill="#f5f5f5"/>
      <polygon points="312,56 408,120 312,184 216,120" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Có ô chưa</text>
      <text x="312" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">có khuôn?</text>

      <!-- Khuôn sẵn (oval kết) -->
      <rect x="200" y="232" width="224" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="200" y="232" width="224" height="56" rx="20" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="312" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đi khuôn sẵn</text>
      <text x="312" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">không cần trang</text>

      <!-- Dựng trang ba lối -->
      <rect x="456" y="84" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="84" width="240" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="576" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dựng trang ba lối</text>
      <text x="576" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--ba-loi → chụp 6 ảnh</text>
      <text x="576" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ điền chữ → --dung-ba-loi</text>

      <!-- Gửi kèm thẻ -->
      <rect x="736" y="84" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="736" y="84" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="836" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gửi kèm thẻ</text>
      <text x="836" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cổng Phạm vi</text>

      <!-- Bước chấm -->
      <rect x="976" y="84" width="192" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="976" y="84" width="192" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1072" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bước chấm</text>
      <text x="1072" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">--kiem-ba-loi</text>

      <!-- Hỏi-1 nhãn -->
      <text x="456" y="264" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">HỎI-1 · CHẠY Ở ĐÂU</text>

      <!-- Nhánh 1 · khuyên -->
      <rect x="456" y="280" width="380" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="280" width="380" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="472" y="300" fill="#ba4513" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">NHÁNH 1 · KHUYÊN</text>
      <text x="646" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bước chấm của vòng</text>
      <text x="646" y="348" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">+ lint bắt trang đã mở mà thiếu hay sai</text>

      <!-- Nhánh 2 · lối khác -->
      <rect x="880" y="280" width="288" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="280" width="288" height="96" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="896" y="300" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.12em">NHÁNH 2 · LỐI KHÁC</text>
      <text x="1024" y="328" fill="#2d3142" font-size="12" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">Thêm bước CI mỗi PR</text>
      <text x="1024" y="348" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">so nhánh gốc · chậm hơn</text>
      <text x="1024" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sửa ci.yml</text>

      <!-- ===== Legend ===== -->
      <line x1="32" y1="416" x2="1168" y2="416" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="32" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="112" y="432" width="28" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="148" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh khuyên</text>
      <rect x="264" y="432" width="28" height="16" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="300" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Lối khác</text>
      <polygon points="416,432 424,440 416,448 408,440" fill="none" stroke="#2d3142" stroke-width="1"/>
      <text x="436" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Câu hỏi rẽ nhánh</text>
      <rect x="560" y="432" width="28" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="596" y="444" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Đầu / cuối luồng</text>
    </svg>
  </main>
</body>
</html>
