  - id: E9b
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.web_db
    expected: "exit 0; bộ đồng bộ của màn trên Postgres dãy (apps/web/src/lib/sync/test-db) xanh trọn sau migration 046, trong đó ca «đồng bộ: đổi giá căn Đã bán vào Cần xem» (doi-gia-da-ban.db-test.mts — đỏ ở lượt đo S1) có mặt và ok. Chiều đỏ: bỏ vai Bảng hàng vừa thêm cho người tạo hàng trong bài → ca đỏ 404."
    paths: [packages/db/migrations/046_*, packages/api/src/listings/**, apps/web/src/lib/sync/test-db/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9c
    criterion: AC-9
    executor: test
    cmd: config:executors.test.isolation
    expected: "exit 0; ca «bảng quyền: bài có sẵn chỉ thêm vai, không đổi điều bài kiểm» có mặt và ok trong packages/api/test-db/bang-quyen-theo-vai/ — với từng tệp trong danh sách sáu tệp Q-3 (đọc từ một hằng trong bài), git diff của tệp so với merge-base của nhánh chính: mọi dòng bị bỏ nằm trong danh sách được duyệt của tệp (dòng kỳ vọng «vai lúc làm» của listings.test.ts, dòng vai người chốt bán của bài đồng bộ; ở owners.test.ts và goi-ep-gia-dot-hai.test.ts chỉ các dòng kỳ vọng 403/200 của ca Telesales, Quản trị sàn — giám sát duyệt Q-0511-3), mọi dòng thêm chứa listing_agent hoặc buyer_agent, hoặc là kỳ vọng 404 not-found của ca Telesales, Quản trị sàn, hoặc là chú thích (assert mỗi tệp), số lời gọi assert. trong tệp sau ≥ trước (assert mỗi tệp), không dòng thêm nào chứa team_lead (assert mỗi tệp); tệp ngoài danh sách dưới packages/api/test-db (trừ thư mục bang-quyen-theo-vai) không đổi so với merge-base (assert). Đường gốc kho suy từ vị trí bài. Chiều đỏ: xoá một assert trong bản sao listings.test.ts → ca đỏ nêu tên tệp."
    paths: [packages/api/test-db/**, apps/web/src/lib/sync/test-db/**]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2b
    criterion: AC-2
    executor: judgment
    inputs: ["apps/web/src/app/(app)/inventory/page.tsx"]
    question: "Trong tệp trang Bảng hàng này, người đã đăng nhập mà không có vai nào trong ba vai của Bảng hàng (Đầu chủ, Đầu khách, Trưởng nhóm) có bị đưa về /today trước khi trang dựng bảng không, và quyết định ấy có đọc từ hàm của lõi (lamViecVoiHang) thay vì so tên vai tại chỗ không? Người có một trong ba vai có còn đi tiếp tới bảng như trước không?"
    expected: "PASS khi có nhánh redirect('/today') dựa trên lamViecVoiHang của @quy-hang/core/access đặt trước khi trả KhungBangHang, và không đổi phần còn lại của trang."
    paths: ["apps/web/src/app/(app)/inventory/page.tsx"]
    evidence_required: [run_id, verdict, verified_at]

