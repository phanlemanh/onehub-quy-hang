<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng mở số lead</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1440px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sơ đồ luồng · AC-1, AC-2, AC-5</p>
    <h1>Mở số của lead: ba chỗ rẽ chờ chủ kho chốt</h1>
    <p class="subtitle">Máy chủ chỉ trả số khi người bấm là đầu chủ đang được giao và lead còn trong việc; mỗi lần mở ghi đúng một vết. Nét liền là nhánh khuyến nghị, nét đứt là nhánh khác.</p>
    <svg viewBox="0 0 1504 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Luồng mở số lead</title>
      <desc id="d">Đầu chủ bấm Mở số trên dòng lead ở Hôm nay. Hỏi-1: máy chủ kiểm người bấm có phải đầu chủ đang được giao và lead còn trong việc; không đạt thì từ chối, không ghi vết; nhánh khác: trưởng nhóm cùng sàn cũng mở. Hỏi-3: lead căn trùng (tin bổ sung cho căn đang rao, người nhận là đầu chủ giữ căn); khuyến nghị không mở vì đầu chủ đã có số chủ của căn qua Mở số căn, đi về Từ chối; nhánh khác: mở được, mỗi lần một vết. Không trùng thì ghi một vết gồm người, vai, lúc, rồi trả số. Hỏi-2: mở số có đổi nấc lead không; khuyến nghị không đổi: dòng hiện số kèm nút Gọi mở ứng dụng gọi của máy, đầu chủ tự bấm Nhận hoặc Đã gọi; nhánh khác: máy tự ghi Đã nhận.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2d3142"/></marker>
      </defs>
      <rect width="1504" height="452" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước hộp) ===== -->
      <!-- Bắt đầu → Hỏi-1 -->
      <line x1="152" y1="200" x2="174" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Hỏi-1 khuyến nghị: chỉ đầu chủ được giao → Hỏi-3 (nét liền) -->
      <line x1="368" y1="200" x2="510" y2="200" stroke="#2d3142" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
      <rect x="376" y="160" width="128" height="32" rx="2" fill="#f5f5f5"/>
      <text x="440" y="172" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYẾN NGHỊ</text>
      <text x="440" y="186" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">chỉ đầu chủ được giao</text>

      <!-- Hỏi-1 nhánh khác: trưởng nhóm cùng sàn cũng mở (nét đứt) -->
      <path d="M 272 136 V 80 Q 272 72 280 72 H 848 Q 856 72 856 80 V 170" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="340" y="36" width="168" height="28" rx="2" fill="#f5f5f5"/>
      <text x="424" y="46" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH KHÁC</text>
      <text x="424" y="60" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trưởng nhóm cùng sàn cũng mở</text>

      <!-- Hỏi-1 không đạt → Từ chối -->
      <line x1="272" y1="264" x2="272" y2="310" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="280" y="278" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="310" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG ĐẠT</text>

      <!-- Hỏi-3 khuyến nghị: trùng → không mở → Từ chối (nét liền) -->
      <path d="M 600 264 V 332 Q 600 340 592 340 H 354" fill="none" stroke="#2d3142" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
      <rect x="372" y="288" width="208" height="44" rx="2" fill="#f5f5f5"/>
      <text x="476" y="298" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYẾN NGHỊ · TRÙNG</text>
      <text x="476" y="312" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">không mở — đầu chủ đã có số chủ</text>
      <text x="476" y="326" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">của căn qua «Mở số căn»</text>

      <!-- Hỏi-3 nhánh khác: trùng vẫn mở, mỗi lần một vết (nét đứt) -->
      <path d="M 600 136 V 120 Q 600 112 608 112 H 800 Q 808 112 808 120 V 170" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="620" y="80" width="168" height="24" rx="2" fill="#f5f5f5"/>
      <text x="704" y="89" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NHÁNH KHÁC · TRÙNG</text>
      <text x="704" y="102" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">mở được, mỗi lần một vết</text>

      <!-- Hỏi-3 không trùng → Ghi vết -->
      <line x1="688" y1="200" x2="766" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="696" y="178" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG TRÙNG</text>

      <!-- Ghi vết → Trả số → Hỏi-2 -->
      <line x1="896" y1="200" x2="918" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1032" y1="200" x2="1054" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Hỏi-2 khuyến nghị: không đổi nấc lead → Dòng hiện số (nét liền) -->
      <line x1="1216" y1="200" x2="1342" y2="200" stroke="#2d3142" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
      <rect x="1224" y="160" width="112" height="32" rx="2" fill="#f5f5f5"/>
      <text x="1280" y="172" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KHUYẾN NGHỊ</text>
      <text x="1280" y="186" fill="#2d3142" font-size="10" font-weight="500" font-family="'Geist', sans-serif" text-anchor="middle">không đổi nấc lead</text>

      <!-- Hỏi-2 nhánh khác: tự ghi Đã nhận (nét đứt) -->
      <line x1="1136" y1="256" x2="1136" y2="310" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="1144" y="278" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1176" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NHÁNH KHÁC</text>

      <!-- Dòng hiện số → Đầu chủ tự bấm -->
      <line x1="1412" y1="236" x2="1412" y2="310" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Hộp ===== -->
      <!-- Bắt đầu -->
      <rect x="24" y="164" width="128" height="72" rx="20" fill="#f5f5f5"/>
      <rect x="24" y="164" width="128" height="72" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="88" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đầu chủ bấm</text>
      <text x="88" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Mở số»</text>
      <text x="88" y="222" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">dòng lead ở Hôm nay</text>

      <!-- Hỏi-1: máy chủ kiểm -->
      <polygon points="272,136 368,200 272,264 176,200" fill="#f5f5f5"/>
      <polygon points="272,136 368,200 272,264 176,200" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="272" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy chủ kiểm</text>
      <text x="272" y="202" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đầu chủ đang được giao?</text>
      <text x="272" y="216" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">lead còn trong việc?</text>
      <rect x="196" y="112" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
      <text x="220" y="123" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HỎI-1</text>

      <!-- Hỏi-3: lead căn trùng? -->
      <polygon points="600,136 688,200 600,264 512,200" fill="#f5f5f5"/>
      <polygon points="600,136 688,200 600,264 512,200" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="600" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead căn trùng?</text>
      <text x="600" y="208" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">tin bổ sung cho</text>
      <text x="600" y="222" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">căn đang rao</text>
      <rect x="528" y="112" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
      <text x="552" y="123" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HỎI-3</text>

      <!-- Từ chối -->
      <rect x="192" y="312" width="160" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="192" y="312" width="160" height="56" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="272" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Từ chối</text>
      <text x="272" y="352" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">không ghi vết</text>

      <!-- Ghi một vết -->
      <rect x="768" y="172" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="172" width="128" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="832" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi một vết</text>
      <text x="832" y="212" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">người · vai · lúc</text>

      <!-- Trả số -->
      <rect x="920" y="172" width="112" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="172" width="112" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="976" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trả số</text>
      <text x="976" y="212" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">cho người bấm</text>

      <!-- Hỏi-2: có đổi nấc lead? -->
      <polygon points="1136,144 1216,200 1136,256 1056,200" fill="#f5f5f5"/>
      <polygon points="1136,144 1216,200 1136,256 1056,200" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="1136" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở số có</text>
      <text x="1136" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">đổi nấc lead?</text>
      <rect x="1060" y="120" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
      <text x="1084" y="131" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HỎI-2</text>

      <!-- Máy tự ghi Đã nhận (nhánh khác) -->
      <rect x="1052" y="312" width="168" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="1052" y="312" width="168" height="56" rx="6" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="1136" y="336" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Máy tự ghi «Đã nhận»</text>
      <text x="1136" y="352" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đầu chủ khỏi bấm «Nhận»</text>

      <!-- Dòng hiện số + nút Gọi -->
      <rect x="1344" y="164" width="136" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1344" y="164" width="136" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1412" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dòng hiện số</text>
      <text x="1412" y="204" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">nút «Gọi» mở</text>
      <text x="1412" y="218" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">ứng dụng gọi của máy</text>

      <!-- Đầu chủ tự bấm -->
      <rect x="1344" y="312" width="136" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="1344" y="312" width="136" height="56" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1412" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đầu chủ tự bấm</text>
      <text x="1412" y="352" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">«Nhận» · «Đã gọi»</text>

      <!-- ===== Chú giải ===== -->
      <line x1="24" y1="400" x2="1480" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.14em">CHÚ GIẢI</text>
      <line x1="104" y1="424" x2="136" y2="424" stroke="#2d3142" stroke-width="1.6" marker-end="url(#arrow-ink)"/>
      <text x="148" y="428" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh khuyến nghị</text>
      <line x1="268" y1="424" x2="300" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="312" y="428" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Nhánh khác</text>
      <polygon points="420,416 432,424 420,432 408,424" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="444" y="428" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Điểm rẽ chờ chủ kho chốt</text>
      <rect x="600" y="416" width="28" height="16" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="428" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Bước của máy</text>
      <rect x="740" y="416" width="28" height="16" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="780" y="428" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">Bắt đầu / kết thúc</text>
    </svg>
  </main>
</body>
</html>
