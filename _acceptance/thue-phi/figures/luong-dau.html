<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dấu định nghĩa thuế phí</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Lora', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .frame { max-width: 1184px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Dấu định nghĩa thuế phí</p>
    <h1>Năm lối ghi giá đổ về một chỗ: giá bao phí được đóng dấu định nghĩa của sàn lúc ấy</h1>

    <svg viewBox="0 0 1184 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Năm lối ghi giá — sửa trên ô ở Bảng hàng, màn cuộc gọi, nhập file, hoàn tác lần nhập, đồng bộ khi có mạng lại — cùng đổ vào sự kiện giá vào máy chủ. Giá bao phí được đóng dấu định nghĩa của sàn lúc ấy, đọc từ Cài đặt › Thuế phí; giá không bao phí không có dấu. Dấu tới hồ sơ căn và lối đọc dấu. Giá ghi trước 06/11 rẽ hai theo Hỏi-3: điền dấu mặc định (khuyến nghị) hoặc dấu không ghi định nghĩa.">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Mũi tên (vẽ trước hộp) ===== -->
      <!-- Năm lối → Sự kiện giá -->
      <path d="M240 116 H288 A8 8 0 0 1 296 124 V188 A8 8 0 0 0 304 196 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M240 172 H264 A8 8 0 0 1 272 180 V204 A8 8 0 0 0 280 212 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="228" x2="320" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M240 284 H264 A8 8 0 0 0 272 276 V252 A8 8 0 0 1 280 244 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M240 340 H288 A8 8 0 0 0 296 332 V268 A8 8 0 0 1 304 260 H320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Sự kiện giá → Đóng dấu (giá bao phí) -->
      <line x1="520" y1="212" x2="616" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Sự kiện giá → Không dấu (không bao phí) -->
      <path d="M520 244 H552 A8 8 0 0 1 560 252 V324 A8 8 0 0 0 568 332 H616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Cài đặt → Đóng dấu (đọc thêm) -->
      <line x1="756" y1="96" x2="756" y2="180" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Đóng dấu → hai chỗ xem -->
      <path d="M896 204 H916 A8 8 0 0 0 924 196 V180 A8 8 0 0 1 932 172 H968" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M896 252 H916 A8 8 0 0 1 924 260 V276 A8 8 0 0 0 932 284 H968" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Giá cũ → Hỏi-3 → a / b -->
      <line x1="240" y1="504" x2="320" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="504" x2="616" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420 552 V584 A8 8 0 0 0 428 592 H616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nhãn mũi tên ===== -->
      <rect x="528" y="188" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="197" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIÁ BAO PHÍ</text>

      <rect x="456" y="288" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">KHÔNG BAO PHÍ</text>

      <rect x="764" y="132" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="768" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐỌC</text>

      <rect x="560" y="484" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">A</text>

      <rect x="512" y="572" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="581" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">B</text>

      <!-- ===== Hộp ===== -->
      <text x="40" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NĂM LỐI GHI GIÁ</text>

      <!-- Năm lối -->
      <rect x="40" y="96" width="200" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="96" width="200" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sửa trên ô ở Bảng hàng</text>

      <rect x="40" y="152" width="200" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="152" width="200" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Màn cuộc gọi</text>

      <rect x="40" y="208" width="200" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="200" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nhập file</text>

      <rect x="40" y="264" width="200" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="264" width="200" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hoàn tác lần nhập</text>

      <rect x="40" y="320" width="200" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="320" width="200" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đồng bộ khi có mạng lại</text>

      <!-- Sự kiện giá vào máy chủ -->
      <rect x="320" y="180" width="200" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="180" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sự kiện giá vào máy chủ</text>
      <text x="420" y="244" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">một chỗ cho cả năm lối</text>

      <!-- Cài đặt › Thuế phí -->
      <rect x="616" y="40" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="40" width="280" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="756" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cài đặt › Thuế phí</text>
      <text x="756" y="82" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">quản trị sàn đặt</text>

      <!-- Đóng dấu (tâm điểm) -->
      <rect x="616" y="180" width="280" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="180" width="280" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="756" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đóng dấu định nghĩa của sàn lúc ấy</text>
      <text x="756" y="236" fill="#ba4513" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khoản nào, tỉ lệ, ngày</text>
      <text x="756" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-4</text>

      <!-- Không dấu -->
      <rect x="616" y="312" width="280" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="312" width="280" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="756" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Không dấu</text>

      <!-- Hai chỗ xem -->
      <text x="968" y="128" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHỖ XEM DẤU</text>

      <rect x="968" y="140" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="968" y="140" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1056" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hồ sơ căn</text>
      <text x="1056" y="178" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Tính theo định nghĩa ngày …</text>
      <text x="1056" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-7</text>

      <rect x="968" y="252" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="968" y="252" width="176" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="1056" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lối đọc dấu</text>
      <text x="1056" y="290" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đọc lại dấu của mỗi giá</text>
      <text x="1056" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-7</text>

      <!-- Ghi chú biên -->
      <text x="40" y="396" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif">Máy tính cuộc gọi sửa môi giới cho một lần tính — không vào dấu.</text>

      <!-- ===== Nhánh giá cũ ===== -->
      <line x1="40" y1="424" x2="1144" y2="424" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">GIÁ CŨ · HỎI-3</text>

      <rect x="40" y="476" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="476" width="200" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="140" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Giá ghi trước 06/11</text>
      <text x="140" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AC-5</text>

      <polygon points="420,456 520,504 420,552 320,504" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="420" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hỏi-3</text>
      <text x="420" y="516" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">giá cũ mang dấu gì?</text>

      <rect x="616" y="476" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="476" width="280" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="756" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a · Điền dấu mặc định</text>
      <text x="756" y="518" fill="#ba4513" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">khuyến nghị</text>

      <rect x="616" y="564" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="564" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="756" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">b · Dấu “không ghi định nghĩa”</text>
      <text x="756" y="606" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">giá cũ không có về tay theo dấu</text>

      <!-- ===== Chú giải ===== -->
      <line x1="40" y1="652" x2="1144" y2="652" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="680" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI</text>

      <rect x="132" y="670" width="24" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="164" y="680" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Lối ghi, chỗ xem</text>

      <rect x="292" y="670" width="24" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="324" y="680" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Điểm chốt: dấu ở máy chủ · lối máy khuyên</text>

      <polygon points="568,676 580,670 592,676 580,682" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="600" y="680" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Câu hỏi ở Cổng Phạm vi</text>

      <line x1="760" y1="676" x2="788" y2="676" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="796" y="680" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">Đọc thêm, không ghi</text>
    </svg>
  </div>
</body>
</html>
