schema_version: 1
feature_slug: vong-giao-dien-qua-ban-do
# Dựng chung cho eval ui-check (gọi là «DỰNG A» trong steps):
#   docker run --rm -d --name quy-hang-db-A -e POSTGRES_PASSWORD=quyhang -p 5552:5432 postgres:16 (đã chạy thì bỏ qua)
#   export DATABASE_URL=postgres://postgres:quyhang@localhost:5552/postgres && npm run db:migrate
#   node _acceptance/vo-ung-dung/thu/vai-mau.mjs  → người mẫu *@example.test: quan-tri@ quản trị Sàn mẫu A; dau-chu@
#   Đầu chủ Sàn mẫu A (không phải quản trị)
#   máy chủ dev cấu hình `web-a` của .claude/launch.json (cổng 3472); đăng nhập bằng email, đọc mã trong nhật ký máy chủ
#   dòng «[ma-dang-nhap] <email> <mã>»
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; doi-chieu.test.mjs dựng một kho git tạm (bản sao design/patterns + apps/web/src + packages/ui-lint, git init, commit làm <ref>), commit sửa settings/users/page.tsx và (auth)/login/page.tsx, chạy lệnh thật bằng tiến trình con. Ma trận viết trước 10 cặp: cai-dat-san × {mac-dinh, khong-quyen, loi} × {1440, 375} + xac-thuc × {mac-dinh, loi} × {1440, 375}; assert ke-hoach.json có đúng 10 cặp (so tập), mỗi cặp đủ nhom, tep_moi, mau.tep, mau.duong, anh_moi, anh_mau đúng khuôn «<nhóm>--<trạng thái>--<khổ>--moi.png»; stdout đúng 10 dòng cặp; mã 0. Ca chưa theo dõi: từ <ref> tạo settings/thu/page.tsx MỚI chưa git add → kế hoạch có đúng 6 cặp với tep_moi = settings/thu/page.tsx; đối chứng âm cùng lần: docs/moi.md chưa theo dõi không sinh cặp nào. Chiều im cùng kho: từ <ref> chỉ sửa docs/x.md và _acceptance/y.md → stdout đúng «đối chiếu: vòng không chạm màn của nhóm nào», không có tệp ke-hoach.json, mã 0. Đường tới lệnh suy từ vị trí tệp kiểm."
    paths: ["packages/ui-lint/doi-chieu.mjs", "packages/ui-lint/lib/ban-do.mjs", "packages/ui-lint/tests/doi-chieu.test.mjs", "design/patterns/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; cùng tệp kiểm, sau kế hoạch E1 sinh 20 ảnh PNG nhỏ hợp lệ (mỗi ảnh một màu khác nhau) đúng tên kế hoạch; --dung <slug> → mã 0, stdout «đối chiếu: 10 cặp đủ»; index.html có đúng 10 hàng cặp (đếm phần tử mang data-cap), mỗi hàng đúng hai <img> src data:image/png;base64 mà nội dung giải ra bằng byte ảnh mới và ảnh mẫu của đúng cặp ấy (quan hệ, không chỉ có mặt), hai ảnh cùng thuộc tính bề ngang, nhãn «màn mới · <tệp>» và «màn mẫu · <đường>». Chiều đỏ cùng thư mục: xoá cai-dat-san--loi--375--mau.png → mã 1, stderr chứa đúng tên tệp ấy, index.html có ô «thiếu ảnh cai-dat-san--loi--375--mau.png» trong đúng hàng data-cap của cặp ấy và 9 hàng kia vẫn đủ hai ảnh."
    paths: ["packages/ui-lint/doi-chieu.mjs", "packages/ui-lint/tests/doi-chieu.test.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E3a
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; doi-chieu --mau --slug <slug> trên kho tạm chép cây thật → ke-hoach.json liệt màn mẫu của đúng bốn nhóm (so tập tên nhóm với tệp trong design/patterns), mỗi nhóm đường và trạng thái bằng giá trị đọc từ frontmatter mau_dang_chay của chính tệp ấy (rút bằng docBanDo — bên ghi thật), × hai khổ; mỗi mục chỉ có anh_mau (không anh_moi)."
    paths: ["packages/ui-lint/doi-chieu.mjs", "packages/ui-lint/tests/doi-chieu.test.mjs", "design/patterns/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E3
    criterion: AC-3
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG A (đầu tệp). Chạy node packages/ui-lint/doi-chieu.mjs --mau --slug vong-giao-dien-qua-ban-do, đọc _acceptance/vong-giao-dien-qua-ban-do/doi-chieu/ke-hoach.json."
      - "Đăng nhập quan-tri@example.test, chọn Sàn mẫu A. Với từng mục kế hoạch ở khổ 1440x900 rồi 375x812, giao diện sáng: mở đường màn mẫu trong đúng trạng thái và chụp vào _acceptance/vong-giao-dien-qua-ban-do/doi-chieu/<anh_mau>. Trạng thái: cai-dat-san mac-dinh = /settings/users của quan-tri@; khong-quyen = /settings/users của dau-chu@; loi = Sửa dòng chính quan-tri@ ở Sàn mẫu có một quản trị rồi Lưu (hay Rời sàn) để hiện khối báo đỏ — dùng hai-san@ ở Sàn mẫu B nếu Sàn mẫu A có hơn một quản trị; xac-thuc mac-dinh = /login đã đăng xuất; loi = /login gõ mã sai; trang-tam mac-dinh = /today; trang-thai trong = /today rồi mở chuông."
      - "Với mỗi ảnh ghi: đường thật trên thanh địa chỉ, tiêu đề hay chữ chính của màn, có trang lỗi Next (chữ «Application error» hay «404») không."
      - "Chạy node packages/ui-lint/doi-chieu.mjs --dung vong-giao-dien-qua-ban-do, ghi mã thoát và dòng stdout."
    expected: "Mọi mục kế hoạch có ảnh; mỗi ảnh là đúng màn mẫu của nhóm trong đúng trạng thái đã khai (Người dùng: danh sách người · khối báo «Chỉ quản trị sàn xem được trang này.» · khối báo đỏ «Sàn cần ít nhất một quản trị.»; đăng nhập: ô email · báo mã sai; Hôm nay: trang tạm nói mục lộ trình; chuông: ngăn thông báo trống); không ảnh nào là trang lỗi; --dung thoát 0."
    paths: ["design/patterns/**", "packages/ui-lint/doi-chieu.mjs", "apps/web/src/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; ban-do-khuon.test.mjs (hay tệp mới man-ngoai-ban-do.test.mjs) trên bản sao: đối chứng dương trước — bản sao lành → ban-do-khuon.mjs mã 0, không dòng «ngoai-ban-do». Ca đỏ (mỗi ca mã 1 và đúng một dòng «<tệp>: ngoai-ban-do — màn chưa thuộc nhóm nào» chứa «design/patterns/»): (a) sửa nhan_dien trang-tam.md loại riêng (app)/inventory/page.tsx và đổi tệp ấy trả <main> → dòng nêu (app)/inventory/page.tsx, và KHÔNG có dòng trang-tam cho tệp ấy; (b) trang mới (app)/bao-cao/page.tsx trả <div> với nhan_dien trang-tam đã loại nó. Chiều xanh cùng bản sao (a): thêm design/patterns/bang-hang.md hợp lệ (khuôn nhập một tệp khuôn tạm xuất BangHang, nhan_dien phủ inventory) và trang dựng <BangHang> → mã 0. Chiều im: app/page.tsx (chỉ redirect, không trả JSX) không bao giờ có dòng ngoai-ban-do, kể cả khi bỏ nó khỏi mọi nhóm."
    paths: ["packages/ui-lint/ban-do-khuon.mjs", "packages/ui-lint/lib/ban-do.mjs", "packages/ui-lint/tests/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; kho git tạm từ cây lành làm <ref>: thêm (app)/bao-cao/page.tsx trả JSX chưa git add, đồng thời trang-tam.md loại nó khỏi nhan_dien (commit sửa bản đồ) → ban-do-khuon.mjs --base <ref> mã 1, stderr nêu (app)/bao-cao/page.tsx với «ngoai-ban-do», stdout KHÔNG chứa «không tệp nào của nhóm đổi»; kiem-chuan.mjs --root <kho tạm> mã 1, stderr có đúng một dòng bắt đầu «khuôn: » và dòng ấy bằng «khuôn: (app)/bao-cao/page.tsx đầy đủ: ngoai-ban-do — màn chưa thuộc nhóm nào …» (kiem-chuan đỏ thì không in dòng tóm tắt). Đối chứng cùng kho trước khi thêm trang: --base mã 0 và kiem-chuan in đúng «khuôn: 4 nhóm · 0 lỗi đọc · 0 lệch». Ca thêm: tệp mới chỉ dưới docs/ → --base vẫn «khuôn: không tệp nào của nhóm đổi», mã 0."
    paths: ["packages/ui-lint/ban-do-khuon.mjs", "packages/ui-lint/kiem-chuan.mjs", "packages/ui-lint/lib/ban-do.mjs", "packages/ui-lint/tests/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E5b
    criterion: AC-5
    executor: script
    cmd: config:executors.script.lint
    expected: "exit 0 trên cây thật; đầu ra có «mức nợ giao diện: 0/» và dòng đúng «khuôn: 4 nhóm · 0 lỗi đọc · 0 lệch»."
    paths: ["packages/ui-lint/**", "apps/web/src/**", "design/patterns/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; so-do-vong.test.mjs dựng kho git tạm từ cây lành, nhánh <ref>, rồi bốn commit viết trước: c1 thêm settings/thu/page.tsx trả <main> (lệch cai-dat-san); c2 sửa nó thành <MucCaiDat title>; c3 thêm (app)/bao-cao/page.tsx trả <div> và loại nó khỏi nhan_dien trang-tam (lệch ngoai-ban-do); c4 thêm design/patterns/bao-cao.md + khuôn phủ nó. docs/design/lech-lot.md bảng hai dòng: một dòng cột «Vòng làm ra» = slug thử, một dòng slug khác. so-do-vong.mjs --slug <slug thử> --base <ref> --write → mã 0; khuon-so-do.json: rang_bat = 2 và danh sách đúng tập {(settings/thu/page.tsx, cai-dat-san), ((app)/bao-cao/page.tsx, ngoai-ban-do)}; lech_lot = 1; tep_theo_khuon đúng tập {settings/thu/page.tsx, (app)/bao-cao/page.tsx}. Đối chứng chiều «còn ở HEAD»: thêm c5 đổi settings/thu/page.tsx trả lại <main> (cùng điều lệch của c1) → cặp ấy còn ở HEAD nên không tính: rang_bat = 1 (chỉ cặp ngoai-ban-do) và tep_theo_khuon không còn settings/thu/page.tsx. Thư mục worktree tạm bị xoá sau lệnh (git worktree list chỉ còn cây chính)."
    paths: ["packages/ui-lint/so-do-vong.mjs", "packages/ui-lint/lib/ban-do.mjs", "packages/ui-lint/tests/so-do-vong.test.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.ui_lint
    expected: "exit 0; kho thử RIÊNG dựng như E6 tới HEAD = c4 (không có c5), với _acceptance/<slug thử>/run-log.jsonl có hai dòng gio-may (dòng cuối: gio_may 1.5, gio_cho 0.5, token.<model>.ra cộng = 300, phan_tram_tuan 31.2) và decisions.jsonl có một dòng seal, một dòng gate2 có decided_by, một dòng gate1 không decided_by → --write --bao: khuon-so-do.json khối kit = {gio_may 1.5, gio_cho 0.5, token_ra 300, phan_tram_tuan 31.2, luot_goi_nguoi 2} (lấy dòng cuối, không dòng đầu); stdout có đúng một dòng khớp «quy-hang · <slug thử> · khuôn 2 tệp · răng bắt 2 · lệch lọt 1 · giờ máy 1.5 · gọi người 2», và ba số khuôn/răng bắt/lệch lọt của dòng bằng đúng độ dài tep_theo_khuon, rang_bat, lech_lot đọc lại từ khuon-so-do.json cùng lần chạy (quan hệ, không chỉ chuỗi). Chiều thiếu: xoá dòng gio-may → mã 0, kit = null và khoá ly_do_kit nói thiếu gio-may; dòng --bao in «giờ máy chưa đo»."
    paths: ["packages/ui-lint/so-do-vong.mjs", "packages/ui-lint/tests/so-do-vong.test.mjs"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E8
    criterion: AC-8
    executor: judgment
    inputs:
      - docs/design/vo-va-ia.md
      - .agents/skills/quy-hang-ui/SKILL.md
      - docs/design/lech-lot.md
      - design/patterns/trang-tam.md
    question: "Đọc bốn tệp như một tác tử sắp dựng màn ĐẦU TIÊN của một nhóm chưa có trong bản đồ khuôn (ví dụ Bảng hàng). (1) Văn bản có bảo xếp nhóm và đọc tệp màn mẫu trước khi dựng không? (2) Có nói nhóm mới thì tạo mục design/patterns/<nhóm>.md và khuôn trong CHÍNH vòng ấy, và bài quét đỏ «màn ngoài bản đồ» cho tới khi có mục không? (3) Có nói ba lệnh doi-chieu.mjs, ban-do-khuon.mjs, so-do-vong.mjs chạy ở bước nào của vòng (thiết kế/design-pass, chấm) không? (4) Có nói lệch chủ sản phẩm thấy khi dùng ghi vào docs/design/lech-lot.md, và lech-lot.md có bảng đủ bốn cột Ngày · Màn · Lệch · Vòng làm ra không? (5) Bảng luật trong SKILL.md có một dòng cho «màn ngoài bản đồ» nói cấm gì và dùng gì thay không? (6) Luật KH-tt-roi-nhom của trang-tam.md có khớp (không mâu thuẫn) với luật nhóm mới không? (7) Có buộc vòng chạm màn của nhóm gửi doi-chieu/index.html có ảnh màn mới kèm thẻ Cổng Phạm vi TRƯỚC khi ký không? PASS khi đủ bảy; FAIL nêu tệp và câu thiếu."
    evidence_required: [run_id, exit_code, verifier, verified_at]
  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.ho_so_vong_giao_dien
    expected: "exit 0; _acceptance/vong-giao-dien-qua-ban-do/thu/kiem-ho-so.mjs đọc hồ sơ của chính vòng: khuon-so-do.json có tep_theo_khuon (mảng), rang_bat và lech_lot (số) và khoá base khớp merge-base của nhánh; doi-chieu/ke-hoach.json phủ đúng tập nhóm của design/patterns (đọc bằng docBanDo); doi-chieu/index.html có số hàng data-cap bằng số mục kế hoạch và đủ ảnh (không ô «thiếu ảnh»). Chiều đỏ ghim (cặp hai chiều trong thu/kiem-ho-so.test.mjs chạy bằng node --test cùng lệnh): bản sao hồ sơ thiếu khuon-so-do.json → mã 1 nêu tên tệp; kế hoạch thiếu một nhóm → mã 1 nêu tên nhóm thiếu; index.html có ô thiếu ảnh → mã 1."
    paths: ["_acceptance/vong-giao-dien-qua-ban-do/khuon-so-do.json", "_acceptance/vong-giao-dien-qua-ban-do/doi-chieu/**", "_acceptance/vong-giao-dien-qua-ban-do/thu/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]
