<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đường của màn nhóm mới</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Lora', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1320px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1100px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sơ đồ luồng · Vòng giao diện qua bản đồ</p>
    <h1>Đường của một tệp màn: khớp nhóm hay nhóm mới</h1>

    <svg viewBox="0 0 1320 540" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows -->
      <line x1="160" y1="260" x2="200" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M270 200 V164 Q270 148 286 148 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="580" y1="148" x2="620" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="820" y1="148" x2="860" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1060" y1="148" x2="1100" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M270 320 V364 Q270 380 286 380 H400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="380" x2="640" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M750 344 V276 Q750 260 734 260 H340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="278" y="168" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="294" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">CÓ</text>
      <rect x="278" y="328" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="302" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KHÔNG</text>
      <rect x="500" y="234" width="64" height="16" rx="2" fill="#f5f5f5"/>
      <text x="532" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">KIỂM LẠI</text>

      <!-- A: start oval -->
      <rect x="40" y="236" width="120" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="100" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vòng sửa</text>
      <text x="100" y="272" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">hay dựng màn</text>

      <!-- B: decision -->
      <polygon points="270,200 340,260 270,320 200,260" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="270" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tệp khớp</text>
      <text x="270" y="272" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nhóm?</text>

      <!-- C -->
      <rect x="400" y="112" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">doi-chieu --base</text>
      <text x="490" y="162" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">kế hoạch cặp ảnh</text>

      <!-- D -->
      <rect x="620" y="112" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="720" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">design-pass</text>
      <text x="720" y="154" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">chụp màn mới + màn mẫu</text>
      <text x="720" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1440 · 375</text>

      <!-- E (accent) -->
      <rect x="860" y="112" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="960" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">doi-chieu --dung</text>
      <text x="960" y="154" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">trang ghép đôi</text>
      <text x="960" y="168" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">thiếu ảnh → đỏ</text>

      <!-- H -->
      <rect x="1100" y="112" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1190" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bước chấm</text>
      <text x="1190" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">so-do-vong --write</text>
      <text x="1190" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ khuon-so-do.json</text>

      <!-- F (accent) -->
      <rect x="400" y="344" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bài quét</text>
      <text x="500" y="386" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">«màn ngoài bản đồ»</text>
      <text x="500" y="400" fill="#ba4513" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">→ đỏ</text>

      <!-- G -->
      <rect x="640" y="344" width="220" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="750" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tạo mục bản đồ</text>
      <text x="750" y="386" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">design/patterns/&lt;nhóm&gt;.md</text>
      <text x="750" y="400" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">+ khuôn</text>

      <!-- Legend -->
      <line x1="40" y1="452" x2="1280" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CHÚ GIẢI · HÌNH CHỈ LOẠI</text>
      <rect x="40" y="488" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Điểm vào</text>
      <rect x="180" y="488" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>
      <polygon points="292,494 304,488 316,494 304,500" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="324" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Rẽ nhánh</text>
      <rect x="420" y="488" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="452" y="498" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chặn đỏ</text>
      <text x="1280" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">AC-1 · AC-2 · AC-4 · AC-5 · AC-6</text>
    </svg>
  </div>
</body>
</html>
