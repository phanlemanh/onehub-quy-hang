  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/gioi-han-thu.test.ts: ca «giới hạn thử: 5 sai trong 15 phút» — 5 lần sai rồi lần 6 bằng mật khẩu đúng ra 429 password_rate_limited; ca «giới hạn thử: email lạ cũng đếm» — 5 lần với email không tài khoản, lần 6 ra 429 cùng thân lỗi; ca «giới hạn thử: 20 liên tiếp thì vô hiệu» — 20 lần sai (dọn identity.password_failures giữa các cửa sổ bằng kết nối chủ để vượt giới hạn 15 phút), rồi mật khẩu đúng ra 403 password_disabled, password_events có «khoa-20»; quản trị cấp lại thì đăng nhập tạm được; ca «giới hạn thử: đúng giữa chừng thì về 0» — 19 sai, 1 đúng, 19 sai nữa vẫn đăng nhập được. Chiều đỏ (phá-thử S3): đếm cửa sổ chỉ cho email có tài khoản thì ca «email lạ cũng đếm» đỏ."
