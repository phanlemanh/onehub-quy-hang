    expected: "exit 0; bài kiểm bảng xếp loại đường trong packages/api/src/auth (cạnh duong-gui-ma.test.ts): ca «xếp loại: mọi đường lõi chạm mật khẩu có loại» đọc danh sách đường của bản better-auth đã cài (đường lõi lẫn đường plugin), lọc các đường có password, sign-up, verification-email, verify-email, assert mỗi đường có đúng một loại trong bảng (bọc hay 404); bảng viết trước có ít nhất /sign-up/email, /sign-in/email, /change-password, /request-password-reset, /reset-password, /reset-password/:token, /verify-password, /send-verification-email, /verify-email; đối chứng: bảng thiếu /change-password thì ca đỏ nêu đúng đường ấy."
