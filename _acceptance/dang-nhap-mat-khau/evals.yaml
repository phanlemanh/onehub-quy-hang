  - id: E10
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    steps:
      - "DỰNG B. Dựng trạng thái bằng node --env-file-if-exists=.env.local --import tsx _acceptance/dang-nhap-mat-khau/thu/dung-trang-thai.mjs <email> <trạng-thái> (dựng ở S3; in mật khẩu thử ra stdout của lệnh, không ra trang). Ma trận viết trước, đi ĐỦ từng ô × hai khổ 375x812 và 1280x800, mỗi ô một hồ sơ trình duyệt mới và một ảnh evidence/E10-<ST>-<khổ>.png: (1) ST-dang-nhap-mat-khau — dau-chu-1@mau.quy-hang.test trạng thái tu-dat, /login, gõ email, bấm «Dùng mật khẩu»; (2) ST-dang-nhap-sai — gõ mật khẩu sai, bấm đăng nhập; (3) ST-dang-nhap-cho — trạng thái cho (5 lần sai trong 15 phút) rồi gõ mật khẩu đúng; (4) ST-dang-nhap-khoa — trạng thái khoa-20, gõ mật khẩu đúng; (5) ST-dang-nhap-tam-het — trạng thái tam-het-han, gõ mật khẩu tạm; (6) ST-dat-mat-khau-mac-dinh — trạng thái tam, gõ mật khẩu tạm, đăng nhập; ghi URL và history.length cùng mọi mục location.href sau bước này; (7) ST-dat-mat-khau-tu-choi — gõ «matkhau», lưu; (8) ST-dat-mat-khau-het-phien — tải lại trang /dat-mat-khau; bấm nút về đăng nhập, gõ lại mật khẩu tạm, ghi URL."
      - "Ô (9) suôn sẻ, khổ 375x812: từ ô (6), gõ «ba con mèo ngủ trưa», bấm «Lưu và vào Quỹ hàng» → ghi URL, chụp evidence/E10-vao-375.png. Đếm số ảnh evidence/E10-ST-*.png và ghi lại."
    expected: "Số ảnh ST = 8 trạng thái × 2 khổ = 16. Chữ từng ô đúng bảng trạng thái của Đặc tả UX trong thiết kế: (1) ô email, ô mật khẩu, nút «Đăng nhập» và nút quay về mã; (2) «Email hoặc mật khẩu không đúng» ngay dưới ô mật khẩu; (3) «Thử lại sau ít phút» dưới ô mật khẩu; (4) «Mật khẩu đã bị khoá — đăng nhập bằng mã rồi đặt mật khẩu mới trong Cá nhân, hay nhờ quản trị sàn cấp lại»; (5) «Mật khẩu tạm đã hết hạn — nhờ quản trị sàn cấp lại»; (6) URL /dat-mat-khau, ô mật khẩu có nút hiện/ẩn, câu gợi ý 8 ký tự, nút «Lưu và vào Quỹ hàng»; URL và mọi mục lịch sử đã ghi không chứa changeToken hay mật khẩu; (7) lý do dưới ô; (8) «Phiên đặt mật khẩu đã hết — đăng nhập lại bằng mật khẩu tạm» kèm nút về đăng nhập, và đăng nhập lại bằng mật khẩu tạm đưa về /dat-mat-khau (việc tiếp theo làm được thật); (9) URL rời /dat-mat-khau vào trang trong vỏ. Không ô nào tràn ngang ở 375. Đối chứng: vào được vỏ bằng mật khẩu tạm mà không qua /dat-mat-khau, hay thiếu ảnh của một ô, là FAIL."
    paths: ["apps/web/src/app/(auth)/**", "apps/web/src/proxy.ts"]
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

