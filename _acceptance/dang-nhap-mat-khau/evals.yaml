schema_version: 1
feature_slug: dang-nhap-mat-khau
# Lệnh máy: executors.test.isolation (npm run db:migrate && npm run db:test — bộ kiểm cách ly + mọi tệp
# packages/api/test-db/**/*.test.ts, cần DATABASE_URL tới Postgres dãy B: postgres://postgres:quyhang@localhost:5572/postgres),
# executors.test.api (đơn vị của packages/api), executors.test.web (đơn vị của apps/web), executors.script.dang_nhap_mat_khau
# (_acceptance/dang-nhap-mat-khau/thu/*.test.mjs), executors.script typecheck, lint, build, ro_ri. Người chấm đối chiếu tên
# ca nêu trong `expected` với dòng reporter: có mặt, ok, không SKIP.
# Dựng chung cho ui-check («DỰNG B»): node --env-file-if-exists=.env.local --import tsx
#   _acceptance/bang-hang-dang-the/thu/dung-b.mjs → Postgres dãy B (5572), máy chủ dev 3492, người mẫu đã nạp; rồi
#   node _acceptance/dang-nhap-auth-15/thu/nguoi-mau.mjs (hai-san@mau.quy-hang.test thuộc hai sàn). Phiên có sẵn:
#   node _acceptance/bang-hang-dang-the/thu/phien.mjs <email> in JSON cookie «qh.session_token» (localhost:3492).
#   Mỗi bài ui-check mở một hồ sơ trình duyệt MỚI (ngữ cảnh sạch) và chỉ dùng email của bài mình.
evals:
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/cap-mat-khau.test.ts: ca «cấp mật khẩu: quản trị cấp cho người chỉ ở sàn mình» — 200, tempPassword 16 ký tự thuộc bảng chữ khai ở packages/api/src/auth, chia bốn nhóm, expiresAt cách lúc gọi 72 giờ (±1 phút); đọc bằng kết nối chủ: identity.account providerId «credential» có password bắt đầu bằng dạng băm scrypt của thư viện và KHÁC tempPassword, mọi identity.session của người ấy đã xoá, identity.password_events có đúng một dòng kind «cap» với actor, user, company đúng; ca «cấp mật khẩu: không bản rõ ở đâu» quét mọi cột chữ của ba bảng identity.password_* và account, cùng mọi dòng stdout/stderr bắt được của máy chủ thử trong lần gọi, không chứa tempPassword; ca «cấp mật khẩu: không quản trị → 403», ca «cấp mật khẩu: người ngoài sàn → 404». Chiều đỏ (phá-thử S3, có vật): evidence/E1-pha-thu.log ghi lần cho đường cấp in thân trả lời ra nhật ký thì ca «không bản rõ ở đâu» đỏ."
    paths: ["packages/api/src/auth/**", "packages/db/migrations/034_*.sql", "packages/api/test-db/dang-nhap-mat-khau/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/san-khac.test.ts: ca «cấp mật khẩu: người ở hai sàn → 409» — quản trị sàn A gọi cho người thuộc A và B: 409, mã lỗi user_in_other_company, thân lỗi không chứa tên hay id của sàn B; account, session, password_events của người ấy y như trước lời gọi; ca «cấp mật khẩu: gọi thẳng hàm bằng vai API cũng bị từ chối» — gọi app.cap_mat_khau_tam qua appPool với ngữ cảnh quản trị A cho người ở A và B ra lỗi, không đổi gì; ca «cấp mật khẩu: mời đồng thời phải chờ khoá» — mở giao dịch giữ khoá của hàm cho người u, chèn company_members (sàn B, u) ở kết nối khác thì bị chặn tới khi giao dịch kia kết thúc (đo bằng pg_locks hay thời gian chờ có trần), sau đó hàm gọi lại cho u ra 409; ca «vào sàn khác: mật khẩu gốc sàn cấp bị vô hiệu» — bảng viết trước ba hình (mật khẩu tạm chưa dùng · đặt lần đầu từ mật khẩu tạm · tự đổi ở Cá nhân sau đặt lần đầu), mỗi hình: người chỉ ở A, chèn company_members (sàn B) qua đường mời của API, lời mời 2xx, rồi đăng nhập bằng mật khẩu ấy: hai hình đầu 403 password_disabled kèm sự kiện vo-hieu-san-khac, hình ba (đối chứng dương) có phiên; assert số hình = 3. Chiều đỏ (phá-thử S3): bỏ điều kiện «không thuộc sàn khác» khỏi 034 thì ca «người ở hai sàn → 409» đỏ; bỏ bước vô hiệu trong trigger thì hình «đặt lần đầu từ mật khẩu tạm» đỏ."
    paths: ["packages/db/migrations/034_*.sql", "packages/api/src/auth/**", "packages/api/test-db/dang-nhap-mat-khau/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/dang-nhap-tam.test.ts: ca «đăng nhập tạm: không phiên» — POST /api/v1/auth/sign-in/email bằng email + mật khẩu tạm: 200, thân có mustChange true và changeToken, không header set-cookie mang qh.session_token, GET /api/v1/me không cookie ra 401, identity.session của người ấy rỗng; ca «đăng nhập tạm: dùng lại trước khi đặt xong» — đăng nhập tạm lần hai ra changeToken mới, POST /api/v1/auth/password/first bằng changeToken lần một ra 403, bằng changeToken lần hai ra 200; sau đó đăng nhập bằng mật khẩu tạm ra 401 invalid_email_or_password; ca «đăng nhập tạm: quá 72 giờ → 403 temp_password_expired» (lùi temp_expires_at bằng kết nối chủ); ca «đăng nhập tạm: sai mật khẩu tạm → 401 invalid_email_or_password» (không lộ trạng thái tạm)."
    paths: ["packages/api/src/auth/**", "packages/api/src/app.ts", "packages/api/test-db/dang-nhap-mat-khau/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/dat-lan-dau.test.ts: ca «đặt lần đầu: nhận rồi có phiên» — POST /api/v1/auth/password/first với changeToken và một mật khẩu 8 ký tự có dấu cách và chữ có dấu: 200, set-cookie qh.session_token, phiên hết hạn sau 30 ngày (±1 phút), GET /api/v1/me bằng cookie ấy 200, password_state kind «tu-dat», password_events có «dat-lan-dau»; ca «đặt lần đầu: mã đổi không dùng lại» — gọi lại cùng changeToken ra 403; ca «đặt lần đầu: từ chối có lý do» — mật khẩu 7 ký tự ra 400 kèm mã lý do độ dài, mật khẩu chứa phần trước «@» của email ra 400 kèm mã lý do ngữ cảnh, và changeToken vẫn dùng được sau lần từ chối."
    paths: ["packages/api/src/auth/**", "packages/api/test-db/dang-nhap-mat-khau/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/dang-nhap-tu-dat.test.ts: ca «đăng nhập mật khẩu: đúng có phiên 30 ngày», ca «đăng nhập mật khẩu: sai và email lạ cùng một lỗi» — hai lời gọi cùng status 401 và thân JSON bằng nhau từng byte; ca «đăng nhập mật khẩu: mã 6 số vẫn chạy» — gửi mã, đọc mã từ bộ gửi thử, đăng nhập bằng mã ra phiên; ca «đăng nhập mật khẩu: tự đăng ký 404» — POST /api/v1/auth/sign-up/email ra 404 và identity.user không thêm dòng. Bộ kiểm hiện có packages/api/test-db/auth.test.ts và session.test.ts vẫn xanh."
