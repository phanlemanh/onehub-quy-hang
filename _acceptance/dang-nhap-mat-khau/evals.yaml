  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.isolation
    layer: backend-effect
    expected: "exit 0; tệp packages/api/test-db/dang-nhap-mat-khau/doi-mat-khau.test.ts: ca «đổi mật khẩu: cần mật khẩu hiện tại» — người có mật khẩu tự đặt, phiên ở hai máy: PUT /api/v1/me/password sai currentPassword ra 403, đúng ra 200; phiên máy kia sau đó GET /api/v1/me ra 401, phiên máy này 200; password_events có «doi»; ca «đổi mật khẩu: chưa có thì đặt không cần» — người chỉ vào bằng mã đặt được không có currentPassword; ca «đổi mật khẩu: cùng luật độ dài» — 7 ký tự ra 400; ca «báo mất máy: vô hiệu mật khẩu» — POST /api/v1/me/report-lost từ máy giữ lại, rồi đăng nhập bằng mật khẩu cũ đúng ra 403 password_disabled, password_events có «vo-hieu-bao-mat», bộ kiểm packages/api/test-db/tab-toi/thiet-bi.test.ts vẫn xanh."
