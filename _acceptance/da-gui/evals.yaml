schema_version: 1
feature_slug: da-gui
# Lệnh máy: `executors.test.isolation` (packages/api/test-db và packages/db/tests, cần DATABASE_URL tới Postgres dãy L,
# cổng 5571), `executors.test.web`, `executors.test.core`, `executors.script.ro_ri`. exit 0 của lệnh chung KHÔNG đủ: mỗi
# eval đòi `output` — dòng reporter liệt tên ca — và người chấm đối chiếu từng tên ca nêu trong `expected`: có mặt, «ok»,
# không «# SKIP»/«# TODO». Dữ liệu: bộ dựng sàn thử qua đường ghi thật, số `0900 000 0xx`, tên «[Tên]».
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: backend-effect
    cmd: config:executors.test.isolation
    expected: "exit 0; trong packages/api/test-db/da-gui.test.ts có mặt và ok: «đã gửi: danh sách theo người xem» — đầu khách 1 gửi hai link (khách riêng, nhóm môi giới), đầu khách 2 gửi một: GET /api/v1/shares của đầu khách 1 trả đúng hai id mới trước (deepEqual danh sách viết trước), của đầu khách 2 trả một, của trưởng nhóm trả ba; bảng viết trước (đầu chủ 403, telesales 403, không cookie 401) → mã HTTP, đếm bằng số dòng; mỗi phần tử có recipient deepEqual tên nhu cầu khách hay «Nhóm môi giới», listingCount đúng, covers dài ≤ 4; thân trả không có khoá phone, contactId, ownerName, ownerPhone, floorPrice và máy dò số theo số khách đã biết không bắt gì, đối chứng dương: máy dò bắt số cài sẵn; cùng phép quét (khoá cấm + máy dò số + tên chủ nhà mẫu) trên thân GET /api/v1/shares/{id} của từng link cũng rỗng. Chiều đỏ: bỏ lọc theo người xem → ca đỏ nêu id thừa."
    paths: [packages/api/src/da-gui/**, packages/api/test-db/da-gui.test.ts]
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

