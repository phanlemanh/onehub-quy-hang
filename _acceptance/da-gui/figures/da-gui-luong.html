<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luồng Đã gửi</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', 'Lora', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 2rem 16px;
      display: flex;
      justify-content: center;
    }
    .frame { max-width: 560px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .sub { color: var(--color-muted); font-size: 0.875rem; line-height: 1.45; margin-bottom: 1.5rem; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Đã gửi · Hình tại điểm quyết định</p>
    <h1>Từ một link đã gửi: gợi ý căn thay, hoặc tắt link</h1>
    <p class="sub">Hai nhánh rẽ từ màn chi tiết một link. Hai ô viền cam là việc chủ kho quyết (Hỏi-2, Hỏi-3). Phủ AC-3, AC-4, AC-5.</p>

    <svg viewBox="0 0 480 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luồng Đã gửi: nhánh gợi ý căn thay và nhánh tắt link">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Arrows (behind nodes) ===== -->
      <line x1="240" y1="72" x2="240" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="152" x2="240" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- fork A -->
      <path d="M208 240 V256 Q208 264 200 264 H132 Q124 264 124 272 V304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- fork B -->
      <path d="M272 240 V256 Q272 264 280 264 H348 Q356 264 356 272 V304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A column -->
      <line x1="124" y1="376" x2="124" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="124" y1="512" x2="124" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B column -->
      <line x1="356" y1="376" x2="356" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="356" y1="464" x2="356" y2="496" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="356" y1="552" x2="356" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels (side of vertical segments, 8px gap) ===== -->
      <rect x="132" y="276" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="136" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">A · CĂN ĐỔI</text>
      <rect x="364" y="276" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="368" y="288" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">B · THU LINK</text>
      <rect x="132" y="520" width="40" height="16" rx="2" fill="#f5f5f5"/>
      <text x="136" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CHẠM</text>
      <rect x="364" y="472" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="368" y="484" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ĐỒNG Ý</text>

      <!-- ===== Trunk ===== -->
      <rect x="120" y="24" width="240" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="120" y="24" width="240" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="240" y="46" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đầu khách mở Đã gửi</text>
      <text x="240" y="62" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">các link mình đã gửi, mới trước</text>

      <rect x="120" y="104" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chạm thẻ một link</text>

      <rect x="120" y="184" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chi tiết các căn trong link</text>
      <text x="240" y="224" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">số lượt khách quan tâm từng căn</text>

      <!-- ===== Branch A: căn thay ===== -->
      <rect x="24" y="304" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="124" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Căn mang nhãn «Vừa đổi»</text>
      <text x="124" y="348" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">giá đổi, đã có người đặt cọc,</text>
      <text x="124" y="360" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">hay không còn — sau lúc gửi</text>

      <!-- Focal 1: Hỏi-3 -->
      <rect x="24" y="408" width="200" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="408" width="200" height="104" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="32" y="416" width="108" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="86" y="428" fill="#ba4513" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-3 · CHỦ KHO</text>
      <text x="124" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">«Gợi ý căn thay»</text>
      <text x="124" y="468" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tối đa 3 căn Đang bán, chưa trong link</text>
      <text x="124" y="484" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cùng số phòng ngủ · giá trong ±15%</text>
      <text x="124" y="500" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">cùng toà trước, rồi giá gần nhất</text>

      <rect x="24" y="544" width="200" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="24" y="544" width="200" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="124" y="568" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mở luồng Gửi với căn ấy</text>
      <text x="124" y="584" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">người vẫn tự bấm gửi</text>

      <!-- ===== Branch B: tắt link ===== -->
      <!-- Focal 2: Hỏi-2 -->
      <rect x="256" y="304" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="304" width="200" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <rect x="264" y="312" width="108" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
      <text x="318" y="324" fill="#ba4513" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-2 · CHỦ KHO</text>
      <text x="356" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bấm «Tắt link»</text>
      <text x="356" y="364" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">ai được bấm: người gửi và trưởng nhóm</text>

      <rect x="256" y="408" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="356" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hỏi xác nhận</text>
      <text x="356" y="448" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">khách đang giữ link sẽ không mở được</text>

      <rect x="256" y="496" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="356" y="520" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hệ thống tắt link</text>
      <text x="356" y="536" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">tắt ở cơ sở dữ liệu, không ở giao diện</text>

      <rect x="256" y="584" width="200" height="72" rx="28" fill="#f5f5f5"/>
      <rect x="256" y="584" width="200" height="72" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="356" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Link đã tắt</text>
      <text x="356" y="624" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">thẻ mang nhãn «Đã tắt»</text>
      <text x="356" y="640" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">khách thấy «Link không còn mở được»</text>

      <!-- Annotation: Hỏi-4 (đã có khuyến nghị) -->
      <text x="356" y="680" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Không bật lại — muốn mở thì gửi link mới</text>
      <text x="356" y="696" fill="#636b80" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HỎI-4</text>

      <!-- ===== Legend ===== -->
      <line x1="24" y1="712" x2="456" y2="712" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="24" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
      <rect x="24" y="740" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="56" y="750" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bắt đầu / kết thúc</text>
      <rect x="164" y="740" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="196" y="750" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Bước</text>
      <rect x="248" y="740" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="280" y="750" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Chủ kho quyết ở Cổng Phạm vi</text>
    </svg>
  </div>
</body>
</html>
