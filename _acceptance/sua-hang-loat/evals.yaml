schema_version: 1
feature_slug: sua-hang-loat
# Dựng chung cho mọi eval ui-check (gọi là «DỰNG B» trong steps) — chỗ thử dãy B của hàng 14:
#   node _acceptance/bang-hang-kieu-sheet/thu/dung-b.mjs
#   → Postgres dãy B (cổng 5561) đã migrate; sàn và người mẫu của hàng 5; 40 hàng mẫu; máy chủ dev cổng 3481.
#   Phiên đăng nhập: _acceptance/bang-hang-kieu-sheet/thu/cdp.mjs (cookieCua) giữ phiên ở .acceptance-runs.
#   Lịch sử sự kiện của một hàng: GET /api/v1/listings/<id>, trường events (fetch trong trang, cùng phiên).
#   Hàng cho bài nhìn: Toà B, theo mã căn tăng dần (Toà A đã dùng ở hồ sơ sua-tren-o, va-sua-tren-o). Mỗi bài ghi mã thật
#   của căn đã dùng, và căn của bài này không dùng lại ở bài sau (bài sau lấy căn kế tiếp). Toà B thiếu loại căn bài cần
#   (vd căn Ngừng hẳn) thì lấy ở toà kế theo thứ tự chữ cái, ghi mã.
#   Ghi trên máy trước, gửi lên sau (luật 30): đọc sự kiện máy chủ chỉ sau khi chỉ báo đồng bộ đầu trang về «Đã đồng bộ».
evals:
  - id: E1
    criterion: AC-3
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; inventory/bulk/lo.test.ts: ma trận viết tay mọi cặp trạng thái hiện tại (6) × nấc đích (Incomplete, Active, Pending, Hold, Withdrawn) của xetDoiTrangThai trên một căn đủ mục — mỗi ô assert ngăn (đổi được / không đổi được) và chữ lý do («đã ở nấc này», «không chuyển được từ <nhãn>»); thêm căn Chưa đủ để rao thiếu giá → Đang bán ra «thiếu giá, điều kiện phí, …»; lô trộn 4 căn ra đúng hai danh sách theo thứ tự đầu vào; nacMenu(lô) chỉ chứa nấc có ít nhất một căn đổi được và không bao giờ chứa Closed; Withdrawn không lý do → không căn nào đổi được, lý do «chọn lý do ngừng». Đối chứng đỏ trong tệp: hàm xét giả bỏ bảng chuyển (coi mọi nấc đều đổi được) thì ô Closed→Active và Withdrawn→Hold đỏ với thông điệp gọi tên ô."
    paths: ["apps/web/src/app/(app)/inventory/bulk/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-5
    executor: test
    cmd: config:executors.test.web
    expected: "exit 0; inventory/bulk/lo.test.ts: ma trận viết tay xetDaGoi trên 6 trạng thái — Incomplete, Active, Pending, Hold → đổi được; Closed, Withdrawn → không đổi được, lý do «căn đã đóng»; lệnh dựng cho mỗi căn đổi được là {type:'owner_confirmed', payload:{}} và qua validatePayload của lõi không lỗi. Đối chứng đỏ: hàm giả không loại căn đóng thì ô Closed đỏ gọi tên ô."
    paths: ["apps/web/src/app/(app)/inventory/bulk/**"]
    evidence_required: [run_id, exit_code, verifier, verified_at]

