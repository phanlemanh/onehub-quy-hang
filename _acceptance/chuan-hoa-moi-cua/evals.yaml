schema_version: 1
slug: chuan-hoa-moi-cua
evals:
  - id: E1
    criterion: AC-1
    executor: test
    layer: unit
    cmd: config:executors.test.core
    paths: ["packages/core/src/import/**"]
    expected: "exit 0; ca «gợi ý giá trị chuẩn» trong packages/core/src/import/goi-y.test.ts: bảng viết trước — «dong nam», «ĐN», «Đ-N» → khớp Đông Nam; «bp», «KBP» → included/excluded; «Đang gd», «GD» → Pending; «dong nm», «khong bao phi», «dang giao dich» → gợi ý đầu là giá trị đúng; «xyz», «12345» → không gợi ý; «Gọi 0900 000 001», «[Tên]@vidu.vn», «CCCD 012345678901» → không gợi ý; số ô đếm bằng độ dài bảng; ca chạy với fetch và mọi lối mạng bị thay bằng hàm ném lỗi — gọi mạng là ca đỏ. Đối chứng: từ điển của sàn chứa «huong dn» → Đông Nam thì khớp từ điển sàn trước. Chiều đỏ: bỏ bước khoảng cách chữ → ca gần đúng đỏ nêu chữ."
  - id: E2
    criterion: AC-2
    executor: test
    layer: unit
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/imports/new/**", "apps/web/src/lib/nhap/**", "packages/core/src/import/**"]
    expected: "exit 0; ca «gợi ý ở ô cần người» trên bảng xem trước dựng từ tệp mẫu thật qua lõi nhập: ô hướng «dong nm» «cần người» có gợi ý đầu «Đông Nam»; chọn gợi ý (dùng đúng suaO) → ô thành Đông Nam, mark fixed; ô cột ngoài ba trường không có gợi ý. Chiều đỏ: hàm gợi ý trả rỗng → ca đỏ nêu ô."
  - id: E2u
    criterion: AC-2
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    target: "http://localhost:3462/imports/new"
    paths: ["apps/web/src/app/(app)/imports/new/**"]
    steps:
      - "Postgres dãy B (5572, đã migrate, có bộ mẫu «[Mẫu] Sàn thử»). Mở máy chủ dev cổng 3462: env DATABASE_URL=postgres://postgres:quyhang@localhost:5572/postgres BETTER_AUTH_SECRET=dev-b-chuoi-thu-khong-dung-o-ban-that BETTER_AUTH_URL=http://localhost:3462 npm run dev -w @quy-hang/web -- -p 3462 (log ra tệp). Đăng nhập dau-chu-1@mau.quy-hang.test bằng mã 6 số in ở log dòng «[ma-dang-nhap]». Tắt máy chủ khi xong (luật 43)."
      - "Tải tệp _acceptance/chuan-hoa-moi-cua/thu/tu-dien.csv vào /imports/new (khổ 1440), sang bước xem trước; mở ô hướng «dong nm» → chụp evidence/E2u-step1.png: dưới ô dòng «Ý bạn là:» có nút «Đông Nam»"
      - "Bấm «Đông Nam» → chụp evidence/E2u-step2.png: ô hiện Đông Nam, hết đánh dấu cần người. Không bấm Nhập."
      - "Trong trang, fetch GET /api/v1/company/value-aliases; ghi vào observed dòng directionFaces «dong nm» (trạng thái, giá trị, pick_count)"
      - "Vòng ND7: đăng xuất, đăng nhập quan-tri@mau.quy-hang.test, fetch PUT duyệt dòng ấy; đăng xuất, đăng nhập lại dau-chu-1, tải lại tu-dien.csv → chụp evidence/E2u-step3.png: ô hướng hiện Đông Nam ngay, không đánh dấu cần người, không dòng «Ý bạn là:»"
    expected: "step1 có dòng «Ý bạn là:» với nút Đông Nam dưới đúng ô; step2 ô thành Đông Nam; GET sau khi bấm có đúng một dòng proposed directionFaces «dong nm» → Đông Nam, pick_count 1 (nút gợi ý gửi đề xuất thật); step3 sau khi duyệt, lần tải lại chuẩn hoá thẳng ô ấy (trang xem trước nạp cách gõ đã duyệt)."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E3
    criterion: AC-3
    executor: test
    layer: backend-effect
    cmd: config:executors.test.chuan_hoa_moi_cua
    paths: ["packages/api/src/value-aliases/**", "packages/db/migrations/051_*", "packages/api/test-db/chuan-hoa-moi-cua/**"]
    expected: "exit 0; packages/api/test-db/chuan-hoa-moi-cua/tu-dien.test.ts trên Postgres: đầu chủ POST đề xuất (directionFaces, «dong nm» → Đông Nam) → 201, một dòng proposed, pick_count 1; POST lại «Dong  NM» → một dòng, pick_count 2; quản trị duyệt rồi đầu chủ POST lại → vẫn approved, pick_count 3. Đối chứng dương đọc dòng qua GET. Chiều đỏ: bỏ khoá duy nhất theo chữ gập → ca đếm dòng đỏ."
  - id: E4
    criterion: AC-4
    executor: test
    layer: unit
    cmd: config:executors.test.web
    paths: ["apps/web/src/lib/nhap/**", "packages/core/src/import/**"]
    expected: "exit 0; ca «đề xuất chưa duyệt không đổi chuẩn hoá»: bảng xem trước dựng với companyAliases chỉ gồm dòng approved (bộ lọc dùng chung với máy chủ `cachGoDaDuyet`); dòng proposed «dong nm» → ô vẫn needs_person; cùng dòng đổi thành approved → ô fixed Đông Nam. Chiều đỏ: bộ lọc nhận cả proposed → ca đầu đỏ."
  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.chuan_hoa_moi_cua
    paths: ["packages/api/src/value-aliases/**", "packages/db/migrations/051_*", "packages/api/test-db/chuan-hoa-moi-cua/**"]
    expected: "exit 0; trên Postgres: quản trị PUT duyệt → 200, dòng approved, một sự kiện nhật ký (người, lúc, quyết); PUT bỏ → rejected, thêm sự kiện; bảng viết trước vai đầu chủ, trưởng nhóm, đầu khách PUT → 403, dòng không đổi; đối chứng quản trị 200. Chiều đỏ: bỏ kiểm vai → ca 403 đỏ nêu vai."
  - id: E5b
    criterion: AC-5
    executor: test
    layer: unit
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/settings/dictionary/**", "apps/web/src/app/(app)/settings/cai-dat.ts"]
    expected: "exit 0; trang settings/dictionary/page.tsx gọi chanMucSan trước khi đọc API (đối chứng: trang Người dùng; chiều đỏ trên bản sao bỏ dòng chặn); mục «Từ điển» có trong cai-dat.ts nhóm Sàn."
  - id: E6
    criterion: AC-6
    executor: test
    layer: backend-effect
    cmd: config:executors.test.chuan_hoa_moi_cua
    paths: ["packages/api/src/imports/**", "packages/api/src/value-aliases/**", "packages/api/test-db/chuan-hoa-moi-cua/**", "packages/core/src/import/**"]
    expected: "exit 0; trên Postgres: sàn duyệt «huong dn» → Đông Nam; lần nhập qua đường ghi thật của máy chủ với ô hướng «HƯỚNG  DN» → căn ghi directionFaces Đông Nam, dòng không bị chặn; đối chứng: sàn khác không có cách gõ ấy → cùng tệp, ô bị từ chối như cần người. Chiều đỏ: đường ghi không nạp companyAliases → ca đỏ."
  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.chuan_hoa_moi_cua
    paths: ["packages/api/src/value-aliases/**", "packages/api/test-db/chuan-hoa-moi-cua/**"]
    expected: "exit 0; trên Postgres: chụp listings và listing_events của sàn trước khi duyệt và bỏ một cách gõ; sau đó so lại — y nguyên. Đối chứng dương: bảng company_value_aliases đổi trạng thái thật."
  - id: E8
    criterion: AC-8
    executor: test
    layer: backend-effect
    cmd: config:executors.test.chuan_hoa_moi_cua_cach_ly
    paths: ["packages/db/migrations/051_*", "packages/db/tests/isolation.test.mjs"]
    expected: "exit 0; isolation.test.mjs ca «từ điển của sàn»: hai bảng bật và ép luật theo dòng; sàn B không đọc, không chèn hộ A; trường ngoài ba trường bị check chặn (thử ownerPhone); nhật ký không sửa, không xoá; đối chứng sàn A đọc dòng của mình. Chiều đỏ: tắt luật theo dòng trên bản sao → ca đỏ nêu bảng."
  - id: E9
    criterion: AC-9
    executor: test
    layer: unit
    cmd: config:executors.test.web
    paths: ["apps/web/src/app/(app)/settings/dictionary/**", "packages/core/src/import/**"]
    expected: "exit 0; hàm thuần sức khoẻ (`sucKhoeTuDien`) trên bảng viết trước 7 dòng ba trường đủ ba trạng thái: số gặp, đã neo, chờ, đã bỏ, tổng lần chọn đúng từng trường; bộ rỗng → mọi số 0. Chiều đỏ: đếm đã bỏ vào đã neo → ca đỏ nêu trường."
  - id: E9u
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    cmd: config:executors.ui-check
    target: "http://localhost:3462/settings/dictionary"
    paths: ["apps/web/src/app/(app)/settings/dictionary/**"]
    steps:
      - "Máy chủ dev như E2u. Đăng nhập quan-tri@mau.quy-hang.test cho bước 0. Chuẩn bị sau bước 0: đăng nhập dau-chu-1@mau.quy-hang.test, trong trang fetch POST /api/v1/company/value-aliases/proposals ba đề xuất (directionFaces «dong nm»→Đông Nam; feeInclusion «bao phi het»→included; standardStatus «dang gd roi»→Pending), ghi mã trả vào observed; rồi đăng nhập lại quan-tri@mau.quy-hang.test"
      - "Bước 0 (trước khi tạo dữ liệu, sàn chưa có dòng nào — nếu có thì ghi số dòng vào observed): mở /settings/dictionary khổ 1440 → chụp evidence/E9u-step0.png: câu «Chưa có cách gõ lạ nào — chọn gợi ý ở bước xem trước khi nhập file sẽ hiện ở đây», mọi số sức khoẻ bằng 0"
      - "Khổ 1440 mở /settings/dictionary → chụp evidence/E9u-step1.png: hàng sức khoẻ đầu màn (đã gặp 3 · chờ 3 · đã neo 0), ba nhóm trường, mỗi dòng chữ gốc → giá trị chuẩn · số lần · «Duyệt» «Bỏ»"
      - "Bấm «Duyệt» dòng «dong nm» → chụp evidence/E9u-step2.png: dòng ấy đã duyệt, sức khoẻ đã neo 1 · chờ 2"
      - "Khổ 375 → chụp evidence/E9u-step3.png: một cột đọc được"
    expected: "Sức khoẻ khớp số đề xuất; duyệt một dòng làm đã neo tăng, chờ giảm; khổ 375 đọc được."
    evidence_required: [run_id, screenshot, observed, verifier, verified_at]
  - id: E10
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.chuan_hoa_moi_cua
    paths: ["packages/api/src/value-aliases/**", "packages/api/test-db/chuan-hoa-moi-cua/**"]
    expected: "exit 0; trên Postgres: bảng viết trước POST đề xuất với chữ «Gọi 0900 000 001», «[Tên]@vidu.vn», «012345678901», 41 ký tự, trường ownerPhone, giá trị ngoài tập chuẩn, chữ gập trùng cách gõ dựng sẵn mà trỏ giá trị khác («bao phi» → excluded), chữ gập trùng tên giá trị chuẩn mà trỏ giá trị khác («dong nam» → Tây Bắc) → mỗi ô 400, số dòng bảng không đổi; đối chứng chữ hợp lệ → 201. Chiều đỏ: bỏ kiểm dữ liệu cá nhân → ô số điện thoại đỏ."
  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.design.khuon
    expected_exit: 1
    paths: ["design/patterns/cai-dat-san.md", "design/patterns/trang-tam.md", "apps/web/src/app/(app)/settings/**/page.tsx"]
    expected: "exit 1 (đạt có giới hạn, luật 33 của đợt, cùng lối E14 hàng 46 và 47): bộ chấm khuôn của kit 2.37.0 bỏ qua ngoại lệ không mang khoá khoi (kit#485) nên báo oan «lệch: apps/web/src/app/(app)/settings/dictionary/page.tsx · thuộc hai nhóm màn: cai-dat-san, trang-tam» dù trang đã khai ngoại lệ ở trang-tam.md; E11b chứng mọi dòng đỏ chỉ là dòng báo oan ấy."
  - id: E11b
    criterion: AC-9
    executor: script
    cmd: node _acceptance/chuan-hoa-moi-cua/kiem-khuon-e11.mjs
    paths: ["design/patterns/**", "apps/web/src/app/(app)/settings/**/page.tsx", "_acceptance/chuan-hoa-moi-cua/kiem-khuon-e11.mjs"]
    expected: "exit 0; tám đối chứng viết sẵn trong bài qua (chỉ dòng báo oan → qua; báo oan của tệp khác đã khai → qua; thêm một lệch, tệp chưa khai ngoại lệ, lỗi bản đồ, thoát 1 không có dòng của trang Từ điển, không chấm được → đỏ; đọc ngoai_le đúng); trên cây thật, mọi dòng «lệch:» và «sai:» là dòng báo oan của tệp đã khai ngoại lệ, có dòng của trang Từ điển, bài in «E11b: chỉ có dòng báo oan đã khai». Kit vá thì bài nhắc bỏ mã 1, vẫn thoát 0."
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
