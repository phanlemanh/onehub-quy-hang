    inputs:
      - docs/adr/0009-moi-truong-that.md
      - docs/architecture/kien-truc-repo-va-stack.md
      - docs/product/tham-chieu.md
      - .github/workflows/ci.yml
      - apps/web/vercel.json
      - packages/db/supabase/nen-du-an.sql
